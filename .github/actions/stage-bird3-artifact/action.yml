name: "Stage verified BIRD source archive"
description: >-
  Restore a pinned BIRD source archive from its content-addressed cache entry,
  falling back to a retried, checksum-verified fetch from the primary host and
  its mirror on a miss, then verify its immutable checksum and source version
  and stage it into the interop image build context. No same-run producer or
  artifact service is involved: a cache outage degrades to a miss, and a bad
  cache hit is discarded before any bytes are staged. The key and path derive
  from version and checksum only, so every workflow shares one entry per archive.
inputs:
  version:
    description: "Exact BIRD source version"
    required: false
    default: "3.3.2"
  sha256:
    description: "Exact BIRD source archive SHA-256"
    required: false
    default: "21297d7a02edd700ae82de5a630055a9cb88a99e2e7e45551bc7d6c1e5b4de2c"
  stage-directory:
    description: "Directory in the interop Docker build context"
    required: false
    default: "tests/interop/bird3-archive"
runs:
  using: "composite"
  steps:
    - name: Restore exact BIRD archive cache
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/bird-cache/bird-${{ inputs.version }}.tar.gz
        key: bird-v${{ inputs.version }}-source-${{ inputs.sha256 }}

    - name: Verify cached BIRD archive or fetch it upstream
      shell: bash
      run: |
        set -euo pipefail
        .github/scripts/install-bird3.sh \
          --version "${{ inputs.version }}" \
          --sha256 "${{ inputs.sha256 }}" \
          --coverage-label "${{ github.job }}: BIRD ${{ inputs.version }} image blocked" \
          --prepare-archive \
          "$RUNNER_TEMP/bird-cache/bird-${{ inputs.version }}.tar.gz"

    - name: Save verified BIRD archive cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/bird-cache/bird-${{ inputs.version }}.tar.gz
        key: bird-v${{ inputs.version }}-source-${{ inputs.sha256 }}

    - name: Stage exact BIRD archive offline
      shell: bash
      run: |
        set -euo pipefail
        .github/scripts/install-bird3.sh \
          --version "${{ inputs.version }}" \
          --sha256 "${{ inputs.sha256 }}" \
          --stage-archive \
          "$RUNNER_TEMP/bird-cache/bird-${{ inputs.version }}.tar.gz" \
          "${{ inputs.stage-directory }}"
