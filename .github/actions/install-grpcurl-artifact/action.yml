name: "Install verified grpcurl"
description: >-
  Restore the exact grpcurl archive from its content-addressed cache entry,
  falling back to a retried, checksum-verified upstream fetch on a miss, then
  verify its immutable checksum and version and install it on the hosted
  runner. No same-run producer or artifact service is involved: a cache outage
  degrades to a miss, and a bad cache hit is discarded before any bytes are used.
runs:
  using: "composite"
  steps:
    - name: Restore exact grpcurl archive cache
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/grpcurl-cache/grpcurl_1.9.1_linux_x86_64.tar.gz
        key: grpcurl-v1.9.1-linux-x86_64-588c9c429476d9ed66cd3b2ae32283a6da36e0cfbb7e446f5d6a1b68dc770214

    - name: Verify cached grpcurl archive or fetch it upstream
      shell: bash
      run: |
        set -euo pipefail
        .github/scripts/install-grpcurl.sh \
          --prepare-archive \
          "$RUNNER_TEMP/grpcurl-cache/grpcurl_1.9.1_linux_x86_64.tar.gz"

    - name: Save verified grpcurl archive cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/grpcurl-cache/grpcurl_1.9.1_linux_x86_64.tar.gz
        key: grpcurl-v1.9.1-linux-x86_64-588c9c429476d9ed66cd3b2ae32283a6da36e0cfbb7e446f5d6a1b68dc770214

    - name: Install exact grpcurl offline
      shell: bash
      run: |
        set -euo pipefail
        .github/scripts/install-grpcurl.sh \
          --install-archive \
          "$RUNNER_TEMP/grpcurl-cache/grpcurl_1.9.1_linux_x86_64.tar.gz" \
          /usr/local/bin
