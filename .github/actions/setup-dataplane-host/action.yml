name: "Set up dataplane host"
description: >-
  Prepare an `ubuntu-latest` runner for a containerlab kernel-dataplane interop
  job: hardened containerlab install (#208), grpcurl + jq, the kernel modules the
  dataplane tests need (incl. `vrf`, which the slim hosted Azure kernel ships only
  via `linux-modules-extra`), and a built `rustbgpd:dev` image with a GHA layer
  cache. Each hosted job is isolated, so it builds its own image rather than
  sharing a persistent daemon as the old self-hosted runner did.
inputs:
  containerlab-version:
    required: false
    default: "0.74.3"
  build-image:
    description: "Build rustbgpd:dev (set 'false' for jobs that build their own)."
    required: false
    default: "true"
outputs:
  vrf-available:
    description: >-
      "true" when the `vrf` kernel module is loaded (already present, or
      installed from linux-modules-extra for the exact running kernel);
      "false" when the hosted runner kernel is ahead of the matching
      modules-extra package in the apt mirror and vrf cannot be loaded.
      VRF-dependent jobs gate on this so a transient runner-image / mirror
      skew skips with a notice instead of failing.
    value: ${{ steps.dataplane-modules.outputs.vrf-available }}
runs:
  using: "composite"
  steps:
    - name: Install containerlab (hardened)
      uses: ./.github/actions/install-containerlab
      with:
        version: ${{ inputs.containerlab-version }}

    - name: Install grpcurl + jq
      shell: bash
      run: |
        set -euo pipefail
        # jq is normally preinstalled on hosted runners; only touch apt when it
        # is missing. A transient 403 from a preinstalled third-party repo (e.g.
        # packages.microsoft.com) otherwise fails the whole `apt-get update` and
        # the job — and we only need jq from the Ubuntu archive.
        if ! command -v jq >/dev/null 2>&1; then
          sudo apt-get update -o Acquire::Retries=3 || \
            echo "::warning::apt-get update reported repo errors; installing jq from cache"
          sudo apt-get install -y jq
        fi
        bash .github/scripts/install-grpcurl.sh

    - name: Load kernel dataplane modules (vrf / vxlan / bridge / bonding)
      id: dataplane-modules
      shell: bash
      run: |
        set -uo pipefail
        # vrf is absent from the slim hosted Azure kernel; it ships only via
        # linux-modules-extra for the EXACT running kernel. The hosted kernel
        # can roll ahead of that package in the apt mirror (actions/runner-images
        # #7570 / #7587) — a transient skew we must NOT turn into a red build.
        # Load best-effort and report availability so vrf-dependent jobs skip
        # rather than fail when the module genuinely cannot be installed.
        vrf_available=false
        if sudo modprobe vrf 2>/dev/null; then
          vrf_available=true
        else
          # Bounded fetch: a stalled mirror fails this fast (warning), never a
          # ~30 min hang. apt retry / connection timeouts ride out a brief blip.
          sudo timeout 240 apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y "linux-modules-extra-$(uname -r)" \
            || echo "::warning::linux-modules-extra-$(uname -r) unavailable or slow"
          if sudo modprobe vrf 2>/dev/null; then
            vrf_available=true
          fi
        fi
        if [ "$vrf_available" = true ]; then
          echo "::notice::vrf kernel module available; vrf-dependent dataplane jobs will run"
        else
          echo "::warning::vrf kernel module unavailable on this runner (kernel $(uname -r) likely ahead of linux-modules-extra in the apt mirror); vrf-dependent jobs will skip"
        fi
        echo "vrf-available=${vrf_available}" >> "$GITHUB_OUTPUT"
        sudo modprobe vxlan bridge bonding || true

    - name: Set up Docker Buildx
      if: ${{ inputs.build-image == 'true' }}
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - name: Build rustbgpd:dev
      if: ${{ inputs.build-image == 'true' }}
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: .
        load: true
        tags: rustbgpd:dev
        target: dev
        # Consumers load locally from the primer's fixed scope but never write
        # it; a cache miss simply falls back to a normal source build.
        cache-from: type=gha,scope=rustbgpd-dev
