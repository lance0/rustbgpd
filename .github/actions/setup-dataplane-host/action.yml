name: "Set up dataplane host"
description: >-
  Prepare an `ubuntu-latest` runner for a containerlab kernel-dataplane interop
  job: hardened containerlab install (#208), grpcurl + jq, the kernel modules the
  dataplane tests need (incl. `vrf`, which the slim hosted Azure kernel ships only
  via `linux-modules-extra`), and a built `rustbgpd:dev` image with a GHA layer
  cache. Each hosted job is isolated, so it builds its own image rather than
  sharing a persistent daemon as the old self-hosted runner did.
inputs:
  build-image:
    description: "Build rustbgpd:dev (set 'false' for jobs that build their own)."
    required: false
    default: "true"
  vrf-required:
    description: >-
      "true" for jobs that fail closed without VRF; gives the vrf module fetch
      a longer budget (see load-vrf-module). VRF-optional jobs keep 240 s.
    required: false
    default: "false"
outputs:
  vrf-available:
    description: >-
      "true" when the `vrf` kernel module is loaded (already present, or
      installed from linux-modules-extra for the exact running kernel);
      "false" when it could not be obtained within the fetch budget.
      VRF-optional jobs skip on "false"; VRF-required jobs fail closed.
    value: ${{ steps.vrf.outputs.vrf-available }}
runs:
  using: "composite"
  steps:
    - name: Install containerlab (hardened)
      uses: ./.github/actions/install-containerlab

    - name: Install exact grpcurl offline
      uses: ./.github/actions/install-grpcurl-artifact

    - name: Ensure jq
      shell: bash
      # jq is normally preinstalled on hosted runners; the helper only touches
      # apt when it is missing, bounds a slow mirror, and only warns on index
      # errors from a preinstalled third-party repo (e.g. packages.microsoft.com).
      run: .github/scripts/apt-install.sh --command jq jq

    - name: Load vrf kernel module
      id: vrf
      uses: ./.github/actions/load-vrf-module
      with:
        vrf-required: ${{ inputs.vrf-required }}

    - name: Load kernel dataplane modules (vxlan / bridge / bonding)
      shell: bash
      run: sudo modprobe vxlan bridge bonding || true

    # Consumers load locally from the primer's fixed scope but never write it;
    # a cache miss simply falls back to a normal source build.
    - name: Build rustbgpd:dev
      if: ${{ inputs.build-image == 'true' }}
      uses: ./.github/actions/build-rustbgpd-dev
