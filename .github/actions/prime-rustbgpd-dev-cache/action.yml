name: "Prime rustbgpd:dev build cache"
description: "Warm the fixed heavy-lane image cache without loading a local image."
runs:
  using: "composite"
  steps:
    # Same Docker Hub retry structure as build-rustbgpd-dev: a primer failure
    # skips every lab job, so it gets the bounded retry too. The outer
    # timeout caps the pre-pull at 120 s of the primer job's 30 minutes.
    - name: Pre-pull BuildKit image
      shell: bash
      run: |
        RETRY_DELAY_SECONDS=10 timeout 120 .github/scripts/retry-docker-image.sh timeout --foreground 60 docker pull moby/buildkit:buildx-stable-1 \
          || echo "::warning::BuildKit image pre-pull failed; setup-buildx will pull it itself"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Prime rustbgpd:dev build cache
      id: prime
      continue-on-error: true
      uses: docker/build-push-action@v7
      with:
        context: .
        load: false
        tags: rustbgpd:dev
        target: dev
        cache-from: type=gha,scope=rustbgpd-dev
        cache-to: type=gha,scope=rustbgpd-dev,mode=max,ignore-error=true

    - name: Wait before retrying the cache prime
      if: steps.prime.outcome == 'failure'
      shell: bash
      run: sleep 30

    - name: Retry Prime rustbgpd:dev build cache
      if: steps.prime.outcome == 'failure'
      uses: docker/build-push-action@v7
      with:
        context: .
        load: false
        tags: rustbgpd:dev
        target: dev
        cache-from: type=gha,scope=rustbgpd-dev
        cache-to: type=gha,scope=rustbgpd-dev,mode=max,ignore-error=true
