name: "Build rustbgpd:dev"
description: >-
  Set up Buildx and load the `rustbgpd:dev` image from the primer's fixed GHA
  cache scope, retrying the Docker Hub fetches that fail transiently: the
  BuildKit image is pre-pulled with bounded retries (Buildx falls back to the
  local copy when its own pull fails), and a failed build runs once more.
runs:
  using: "composite"
  steps:
    - name: Pre-pull BuildKit image
      shell: bash
      run: |
        RETRY_DELAY_SECONDS=10 .github/scripts/retry-docker-image.sh timeout 90 docker pull moby/buildkit:buildx-stable-1 \
          || echo "::warning::BuildKit image pre-pull failed; setup-buildx will pull it itself"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build rustbgpd:dev
      id: build
      continue-on-error: true
      uses: docker/build-push-action@v7
      with:
        context: .
        load: true
        tags: rustbgpd:dev
        target: dev
        cache-from: type=gha,scope=rustbgpd-dev

    - name: Wait before retrying the build
      if: steps.build.outcome == 'failure'
      shell: bash
      run: sleep 30

    - name: Retry Build rustbgpd:dev
      if: steps.build.outcome == 'failure'
      uses: docker/build-push-action@v7
      with:
        context: .
        load: true
        tags: rustbgpd:dev
        target: dev
        cache-from: type=gha,scope=rustbgpd-dev
