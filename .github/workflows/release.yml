name: Release Binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-tag-version:
    # Fail-closed publication gate: the pushed tag `vX.Y.Z` must equal
    # the workspace `[workspace.package] version` (X.Y.Z). A mismatch
    # means the tag points at a commit that was never version-bumped
    # for this release — nothing may be built or published from it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert tag matches workspace version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error file=Cargo.toml::tag ${GITHUB_REF_NAME} does not match [workspace.package] version ${manifest_version}; refusing to publish"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches workspace version ${manifest_version}"

  test:
    # Fail-closed publication gate: the `release` job `needs:` this,
    # so no artifact can ship from a tagged commit whose tests did
    # not run and pass in this exact workflow run.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/install-protobuf
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build:
    needs: verify-tag-version
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build release binaries
        # --features rustbgpd/jemalloc: the shipped daemon must be the
        # same build the published benchmarks are measured on (jemalloc
        # as the global allocator + allocator gauges on /metrics).
        # tikv-jemalloc-sys cross-compiles for aarch64 via the
        # aarch64-linux-gnu-gcc toolchain installed above.
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --workspace --release --features rustbgpd/jemalloc --target ${{ matrix.target }}

      - name: Package binaries
        run: |
          # Pack the daemon and CLI into a single per-arch tarball with a
          # version-less filename. This is what powers the static
          # `https://github.com/lance0/rustbgpd/releases/latest/download/rustbgpd-<arch>.tar.gz`
          # URL pattern in docs/deployment.md — operators never have to
          # bump a version pin to get the current release. Pinned
          # downloads still work via the per-tag
          # `releases/download/vX.Y.Z/` path; the asset filename is the
          # same on every release.
          SUFFIX=${{ matrix.suffix }}
          mkdir -p dist staging
          cp target/${{ matrix.target }}/release/rustbgpd staging/
          cp target/${{ matrix.target }}/release/rbgp staging/
          cp LICENSE-MIT LICENSE-APACHE staging/
          tar -C staging -czf dist/rustbgpd-${SUFFIX}.tar.gz \
            rustbgpd rbgp LICENSE-MIT LICENSE-APACHE
          cd dist
          sha256sum rustbgpd-${SUFFIX}.tar.gz > checksums-${SUFFIX}.txt

      - name: Assert tarball contains license files
        run: |
          set -euo pipefail
          SUFFIX=${{ matrix.suffix }}
          for f in LICENSE-MIT LICENSE-APACHE; do
            if ! tar -tzf "dist/rustbgpd-${SUFFIX}.tar.gz" | grep -qx "$f"; then
              echo "::error::${f} missing from dist/rustbgpd-${SUFFIX}.tar.gz"
              exit 1
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/

  release:
    # Publication is impossible unless the tag/version gate, the test
    # gate, and both package builds all succeeded for this commit.
    needs: [verify-tag-version, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract CHANGELOG section for this tag
        # Pull the matching `## [X.Y.Z]` block out of CHANGELOG.md so
        # the release body shows the curated notes instead of the
        # auto-generated commit list. Strips the heading line because
        # the GitHub release page already shows the version. If no
        # matching section exists, write a stub so the action still
        # has a body to publish (and surface the gap at release time).
        #
        # CHANGELOG.md is hard-wrapped (~72-80 cols) for review quality and
        # clean diffs, but GitHub renders release bodies with comment-style
        # Markdown where every newline is a hard break — so the raw extract
        # "crams". reflow-release-notes.py un-hard-wraps each paragraph / list
        # item (preserving headings, blank lines, fences, tables, and nested
        # list boundaries) so the release page renders cleanly.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { in_section=1; print; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md | tail -n +2 > release-notes.raw.md
          if [ ! -s release-notes.raw.md ]; then
            echo "::error file=CHANGELOG.md::no \`## [$version]\` section found in CHANGELOG.md"
            exit 1
          fi
          python3 scripts/reflow-release-notes.py \
            < release-notes.raw.md > release-notes.md
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: artifacts/*
