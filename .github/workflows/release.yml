name: Release Binaries

on:
  push:
    tags: ["v*"]

# Read-only default; the `release` job alone escalates to the
# contents scope needed to create the release.
permissions:
  contents: read

jobs:
  verify-tag-version:
    # Fail-closed publication gate: the pushed tag `vX.Y.Z` must equal
    # the workspace `[workspace.package] version` (X.Y.Z). A mismatch
    # means the tag points at a commit that was never version-bumped
    # for this release — nothing may be built or published from it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assert tag matches workspace version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error file=Cargo.toml::tag ${GITHUB_REF_NAME} does not match [workspace.package] version ${manifest_version}; refusing to publish"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches workspace version ${manifest_version}"

  test:
    # Fail-closed publication gate: the `release` job `needs:` this,
    # so no artifact can ship from a tagged commit whose tests did
    # not run and pass in this exact workflow run.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/install-protobuf
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --workspace

  build:
    needs: verify-tag-version
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
          - target: aarch64-unknown-linux-gnu
            suffix: linux-arm64

    runs-on: ubuntu-latest
    # Build inside Debian 11 (glibc 2.31) so the published binaries —
    # and the .deb/.rpm packages repacked from them — run on every
    # deployment distro with glibc >= 2.31: Debian bookworm (2.36),
    # Ubuntu 22.04 (2.35) / 24.04 (2.39), RHEL/Rocky 9 (2.34).
    # Building directly on the ubuntu-latest runner links against its
    # newer glibc and the artifacts fail to start on all of the above.
    # The image also pins the release toolchain (rustc 1.95).
    container: rust:1.95-bullseye

    # Container jobs default `run` steps to sh (dash on Debian), which
    # rejects `set -o pipefail`; the runner-hosted jobs default to bash
    # already.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cross-compilation target and tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          rustup target add aarch64-unknown-linux-gnu
          apt-get update
          # libc6-dev-arm64-cross is a Recommends of the cross gcc, so
          # --no-install-recommends drops it — without the aarch64 libc
          # headers every C dependency (ring, jemalloc) fails at
          # bits/libc-header-start.h.
          apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Install protobuf compiler
        # Bullseye's packaged protoc (3.12) predates the proto3
        # `optional` fields in proto/rustbgpd.proto; install a pinned
        # upstream release binary instead.
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-linux-x86_64.zip
          echo "f853e691868d0557425ea290bf7ba6384eef2fa9b04c323afab49a770ba9da80  /tmp/protoc.zip" | sha256sum -c
          unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          protoc --version

      - name: Build release binaries
        # --features rustbgpd/jemalloc: the shipped daemon must be the
        # same build the published benchmarks are measured on (jemalloc
        # as the global allocator + allocator gauges on /metrics).
        # tikv-jemalloc-sys cross-compiles for aarch64 via the
        # aarch64-linux-gnu-gcc toolchain installed above.
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --workspace --release --features rustbgpd/jemalloc --target ${{ matrix.target }}

      - name: Package binaries
        run: |
          # Pack the daemon, CLI, and route-server config renderer into
          # a single per-arch tarball with a
          # version-less filename. This is what powers the static
          # `https://github.com/lance0/rustbgpd/releases/latest/download/rustbgpd-<arch>.tar.gz`
          # URL pattern in docs/deployment.md — operators never have to
          # bump a version pin to get the current release. Pinned
          # downloads still work via the per-tag
          # `releases/download/vX.Y.Z/` path; the asset filename is the
          # same on every release.
          #
          # Tarball layout (the share/ tree mirrors what packagers
          # install under /usr/share):
          #   rustbgpd, rbgp, rs-config-render        binaries
          #   birdwatcher-adapter                     Alice-LG birdwatcher shim
          #   LICENSE-MIT, LICENSE-APACHE             licenses
          #   rustbgpd.schema.json                    config JSON Schema
          #   share/man/man1/rbgp.1                   CLI man page
          #   share/man/man8/rustbgpd.8               daemon man page
          #   share/completions/rbgp.{bash,zsh,fish}  shell completions
          #   share/systemd/rustbgpd.service          hardened systemd unit
          #   share/systemd/rustbgpd-dataplane.conf   opt-in CAP_NET_ADMIN drop-in
          #
          # Man pages and completions are generated by the binaries
          # themselves (`rbgp man`, `rustbgpd --man`, `rbgp completions
          # <shell>`), so they never drift from the shipped build. The
          # amd64 leg runs its own release binaries; the arm64 leg
          # cross-compiles and cannot execute them, so it generates
          # from a host-native dev build of the same commit (the
          # generated text is identical across profiles and arches).
          SUFFIX=${{ matrix.suffix }}
          mkdir -p dist staging/share/man/man1 staging/share/man/man8 \
            staging/share/completions staging/share/systemd
          cp target/${{ matrix.target }}/release/rustbgpd staging/
          cp target/${{ matrix.target }}/release/rbgp staging/
          cp target/${{ matrix.target }}/release/rs-config-render staging/
          cp target/${{ matrix.target }}/release/birdwatcher-adapter staging/
          cp LICENSE-MIT LICENSE-APACHE staging/
          cp docs/rustbgpd.schema.json staging/
          cp examples/systemd/rustbgpd.service \
            examples/systemd/rustbgpd-dataplane.conf staging/share/systemd/
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            RBGP=target/${{ matrix.target }}/release/rbgp
            RUSTBGPD=target/${{ matrix.target }}/release/rustbgpd
          else
            cargo build -p rustbgpctl -p rustbgpd
            RBGP=target/debug/rbgp
            RUSTBGPD=target/debug/rustbgpd
          fi
          "$RBGP" man > staging/share/man/man1/rbgp.1
          "$RUSTBGPD" --man > staging/share/man/man8/rustbgpd.8
          for shell in bash zsh fish; do
            "$RBGP" completions "$shell" > staging/share/completions/rbgp.$shell
          done
          tar -C staging -czf dist/rustbgpd-${SUFFIX}.tar.gz \
            rustbgpd rbgp rs-config-render birdwatcher-adapter \
            LICENSE-MIT LICENSE-APACHE rustbgpd.schema.json share
          # Also publish the config JSON Schema as a standalone asset so
          # editors can reference the stable
          # `releases/latest/download/rustbgpd.schema.json` URL. Both
          # matrix legs upload an identical copy; the merged artifact
          # download deduplicates them.
          cp docs/rustbgpd.schema.json dist/

      - name: Assert tarball has nonempty binaries, licenses, man pages, and completions
        run: |
          set -euo pipefail
          SUFFIX=${{ matrix.suffix }}
          # List the archive once and match against the captured text. A
          # `tar -tzf ... | grep -q` pipeline breaks here: grep exits on the
          # first match and closes the pipe, tar takes SIGPIPE, and under
          # `pipefail` that non-zero tar status fails the check on the first
          # present entry (LICENSE-MIT) even though it is there.
          entries="$(tar -tzf "dist/rustbgpd-${SUFFIX}.tar.gz")"
          for f in rustbgpd rbgp rs-config-render birdwatcher-adapter \
                   LICENSE-MIT LICENSE-APACHE \
                   share/man/man1/rbgp.1 share/man/man8/rustbgpd.8 \
                   share/completions/rbgp.bash share/completions/rbgp.zsh \
                   share/completions/rbgp.fish \
                   share/systemd/rustbgpd.service \
                   share/systemd/rustbgpd-dataplane.conf; do
            if ! grep -qxF "$f" <<<"$entries"; then
              echo "::error::${f} missing from dist/rustbgpd-${SUFFIX}.tar.gz"
              exit 1
            fi
            if [ "$(tar -xOzf "dist/rustbgpd-${SUFFIX}.tar.gz" "$f" | wc -c)" -eq 0 ]; then
              echo "::error::${f} is empty in dist/rustbgpd-${SUFFIX}.tar.gz"
              exit 1
            fi
          done

      - name: Build .deb/.rpm packages
        # nfpm repackages the tarball staging tree (same binaries, man
        # pages, completions) with a package-path systemd unit, a
        # sysusers.d service user, and a production-path config
        # skeleton — see packaging/nfpm.yaml + scripts/build-packages.sh.
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/nfpm.tgz \
            https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
          echo "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  /tmp/nfpm.tgz" | sha256sum -c
          tar -C /tmp -xzf /tmp/nfpm.tgz nfpm
          deb_arch=${{ matrix.suffix == 'linux-amd64' && 'amd64' || 'arm64' }}
          scripts/build-packages.sh staging "$deb_arch" "${GITHUB_REF_NAME#v}" dist /tmp/nfpm

      - name: Compute per-arch checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum rustbgpd-${{ matrix.suffix }}.tar.gz ./*.deb ./*.rpm \
            > checksums-${{ matrix.suffix }}.txt
          cat checksums-${{ matrix.suffix }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/

  release:
    # Publication is impossible unless the tag/version gate, the test
    # gate, and both package builds all succeeded for this commit.
    needs: [verify-tag-version, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract CHANGELOG section for this tag
        # Pull the matching `## [X.Y.Z]` block out of CHANGELOG.md so
        # the release body shows the curated notes instead of the
        # auto-generated commit list. Strips the heading line because
        # the GitHub release page already shows the version. If no
        # matching section exists, fail closed before creating a release.
        #
        # CHANGELOG.md is hard-wrapped (~72-80 cols) for review quality and
        # clean diffs, but GitHub renders release bodies with comment-style
        # Markdown where every newline is a hard break — so the raw extract
        # "crams". reflow-release-notes.py un-hard-wraps each paragraph / list
        # item (preserving headings, blank lines, fences, tables, and nested
        # list boundaries) so the release page renders cleanly.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { in_section=1; print; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md | tail -n +2 > release-notes.raw.md
          if [ ! -s release-notes.raw.md ]; then
            echo "::error file=CHANGELOG.md::no \`## [$version]\` section found in CHANGELOG.md"
            exit 1
          fi
          python3 scripts/reflow-release-notes.py \
            < release-notes.raw.md > release-notes.md
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: release-notes.md
          files: artifacts/*
