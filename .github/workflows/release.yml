name: Release Binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build release binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rustbgpd dist/rustbgpd-${VERSION}-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/release/rustbgpctl dist/rustbgpctl-${VERSION}-${{ matrix.suffix }}
          cd dist
          sha256sum rustbgpd-${VERSION}-${{ matrix.suffix }} rustbgpctl-${VERSION}-${{ matrix.suffix }} > checksums-${{ matrix.suffix }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract CHANGELOG section for this tag
        # Pull the matching `## [X.Y.Z]` block out of CHANGELOG.md so
        # the release body shows the curated notes instead of the
        # auto-generated commit list. Strips the heading line because
        # the GitHub release page already shows the version. If no
        # matching section exists, write a stub so the action still
        # has a body to publish (and surface the gap at release time).
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { in_section=1; print; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md | tail -n +2 > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "no \`## [$version]\` section found in CHANGELOG.md" \
              > release-notes.md
          fi
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: artifacts/*
