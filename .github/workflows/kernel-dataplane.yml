      # Cross-vendor proof for ADR-0089's v1 Linux topology: rustbgpd owns
      # one vlan_filtering=1 bridge with explicit bridge_vlan bindings, FRR
      # originates the same MAC from two traditional VNIs, and rustbgpd must
      # program/remove only the matching VLAN-scoped FDB row.
      - name: Run M70 (deploy + test + destroy with retry)
        uses: ./.github/actions/run-interop-test
        with:
          label: M70
          topology: tests/interop/m70-evpn-vlan-aware-bridge-frr.clab.yml
          script: tests/interop/scripts/test-m70-evpn-vlan-aware-bridge-frr.sh

  m65:
    needs: [grpcurl_archive, gobgp_archive, prime_dev_image]
    name: M65 — ADR-0083 single-active failover blackout measurement (GoBGP 3.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dataplane-host
        id: dataplane
      # The segment PEs run GoBGP (the failure injection needs the RFC 7432
      # §8.2 mass-withdraw wire shape — EAD-per-ES withdrawn with the MAC
      # routes retained — which neither rustbgpd nor FRR can originate; see
      # the topology header).
      - name: Stage verified GoBGP archive
        uses: ./.github/actions/stage-gobgp-artifact
      - name: Build gobgp:interop image
        run: docker build -t gobgp:interop -f tests/interop/Dockerfile.gobgp tests/interop
      - name: Run M65 (deploy + test + destroy with retry)
        uses: ./.github/actions/run-interop-test
        with:
          label: M65
          topology: tests/interop/m65-evpn-single-active-failover.clab.yml
          script: tests/interop/scripts/test-m65-evpn-single-active-failover.sh

  m71:
    needs: [grpcurl_archive, gobgp_archive, prime_dev_image]
    name: M71 — RFC 9136 §4.3 ESI overlay-index Type 5 single-active receive (GoBGP 3.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dataplane-host
        id: dataplane
      # rustbgpd is the receive-side DUT; GoBGP is the route source. GoBGP
      # (not FRR) because the proof needs byte-exact, independent control over
      # the EAD-per-ES Single-Active vs All-Active ESI Label flag injected and
      # withdrawn separately from the Type 5 — FRR's EVPN multi-homing is
      # all-active only and cannot originate a single-active EAD-per-ES.
      - name: Stage verified GoBGP archive
        uses: ./.github/actions/stage-gobgp-artifact
      - name: Build gobgp:interop image
        run: docker build -t gobgp:interop -f tests/interop/Dockerfile.gobgp tests/interop
      - name: Run M71 (deploy + test + destroy with retry)
        if: steps.dataplane.outputs.vrf-available == 'true'
        uses: ./.github/actions/run-interop-test
        with:
          label: M71
          topology: tests/interop/m71-evpn-esi-overlay-type5-receive-gobgp.clab.yml
          script: tests/interop/scripts/test-m71-evpn-esi-overlay-type5-receive-gobgp.sh

  m72:
    needs: [grpcurl_archive, gobgp_archive, prime_dev_image]
    name: M72 — RFC 9136 §4.3 ESI overlay-index Type 5 all-active receive (GoBGP 3.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dataplane-host
        id: dataplane
      # rustbgpd is the receive-side DUT; two GoBGP PEs are route
      # sources. This extends M71's exact ESI-overlay Type 5/EAD
      # command shape to the all-active success path: route-level ECMP
      # over l3vxlan100 plus a Router-MAC FDB-NHG row.
      - name: Stage verified GoBGP archive
        uses: ./.github/actions/stage-gobgp-artifact
      - name: Build gobgp:interop image
        run: docker build -t gobgp:interop -f tests/interop/Dockerfile.gobgp tests/interop
      - name: Run M72 (deploy + test + destroy with retry)
        if: steps.dataplane.outputs.vrf-available == 'true'
        uses: ./.github/actions/run-interop-test
        with:
          label: M72
          topology: tests/interop/m72-evpn-esi-overlay-type5-all-active-gobgp.clab.yml
          script: tests/interop/scripts/test-m72-evpn-esi-overlay-type5-all-active-gobgp.sh

  m66:
    needs: [grpcurl_archive, prime_dev_image]
    name: M66 — ADR-0084 ES drain service handover (rustbgpd ×3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dataplane-host
        id: dataplane
      # All three BGP speakers are rustbgpd — the origination-side
      # withdrawal stimulus M65 lacked is the ADR-0084 runtime ES
      # drain, so no GoBGP image is needed (see the topology header).
      - name: Run M66 (deploy + test + destroy with retry)
        uses: ./.github/actions/run-interop-test
        with:
          label: M66
          topology: tests/interop/m66-evpn-es-drain-handover.clab.yml
          script: tests/interop/scripts/test-m66-evpn-es-drain-handover.sh

  m67:
    needs: [grpcurl_archive, prime_dev_image]
    name: M67 — ADR-0085 link-driven ES drain failover (rustbgpd ×3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dataplane-host
        id: dataplane
      # The M66 sibling with the production trigger: an attachment-
      # circuit carrier loss (ip link set down inside pe1) — not an
      # RPC — drives the drain, the RFC 7432 §8.2 withdrawal shape,
      # the DF handover, and the held-off recovery (see the topology
      # header). All three BGP speakers are rustbgpd.
      - name: Run M67 (deploy + test + destroy with retry)
        uses: ./.github/actions/run-interop-test
        with:
          label: M67
          topology: tests/interop/m67-evpn-link-drain-failover.clab.yml
          script: tests/interop/scripts/test-m67-evpn-link-drain-failover.sh

  m68:
    needs: [grpcurl_archive, prime_dev_image]
    name: M68 — ADR-0087 GW-IP overlay-index Type 5 (FRR 10.3.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dataplane-host
        id: dataplane
      # Cross-vendor consume-side proof for native GW-IP overlay-index
      # Type 5 origination: FRR holds the Type 5 unresolved until the
      # companion Type 2 exists, then imports the prefix via the Gateway
      # Address using enable-resolve-overlay-index.
      - name: Run M68 (deploy + test + destroy with retry)
        if: steps.dataplane.outputs.vrf-available == 'true'
        uses: ./.github/actions/run-interop-test
        with:
          label: M68
          topology: tests/interop/m68-evpn-type5-gwip-overlay-index-frr.clab.yml
          script: tests/interop/scripts/test-m68-evpn-type5-gwip-overlay-index-frr.sh

  netns:
    needs: classify_changes
    if: needs.classify_changes.outputs.run_labs == 'true'
    name: Privileged netns selectors (kernel dataplane inventory)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Initialize netns selector receipt
        run: |
          receipt="$RUNNER_TEMP/netns-selector-receipt.log"
          : > "$receipt"
          printf 'NETNS_SELECTOR_RECEIPT=%s\n' "$receipt" >> "$GITHUB_ENV"

      # The Docker netns harness builds its own image and runs the privileged
      # tests inside `docker run --cap-add=NET_ADMIN --cap-add=SYS_ADMIN`, so the
      # netns never leaks to the host namespace. Most selectors are vrf-free and
      # need no host setup beyond Docker (preinstalled). The L3 selectors create
      # a `vrf` device, so the step below loads the vrf module on the host kernel
      # the containers share (skipping the L3 selectors if it cannot be loaded).
      - name: ADR-0059 FDB nexthop group netns tests
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh fdb_nhg

      - name: ADR-0061 FIB runtime netns test
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh fib_runtime

      # This ephemeral hosted invocation denies AF_INET6 to prove the current
      # IPv4-only BFD actor does not depend on that family. Future selectors
      # that open address families can reuse the same opt-in harness profile.
      - name: ADR-0067 BFD runtime netns test (IPv4-only, AF_INET6 absent)
        env:
          SECCOMP_PROFILE: crates/evpn-linux/tests/docker/seccomp-deny-af-inet6.json
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh bfd_runtime

      - name: ADR-0089 VLAN-scoped FDB netns test
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh dataplane_vlan_fdb

      - name: Remote MAC extern-learn netns test
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh dataplane_remote_mac

      - name: VLAN local MAC attribution netns test
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh vlan_local_mac_attribution

      - name: LAN-78 MAC+IP VLAN attribution netns test
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh macip_vlan_attribution

      - name: LAN-64 SVD collect-metadata FDB VNI netns test
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh svd_fdb_vni

      - name: ADR-0091 managed bridge lifecycle netns test
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh managed_bridge

      - name: ADR-0091 managed fixed-VNI VXLAN lifecycle netns test
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh managed_vxlan

      - name: ADR-0091 managed SVD VXLAN lifecycle netns test
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh managed_svd_vxlan

      - name: ADR-0091 managed VLAN upper lifecycle netns test
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh managed_vlan_upper

      - name: ADR-0091 managed bridge plus VXLAN readiness netns test
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh managed_ready

      - name: ADR-0085 link-carrier monitor netns test
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh link_carrier

      - name: Single-active AC-gate netns test
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh ac_gate

      - name: Raw nexthop socket netns tests
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh nexthop_raw

      - name: L2 foreign-takeover preservation netns test
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh foreign_state_l2

      - name: Reserved-NHID non-clobber netns test
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh foreign_state_nhid

      # l3_multipath / l3_all_active_writer create a `vrf` device; the slim
      # hosted Azure kernel ships vrf only via linux-modules-extra for the exact
      # running kernel, which can lag the kernel in the apt mirror
      # (actions/runner-images #7570 / #7587). Load it best-effort on the host
      # (the --cap-add netns containers share the host kernel) and report
      # availability so the L3 selectors skip rather than fail on mirror skew.
      - name: Load vrf kernel module (for the L3 netns selectors)
        id: vrf
        run: |
          set -uo pipefail
          vrf_available=false
          if sudo modprobe vrf 2>/dev/null; then
            vrf_available=true
          else
            sudo timeout 240 apt-get -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
              install -y "linux-modules-extra-$(uname -r)" \
              || echo "::warning::linux-modules-extra-$(uname -r) unavailable or slow"
            if sudo modprobe vrf 2>/dev/null; then
              vrf_available=true
            fi
          fi
          if [ "$vrf_available" = true ]; then
            echo "::notice::vrf available; L3 netns selectors will run"
          else
            echo "::warning::vrf unavailable on this runner (kernel $(uname -r) likely ahead of linux-modules-extra in the apt mirror); L3 netns selectors will skip"
          fi
          echo "vrf-available=${vrf_available}" >> "$GITHUB_OUTPUT"

      - name: LAN-70 L3VNI multipath and FDB-NHG netns proof
        if: steps.vrf.outputs.vrf-available == 'true'
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh l3_multipath

      - name: ADR-0091 managed VRF plus L3VXLAN readiness netns test
        if: steps.vrf.outputs.vrf-available == 'true'
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh managed_ip_vrf_ready

      - name: LAN-76 all-active Type 5 L3 writer netns proof
        if: steps.vrf.outputs.vrf-available == 'true'
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh l3_all_active_writer

      - name: L3 foreign-takeover preservation netns test
        if: steps.vrf.outputs.vrf-available == 'true'
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh foreign_state_l3

      - name: Route-event wake latency netns test
        if: steps.vrf.outputs.vrf-available == 'true'
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh l3_route_event

      - name: L3 route-neighbor-FDB lifecycle netns test
        if: steps.vrf.outputs.vrf-available == 'true'
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh l3_single_path_cycle

      - name: L3 foreign-route preservation netns test
        if: steps.vrf.outputs.vrf-available == 'true'
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh l3_foreign_route_cycle

      - name: Finalize netns selector receipt
        if: always()
        env:
          VRF_AVAILABLE: ${{ steps.vrf.outputs.vrf-available }}
        run: |
          set +e
          python3 scripts/check_netns_selector_receipt.py \
            --receipt "$NETNS_SELECTOR_RECEIPT" \
            --output "$RUNNER_TEMP/netns-selector-receipt.json" \
            --summary "$RUNNER_TEMP/netns-selector-summary.md" \
            --vrf-available "${VRF_AVAILABLE:-false}"
          rc=$?
          cat "$RUNNER_TEMP/netns-selector-summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload netns selector receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: netns-selector-receipt
          path: ${{ runner.temp }}/netns-selector-receipt.json
          if-no-files-found: error
          retention-days: 14

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [classify_changes, grpcurl_archive, gobgp_archive, bird3_archive, prime_dev_image, m36,
      m37, m37-ip, m38, m39, m39b, m48, m60, m61, m62, m40, m42, m50, m52,
      m58, m53, m51, m43, m47, m69, m70, m65, m71, m72, m66,
      m67, m68, netns]
    env:
      NEEDS_CONTEXT: ${{ toJSON(needs) }}
      EXPECTED_JOBS: >-
        classify_changes grpcurl_archive gobgp_archive bird3_archive prime_dev_image
        m36 m37 m37-ip m38 m39
        m39b m48 m60 m61 m62 m40 m42 m50 m52 m58 m53 m51 m43 m47
        m69 m70 m65 m71 m72 m66 m67 m68 netns
    steps:
      - name: Aggregate required Kernel Dataplane result
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_CONTEXT"])
          expected = os.environ["EXPECTED_JOBS"].split()
          if set(needs) != set(expected) or len(needs) != len(expected):
              print(f"aggregate dependency drift: expected={expected} actual={sorted(needs)}")
              sys.exit(1)

          classifier = needs["classify_changes"]
          run_labs = classifier.get("outputs", {}).get("run_labs")
          failed = classifier.get("result") != "success" or run_labs not in {"true", "false"}
          expected_result = "success" if run_labs == "true" else "skipped"
          # The only tolerated deviation: m43 reporting skipped because the
          # bird3 producer succeeded and told us the pinned archive was
          # unavailable upstream. A producer that failed, a corrupt archive, or
          # an m43 that actually ran and failed all remain required failures.
          # The excuse prints
          # next to the roster entry so a tolerated skip never reads like a
          # normal not-applicable one.
          bird3 = needs["bird3_archive"]
          excused = (
              "m43"
              if run_labs == "true"
              and bird3.get("result") == "success"
              and bird3.get("outputs", {}).get("bird3_status") == "unavailable"
              and needs["m43"].get("result") == "skipped"
              else ""
          )
          for job in expected:
              result = needs[job].get("result")
              note = " (bird3 archive unavailable upstream)" if job == excused else ""
              print(f"{job}={result}{note}")
              if job in ("classify_changes", excused):
                  continue
              if result != expected_result:
                  failed = True
          if excused:
              print(
                  "::warning::m43=skipped (bird3 archive unavailable upstream): "
                  "TCP-AO interop against BIRD 3.3.1 did not run in this Kernel "
                  "Dataplane run; this gate passed without that coverage"
              )
          if failed:
              sys.exit(1)
          PY
