  m43:
    name: M43 — ADR-0062 TCP-AO protected session (BIRD 3.2.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-dataplane-host

      - name: Detect TCP-AO kernel support
        id: tcp_ao
        run: |
          set -euo pipefail
          supported=unknown
          if [ -f "/boot/config-$(uname -r)" ]; then
            if grep -q '^CONFIG_TCP_AO=y' "/boot/config-$(uname -r)"; then
              supported=true
            else
              supported=false
            fi
          elif [ -f /proc/config.gz ]; then
            if zgrep -q '^CONFIG_TCP_AO=y' /proc/config.gz; then
              supported=true
            else
              supported=false
            fi
          else
            echo "::warning::Kernel config not readable; M43 will rely on runtime TCP-AO probe"
            supported=true
          fi

          echo "supported=$supported" >> "$GITHUB_OUTPUT"
          if [ "$supported" = "false" ]; then
            echo "::warning::M43 skipped: $(uname -r) does not advertise CONFIG_TCP_AO=y"
          fi

      - name: Build BIRD 3.2.1 TCP-AO image
        if: steps.tcp_ao.outputs.supported == 'true'
        run: docker build -t bird:3.2.1-tcpao -f tests/interop/Dockerfile.bird3 tests/interop

      - name: Run M43 (deploy + test + destroy with retry)
        if: steps.tcp_ao.outputs.supported == 'true'
        uses: ./.github/actions/run-interop-test
        with:
          label: M43
          topology: tests/interop/m43-tcp-ao-bird.clab.yml
          script: tests/interop/scripts/test-m43-tcp-ao-bird.sh

