name: Kernel Dataplane

# Privileged Linux kernel dataplane interop suite. Runs on GitHub-hosted
# `ubuntu-latest`: a spike (2026-05-25) confirmed the hosted Azure kernel + a
# `docker run --cap-add` / passwordless-sudo VM provides everything these tests
# need — bridge + VXLAN FDB, FDB nexthop groups (kernel >= 5.8), real netns
# route tables, CONFIG_TCP_AO, and UDP/3784 BFD. The one gap, the `vrf` module
# (L3VNI / symmetric IRB), is supplied by `linux-modules-extra-<kver>`; the
# `setup-dataplane-host` action loads it. This retired the self-hosted runner.
#
# Each hosted job is an isolated VM, so it runs `setup-dataplane-host` to install
# containerlab (hardened, issue #208) + grpcurl + jq + kernel modules and build
# its own `rustbgpd:dev` (GHA layer cache) — there is no shared persistent daemon
# to fan out from, and stale-topology accumulation (issue #188) can't happen.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify_changes:
    name: Classify kernel heavy-lab paths
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      run_labs: ${{ steps.classify.outputs.run_labs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify complete pull-request diff
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/classify_heavy_ci_paths.py

  grpcurl_archive:
    needs: classify_changes
    if: needs.classify_changes.outputs.run_labs == 'true'
    name: Prepare exact grpcurl archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Restore, prepare, and upload exact grpcurl archive
        uses: ./.github/actions/prepare-grpcurl-artifact

  gobgp_archive:
    needs: classify_changes
    if: needs.classify_changes.outputs.run_labs == 'true'
    name: Prepare exact gobgp archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Restore, prepare, and upload exact gobgp archive
        uses: ./.github/actions/prepare-gobgp-artifact

  # This archive feeds exactly one scenario, m43. Its host is a third party:
  # when it refuses to serve the pinned tarball (nic.cz returned 403 on all
  # three attempts with a cold cache on 2026-08-18) the run is carrying
  # evidence about somebody else's web server, not about rustbgpd, and it
  # hard-failed a release gate. So a *fetch* outage degrades to a loud,
  # non-blocking skip of m43; nothing else does. In particular bytes that DID
  # download and then failed the pinned checksum or source-version check are a
  # supply-chain signal, not an outage, and stay a required failure. install-bird3.sh
  # separates the two by exit code (3 = never fetched, 4 = fetched but
  # unverifiable) and this job republishes the call as bird3_status for the
  # m43 job gate and the check aggregate to read, so neither has to infer
  # intent from a bare job conclusion.
  bird3_archive:
    needs: classify_changes
    if: needs.classify_changes.outputs.run_labs == 'true'
    name: Prepare exact bird3 archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      bird3_status: ${{ steps.prepare.outputs.bird3_status }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Restore exact bird3 archive cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bird3-cache/bird-3.3.1.tar.gz
          key: bird3-v3.3.1-source-d5a8d651d6184c18252954932bb249dfee1fd213b3665cdd86226ac45edc0190
      - name: Prepare exact bird3 archive
        id: prepare
        run: |
          set -uo pipefail
          rc=0
          .github/scripts/install-bird3.sh \
            --prepare-archive \
            "$RUNNER_TEMP/bird3-cache/bird-3.3.1.tar.gz" || rc=$?
          case "$rc" in
            0) status=ok ;;
            3) status=unavailable ;;
            4) status=corrupt ;;
            *) status=error ;;
          esac
          echo "bird3_status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != ok ] && [ "$status" != unavailable ]; then
            exit "$rc"
          fi
      - name: Upload verified bird3 archive
        if: steps.prepare.outputs.bird3_status == 'ok'
        uses: actions/upload-artifact@v7
        with:
          name: bird3-v3.3.1-source
          path: ${{ runner.temp }}/bird3-cache/bird-3.3.1.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Warm one fixed-scope cache per source SHA; jobs still build and load their
  # own image, falling back to an uncached build if the cache is unavailable.
  prime_dev_image:
    needs: classify_changes
    if: needs.classify_changes.outputs.run_labs == 'true'
    name: Prime rustbgpd:dev build cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: rustbgpd-dev-image-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Prime rustbgpd:dev build cache
        uses: ./.github/actions/prime-rustbgpd-dev-cache

  m36:
    needs: [grpcurl_archive, prime_dev_image]
    name: M36 — EVPN VTEP receive FDB programming (FRR 10.3.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dataplane-host
        id: dataplane
      - name: Run M36 (deploy + test + destroy with retry)
        uses: ./.github/actions/run-interop-test
        with:
          label: M36
          topology: tests/interop/m36-evpn-vtep-smoke.clab.yml
          script: tests/interop/scripts/test-m36-evpn-vtep-smoke.sh

  m37:
