  m43:
    name: M43 — TCP-AO live rotation and crash recovery (BIRD 3.3.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dataplane-host
        id: dataplane

      - name: Detect TCP-AO kernel support
        id: tcp_ao
        run: |
          set -euo pipefail
          supported=unknown
          if [ -f "/boot/config-$(uname -r)" ]; then
            if grep -q '^CONFIG_TCP_AO=y' "/boot/config-$(uname -r)"; then
              supported=true
            else
              supported=false
            fi
          elif [ -f /proc/config.gz ]; then
            if zgrep -q '^CONFIG_TCP_AO=y' /proc/config.gz; then
              supported=true
            else
              supported=false
            fi
          else
            echo "::warning::Kernel config not readable; M43 will rely on runtime TCP-AO probe"
            supported=true
          fi

          echo "supported=$supported" >> "$GITHUB_OUTPUT"
          if [ "$supported" = "false" ]; then
            echo "::warning::M43 skipped: $(uname -r) does not advertise CONFIG_TCP_AO=y"
          fi

      - name: Install Rust 1.95 for the direct GET_KEYS receipt
        if: steps.tcp_ao.outputs.supported == 'true'
        uses: dtolnay/rust-toolchain@1.95

      - name: Cache direct GET_KEYS receipt build
        if: steps.tcp_ao.outputs.supported == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: m43-tcp-ao-get-keys

      - name: Run overlapping-owner TCP-AO GET_KEYS kernel receipt
        if: steps.tcp_ao.outputs.supported == 'true'
        run: |
          set -euo pipefail
          receipt='listener::tests::overlapping_tcp_ao_owned_union_kernel_receipt'
          test_count="$({
            cargo test -p rustbgpd-transport --lib -- --list
          } | awk -v target="${receipt}:" \
            '$1 == target && $2 == "test" { count++ } END { print count + 0 }')"
          if [ "$test_count" -ne 1 ]; then
            echo "error: expected exactly one kernel receipt named $receipt; found $test_count" >&2
            exit 1
          fi
          cargo test -p rustbgpd-transport --lib "$receipt" -- \
            --ignored --exact --nocapture

      - name: Run queued-child TCP-AO successor reconciliation receipt
        if: steps.tcp_ao.outputs.supported == 'true'
        run: |
          set -euo pipefail
          receipt='listener::tests::queued_tcp_ao_child_reconciles_immediate_listener_successor'
          test_count="$({
            cargo test -p rustbgpd-transport --lib -- --list
          } | awk -v target="${receipt}:" \
            '$1 == target && $2 == "test" { count++ } END { print count + 0 }')"
          if [ "$test_count" -ne 1 ]; then
            echo "error: expected exactly one kernel receipt named $receipt; found $test_count" >&2
            exit 1
          fi
          cargo test -p rustbgpd-transport --lib "$receipt" -- \
            --ignored --exact --nocapture

      - name: Run TCP-AO deletion and listener-queue boundary receipt
        if: steps.tcp_ao.outputs.supported == 'true'
        run: |
          set -euo pipefail
          receipt='socket_opts::tests::tcp_ao_delete_kernel_receipt_preserves_covering_owners_and_queue_boundary'
          test_count="$({
            cargo test -p rustbgpd-transport --lib -- --list
          } | awk -v target="${receipt}:" \
            '$1 == target && $2 == "test" { count++ } END { print count + 0 }')"
          if [ "$test_count" -ne 1 ]; then
            echo "error: expected exactly one kernel receipt named $receipt; found $test_count" >&2
            exit 1
          fi
          cargo test -p rustbgpd-transport --lib "$receipt" -- \
            --ignored --exact --nocapture

      # Buildx GHA layer cache (LAN-252): the bird.nic.cz tarball fetch and
      # the full BIRD source build live in layers keyed on the Dockerfile
      # content (which pins BIRD_VERSION and the configure flags), so warm
      # runs skip both the flaky download and the compile; a version bump
      # edits the Dockerfile and naturally invalidates. Buildx itself is set
      # up by setup-dataplane-host above. The dedicated scope keeps this
      # image's cache separate from rustbgpd:dev's.
      - name: Build BIRD 3.3.1 TCP-AO image
        if: steps.tcp_ao.outputs.supported == 'true'
        uses: docker/build-push-action@v7
        with:
          context: tests/interop
          file: tests/interop/Dockerfile.bird3
          load: true
          tags: bird:3.3.1-tcpao
          cache-from: type=gha,scope=bird3-tcpao
          cache-to: type=gha,mode=max,scope=bird3-tcpao,ignore-error=true

      - name: Run M43 (deploy + test + destroy with retry)
        if: steps.tcp_ao.outputs.supported == 'true'
        uses: ./.github/actions/run-interop-test
        with:
          label: M43
          topology: tests/interop/m43-tcp-ao-bird.clab.yml
          script: tests/interop/scripts/test-m43-tcp-ao-bird.sh

      - name: Run M43 crash-restart recovery (deploy + test + destroy with retry)
        if: steps.tcp_ao.outputs.supported == 'true'
        uses: ./.github/actions/run-interop-test
        with:
          label: M43 crash-restart
          topology: tests/interop/m43-tcp-ao-bird.clab.yml
          script: tests/interop/scripts/test-m43-tcp-ao-bird-crash-restart.sh

