name: Kernel Dataplane

# Privileged Linux kernel dataplane interop suite. Runs on the
# self-hosted `kernel-dataplane` runner because these tests need kernel
# features the hosted ubuntu-latest image lacks:
#   - bridge + VXLAN FDB   — real VTEP receive/origination (M36/M37/M37+IP)
#   - shared ESI + metrics — DF election and Type 1/4 origination (M38)
#   - `vrf` module           — L3VNI / symmetric IRB (M39)
#   - bond ES + FDB-NHG      — aliasing dataplane ECMP (M40)
#   - FDB nexthop groups     — kernel >= 5.8 (netns fdb_nhg selectors)
#   - real netns route table — configured-table FIB runtime (M42,
#                              netns fib_runtime selector)
#
# Security: external / non-owner PRs target the protected
# `kernel-dataplane` environment and require maintainer approval before
# code reaches the persistent self-hosted runner. Trusted runs (main,
# schedule, workflow_dispatch, and same-repository PRs opened by lance0)
# use the unprotected `kernel-dataplane-auto` environment.
#
# The runner pool is expected to be multiple runner services on the same
# host, sharing one Docker daemon. The build job creates `rustbgpd:dev`
# once; M39/M40/M42 and the netns selectors can fan out. M36-M38 are
# ordered below to reduce shared-host load while still reporting each
# milestone independently after an earlier smoke fails; each job
# pre-cleans its own topology before deploy.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  schedule:
    # 07:00 UTC nightly — catches dataplane regressions even if a PR
    # author's privileged run was never approved.
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  # The jobs inside one run may execute in parallel across multiple
  # self-hosted runner services, but only one kernel-dataplane workflow
  # run should own the persistent Docker daemon / containerlab namespace
  # at a time.
  group: kernel-dataplane
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-image:
    name: Build rustbgpd:dev image
    runs-on: [self-hosted, linux, kernel-dataplane]
    environment:
      name: ${{ github.event_name == 'pull_request' && (github.actor != 'lance0' || github.event.pull_request.head.repo.full_name != github.repository) && 'kernel-dataplane' || 'kernel-dataplane-auto' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Verify host tooling and kernel support
        run: |
          set -euo pipefail
          for t in docker containerlab grpcurl jq sudo ip; do
            command -v "$t" >/dev/null \
              || { echo "::error::$t not found on the kernel-dataplane runner — see docs/kernel-dataplane-runner.md"; exit 1; }
          done
          sudo -n true
          uname -a
          ip -V
          docker version
          containerlab version
          sudo modprobe vrf vxlan bridge bonding || true
          cleanup_preflight() {
            sudo ip link del vx-ci 2>/dev/null || true
            sudo ip link del br-ci 2>/dev/null || true
            sudo ip link del vrf-ci 2>/dev/null || true
          }
          cleanup_preflight
          trap cleanup_preflight EXIT
          sudo ip link add vrf-ci type vrf table 424242
          sudo ip link add br-ci type bridge
          sudo ip link add vx-ci type vxlan id 4242 local 127.0.0.1 dstport 4789 nolearning

      - name: Build rustbgpd:dev
        run: docker build -t rustbgpd:dev .

  m36:
    name: M36 — EVPN VTEP receive FDB programming (FRR 10.3.1)
    runs-on: [self-hosted, linux, kernel-dataplane]
    needs: build-image
    environment:
      name: ${{ github.event_name == 'pull_request' && (github.actor != 'lance0' || github.event.pull_request.head.repo.full_name != github.repository) && 'kernel-dataplane' || 'kernel-dataplane-auto' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Deploy M36 topology
        run: |
          sudo containerlab destroy -t tests/interop/m36-evpn-vtep-smoke.clab.yml --cleanup 2>/dev/null || true
          sudo containerlab deploy -t tests/interop/m36-evpn-vtep-smoke.clab.yml

      - name: Run M36 test
        run: bash tests/interop/scripts/test-m36-evpn-vtep-smoke.sh

      - name: Destroy topology
        if: always()
        run: sudo containerlab destroy -t tests/interop/m36-evpn-vtep-smoke.clab.yml --cleanup || true

  m37:
    name: M37 — EVPN local MAC origination (FRR 10.3.1)
    runs-on: [self-hosted, linux, kernel-dataplane]
    needs: [build-image, m36]
    if: ${{ !cancelled() && needs.build-image.result == 'success' }}
    environment:
      name: ${{ github.event_name == 'pull_request' && (github.actor != 'lance0' || github.event.pull_request.head.repo.full_name != github.repository) && 'kernel-dataplane' || 'kernel-dataplane-auto' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Deploy M37 topology
        run: |
          sudo containerlab destroy -t tests/interop/m37-evpn-local-origination.clab.yml --cleanup 2>/dev/null || true
          sudo containerlab deploy -t tests/interop/m37-evpn-local-origination.clab.yml

      - name: Run M37 test
        run: bash tests/interop/scripts/test-m37-evpn-local-origination.sh

      - name: Destroy topology
        if: always()
        run: sudo containerlab destroy -t tests/interop/m37-evpn-local-origination.clab.yml --cleanup || true

  m37-ip:
    name: M37+IP — EVPN local MAC/IP origination (FRR 10.3.1)
    runs-on: [self-hosted, linux, kernel-dataplane]
    needs: [build-image, m37]
    if: ${{ !cancelled() && needs.build-image.result == 'success' }}
    environment:
      name: ${{ github.event_name == 'pull_request' && (github.actor != 'lance0' || github.event.pull_request.head.repo.full_name != github.repository) && 'kernel-dataplane' || 'kernel-dataplane-auto' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Deploy M37+IP topology
        run: |
          sudo containerlab destroy -t tests/interop/m37-evpn-mac-ip-origination.clab.yml --cleanup 2>/dev/null || true
          sudo containerlab deploy -t tests/interop/m37-evpn-mac-ip-origination.clab.yml

      - name: Run M37+IP test
        run: bash tests/interop/scripts/test-m37-evpn-mac-ip-origination.sh

      - name: Destroy topology
        if: always()
        run: sudo containerlab destroy -t tests/interop/m37-evpn-mac-ip-origination.clab.yml --cleanup || true

  m38:
    name: M38 — EVPN DF election + Type 1/4 origination
    runs-on: [self-hosted, linux, kernel-dataplane]
    needs: [build-image, m37-ip]
    if: ${{ !cancelled() && needs.build-image.result == 'success' }}
    environment:
      name: ${{ github.event_name == 'pull_request' && (github.actor != 'lance0' || github.event.pull_request.head.repo.full_name != github.repository) && 'kernel-dataplane' || 'kernel-dataplane-auto' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Deploy M38 topology
        run: |
          sudo containerlab destroy -t tests/interop/m38-evpn-df-election.clab.yml --cleanup 2>/dev/null || true
          sudo containerlab deploy -t tests/interop/m38-evpn-df-election.clab.yml

      - name: Run M38 test
        run: bash tests/interop/scripts/test-m38-evpn-df-election.sh

      - name: Destroy topology
        if: always()
        run: sudo containerlab destroy -t tests/interop/m38-evpn-df-election.clab.yml --cleanup || true

  m39:
    name: M39 — EVPN Type 5 symmetric Interface-less IRB (FRR 10.3.1)
    runs-on: [self-hosted, linux, kernel-dataplane]
    needs: build-image
    environment:
      name: ${{ github.event_name == 'pull_request' && (github.actor != 'lance0' || github.event.pull_request.head.repo.full_name != github.repository) && 'kernel-dataplane' || 'kernel-dataplane-auto' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Deploy M39 topology
        # Pre-clean: the runner is persistent, so a crashed prior run
        # could have left containers / netns behind.
        run: |
          sudo containerlab destroy -t tests/interop/m39-evpn-type5-symmetric-irb.clab.yml --cleanup 2>/dev/null || true
          sudo containerlab deploy -t tests/interop/m39-evpn-type5-symmetric-irb.clab.yml

      - name: Run M39 test
        run: bash tests/interop/scripts/test-m39-evpn-type5-symmetric-irb.sh

      - name: Destroy topology
        if: always()
        run: sudo containerlab destroy -t tests/interop/m39-evpn-type5-symmetric-irb.clab.yml --cleanup || true

  m40:
    name: M40 — ADR-0059 aliasing dataplane ECMP (FRR EVPN-MH 10.3.1)
    runs-on: [self-hosted, linux, kernel-dataplane]
    needs: build-image
    environment:
      name: ${{ github.event_name == 'pull_request' && (github.actor != 'lance0' || github.event.pull_request.head.repo.full_name != github.repository) && 'kernel-dataplane' || 'kernel-dataplane-auto' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Deploy M40 topology
        run: |
          sudo containerlab destroy -t tests/interop/m40-evpn-aliasing-ecmp-frr.clab.yml --cleanup 2>/dev/null || true
          sudo containerlab deploy -t tests/interop/m40-evpn-aliasing-ecmp-frr.clab.yml

      - name: Run M40 test
        run: bash tests/interop/scripts/test-m40-evpn-aliasing-ecmp-frr.sh

      - name: Destroy topology
        if: always()
        run: sudo containerlab destroy -t tests/interop/m40-evpn-aliasing-ecmp-frr.clab.yml --cleanup || true

  m42:
    name: M42 — ADR-0061 configured-table unicast FIB runtime (FRR 10.3.1)
    runs-on: [self-hosted, linux, kernel-dataplane]
    needs: build-image
    environment:
      name: ${{ github.event_name == 'pull_request' && (github.actor != 'lance0' || github.event.pull_request.head.repo.full_name != github.repository) && 'kernel-dataplane' || 'kernel-dataplane-auto' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Deploy M42 topology
        run: |
          sudo containerlab destroy -t tests/interop/m42-fib-runtime-frr.clab.yml --cleanup 2>/dev/null || true
          sudo containerlab deploy -t tests/interop/m42-fib-runtime-frr.clab.yml

      - name: Run M42 test
        run: bash tests/interop/scripts/test-m42-fib-runtime-frr.sh

      - name: Destroy topology
        if: always()
        run: sudo containerlab destroy -t tests/interop/m42-fib-runtime-frr.clab.yml --cleanup || true

  netns:
    name: Privileged netns selectors (fdb_nhg + fib_runtime)
    runs-on: [self-hosted, linux, kernel-dataplane]
    environment:
      name: ${{ github.event_name == 'pull_request' && (github.actor != 'lance0' || github.event.pull_request.head.repo.full_name != github.repository) && 'kernel-dataplane' || 'kernel-dataplane-auto' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Verify host tooling
        run: |
          command -v docker >/dev/null \
            || { echo "::error::docker not found on the kernel-dataplane runner — see docs/kernel-dataplane-runner.md"; exit 1; }

      # The Docker netns harness builds its own image and runs the
      # privileged tests inside `docker run --cap-add=NET_ADMIN`, so
      # netns never leaks to the host namespace.
      - name: ADR-0059 FDB nexthop group netns tests
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh fdb_nhg

      - name: ADR-0061 FIB runtime netns test
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh fib_runtime
