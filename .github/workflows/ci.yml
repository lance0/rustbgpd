name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

jobs:
  check:
    runs-on: ubuntu-latest
    # Bound any wedge (e.g. a rustdoc hang) so a stuck step fails fast
    # instead of running to GitHub's 6-hour default. Cold build + clippy
    # (--all-targets) + test (--workspace) + doc fits comfortably under this.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Need history so the wire-readme freshness gate can diff
          # against the previous commit / PR base.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/install-protobuf
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: python3 scripts/check-clippy-reasons.py
      - run: python3 scripts/check-v1-stable-surface.py
      - run: python3 scripts/reflow-release-notes.py --selftest
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `bench-internals` is off by default and its bench target carries
      # `required-features`, so nothing above compiles the feature-gated
      # bench_support surface; it has silently broken before when a
      # manager API grew an argument.
      - run: cargo check -p rustbgpd-rib --features bench-internals --benches
      # Transport has the same feature-gated `bench-internals` bench surface.
      - run: cargo check -p rustbgpd-transport --features bench-internals --benches
      # Same class of gap for the root crate: `bench-internals` exposes
      # `pub mod config` (and its EVPN reload-diff dependencies) in the
      # lib, a surface the default `--all-targets` clippy never compiles.
      # LAN-198: `config` referenced binary-only modules, so the lib
      # failed to build under `--all-features` while the bin stayed green.
      - run: cargo check -p rustbgpd --all-features --lib
      - name: Check standalone scale harnesses and receipt classifiers
        run: |
          set -euo pipefail
          cargo fmt --manifest-path bench/scale/rrharness/Cargo.toml -- --check
          cargo fmt --manifest-path bench/scale/reloadstall/Cargo.toml -- --check
          cargo test --manifest-path bench/scale/rrharness/Cargo.toml --locked
          cargo test --manifest-path bench/scale/reloadstall/Cargo.toml --locked
          python3 bench/scale/rebaseline/test_classifiers.py
      - run: cargo test --workspace
      - run: cargo doc --workspace --lib --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Wire crate README freshness gate
        # Catches the common omission where someone bumps
        # `crates/wire/Cargo.toml` version without revisiting
        # `crates/wire/README.md`. The README is what crates.io and
        # docs.rs render, so a stale RFC table or stale "Key types"
        # list ships to every consumer of the published crate.
        # If wire's version line moved in this diff, require any
        # touch to its README. A whitespace-only edit is acceptable
        # if the README really is current — the gate's purpose is to
        # force a deliberate review, not to enforce content shape.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            # Initial push of a new branch — nothing to diff against.
            echo "no diff base; skipping"
            exit 0
          fi
          if git diff "$base"...HEAD -- crates/wire/Cargo.toml \
              | grep -qE '^\+version\s*='; then
            if ! git diff "$base"...HEAD -- crates/wire/README.md \
                | grep -qE '^[+-]'; then
              echo "::error file=crates/wire/Cargo.toml::wire crate version was bumped but crates/wire/README.md was not touched. Update the RFC table / Key types / examples to reflect what's actually published, then re-push. (A whitespace-only edit is fine if the README really is current.)"
              exit 1
            fi
            echo "wire bump + README touched — gate passed"
          fi

  msrv:
    # Build at the declared `rust-version` (`Cargo.toml`
    # `[workspace.package] rust-version`).
    #
    # Without this, the `check` job above runs on `stable` and can
    # quietly use newer rustc features that don't compile on MSRV.
    # Interop then becomes the catch-net — slow (~5 min per failed
    # Docker build × every M-tag) and only fires after PR merge if
    # PR-CI didn't catch it. Pinning here surfaces MSRV breakage at
    # PR time.
    #
    # Pinned literally to the Dockerfile's builder version
    # (`rust:1.95-bookworm`) — keep them in lockstep when bumping.
    # Bumping is a deliberate decision recorded in the diff of this
    # file alongside `Cargo.toml` and `Dockerfile`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: ./.github/actions/install-protobuf
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache key from the `check` job so MSRV builds don't
          # share artifacts compiled by stable rustc.
          key: msrv-1.95
      - run: cargo check --workspace --all-targets

  evpn_bum_filter_kernel:
    # Runs the Gate 8b BUM-suppression primitive against a real
    # kernel via the Docker harness at
    # `crates/evpn-linux/tests/docker/`. Two tests fire under one
    # invocation:
    #
    # - `bum_filter_spike_validates_kernel_primitive` — shell-driven
    #   topology + `ping -b` + `bridge link set` flag toggle. Asserts
    #   the five load-bearing invariants (DF allows, Non-DF blocks
    #   broadcast/multicast/unknown-unicast, known-unicast survives
    #   Non-DF, restore is symmetric, FDB programming unaffected).
    # - `linux_dataplane_set_bum_port_flags_round_trip` — Rust netlink
    #   round-trip. Asserts `LinuxDataplane::apply` actually lands
    #   `flood off / mcast_flood off / bcast_flood off` on the
    #   kernel-side bridge port.
    #
    # `ubuntu-latest` ships kernel 6.x which has
    # `IFLA_BRPORT_BCAST_FLOOD` (added in 4.18) so the harness's
    # kernel prerequisite is met without runner customization.
    #
    # The harness needs `--cap-add=NET_ADMIN --cap-add=SYS_ADMIN
    # --security-opt apparmor=unconfined`; it does NOT need
    # `--privileged`. GitHub-hosted runners allow all three.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pre-build the harness image with GHA cache so the warm path
      # (no Dockerfile change) skips the `apt-get install` rebuild.
      - name: Build netns-test harness image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/evpn-linux/tests/docker/Dockerfile
          load: true
          tags: rustbgpd-netns-tests:latest
          cache-from: type=gha,scope=evpn-bum-kernel
          cache-to: type=gha,scope=evpn-bum-kernel,mode=max,ignore-error=true

      - name: Run BUM-filter primitive validation
        # The helper handles cap flags + bind-mounts. We pre-built
        # the image via the GHA-cached step above, so SKIP_BUILD=1
        # makes the helper assert the image exists and skip its
        # mtime-based rebuild check (which would otherwise refire
        # the build because every checkout writes fresh mtimes).
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh
        env:
          IMAGE_TAG: rustbgpd-netns-tests:latest
          SKIP_BUILD: "1"
