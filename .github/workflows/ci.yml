name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Placed above `on:` so the trigger-contract self-check below (which
# asserts the exact `on:`..`jobs:` region) stays byte-stable.
permissions:
  contents: read

# Feature branches without a PR must use a draft PR or the local quartet;
# hosted push CI is intentionally main-only to avoid duplicating PR runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

jobs:
  v064_validator:
    name: prepare exact v0.64 config migration validator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The cache avoids a release fetch across runs. Its key seals the exact
      # release checksum and deliberately has no partial restore fallback.
      - name: Restore exact v0.64 validator archive cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/rustbgpd-v064-cache/rustbgpd-linux-amd64.tar.gz
          key: rustbgpd-v0.64.0-linux-amd64-bd4829de08d0c50074f9ecd5c351399fae42be06d456b3880a04aa4a7cda1137
      - name: Prepare exact v0.64 validator archive
        run: |
          bash -n .github/scripts/install-rustbgpd-v064-validator.sh
          shellcheck .github/scripts/install-rustbgpd-v064-validator.sh
          .github/scripts/install-rustbgpd-v064-validator.sh --self-test
          .github/scripts/install-rustbgpd-v064-validator.sh \
            --prepare-archive \
            "$RUNNER_TEMP/rustbgpd-v064-cache/rustbgpd-linux-amd64.tar.gz"
      # Consumers use this same-run artifact instead of independently reaching
      # GitHub Releases. They verify its pinned checksum again before extract.
      - name: Upload verified v0.64 validator archive
        uses: actions/upload-artifact@v7
        with:
          name: rustbgpd-v0.64.0-linux-amd64
          path: ${{ runner.temp }}/rustbgpd-v064-cache/rustbgpd-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  core:
    runs-on: ubuntu-latest
    # Bound any wedge (e.g. a rustdoc hang) so a stuck step fails fast
    # instead of running to GitHub's 6-hour default. The last serial run
    # took 24m32; extracting the 9m10 scale/receipt block should leave this
    # lane near 15 minutes. Keep the inherited 45-minute ceiling until
    # hosted receipts establish a safe tighter bound.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Need history so the published-crate README freshness gate can diff
          # against the previous commit / PR base.
          fetch-depth: 0
      - name: Check CI trigger contract
        shell: bash
        run: |
          actual="$(sed -n '/^on:/,/^jobs:/p' .github/workflows/ci.yml | sed '$d')"
          expected='on:
            push:
              branches: [main]
              paths-ignore:
                - "**/*.md"
            pull_request:
              paths-ignore:
                - "**/*.md"'
          if [[ "$actual" != "$expected" ]]; then
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            echo "CI triggers must keep main-only pushes, all PRs, and Markdown ignores" >&2
            exit 1
          fi
      - name: Install exact developer linters
        shell: bash
        run: |
          bash -n .github/scripts/install-developer-linters.sh
          shellcheck .github/scripts/install-developer-linters.sh
          .github/scripts/install-developer-linters.sh \
            "$RUNNER_TEMP/developer-linters"
          echo "$RUNNER_TEMP/developer-linters" >> "$GITHUB_PATH"
      - name: Prove developer-tooling lint failures are enforced
        run: python3 scripts/check_developer_tooling.py --self-test
      - name: Check Python and GitHub Actions developer tooling
        run: python3 scripts/check_developer_tooling.py
      # The chooser's security link once pointed at a posture doc and a
      # nonexistent security email; keep it pinned to the private
      # vulnerability-reporting intake so it cannot silently drift again.
      - name: Check issue-chooser security link targets private vulnerability reporting
        run: |
          grep -q 'https://github.com/lance0/rustbgpd/security/advisories/new' \
            .github/ISSUE_TEMPLATE/config.yml
      - name: Check pinned grpcurl installer contract
        shell: bash
        run: |
          bash -n .github/scripts/install-grpcurl.sh
          shellcheck .github/scripts/install-grpcurl.sh
          bash .github/scripts/install-grpcurl.sh --self-test
      - name: Prove CI image-primer contract
        run: |
          python3 -m unittest -v scripts/test_check_ci_image_primer_contract.py
          python3 scripts/check_ci_image_primer_contract.py
      - name: Prove CI scale split contract
        run: |
          python3 -m unittest -v scripts/test_check_ci_scale_split_contract.py
          python3 scripts/check_ci_scale_split_contract.py
      # The Kernel Dataplane gate tolerates exactly one skip (m43, when the
      # third-party bird3 archive is unavailable upstream). Execute the real
      # aggregate body and the installer's outage/corruption split here so the
      # tolerance cannot silently widen into a gate that no longer fails.
      - name: Prove kernel-dataplane bird3 outage tolerance
        run: |
          python3 -m unittest -v scripts/test_kernel_dataplane_bird3_tolerance.py
      - uses: dtolnay/rust-toolchain@v1 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: ./.github/actions/install-protobuf
      - uses: Swatinem/rust-cache@v2
      - name: Prove exact fail-closed fuzz target inventory
        run: |
          python3 -m unittest -v scripts/test_check_fuzz_target_inventory.py
          python3 scripts/check_fuzz_target_inventory.py
      # A reintroduced floating toolchain stays invisible until an upstream
      # compiler break takes the scheduled campaign down, and the failure then
      # reads as if it came from this repository.
      - name: Prove every fuzz-toolchain consumer reads the reviewed pin
        run: |
          python3 -m unittest -v scripts/test_check_fuzz_toolchain_pin.py
          python3 scripts/check_fuzz_toolchain_pin.py
      - name: Install receipt-tool dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - run: cargo fmt --check
      - name: Check clippy suppression reasons
        run: |
          python3 -m unittest -v scripts/test_check_clippy_reasons.py
          python3 scripts/check-clippy-reasons.py
      - name: Check shared interop helpers
        run: |
          bash -n tests/interop/scripts/test-lib.sh \
            tests/interop/scripts/test-test-operator-auth-helper.sh \
            tests/interop/scripts/test-test-vtep-route-oracles.sh \
            tests/interop/scripts/test-m1-frr.sh
          shellcheck -x tests/interop/scripts/test-lib.sh \
            tests/interop/scripts/test-test-operator-auth-helper.sh \
            tests/interop/scripts/test-test-vtep-route-oracles.sh \
            tests/interop/scripts/test-m1-frr.sh
          bash tests/interop/scripts/test-test-operator-auth-helper.sh
          bash tests/interop/scripts/test-test-vtep-route-oracles.sh
      - run: python3 scripts/check-v1-stable-surface.py
      - run: python3 scripts/reflow-release-notes.py --selftest
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # `tokio-codec` is intentionally off by default, so the workspace lint
      # above does not compile its public adapter, tests, or example.
      - run: cargo clippy --locked -p rustbgpd-wire --all-targets --features tokio-codec -- -D warnings
      # `bench-internals` is off by default and its bench target carries
      # `required-features`, so nothing above compiles the feature-gated
      # bench_support surface; it has silently broken before when a
      # manager API grew an argument.
      - run: cargo check --locked -p rustbgpd-rib --features bench-internals --benches
      # Transport has the same feature-gated `bench-internals` bench surface.
      - run: cargo check --locked -p rustbgpd-transport --features bench-internals --benches
      # API owns the feature-gated event-history producer bench.
      - run: cargo check --locked -p rustbgpd-api --features bench-internals --benches
      # `cargo check` above proves the bench targets compile, not that they run.
      # A fixture the codec later made illegal (RFC 9774 AS_SET in the wire
      # `rich` AS_PATH) compiled clean and panicked on first iteration, so two
      # benchmark groups stopped executing without any gate noticing. `cargo
      # test --bench` runs every Criterion body once; bounded native CLI
      # fixtures exercise both paging receipt harnesses. Smoke only — no timings.
      - name: Smoke benchmark targets without dedicated checks
        run: bash bench/smoke-benches.sh --locked
      - name: Smoke selection-deferral release receipt
        run: cargo test --locked -p rustbgpd-rib --features bench-internals --bench selection_deferral_release -- --self-test
      # LAN-572 keeps the real MRT snapshot encoder benchmark usable in both
      # deliberately incompatible builds: bare-jemalloc timing, and opt-in
      # allocation/growth diagnostics.  `--smoke` bounds both executions for
      # the PR critical path while retaining the harness's path assertions.
      - name: Smoke MRT snapshot allocation benchmark modes
        run: |
          cargo test --locked -p rustbgpd-mrt --bench snapshot_allocation -- timing --candidate --smoke
          cargo test --locked -p rustbgpd-mrt --features snapshot-allocation-diagnostics --bench snapshot_allocation -- diagnostic --candidate --smoke
      # Same class of gap for the root crate: `bench-internals` exposes
      # `pub mod config` (and its EVPN reload-diff dependencies) in the
      # lib, a surface the default `--all-targets` clippy never compiles.
      # LAN-198: `config` referenced binary-only modules, so the lib
      # failed to build under `--all-features` while the bin stayed green.
      - run: cargo check --locked -p rustbgpd --all-features --lib
      # The root `Config` API is exported only by `bench-internals`, so the
      # normal workspace test cannot compile this cheap allocation gate.
      - name: Gate eager policy-set sharing allocation shape
        run: cargo test --locked -p rustbgpd --no-default-features --features bench-internals --test policy_set_store_allocation shared_set_batch_allocations_do_not_scale_per_peer -- --exact
      # jemalloc became the default feature; keep the stock-glibc build
      # compiling (debug/fallback builds use it) while independently exercising
      # the daemon's unconditional deny(unsafe_code) with no allocator feature.
      - run: cargo check --locked -p rustbgpd --no-default-features --all-targets
      - name: Verify committed RIB rebaseline receipt
        run: |
          set -euo pipefail
          receipt=docs/perf/artifacts/rib-rebaseline-2026-07-13
          cpu_dir="$RUNNER_TEMP/rib-rebaseline-cpu"
          (cd "$receipt" && sha256sum -c SHA256SUMS)
          mkdir "$cpu_dir"
          tar -xzf "$receipt/cpu-folded-profiles.tar.gz" -C "$cpu_dir"
          (cd "$cpu_dir" && sha256sum -c folded-SHA256SUMS)
          for profile in "$cpu_dir"/*.folded; do
            stem=$(basename "$profile" .folded)
            python3 bench/scale/rebaseline/classify_cpu.py "$profile" \
              --check "$receipt/$stem.cpu.tsv"
          done
          python3 bench/scale/rebaseline/classify_dhat.py \
            --from-derivative "$receipt/2p-100k.dhat-derivative.tsv" \
            --check "$receipt/2p-100k.memory.tsv"
          # The raw bgperf capture is never committed, so the CSV numerics
          # cannot be re-derived here (unlike the CPU/DHAT legs above). This
          # leg validates structure, schema, convergence, bounds, and
          # canonical form of the sanitized receipt only.
          python3 bench/scale/rebaseline/sanitize_bgperf_csv.py \
            --from-sanitized "$receipt/2p-100k.csv" >/dev/null
      - name: Verify committed known-path accounting receipt
        run: |
          set -euo pipefail
          receipt=docs/perf/artifacts/known-path-accounting-2026-07
          (cd "$receipt" && sha256sum -c SHA256SUMS)
          for variant in baseline candidate; do
            python3 bench/scale/rebaseline/classify_dhat.py \
              --from-derivative "$receipt/$variant.dhat-derivative.tsv" \
              --check "$receipt/$variant.memory.tsv"
          done
      - name: Verify committed explain-cache DHAT receipt
        run: |
          set -euo pipefail
          receipt=docs/perf/artifacts/explain-cache-opt-in-2026-07
          (cd "$receipt" && sha256sum -c SHA256SUMS)
          for variant in D3-explain-true D4-explain-false; do
            derivative="$RUNNER_TEMP/$variant.dhat-derivative.tsv"
            gzip -cd "$receipt/dhat/$variant.dhat-derivative.tsv.gz" \
              > "$derivative"
            python3 bench/scale/rebaseline/classify_dhat.py \
              --from-derivative "$derivative" \
              --check "$receipt/dhat/$variant.memory.tsv"
          done
      - name: Verify policy-attribution Criterion receipt
        run: |
          set -euo pipefail
          receipt=docs/perf/artifacts/policy-attribution-criterion-2026-07
          python3 "$receipt/verify.py"
          (cd "$receipt" && sha256sum -c SHA256SUMS)
      - name: Check event-history host-fence and naming guards
        run: |
          set -euo pipefail
          bash docs/perf/test-event-history-host-fence.sh
          bash docs/perf/test-event-history-naming.sh
          shellcheck -x \
            docs/perf/event-history-host-fence.sh \
            docs/perf/test-event-history-host-fence.sh \
            docs/perf/test-event-history-naming.sh
      - name: Published crate README freshness gate
        # A published crate's README is its crates.io landing page and the
        # repository usage guide. If an independently versioned library moves,
        # require a deliberate review of its RFC table, key-type roster, and
        # examples.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            # Initial push of a new branch — nothing to diff against.
            echo "no diff base; skipping"
            exit 0
          fi
          for crate in wire fsm rpki; do
            if git diff "$base"...HEAD -- "crates/$crate/Cargo.toml" \
                | grep -qE '^\+version\s*='; then
              if ! git diff "$base"...HEAD -- "crates/$crate/README.md" \
                  | grep -qE '^[+-]'; then
                echo "::error file=crates/$crate/Cargo.toml::$crate crate version was bumped but crates/$crate/README.md was not touched. Update its RFC / key-type / example contract to reflect what is actually published, then re-push."
                exit 1
              fi
              echo "$crate bump + README touched — gate passed"
            fi
          done

  core_tests:
    name: core tests / rustdoc
    needs: v064_validator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1 # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/install-protobuf
      - uses: Swatinem/rust-cache@v2
      - name: Download verified v0.64 validator archive
        uses: actions/download-artifact@v8
        with:
          name: rustbgpd-v0.64.0-linux-amd64
          path: ${{ runner.temp }}/rustbgpd-v064-artifact
      - name: Install exact v0.64 config migration validator offline
        run: |
          .github/scripts/install-rustbgpd-v064-validator.sh \
            --install-archive \
            "$RUNNER_TEMP/rustbgpd-v064-artifact/rustbgpd-linux-amd64.tar.gz" \
            "$RUNNER_TEMP/rustbgpd-v064"
      - run: cargo test --locked --workspace
        env:
          RUSTBGPD_V064_VALIDATOR: ${{ runner.temp }}/rustbgpd-v064/rustbgpd-v0.64.0
      - run: cargo test --locked -p rustbgpd-wire --features tokio-codec
      - run: cargo doc --locked --workspace --lib --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo doc --locked -p rustbgpd --bin rustbgpd --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo doc --locked -p rustbgpctl --bin rbgp --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo doc --locked -p rustbgpd-wire --lib --no-deps --features tokio-codec
        env:
          RUSTDOCFLAGS: "-D warnings"

  scale_receipts:
    name: scale / receipt checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # test-rrharness-driver resolves a retained pin commit and creates a
          # detached worktree at that exact revision.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: ./.github/actions/install-protobuf
      - uses: Swatinem/rust-cache@v2
      - name: Install receipt-tool dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Check standalone scale harnesses and receipt classifiers
        run: |
          set -euo pipefail
          cargo fmt --manifest-path bench/scale/rrharness/Cargo.toml -- --check
          cargo fmt --manifest-path bench/scale/rrtransport/Cargo.toml -- --check
          cargo fmt --manifest-path bench/scale/reloadstall/Cargo.toml -- --check
          cargo fmt --manifest-path bench/scale/enhanced-route-refresh/Cargo.toml -- --check
          cargo test --manifest-path bench/scale/rrharness/Cargo.toml --locked
          cargo test --manifest-path bench/scale/rrtransport/Cargo.toml --locked
          cargo test --manifest-path bench/scale/reloadstall/Cargo.toml --locked
          cargo test --manifest-path bench/scale/enhanced-route-refresh/Cargo.toml --locked
          cargo clippy --manifest-path bench/scale/rrtransport/Cargo.toml \
            --locked --all-targets -- -D warnings
          cargo run --manifest-path bench/scale/rrtransport/Cargo.toml --locked -- smoke
          rrtransport_receipt=$(mktemp -d)
          bench/scale/rrtransport/run-receipt.sh --real-smoke "$rrtransport_receipt"
          bash bench/tests/test-rrtransport-receipt.sh
          bash bench/tests/test-scale-provenance.sh
          cargo clippy --manifest-path bench/scale/enhanced-route-refresh/Cargo.toml \
            --locked --all-targets -- -D warnings
          # The IRR manifest contract exercises the production rustbgpd
          # renderer, so make that prerequisite explicit on a clean runner.
          cargo build --locked -p rs-config-render
          cargo test --locked --test reloadstall_scenario_emitted_check
          python3 bench/scale/irrreload/verify-receipt.py self-test
          python3 bench/scale/irrreload/verify-receipt.py authoritative-publication \
            --artifact-dir docs/perf/artifacts/reload-authoritative-batch-discriminator-2026-08
          bash -n bench/compare-criterion.sh bench/tests/test-compare-criterion-harness.sh
          shellcheck bench/compare-criterion.sh bench/tests/test-compare-criterion-harness.sh
          bash -n bench/compare-rib-memory.sh bench/tests/test-rib-memory-comparator.sh
          shellcheck bench/compare-route-paging.sh \
            bench/compare-rib-memory.sh \
            bench/tests/test-rib-memory-comparator.sh
          shellcheck bench/smoke-benches.sh
          bash -n bench/scale/route-server-1000/run-receipt.sh
          bash -n bench/scale/host-quiet.sh
          bash -n bench/scale/provenance.sh
          bash -n bench/scale/matrix/run-matrix.sh
          bash -n bench/scale/irrreload/run-irr-reload.sh
          bash -n bench/scale/enhanced-route-refresh/run-receipt.sh
          bash -n bench/scale/rrtransport/run-receipt.sh
          bash -n bench/tests/test-rrtransport-receipt.sh
          bash -n bench/tests/test-scale-provenance.sh
          bash -n bench/tests/test-route-server-1000-receipt.sh
          bash -n bench/tests/test-scale-host-quiet.sh
          bash -n bench/tests/test-vpn-query-receipt.sh
          bash -n bench/tests/test-vpn-query-campaign.sh
          bash -n bench/run-vpn-query-campaign.sh
          bash -n bench/netns-calibration/run-vm.sh \
            bench/netns-calibration/guest-smoke.sh \
            bench/tests/test-netns-calibration-vm.sh
          shellcheck bench/scale/host-quiet.sh \
            bench/scale/provenance.sh \
            bench/scale/matrix/run-matrix.sh \
            bench/scale/irrreload/run-irr-reload.sh \
            bench/scale/route-server-1000/run-receipt.sh \
            bench/scale/enhanced-route-refresh/run-receipt.sh \
            bench/scale/rrtransport/run-receipt.sh \
            bench/tests/test-rrtransport-receipt.sh \
            bench/tests/test-scale-provenance.sh \
            bench/tests/test-route-server-1000-receipt.sh \
            bench/tests/test-scale-host-quiet.sh \
            bench/scale/compare-rrharness.sh
          shellcheck bench/tests/test-vpn-query-receipt.sh
          shellcheck bench/tests/test-vpn-query-campaign.sh \
            bench/run-vpn-query-campaign.sh
          shellcheck -x bench/netns-calibration/run-vm.sh \
            bench/netns-calibration/guest-smoke.sh \
            bench/tests/test-netns-calibration-vm.sh
          bash bench/tests/test-route-server-1000-receipt.sh
          bash bench/tests/test-scale-host-quiet.sh
          bash bench/tests/test-vpn-query-receipt.sh
          bash bench/tests/test-vpn-query-campaign.sh
          bash bench/tests/test-compare-criterion-harness.sh
          bash bench/tests/test-rib-memory-comparator.sh
          bash bench/tests/test-route-paging-driver.sh
          bash bench/tests/test-netns-calibration-vm.sh
          python3 bench/tests/test_verify_mrt_attribute_scratch_campaign.py
          bash -n bench/scale/compare-rrharness.sh
          bash bench/tests/test-rrharness-driver.sh
          python3 -m unittest discover \
            -s bench/scale/enhanced-route-refresh -p 'test_*.py'
          python3 -m unittest -v tests/soak/test_intern_churn_analyzers.py
          python3 -m unittest -v tests/soak/test_gate8b_recovery_contract.py
          python3 -m unittest -v tests/soak/test_m67_link_drain_analyzer.py
          python3 -m unittest -v tests/soak/test_analyze_soak_rs_flagship.py
          python3 -m unittest -v tests/soak/test_analyze_soak_rr_flagship.py
          shellcheck -x tests/soak/run-soak-rs-flagship.sh
          shellcheck -x tests/soak/run-soak-rr-flagship.sh
          python3 bench/scale/rebaseline/test_classifiers.py
          python3 bench/scale/rebaseline/test_parse_rrharness.py
          python3 bench/scale/rebaseline/test_validate_lan395_criterion.py
          python3 bench/tests/test_verify_mrt_growth_campaign.py
          (
            cd docs/perf/artifacts/enhanced-route-refresh-2026-07
            sha256sum -c SHA256SUMS
          )
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [v064_validator, core, core_tests, scale_receipts]
    env:
      V064_VALIDATOR_RESULT: ${{ needs.v064_validator.result }}
      CORE_RESULT: ${{ needs.core.result }}
      CORE_TESTS_RESULT: ${{ needs.core_tests.result }}
      SCALE_RECEIPTS_RESULT: ${{ needs.scale_receipts.result }}
    steps:
      - name: Aggregate required CI result
        run: |
          set -euo pipefail
          printf 'v064_validator=%s\n' "$V064_VALIDATOR_RESULT"
          printf 'core=%s\n' "$CORE_RESULT"
          printf 'core_tests=%s\n' "$CORE_TESTS_RESULT"
          printf 'scale_receipts=%s\n' "$SCALE_RECEIPTS_RESULT"
          if [[ "$V064_VALIDATOR_RESULT" != "success" || "$CORE_RESULT" != "success" || "$CORE_TESTS_RESULT" != "success" || "$SCALE_RECEIPTS_RESULT" != "success" ]]; then
            exit 1
          fi

  msrv:
    # Build at the declared `rust-version` (`Cargo.toml`
    # `[workspace.package] rust-version`).
    #
    # Without this, the `check` job above runs on `stable` and can
    # quietly use newer rustc features that don't compile on MSRV.
    # Interop then becomes the catch-net — slow (~5 min per failed
    # Docker build × every M-tag) and only fires after PR merge if
    # PR-CI didn't catch it. Pinning here surfaces MSRV breakage at
    # PR time.
    #
    # Pinned literally to the Dockerfile's builder version
    # (`rust:1.95-bookworm`) — keep them in lockstep when bumping.
    # Bumping is a deliberate decision recorded in the diff of this
    # file alongside `Cargo.toml` and `Dockerfile`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1 # 1.95
        with:
          toolchain: "1.95"
      - uses: ./.github/actions/install-protobuf
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache key from the `check` job so MSRV builds don't
          # share artifacts compiled by stable rustc.
          key: msrv-1.95
      - run: cargo check --locked --workspace --all-targets

  evpn_bum_filter_kernel:
    # Runs the Gate 8b BUM-suppression primitive against a real
    # kernel via the Docker harness at
    # `crates/evpn-linux/tests/docker/`. Two tests fire under one
    # invocation:
    #
    # - `bum_filter_spike_validates_kernel_primitive` — shell-driven
    #   topology + `ping -b` + `bridge link set` flag toggle. Asserts
    #   the five load-bearing invariants (DF allows, Non-DF blocks
    #   broadcast/multicast/unknown-unicast, known-unicast survives
    #   Non-DF, restore is symmetric, FDB programming unaffected).
    # - `linux_dataplane_set_bum_port_flags_round_trip` — Rust netlink
    #   round-trip. Asserts `LinuxDataplane::apply` actually lands
    #   `flood off / mcast_flood off / bcast_flood off` on the
    #   kernel-side bridge port.
    #
    # `ubuntu-latest` ships kernel 6.x which has
    # `IFLA_BRPORT_BCAST_FLOOD` (added in 4.18) so the harness's
    # kernel prerequisite is met without runner customization.
    #
    # The harness needs `--cap-add=NET_ADMIN --cap-add=SYS_ADMIN
    # --security-opt apparmor=unconfined`; it does NOT need
    # `--privileged`. GitHub-hosted runners allow all three.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pre-build the harness image with GHA cache so the warm path
      # (no Dockerfile change) skips the `apt-get install` rebuild.
      - name: Build netns-test harness image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/evpn-linux/tests/docker/Dockerfile
          load: true
          tags: rustbgpd-netns-tests:latest
          cache-from: type=gha,scope=evpn-bum-kernel
          cache-to: type=gha,scope=evpn-bum-kernel,mode=max,ignore-error=true

      - name: Run BUM-filter primitive validation
        # The helper handles cap flags + bind-mounts. We pre-built
        # the image via the GHA-cached step above, so SKIP_BUILD=1
        # makes the helper assert the image exists and skip its
        # mtime-based rebuild check (which would otherwise refire
        # the build because every checkout writes fresh mtimes).
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh
        env:
          IMAGE_TAG: rustbgpd-netns-tests:latest
          SKIP_BUILD: "1"
