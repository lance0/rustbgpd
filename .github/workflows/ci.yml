name: CI

# Placed above `on:` so the trigger-contract self-check below (which
# asserts the exact `on:`..`jobs:` region) stays byte-stable.
permissions:
  contents: read

# Feature branches without a PR must use a draft PR or the local quartet;
# hosted push CI is intentionally main-only to avoid duplicating PR runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

jobs:
  check:
    runs-on: ubuntu-latest
    # Bound any wedge (e.g. a rustdoc hang) so a stuck step fails fast
    # instead of running to GitHub's 6-hour default. Recent green runs
    # now reach the mid-30-minute range; the previous 30-minute bound sat
    # inside normal hosted-runner variance and cancelled two healthy runs
    # mid `cargo test --workspace`. Keep the 45-minute ceiling above that
    # observed green range.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Need history so the wire-readme freshness gate can diff
          # against the previous commit / PR base.
          fetch-depth: 0
      - name: Check CI trigger contract
        shell: bash
        run: |
          actual="$(sed -n '/^on:/,/^jobs:/p' .github/workflows/ci.yml | sed '$d')"
          expected='on:
            push:
              branches: [main]
              paths-ignore:
                - "**/*.md"
            pull_request:
              paths-ignore:
                - "**/*.md"'
          if [[ "$actual" != "$expected" ]]; then
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            echo "CI triggers must keep main-only pushes, all PRs, and Markdown ignores" >&2
            exit 1
          fi
      # The chooser's security link once pointed at a posture doc and a
      # nonexistent security email; keep it pinned to the private
      # vulnerability-reporting intake so it cannot silently drift again.
      - name: Check issue-chooser security link targets private vulnerability reporting
        run: |
          grep -q 'https://github.com/lance0/rustbgpd/security/advisories/new' \
            .github/ISSUE_TEMPLATE/config.yml
      - name: Check pinned grpcurl installer contract
        shell: bash
        run: |
          bash -n .github/scripts/install-grpcurl.sh
          shellcheck .github/scripts/install-grpcurl.sh
          bash .github/scripts/install-grpcurl.sh --self-test
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: ./.github/actions/install-protobuf
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Prove exact fail-closed fuzz target inventory
        run: |
          python3 -m unittest -v scripts/test_check_fuzz_target_inventory.py
          python3 scripts/check_fuzz_target_inventory.py
      # A reintroduced floating toolchain stays invisible until an upstream
      # compiler break takes the scheduled campaign down, and the failure then
      # reads as if it came from this repository.
      - name: Prove every fuzz-toolchain consumer reads the reviewed pin
        run: |
          python3 -m unittest -v scripts/test_check_fuzz_toolchain_pin.py
          python3 scripts/check_fuzz_toolchain_pin.py
      - name: Install receipt-tool dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - run: cargo fmt --check
      - name: Check clippy suppression reasons
        run: |
          python3 -m unittest -v scripts/test_check_clippy_reasons.py
          python3 scripts/check-clippy-reasons.py
      - name: Check shared test-only interop authentication helper
        run: |
          bash -n tests/interop/scripts/test-lib.sh \
            tests/interop/scripts/test-test-operator-auth-helper.sh \
            tests/interop/scripts/test-m1-frr.sh
          shellcheck -x tests/interop/scripts/test-lib.sh \
            tests/interop/scripts/test-test-operator-auth-helper.sh \
            tests/interop/scripts/test-m1-frr.sh
          bash tests/interop/scripts/test-test-operator-auth-helper.sh
      - run: python3 scripts/check-v1-stable-surface.py
      - run: python3 scripts/reflow-release-notes.py --selftest
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `bench-internals` is off by default and its bench target carries
      # `required-features`, so nothing above compiles the feature-gated
      # bench_support surface; it has silently broken before when a
      # manager API grew an argument.
      - run: cargo check -p rustbgpd-rib --features bench-internals --benches
      # Transport has the same feature-gated `bench-internals` bench surface.
      - run: cargo check -p rustbgpd-transport --features bench-internals --benches
      # API owns the feature-gated event-history producer bench.
      - run: cargo check -p rustbgpd-api --features bench-internals --benches
      # `--no-run` above proves the bench targets compile, not that they run.
      # A fixture the codec later made illegal (RFC 9774 AS_SET in the wire
      # `rich` AS_PATH) compiled clean and panicked on first iteration, so two
      # benchmark groups stopped executing without any gate noticing. Criterion
      # `--test` mode runs every benchmark body once, unmeasured, which is what
      # separates "broken" from "nobody ran it". Smoke only — no timings.
      - name: Smoke every criterion bench target
        run: bash bench/smoke-benches.sh
      # LAN-572 keeps the real MRT snapshot encoder benchmark usable in both
      # deliberately incompatible builds: bare-jemalloc timing, and opt-in
      # allocation/growth diagnostics.  `--smoke` bounds both executions for
      # the PR critical path while retaining the harness's path assertions.
      - name: Smoke MRT snapshot allocation benchmark modes
        run: |
          cargo test -p rustbgpd-mrt --bench snapshot_allocation -- timing --candidate --smoke
          cargo test -p rustbgpd-mrt --features snapshot-allocation-diagnostics --bench snapshot_allocation -- diagnostic --candidate --smoke
      # Same class of gap for the root crate: `bench-internals` exposes
      # `pub mod config` (and its EVPN reload-diff dependencies) in the
      # lib, a surface the default `--all-targets` clippy never compiles.
      # LAN-198: `config` referenced binary-only modules, so the lib
      # failed to build under `--all-features` while the bin stayed green.
      - run: cargo check -p rustbgpd --all-features --lib
      # The root `Config` API is exported only by `bench-internals`, so the
      # normal workspace test cannot compile this cheap allocation gate.
      - name: Gate eager policy-set sharing allocation shape
        run: cargo test -p rustbgpd --no-default-features --features bench-internals --test policy_set_store_allocation shared_set_batch_allocations_do_not_scale_per_peer -- --exact
      # jemalloc became the default feature; keep the stock-glibc build
      # compiling (debug/fallback builds use it) and keep the
      # deny(unsafe_code) lint posture — it is only armed when neither
      # allocator feature is on, so the default build no longer checks it.
      - run: cargo check -p rustbgpd --no-default-features --all-targets
      - name: Check standalone scale harnesses and receipt classifiers
        run: |
          set -euo pipefail
          cargo fmt --manifest-path bench/scale/rrharness/Cargo.toml -- --check
          cargo fmt --manifest-path bench/scale/rrtransport/Cargo.toml -- --check
          cargo fmt --manifest-path bench/scale/reloadstall/Cargo.toml -- --check
          cargo fmt --manifest-path bench/scale/outbound-prefix-limits/Cargo.toml -- --check
          cargo fmt --manifest-path bench/scale/config-persistence/Cargo.toml -- --check
          cargo fmt --manifest-path bench/scale/enhanced-route-refresh/Cargo.toml -- --check
          cargo fmt --manifest-path bench/scale/outbound-prefix-limit-scale/Cargo.toml -- --check
          cargo test --manifest-path bench/scale/rrharness/Cargo.toml --locked
          cargo test --manifest-path bench/scale/rrtransport/Cargo.toml --locked
          cargo test --manifest-path bench/scale/reloadstall/Cargo.toml --locked
          cargo test --manifest-path bench/scale/outbound-prefix-limits/Cargo.toml --locked
          cargo test --manifest-path bench/scale/config-persistence/Cargo.toml --locked
          cargo test --manifest-path bench/scale/enhanced-route-refresh/Cargo.toml --locked
          cargo test --manifest-path bench/scale/outbound-prefix-limit-scale/Cargo.toml --locked
          cargo clippy --manifest-path bench/scale/outbound-prefix-limits/Cargo.toml \
            --locked --all-targets -- -D warnings
          cargo clippy --manifest-path bench/scale/rrtransport/Cargo.toml \
            --locked --all-targets -- -D warnings
          cargo run --manifest-path bench/scale/rrtransport/Cargo.toml --locked -- smoke
          rrtransport_receipt=$(mktemp -d)
          bench/scale/rrtransport/run-receipt.sh --real-smoke "$rrtransport_receipt"
          bash bench/tests/test-rrtransport-receipt.sh
          cargo clippy --manifest-path bench/scale/config-persistence/Cargo.toml \
            --locked --all-targets -- -D warnings
          cargo clippy --manifest-path bench/scale/enhanced-route-refresh/Cargo.toml \
            --locked --all-targets -- -D warnings
          cargo clippy --manifest-path bench/scale/outbound-prefix-limit-scale/Cargo.toml \
            --locked --all-targets -- -D warnings
          # The IRR manifest contract exercises the production rustbgpd
          # renderer, so make that prerequisite explicit on a clean runner.
          cargo build -p rs-config-render
          cargo test --test reloadstall_scenario_emitted_check
          bash -n bench/compare-criterion.sh
          shellcheck bench/smoke-benches.sh
          bash -n bench/scale/route-server-1000/run-receipt.sh
          bash -n bench/scale/outbound-prefix-limits/run-receipt.sh
          bash -n bench/scale/config-persistence/run-receipt.sh
          bash -n bench/scale/enhanced-route-refresh/run-receipt.sh
          bash -n bench/scale/outbound-prefix-limit-scale/run-receipt.sh
          bash -n bench/scale/rrtransport/run-receipt.sh
          bash -n bench/tests/test-rrtransport-receipt.sh
          bash -n bench/tests/test-route-server-1000-receipt.sh
          bash -n bench/tests/test-vpn-query-receipt.sh
          bash -n bench/tests/test-vpn-query-campaign.sh
          bash -n bench/run-vpn-query-campaign.sh
          shellcheck bench/scale/route-server-1000/run-receipt.sh \
            bench/scale/outbound-prefix-limits/run-receipt.sh \
            bench/scale/config-persistence/run-receipt.sh \
            bench/scale/enhanced-route-refresh/run-receipt.sh \
            bench/scale/outbound-prefix-limit-scale/run-receipt.sh \
            bench/scale/rrtransport/run-receipt.sh \
            bench/tests/test-rrtransport-receipt.sh \
            bench/tests/test-route-server-1000-receipt.sh
          shellcheck bench/tests/test-vpn-query-receipt.sh
          shellcheck bench/tests/test-vpn-query-campaign.sh \
            bench/run-vpn-query-campaign.sh
          bash bench/tests/test-route-server-1000-receipt.sh
          bash bench/tests/test-vpn-query-receipt.sh
          bash bench/tests/test-vpn-query-campaign.sh
          bash -n bench/scale/compare-rrharness.sh
          bash bench/tests/test-rrharness-driver.sh
          python3 -m unittest discover \
            -s bench/scale/enhanced-route-refresh -p 'test_*.py'
          python3 -m unittest -v tests/soak/test_intern_churn_analyzers.py
          python3 bench/scale/rebaseline/test_classifiers.py
          python3 bench/scale/rebaseline/test_parse_rrharness.py
          python3 bench/scale/rebaseline/test_validate_lan395_criterion.py
          python3 bench/tests/test_verify_mrt_growth_campaign.py
          (
            cd docs/perf/artifacts/enhanced-route-refresh-2026-07
            sha256sum -c SHA256SUMS
          )
      - name: Verify committed RIB rebaseline receipt
        run: |
          set -euo pipefail
          receipt=docs/perf/artifacts/rib-rebaseline-2026-07-13
          cpu_dir="$RUNNER_TEMP/rib-rebaseline-cpu"
          (cd "$receipt" && sha256sum -c SHA256SUMS)
          mkdir "$cpu_dir"
          tar -xzf "$receipt/cpu-folded-profiles.tar.gz" -C "$cpu_dir"
          (cd "$cpu_dir" && sha256sum -c folded-SHA256SUMS)
          for profile in "$cpu_dir"/*.folded; do
            stem=$(basename "$profile" .folded)
            python3 bench/scale/rebaseline/classify_cpu.py "$profile" \
              --check "$receipt/$stem.cpu.tsv"
          done
          python3 bench/scale/rebaseline/classify_dhat.py \
            --from-derivative "$receipt/2p-100k.dhat-derivative.tsv" \
            --check "$receipt/2p-100k.memory.tsv"
          # The raw bgperf capture is never committed, so the CSV numerics
          # cannot be re-derived here (unlike the CPU/DHAT legs above). This
          # leg validates structure, schema, convergence, bounds, and
          # canonical form of the sanitized receipt only.
          python3 bench/scale/rebaseline/sanitize_bgperf_csv.py \
            --from-sanitized "$receipt/2p-100k.csv" >/dev/null
      - name: Verify committed known-path accounting receipt
        run: |
          set -euo pipefail
          receipt=docs/perf/artifacts/known-path-accounting-2026-07
          (cd "$receipt" && sha256sum -c SHA256SUMS)
          for variant in baseline candidate; do
            python3 bench/scale/rebaseline/classify_dhat.py \
              --from-derivative "$receipt/$variant.dhat-derivative.tsv" \
              --check "$receipt/$variant.memory.tsv"
          done
      - name: Verify committed explain-cache DHAT receipt
        run: |
          set -euo pipefail
          receipt=docs/perf/artifacts/explain-cache-opt-in-2026-07
          (cd "$receipt" && sha256sum -c SHA256SUMS)
          for variant in D3-explain-true D4-explain-false; do
            derivative="$RUNNER_TEMP/$variant.dhat-derivative.tsv"
            gzip -cd "$receipt/dhat/$variant.dhat-derivative.tsv.gz" \
              > "$derivative"
            python3 bench/scale/rebaseline/classify_dhat.py \
              --from-derivative "$derivative" \
              --check "$receipt/dhat/$variant.memory.tsv"
          done
      - name: Verify policy-attribution Criterion receipt
        run: |
          set -euo pipefail
          receipt=docs/perf/artifacts/policy-attribution-criterion-2026-07
          python3 "$receipt/verify.py"
          (cd "$receipt" && sha256sum -c SHA256SUMS)
      - name: Check event-history producer fail-closed measurement tooling
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/event-history-venv"
          "$RUNNER_TEMP/event-history-venv/bin/pip" install --disable-pip-version-check 'PyYAML==6.0.2'
          bash docs/perf/test-event-history-host-fence.sh
          bash docs/perf/test-event-history-naming.sh
          "$RUNNER_TEMP/event-history-venv/bin/python" -m unittest -v \
            docs/perf/test_validate_event_history_receipt.py \
            docs/perf/test_validate_event_history_criterion.py \
            docs/perf/test_validate_event_history_perf.py \
            docs/perf/test_validate_event_history_full_comparison.py
          shellcheck -x \
            docs/perf/event-history-host-fence.sh \
            docs/perf/run-event-history-criterion.sh \
            docs/perf/run-event-history-full-daemon.sh \
            docs/perf/bgperf-rustbgpd-ehm-wrapper.sh \
            docs/perf/test-event-history-host-fence.sh \
            docs/perf/test-event-history-naming.sh
      - run: cargo test --workspace
      - run: cargo doc --workspace --lib --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Wire crate README freshness gate
        # Catches the common omission where someone bumps
        # `crates/wire/Cargo.toml` version without revisiting
        # `crates/wire/README.md`. The README is what crates.io and
        # docs.rs render, so a stale RFC table or stale "Key types"
        # list ships to every consumer of the published crate.
        # If wire's version line moved in this diff, require any
        # touch to its README. A whitespace-only edit is acceptable
        # if the README really is current — the gate's purpose is to
        # force a deliberate review, not to enforce content shape.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            # Initial push of a new branch — nothing to diff against.
            echo "no diff base; skipping"
            exit 0
          fi
          if git diff "$base"...HEAD -- crates/wire/Cargo.toml \
              | grep -qE '^\+version\s*='; then
            if ! git diff "$base"...HEAD -- crates/wire/README.md \
                | grep -qE '^[+-]'; then
              echo "::error file=crates/wire/Cargo.toml::wire crate version was bumped but crates/wire/README.md was not touched. Update the RFC table / Key types / examples to reflect what's actually published, then re-push. (A whitespace-only edit is fine if the README really is current.)"
              exit 1
            fi
            echo "wire bump + README touched — gate passed"
          fi

  msrv:
    # Build at the declared `rust-version` (`Cargo.toml`
    # `[workspace.package] rust-version`).
    #
    # Without this, the `check` job above runs on `stable` and can
    # quietly use newer rustc features that don't compile on MSRV.
    # Interop then becomes the catch-net — slow (~5 min per failed
    # Docker build × every M-tag) and only fires after PR merge if
    # PR-CI didn't catch it. Pinning here surfaces MSRV breakage at
    # PR time.
    #
    # Pinned literally to the Dockerfile's builder version
    # (`rust:1.95-bookworm`) — keep them in lockstep when bumping.
    # Bumping is a deliberate decision recorded in the diff of this
    # file alongside `Cargo.toml` and `Dockerfile`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.95
        with:
          toolchain: "1.95"
      - uses: ./.github/actions/install-protobuf
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Distinct cache key from the `check` job so MSRV builds don't
          # share artifacts compiled by stable rustc.
          key: msrv-1.95
      - run: cargo check --workspace --all-targets

  evpn_bum_filter_kernel:
    # Runs the Gate 8b BUM-suppression primitive against a real
    # kernel via the Docker harness at
    # `crates/evpn-linux/tests/docker/`. Two tests fire under one
    # invocation:
    #
    # - `bum_filter_spike_validates_kernel_primitive` — shell-driven
    #   topology + `ping -b` + `bridge link set` flag toggle. Asserts
    #   the five load-bearing invariants (DF allows, Non-DF blocks
    #   broadcast/multicast/unknown-unicast, known-unicast survives
    #   Non-DF, restore is symmetric, FDB programming unaffected).
    # - `linux_dataplane_set_bum_port_flags_round_trip` — Rust netlink
    #   round-trip. Asserts `LinuxDataplane::apply` actually lands
    #   `flood off / mcast_flood off / bcast_flood off` on the
    #   kernel-side bridge port.
    #
    # `ubuntu-latest` ships kernel 6.x which has
    # `IFLA_BRPORT_BCAST_FLOOD` (added in 4.18) so the harness's
    # kernel prerequisite is met without runner customization.
    #
    # The harness needs `--cap-add=NET_ADMIN --cap-add=SYS_ADMIN
    # --security-opt apparmor=unconfined`; it does NOT need
    # `--privileged`. GitHub-hosted runners allow all three.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Pre-build the harness image with GHA cache so the warm path
      # (no Dockerfile change) skips the `apt-get install` rebuild.
      - name: Build netns-test harness image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: crates/evpn-linux/tests/docker/Dockerfile
          load: true
          tags: rustbgpd-netns-tests:latest
          cache-from: type=gha,scope=evpn-bum-kernel
          cache-to: type=gha,scope=evpn-bum-kernel,mode=max,ignore-error=true

      - name: Run BUM-filter primitive validation
        # The helper handles cap flags + bind-mounts. We pre-built
        # the image via the GHA-cached step above, so SKIP_BUILD=1
        # makes the helper assert the image exists and skip its
        # mtime-based rebuild check (which would otherwise refire
        # the build because every checkout writes fresh mtimes).
        run: bash crates/evpn-linux/tests/docker/run-netns-tests.sh
        env:
          IMAGE_TAG: rustbgpd-netns-tests:latest
          SKIP_BUILD: "1"
