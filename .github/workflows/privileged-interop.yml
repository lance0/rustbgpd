name: Privileged Interop (netns)

# Manual, on-demand harness for the direct-`cargo test` privileged netns suites
# on GitHub-hosted ubuntu-latest. The containerlab EVPN smokes (M36–M49) now run
# automatically in the kernel-dataplane workflow, so this keeps only the
# non-docker netns binaries (`netns_dataplane` / `netns_fdb_nhg` /
# `netns_l3_install` / `netns_nexthop_raw`) available on demand. The
# kernel-dataplane workflow exercises the docker-harness netns selectors
# (`fdb_nhg` / `fib_runtime` / `bfd_runtime`) on every PR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netns:
    name: Direct-cargo privileged netns tests on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install protoc + jq
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq protobuf-compiler

      - name: Preflight privileged networking support
        run: |
          set -euo pipefail
          uname -a
          ip -V
          cargo --version
          protoc --version
          # vrf is absent from the hosted Azure kernel; pull it from
          # linux-modules-extra for the running kernel before the probe.
          if ! sudo modprobe vrf 2>/dev/null; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || \
              echo "::warning::linux-modules-extra-$(uname -r) unavailable; vrf-dependent tests may fail"
            sudo modprobe vrf || echo "::warning::vrf module still not loadable"
          fi
          sudo modprobe vxlan bridge bonding || true
          sudo ip link add vrf-ci-preflight type vrf table 424242
          sudo ip link del vrf-ci-preflight

      - name: Run privileged netns tests
        run: |
          set -euo pipefail
          run_privileged_cargo_test() {
            sudo -E env \
              "PATH=$PATH" \
              "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
              "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
              CARGO_TARGET_DIR=target/privileged-ci \
              EVPN_LINUX_NETNS=1 \
              cargo test -p rustbgpd-evpn-linux --test "$1" -- --nocapture
          }
          run_privileged_cargo_test netns_dataplane
          run_privileged_cargo_test netns_fdb_nhg
          run_privileged_cargo_test netns_l3_install
          run_privileged_cargo_test netns_nexthop_raw
