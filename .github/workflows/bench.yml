name: Criterion Bench Compare

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Baseline git ref"
        required: true
        default: "origin/main"
      head_ref:
        description: "Head git ref"
        required: true
        default: "HEAD"
      package:
        description: "Cargo package"
        required: true
        default: "rustbgpd-rib"
      bench:
        description: "Criterion bench target"
        required: true
        default: "rib_ops"
      filter:
        description: "Optional Criterion benchmark filter"
        required: false
        default: ""
      core:
        description: "CPU core for taskset pinning"
        required: true
        default: "0"
      require_performance:
        description: "Fail if the selected CPU is not using the performance governor"
        required: true
        default: "true"
        type: boolean

permissions:
  contents: read

# Serialise dispatches on the single pinned runner. Queue newer
# dispatches behind older ones rather than cancel-in-progress — we'd
# rather lose dispatch latency than throw away a half-finished bench.
concurrency:
  group: criterion-bench-compare
  cancel-in-progress: false

# Empirical noise floor on the `lancebox-cloud` runner is ~11% spread
# across 5 pinned runs at the same SHA (`adj_rib_in_insert/10000`,
# 2026-05-28 calibration). Treat workflow output as advisory:
#
#   delta < ~11%   →  inside noise; report as informational
#   delta 11–15%   →  watch; worth a second run to confirm
#   delta ≥ 15%    →  advisory regression; investigate before merge
#
# These thresholds are not enforced anywhere in code — the workflow
# emits the table and the reviewer applies judgment. Hardening to a
# pass/fail gate is deferred until the noise floor is re-measured on a
# host with cpufreq governor control (the virtualized CPU on
# `lancebox-cloud` has no `performance` governor available). See
# `docs/BENCHMARKS.md` for the full secondary-environment context.

jobs:
  compare:
    # Defensive: refuse to run on anything but the canonical repository.
    # The `workflow_dispatch` trigger already requires write access (so
    # fork PRs cannot trigger this), and self-hosted runners are scoped
    # to a single repo by registration — but this guard is the
    # belt-and-suspenders catch if either of those assumptions ever
    # breaks (e.g. a fork accidentally inherits the runner registration
    # via repo transfer, or a misconfigured org-level runner group).
    if: github.repository == 'lance0/rustbgpd'
    # Self-hosted, label-locked runner. GitHub-hosted runners are too
    # noisy for these numbers and cannot provide the CPU pinning /
    # governor posture this workflow assumes.
    runs-on: [self-hosted, rustbgpd-bench]
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-${{ inputs.package }}-${{ inputs.bench }}

      - name: Run Criterion comparison
        run: |
          set -euo pipefail
          args=(
            --base "${{ inputs.base_ref }}"
            --head "${{ inputs.head_ref }}"
            --package "${{ inputs.package }}"
            --bench "${{ inputs.bench }}"
            --core "${{ inputs.core }}"
            --out-dir "target/bench-compare"
          )
          if [ -n "${{ inputs.filter }}" ]; then
            args+=(--filter "${{ inputs.filter }}")
          fi
          if [ "${{ inputs.require_performance }}" = "true" ]; then
            args+=(--require-performance)
          fi
          bench/compare-criterion.sh "${args[@]}"

      - name: Publish summary
        if: always()
        run: |
          set -euo pipefail
          summary="$(
            find target/bench-compare -name summary.md -print 2>/dev/null \
              | sort \
              | tail -n 1 \
              || true
          )"
          if [ -n "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No benchmark summary found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Criterion artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-bench-compare
          path: target/bench-compare/
          if-no-files-found: warn
