name: Criterion Bench Compare

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Baseline git ref"
        required: true
        default: "origin/main"
      head_ref:
        description: "Head git ref"
        required: true
        default: "HEAD"
      package:
        description: "Cargo package"
        required: true
        default: "rustbgpd-rib"
      bench:
        description: "Criterion bench target"
        required: true
        default: "rib_ops"
      filter:
        description: "Optional Criterion benchmark filter"
        required: false
        default: ""
      core:
        description: "CPU core for taskset pinning"
        required: true
        default: "0"
      attempts:
        description: "A/B attempts with alternating order (≥3 recommended on this runner)"
        required: true
        default: "3"
      require_performance:
        description: "Fail if the selected CPU is not using the performance governor (leave false on the self-hosted VPS runner — virtualized CPU has no cpufreq sysfs)"
        required: true
        default: "false"
        type: boolean

permissions:
  contents: read

# Serialise dispatches on the single pinned runner. Queue newer
# dispatches behind older ones rather than cancel-in-progress — we'd
# rather lose dispatch latency than throw away a half-finished bench.
concurrency:
  group: criterion-bench-compare
  cancel-in-progress: false

# Empirical noise floor on the self-hosted VPS runner is ~11% spread
# across 5 pinned runs at the same SHA (`adj_rib_in_insert/10000`,
# 2026-05-28 calibration). Single-dispatch comparisons across two
# different SHAs are wider than that — base/head cache-warming bias and
# inter-SHA compile-cache state both contribute. Treat single-attempt
# workflow output as advisory only:
#
#   delta < ~20%   →  inside single-dispatch noise / bias band; do
#                     not act on it without re-running with more attempts
#   delta ≥ 20%    →  advisory regression; investigate before merge
#
# The `attempts` input runs the comparison N times with alternating
# base-first / head-first ordering to dampen the bias. Default is 3;
# even N (4, 6, ...) cancels first-vs-second bias fully. With ≥ 3
# attempts the table also includes the across-attempt stddev and the
# min..max spread, which are better signals than any single dispatch.
#
# These bands are not enforced in code — the workflow emits the table
# and the reviewer applies judgment. Pass/fail gating is deferred until
# the noise floor is re-measured on a host with cpufreq governor
# control. See `docs/BENCHMARKS.md` for the full context.

jobs:
  compare:
    # Defensive: refuse to run on anything but the canonical repository.
    # The `workflow_dispatch` trigger already requires write access (so
    # fork PRs cannot trigger this), and self-hosted runners are scoped
    # to a single repo by registration — but this guard is the
    # belt-and-suspenders catch if either of those assumptions ever
    # breaks (e.g. a fork accidentally inherits the runner registration
    # via repo transfer, or a misconfigured org-level runner group).
    if: github.repository == 'lance0/rustbgpd'
    # Self-hosted, label-locked runner. GitHub-hosted runners are too
    # noisy for these numbers and cannot provide the CPU pinning /
    # governor posture this workflow assumes.
    runs-on: [self-hosted, rustbgpd-bench]
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master # stable

        with:

          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-${{ inputs.package }}-${{ inputs.bench }}

      - name: Run Criterion comparison
        # Pass workflow inputs via env rather than interpolating `${{ inputs.* }}`
        # directly into the script — keeps user-controlled values out of the
        # shell text (no injection surface even though dispatch is privileged).
        env:
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
          PACKAGE: ${{ inputs.package }}
          BENCH: ${{ inputs.bench }}
          CORE: ${{ inputs.core }}
          ATTEMPTS: ${{ inputs.attempts }}
          FILTER: ${{ inputs.filter }}
          REQUIRE_PERFORMANCE: ${{ inputs.require_performance }}
        run: |
          set -euo pipefail
          args=(
            --base "$BASE_REF"
            --head "$HEAD_REF"
            --package "$PACKAGE"
            --bench "$BENCH"
            --core "$CORE"
            --attempts "$ATTEMPTS"
            --out-dir "target/bench-compare"
          )
          if [ -n "$FILTER" ]; then
            args+=(--filter "$FILTER")
          fi
          if [ "$REQUIRE_PERFORMANCE" = "true" ]; then
            args+=(--require-performance)
          fi
          bench/compare-criterion.sh "${args[@]}"

      - name: Publish summary
        if: always()
        run: |
          set -euo pipefail
          summary="$(
            find target/bench-compare -name summary.md -print 2>/dev/null \
              | sort \
              | tail -n 1 \
              || true
          )"
          if [ -n "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No benchmark summary found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Criterion artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-bench-compare
          path: target/bench-compare/
          if-no-files-found: warn
