name: IXP Manager / Bird's Eye contract oracle

on:
  pull_request:
    paths:
      - "tests/compat/ixp-manager-birdseye/**"
      - "examples/birdwatcher-adapter/**"
      - "tools/rs-config-render/**"
      - "integrations/ixp-manager/**"
      - "tests/birdwatcher_adapter_smoke.rs"
      - ".github/workflows/ixp-compat.yml"
      - "docs/interop.md"
      - "docs/cookbook/ixp-filter-pipeline.md"
      - "docs/explanation/ixp-evaluation.md"
  push:
    branches: [main]
    paths:
      - "tests/compat/ixp-manager-birdseye/**"
      - "examples/birdwatcher-adapter/**"
      - "tools/rs-config-render/**"
      - "integrations/ixp-manager/**"
      - "tests/birdwatcher_adapter_smoke.rs"
      - ".github/workflows/ixp-compat.yml"
      - "docs/interop.md"
      - "docs/cookbook/ixp-filter-pipeline.md"
      - "docs/explanation/ixp-evaluation.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-protobuf
      - name: Verify the pinned upstream contract
        run: tests/compat/ixp-manager-birdseye/run.sh
