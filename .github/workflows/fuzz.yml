name: Fuzz

on:
  schedule:
    - cron: '0 4 * * *'  # nightly at 04:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: read

concurrency:
  group: fuzz-wire-corpus-main
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WIRE_CORPUS_WRITER: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v7
      # fuzz/rust-nightly.txt holds the single reviewed nightly, shared with
      # the OSS-Fuzz and ClusterFuzzLite images. A floating `nightly` lets an
      # upstream compiler regression take the campaign down with no change on
      # our side, and the failure reads as if it came from this repository.
      # RUSTUP_TOOLCHAIN then applies the pin to every cargo call below.
      - name: Select the reviewed nightly
        id: nightly
        run: |
          toolchain=$(cat fuzz/rust-nightly.txt)
          if [ -z "$toolchain" ]; then
            echo "fuzz/rust-nightly.txt is empty" >&2
            exit 1
          fi
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      # The action implementation follows its `v1` release line; the
      # independently reviewed nightly is still passed through `toolchain:`.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.nightly.outputs.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Restore bounded wire corpus cache
        id: wire-corpus-restore
        if: env.WIRE_CORPUS_WRITER == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/wire-corpus-cache
          key: wire-fuzz-corpus-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wire-fuzz-corpus-v1-main-
      - name: Validate and install wire corpus
        env:
          WIRE_CACHE_BUNDLE: ${{ runner.temp }}/wire-corpus-cache
          RESTORE_MATCHED_KEY: ${{ steps.wire-corpus-restore.outputs.cache-matched-key }}
          RESTORE_OUTCOME: ${{ steps.wire-corpus-restore.outcome }}
        run: |
          cache_hit=false
          if [ "$WIRE_CORPUS_WRITER" = true ] && [ "$RESTORE_OUTCOME" = success ] && [ -n "$RESTORE_MATCHED_KEY" ]; then
            cache_hit=true
            echo "wire corpus cache matched key: $RESTORE_MATCHED_KEY"
          elif [ -e "$WIRE_CACHE_BUNDLE" ]; then
            python3 -c 'import os, shutil; p=os.environ["WIRE_CACHE_BUNDLE"]; shutil.rmtree(p, ignore_errors=True)'
            echo "wire corpus restore unavailable; cleaned staging and falling back to tracked seeds"
          fi
          python3 scripts/fuzz_corpus_cache.py restore \
            --cache-bundle "$WIRE_CACHE_BUNDLE" \
            --seeds crates/wire/fuzz/seeds \
            --live crates/wire/fuzz/corpus \
            --cache-hit "$cache_hit"
          rm -rf -- "$WIRE_CACHE_BUNDLE"
          echo "wire corpus restore staging cleared before campaign"
      # Every target in each fuzz crate, 2 minutes apiece. Seed corpora are
      # tracked under fuzz/seeds/<target>/ (fuzz/corpus/ is gitignored, so a
      # CI run starts from a validated prior bundle or the tracked seeds).
      - name: Fuzz wire codecs (2 minutes per target)
        run: |
          cd crates/wire
          # `$(cargo fuzz list)` inline would let an errored or empty
          # enumeration silently run zero targets — fail loudly instead.
          targets=$(cargo fuzz list)
          if [ -z "$targets" ]; then
            echo "fuzz-target enumeration returned no targets" >&2
            exit 1
          fi
          for t in $targets; do
            # Full messages carry their header; body-only decoders must use
            # the corresponding framed body ceiling. Substrate, constructor,
            # and text targets retain the reviewed 4096-byte campaign bound.
            case "$t" in
              decode_bgpls) max_len=4096 ;;
              decode_evpn) max_len=4096 ;;
              decode_flowspec) max_len=4096 ;;
              decode_labeled) max_len=4096 ;;
              decode_message) max_len=65535 ;;
              decode_open) max_len=4077 ;;
              decode_route_refresh) max_len=65516 ;;
              decode_rtc) max_len=4096 ;;
              decode_update) max_len=65516 ;;
              decode_vpn) max_len=4096 ;;
              encode_evpn) max_len=4096 ;;
              encode_update) max_len=4096 ;;
              parse_rd) max_len=4096 ;;
              *) echo "wire fuzz target has no reviewed max_len: $t" >&2; exit 1 ;;
            esac
            mkdir -p "fuzz/corpus/$t"
            seeds=""
            [ -d "fuzz/seeds/$t" ] && seeds="fuzz/seeds/$t"
            dict_args=()
            [ "$t" != parse_rd ] && dict_args+=("-dict=fuzz/bgp.dict")
            cargo fuzz run "$t" "fuzz/corpus/$t" $seeds -- -max_total_time=120 -max_len="$max_len" "${dict_args[@]}"
          done
      - name: Fuzz rpol policy frontend (2 minutes per target)
        run: |
          cd crates/policy
          # `$(cargo fuzz list)` inline would let an errored or empty
          # enumeration silently run zero targets — fail loudly instead.
          targets=$(cargo fuzz list)
          if [ -z "$targets" ]; then
            echo "fuzz-target enumeration returned no targets" >&2
            exit 1
          fi
          for t in $targets; do
            mkdir -p "fuzz/corpus/$t"
            seeds=""
            [ -d "fuzz/seeds/$t" ] && seeds="fuzz/seeds/$t"
            cargo fuzz run "$t" "fuzz/corpus/$t" $seeds -- -max_total_time=120 -max_len=8192
          done
      - name: Fuzz EVPN parsers (2 minutes per target)
        run: |
          cd crates/evpn
          # Keep target discovery fail-closed as new EVPN parsers are added.
          targets=$(cargo fuzz list)
          if [ -z "$targets" ]; then
            echo "fuzz-target enumeration returned no targets" >&2
            exit 1
          fi
          if ! grep -Fxq parse_rt <<<"$targets"; then
            echo "required EVPN fuzz target parse_rt is missing" >&2
            exit 1
          fi
          for t in $targets; do
            mkdir -p "fuzz/corpus/$t"
            seeds=""
            [ -d "fuzz/seeds/$t" ] && seeds="fuzz/seeds/$t"
            cargo fuzz run "$t" "fuzz/corpus/$t" $seeds -- -max_total_time=120 -max_len=1024
          done
      - name: Fuzz MRT snapshot and warm-bundle readers (2 minutes per target)
        run: |
          cd crates/mrt
          # Keep target discovery fail-closed as new MRT parsers are added.
          targets=$(cargo fuzz list)
          if [ -z "$targets" ]; then
            echo "fuzz-target enumeration returned no targets" >&2
            exit 1
          fi
          if ! grep -Fxq warm_bundle_manifest <<<"$targets"; then
            echo "required MRT fuzz target warm_bundle_manifest is missing" >&2
            exit 1
          fi
          for t in $targets; do
            mkdir -p "fuzz/corpus/$t"
            seeds=""
            [ -d "fuzz/seeds/$t" ] && seeds="fuzz/seeds/$t"
            cargo fuzz run "$t" "fuzz/corpus/$t" $seeds -- -max_total_time=120 -max_len=65536
          done
      - name: Fuzz BFD control decoder (2 minutes)
        run: |
          cd crates/bfd
          targets=$(cargo fuzz list)
          if [ -z "$targets" ]; then
            echo "fuzz-target enumeration returned no targets" >&2
            exit 1
          fi
          if ! grep -Fxq decode_bfd_control <<<"$targets"; then
            echo "required BFD fuzz target decode_bfd_control is missing" >&2
            exit 1
          fi
          for t in $targets; do
            mkdir -p "fuzz/corpus/$t"
            seeds=()
            [ -d "fuzz/seeds/$t" ] && seeds+=("fuzz/seeds/$t")
            cargo fuzz run "$t" "fuzz/corpus/$t" "${seeds[@]}" -- -max_total_time=120 -max_len=256
          done
      - name: Fuzz RTR PDU decoder (2 minutes)
        run: |
          cd crates/rpki
          targets=$(cargo fuzz list)
          if [ -z "$targets" ]; then
            echo "fuzz-target enumeration returned no targets" >&2
            exit 1
          fi
          if ! grep -Fxq decode_rtr_pdu <<<"$targets"; then
            echo "required RTR fuzz target decode_rtr_pdu is missing" >&2
            exit 1
          fi
          for t in $targets; do
            mkdir -p "fuzz/corpus/$t"
            seeds=()
            [ -d "fuzz/seeds/$t" ] && seeds+=("fuzz/seeds/$t")
            cargo fuzz run "$t" "fuzz/corpus/$t" "${seeds[@]}" -- -max_total_time=120 -max_len=65535
          done
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          retention-days: 14
          path: |
            crates/wire/fuzz/artifacts/
            crates/policy/fuzz/artifacts/
            crates/evpn/fuzz/artifacts/
            crates/mrt/fuzz/artifacts/
            crates/bfd/fuzz/artifacts/
            crates/rpki/fuzz/artifacts/
      - name: Seal bounded wire corpus cache
        id: wire-corpus-seal
        if: success() && env.WIRE_CORPUS_WRITER == 'true'
        env:
          WIRE_CACHE_BUNDLE: ${{ runner.temp }}/wire-corpus-cache
        run: |
          set +e
          python3 scripts/fuzz_corpus_cache.py seal \
            --live crates/wire/fuzz/corpus \
            --output "$WIRE_CACHE_BUNDLE"
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "save=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          echo "save=true" >> "$GITHUB_OUTPUT"
      - name: Save bounded wire corpus cache
        if: steps.wire-corpus-seal.outputs.save == 'true' && env.WIRE_CORPUS_WRITER == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/wire-corpus-cache
          key: wire-fuzz-corpus-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
