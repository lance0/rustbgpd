# The main CI lane ignores `**/*.md`, so a doc-only pull request — exactly
# the change that reintroduces an unresolvable tracker citation — would skip
# the gate entirely. This lane runs on the published doc surface itself.
name: Public docs contract

on:
  push:
    branches: [main]
    paths: &paths
      - docs/**
      - README.md
      - ARCHITECTURE.md
      - CONTRIBUTING.md
      - KNOWN_ISSUES.md
      - SECURITY.md
      - SUPPORT.md
      - scripts/check_public_tracker_ids.py
      - scripts/test_check_public_tracker_ids.py
      - .github/workflows/public-docs-contract.yml
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  public-docs-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check public documentation cites no private tracker IDs
        run: |
          python3 -m unittest -v scripts/test_check_public_tracker_ids.py
          python3 scripts/check_public_tracker_ids.py
