name: Interop

# Lightweight interop suite that gates EVPN against a real FRR peer.
# Two jobs run in parallel:
#   - M29 (~10 s test, ~3 min total): control-plane sanity — session
#     Established + L2VPN/EVPN capability negotiation + gRPC
#     ListEvpnRoutes shape. No kernel VXLAN, no MAC learning.
#   - M30 (~6 s test, ~3 min total): EVPN Type 2 MAC reflection
#     end-to-end with kernel VXLAN + bridge per VTEP. Empirically
#     viable on ubuntu-latest (kernel 6.17.0-101x-azure ships vxlan +
#     bridge; vrf is missing, which keeps M30b out of CI).
#
# M30b/M31/M32/M33 stay manual: M30b needs the missing `vrf` module
# for L3VNI binding (RFC 9136 Type 5); M32 needs a bond ES; M33 needs
# wall time. See "CI wiring for M29-M33" in ROADMAP.md.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  m29:
    name: M29 — EVPN cap negotiation (FRR 10.3.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # containerlab and grpcurl are installed locally to the runner;
      # both are cheap (single Go binaries). Pinned versions to keep the
      # gate reproducible — bumping is a deliberate change.
      - name: Install containerlab
        # Pinned to the version we develop against locally. Bumping is
        # a deliberate change; verify a clean M29 run on the new
        # version before merging.
        run: |
          curl -sL https://github.com/srl-labs/containerlab/releases/download/v0.74.3/containerlab_0.74.3_linux_amd64.deb \
            -o /tmp/clab.deb
          sudo dpkg -i /tmp/clab.deb

      - name: Install grpcurl
        run: |
          curl -sL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.1/grpcurl_1.9.1_linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin grpcurl

      # Buildx cache cuts the docker build step from ~6 min to ~30 s on
      # cache hits. The cargo registry / target dir gets reused via the
      # GitHub Actions cache backend (type=gha).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build rustbgpd:dev
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: rustbgpd:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy M29 topology
        run: |
          sudo containerlab deploy -t tests/interop/m29-evpn-rr-frr.clab.yml
        # The script pulls FRR 10.3.1 on the first run (~150 MB).
        # Subsequent runs hit Docker's local image cache.

      - name: Run M29 test
        run: bash tests/interop/scripts/test-m29-evpn-rr-frr.sh

      # Always clean up so a failed run doesn't leave orphan containers
      # / netns on the runner. `--cleanup` removes generated config too.
      - name: Destroy topology
        if: always()
        run: |
          sudo containerlab destroy -t tests/interop/m29-evpn-rr-frr.clab.yml --cleanup || true

  m30:
    name: M30 — EVPN Type 2 reflection (FRR 10.3.1, kernel VXLAN)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install containerlab
        run: |
          curl -sL https://github.com/srl-labs/containerlab/releases/download/v0.74.3/containerlab_0.74.3_linux_amd64.deb \
            -o /tmp/clab.deb
          sudo dpkg -i /tmp/clab.deb

      - name: Install grpcurl + jq
        # jq is required for M30 test 6's strict next_hop assertion
        # (scoped to the entry containing the test MAC); a substring
        # grep would let a malformed match slip past.
        run: |
          curl -sL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.1/grpcurl_1.9.1_linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin grpcurl
          sudo apt-get update -y && sudo apt-get install -y jq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build rustbgpd:dev
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: rustbgpd:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy M30 topology
        run: sudo containerlab deploy -t tests/interop/m30-evpn-type2-frr.clab.yml

      - name: Run M30 test
        run: bash tests/interop/scripts/test-m30-evpn-type2-frr.sh

      - name: Destroy topology
        if: always()
        run: |
          sudo containerlab destroy -t tests/interop/m30-evpn-type2-frr.clab.yml --cleanup || true
