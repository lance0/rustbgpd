        run: |
          command -v jq >/dev/null || { sudo apt-get update -y && sudo apt-get install -y jq; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build rustbgpd:dev
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rustbgpd:dev
          target: dev
          cache-from: type=gha,scope=rustbgpd-dev

      - name: Verify and pull exact ARouteServer 1.23.2 image
        env:
          AROUTESERVER_IMAGE: pierky/arouteserver@sha256:ba0e9c0b541c63acf0765a08fd2e09c2bba9dc64af1f5bbdce7819e8d1c34d66
          AROUTESERVER_CONFIG: sha256:4a08ef740f00a119f5897b0f834da9ff172a282c93d47fdff636c3b50c9aec93
        run: |
          set -euo pipefail
          manifest_json=$(docker buildx imagetools inspect --raw "$AROUTESERVER_IMAGE")
          test "$(jq -er '.schemaVersion' <<<"$manifest_json")" = 2
          test "$(jq -er '.mediaType' <<<"$manifest_json")" = \
            application/vnd.docker.distribution.manifest.v2+json
          test "$(jq -er '.config.digest' <<<"$manifest_json")" = \
            "$AROUTESERVER_CONFIG"
          docker pull "$AROUTESERVER_IMAGE"
          bash tests/interop/scripts/test-m104-arouteserver-current-rs-differential.sh \
            --preflight-arouteserver-image
          test "$(docker run --rm "$AROUTESERVER_IMAGE" python3 -c \
            'import importlib.metadata; print(importlib.metadata.version("arouteserver"))')" = \
            1.23.2

      - name: Stage verified BIRD 2.19.2 archive
        uses: ./.github/actions/stage-bird3-artifact
        with:
          version: "2.19.2"
          sha256: aff89abba3b92b7637bd57e0168b8d7ae887747f160ada4973378ad72f5f3660
