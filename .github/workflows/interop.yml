  m29:
    name: M29 — EVPN cap negotiation (FRR 10.3.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # containerlab and grpcurl are installed locally to the runner;
      # both are cheap (single Go binaries). Pinned versions to keep the
      # gate reproducible — bumping is a deliberate change.
      - name: Install containerlab
        # Pinned to the version we develop against locally. Bumping is
        # a deliberate change; verify a clean M29 run on the new
        # version before merging.
        run: |
          curl -sL https://github.com/srl-labs/containerlab/releases/download/v0.74.3/containerlab_0.74.3_linux_amd64.deb \
            -o /tmp/clab.deb
          sudo dpkg -i /tmp/clab.deb

      - name: Install grpcurl
        run: |
          curl -sL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.1/grpcurl_1.9.1_linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin grpcurl

      # Buildx cache cuts the docker build step from ~6 min to ~30 s on
      # cache hits. The cargo registry / target dir gets reused via the
      # GitHub Actions cache backend (type=gha).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build rustbgpd:dev
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rustbgpd:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run M29 (deploy + test + destroy with retry)
        # The composite always destroys before each attempt, so an
        # orphan container from a prior failed run cannot leak in.
        uses: ./.github/actions/run-interop-test
        with:
          label: M29
          topology: tests/interop/m29-evpn-rr-frr.clab.yml
          script: tests/interop/scripts/test-m29-evpn-rr-frr.sh

