          bash tests/interop/scripts/test-m104-arouteserver-current-rs-differential.sh
          --self-test-offline-contract

      - name: Run M104 (single-attempt current-daemon differential)
        env:
          M104_EXPECTED_GIT_SHA: ${{ github.sha }}
        uses: ./.github/actions/run-interop-test
        with:
          label: M104
          topology: tests/interop/m104-arouteserver-current-rs-differential.clab.yml
          script: tests/interop/scripts/test-m104-arouteserver-current-rs-differential.sh
          max_attempts: "1"

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [classify_changes, grpcurl_archive, gnmic_archive, gobgp_archive, bird2192_archive,
      bird332_archive, prime_dev_image, m1,
      m13, m80, m15, m10, m14, m17, m73, m74, m75, m76, m77, m78, m79, m22, m24,
      m81, m82, m83, m85, m94, m86, m25, m29, m30, m34, m35, m35b, m35c,
      m41, m44, m54, m55, m56, m45, m57, m63, m64,
      m26_m27_m28_m59_m91, m92, m84, m99, m100, m101, m102, m103, m104]
    env:
      NEEDS_CONTEXT: ${{ toJSON(needs) }}
      EXPECTED_JOBS: >-
        classify_changes grpcurl_archive gnmic_archive gobgp_archive bird2192_archive
        bird332_archive prime_dev_image
        m1 m13 m80 m15 m10
        m14 m17 m73 m74 m75 m76 m77 m78 m79 m22 m24 m81 m82 m83 m85 m94
        m86 m25 m29 m30 m34 m35 m35b m35c m41 m44 m54 m55 m56 m45 m57
        m63 m64 m26_m27_m28_m59_m91 m92 m84 m99 m100 m101 m102 m103 m104
    steps:
      - name: Aggregate required Interop result
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_CONTEXT"])
          expected = os.environ["EXPECTED_JOBS"].split()
          if set(needs) != set(expected) or len(needs) != len(expected):
              print(f"aggregate dependency drift: expected={expected} actual={sorted(needs)}")
              sys.exit(1)

          classifier = needs["classify_changes"]
          run_labs = classifier.get("outputs", {}).get("run_labs")
          failed = classifier.get("result") != "success" or run_labs not in {"true", "false"}
          expected_result = "success" if run_labs == "true" else "skipped"
          for job in expected:
              result = needs[job].get("result")
              print(f"{job}={result}")
              if job != "classify_changes" and result != expected_result:
                  failed = True
          if failed:
              sys.exit(1)
          PY
