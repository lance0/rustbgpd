name: Interop

# Lightweight interop suite that gates wire-protocol, policy, and
# EVPN behavior against a real FRR peer. Each job is independent and
# runs in parallel; ~3 min wall-clock per job dominated by the FRR
# image pull and the rustbgpd:dev docker build (cached).
#
# Foundation tier — wire-protocol + core RIB / refresh / policy:
#   - M1  (~10 s test): basic session + UPDATE + Adj-RIB-In + gRPC
#     ListReceivedRoutes + withdrawal. If this regresses, every
#     other interop test below is meaningless.
#   - M13 (~10 s test): policy engine end-to-end (import + export
#     chains; set_local_pref / set_med / set_community_add /
#     AS_PATH regex / prefix deny). 3-node topology (rustbgpd
#     between FRR-A and FRR-B).
#   - M15 (~10 s test): Route Refresh (RFC 2918 + RFC 7313) via
#     gRPC SoftResetIn. Companion to M34 — together they pin both
#     ends of the contract (gRPC-driven and SIGHUP-driven refresh).
#   - M80 (~60 s test): rpol policy parity (ADR-0096) — rustbgpd
#     runs its policy from an `.rpol` file while an FRR parity node
#     expresses the same intent as route-maps / prefix-lists /
#     community-lists; asserts route-for-route import + export
#     agreement (prefix-set ge/le, community add/remove, LP, as-path
#     regex reject, modify-then-continue, a parameterized policy
#     instantiated twice), `rbgp policy check` / `policy test` /
#     `policy stats`, and an .rpol edit + SIGHUP hot-apply whose
#     Route Refresh is scoped to the one peer whose chain changed.
#
# Address-family + topology tier — MP-BGP, RR, multi-path:
#   - M10 (~10 s test): IPv6 dual-stack via MP_REACH_NLRI /
#     MP_UNREACH_NLRI, IPv4 + IPv6 routes over the same session.
#     Wire-level fragility check for MP-BGP.
#   - M16 (~30 s test): dual-stack LLGR (RFC 9494) over one IPv4
#     session. Exact IPv4/IPv6 inventories cross GR-stale and
#     LLGR-stale before both-family EoR restores fresh state.
#   - M14 (~10 s test): Route Reflector (RFC 4456) — RR + 2 iBGP
#     clients, validates CLUSTER_LIST + ORIGINATOR_ID set
#     correctly on reflected routes. Spine of every IX deployment.
#   - M17 (~10 s test): Add-Path (RFC 7911) — multi-path send with
#     distinct path_ids over a 4-node topology (rustbgpd between
#     two upstreams + one client). Wire-level path_id encoding +
#     capability-negotiation fragility.
#   - M99 (~15 s test): RFC 9072 extended OPEN framing against stock
#     FRR 10.3.1. A host-tshark raw TCP capture proves FRR's forced-small
#     extended form, rustbgpd's exact 342-byte maximum production OPEN,
#     and a parallel exact 49-byte classic control. The oracle reassembles
#     the TCP streams itself and does not trust tshark's BGP dissector.
#   - M89 (~15 s test): experimental Paths-Limit capability 76 —
#     three real FRR sources feed dual-stack candidate sets to a
#     real FRR sink whose unequal receive limits cap Add-Path export.
#   - M73 (~10 s test): BGP-LS reflection (RFC 9552) — GoBGP v4
#     source injects a Node NLRI, rustbgpd reflects it as RR, and
#     GoBGP v4 sink validates receipt plus withdrawal.
#   - M74 (~15 s test): dual VPNv4/VPNv6 route reflection (RFC 4364/4659,
#     ADR-0077 §9 gate) — pinned GoBGP validates scoped receipt, RFC 4456
#     attributes, family-isolated withdrawals, and zero dataplane install.
#   - M75 (~30 s test): RT-Constrain (RFC 4684) VPNv4 reflection
#     filtering — GoBGP source with two VRFs, an RTC sink that must
#     receive only its member RT, a non-RTC sink that must receive
#     everything, plus widen/narrow membership churn with zero
#     session flaps and no UPDATE storm.
#   - M76 (~60 s test): Optimal Route Reflection (RFC 9107) — GoBGP
#     v4 source injects a 4-link BGP-LS square, two PEs announce the
#     same prefix with different next-hops, and two clients pinned
#     to different ORR vantages must receive DIVERGENT best paths,
#     flip on a topology metric change (no churn to the unaffected
#     client), and fall back to one standard best on withdrawal.
#   - M77 (~4 min test): GR/LLGR stale preservation for the RR
#     families (RFC 4724 / RFC 9494) — a GoBGP PE (VPNv4 + VPNv6 +
#     RTC) is kill -9'd: rustbgpd must hold its routes stale, keep
#     serving the client, sweep exactly the per-family routes omitted
#     by the relaunched (`gobgpd -r`) PE's End-of-RIB, promote to the
#     LLGR stale phase (LLGR_STALE toward the client) when the PE never
#     returns, and keep the ORR vantage resolved through a BGP-LS
#     source's GR window.
#   - M78 (~60 s test): multi-cluster ORR — two rustbgpd RRs with
#     divergent vantages exchange Add-Path over the inter-RR mesh
#     so per-cluster optimal routes survive the second reflection
#     hop.
#   - M79 (~90 s test): labeled-unicast route reflection (RFC 8277,
#     SAFI 4) — GoBGP PE injects IPv4 + IPv6 labeled routes
#     (including a multi-label stack), rustbgpd reflects with label
#     stack/next-hop preserved verbatim + ORIGINATOR_ID/CLUSTER_LIST,
#     relabel is an implicit replace, withdrawal uses the §2.4
#     compatibility field, a kill -9 GR window preserves the routes
#     stale with zero client-facing UPDATEs, and the relaunched
#     PE's End-of-RIB sweeps exactly the not-re-advertised route.
#
# Operational + security tier — BMP monitoring, transport security,
# FlowSpec:
#   - M22 (~30 s test): FlowSpec (RFC 5575/8955) injection,
#     distribution, and withdrawal. Wait windows are deliberately
#     wide (60 s) because FRR's `show bgp ipv4 flowspec` view
#     reconverges slowly after MP_UNREACH — observed up to ~44 s
#     of empty display before rule 2 reappears. Underlying
#     data-plane state is correct; the lag is FRR's display path.
#   - M24 (~10 s test): BMP (RFC 7854) — Initiation, PeerUp, and
#     RouteMonitoring messages received by a BMP receiver. Adds
#     a python:3.12-slim container running scripts/bmp-receiver.py.
#     Catches RibManager BMP integration regressions.
#   - M81 (~3 min test): the BMP trio receipt — RFC 8671 Adj-RIB-Out
#     + RFC 9069 Loc-RIB (collector-connect dump + EoR) + BMPv4 TLV
#     framing (draft-ietf-grow-bmp-tlv-21), with raw proof that the
#     colliding draft type-5 Path Marking TLV is not emitted, against
#     three collectors at once:
#     pmacct pmbmpd bleeding-edge + gobmp (semantic v3 oracles,
#     digest-pinned) and a raw byte sink with tshark 4.4 pcap
#     dissection for the v4 frames. 50 assertions; the wall time is
#     dominated by the 60 s stats cadence.
#   - M25 (~45 s test): TCP MD5 (RFC 2385) + GTSM / TTL security
#     (RFC 5082). Two static FRR peers cover MD5 and GTSM separately;
#     a third FRR peer active-opens over IPv6 into a dynamic range
#     requiring both, including wrong-MD5 and missing-GTSM negative
#     phases. Catches active- and accepted-socket transport regressions.
#
# EVPN + SIGHUP tier:
#   - M29 (~10 s test): control-plane sanity — session Established
#     + L2VPN/EVPN capability negotiation + gRPC ListEvpnRoutes
#     shape. No kernel VXLAN, no MAC learning.
#   - M30 (~6 s test): EVPN Type 2 MAC reflection end-to-end with
#     kernel VXLAN + bridge per VTEP. Empirically viable on
#     ubuntu-latest (kernel 6.17.0-101x-azure ships vxlan + bridge;
#     vrf is missing, which keeps M30b out of CI).
#   - M34 (~15 s test): SIGHUP-driven policy edit fires an automatic
#     Route Refresh and re-imports against the new policy. Guards
#     the auto-fire path inside `PeerManager::update_runtime_policies`
#     introduced post-v0.11.0. Plain BGP + IPv4 unicast.
#   - M35/M35b/M35c (~30 s each): RFC 8326 Graceful Shutdown receiver
#     and initiator behavior. M35 covers IPv4 unicast, M35b FlowSpec,
#     M35c L2VPN/EVPN so all outbound attach sites are exercised
#     against FRR.
#   - M41 (~15 s test): RFC 7999 BLACKHOLE (65535:666) — FRR tags a
#     /32 with BLACKHOLE, rustbgpd's `honor_blackhole = true` chain-
#     tail rule preserves it and adds NO_ADVERTISE while an untagged
#     /32 stays untouched. Plain BGP + IPv4 unicast.
#
# M30b/M31/M32/M33 stay manual: M30b needs the missing `vrf` module
# for L3VNI binding (RFC 9136 Type 5); M32 needs a bond ES; M33 needs
# wall time. See "CI wiring for M29-M33" in ROADMAP.md.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify_changes:
    name: Classify interop heavy-lab paths
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      run_labs: ${{ steps.classify.outputs.run_labs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify complete pull-request diff
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/classify_heavy_ci_paths.py

  grpcurl_archive:
    needs: classify_changes
    if: needs.classify_changes.outputs.run_labs == 'true'
    name: Prepare exact grpcurl archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Restore, prepare, and upload exact grpcurl archive
        uses: ./.github/actions/prepare-grpcurl-artifact

  gnmic_archive:
    needs: classify_changes
    if: needs.classify_changes.outputs.run_labs == 'true'
    name: Prepare exact gnmic archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Restore exact gnmic archive cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/gnmic-cache/gnmic_0.46.0_Linux_x86_64.tar.gz
          key: gnmic-v0.46.0-linux-x86_64-a3ded2f355a615df73900f31b9791f41e796e9c5c63b171e1ce041e8139ee00e
      - name: Prepare exact gnmic archive
        run: |
          .github/scripts/install-gnmic.sh \
            --prepare-archive \
            "$RUNNER_TEMP/gnmic-cache/gnmic_0.46.0_Linux_x86_64.tar.gz"
      - name: Upload verified gnmic archive
        uses: actions/upload-artifact@v7
        with:
          name: gnmic-v0.46.0-linux-x86_64
          path: ${{ runner.temp }}/gnmic-cache/gnmic_0.46.0_Linux_x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  gobgp_archive:
    needs: classify_changes
    if: needs.classify_changes.outputs.run_labs == 'true'
    name: Prepare exact gobgp archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Restore, prepare, and upload exact gobgp archive
        uses: ./.github/actions/prepare-gobgp-artifact

  bird2192_archive:
    needs: classify_changes
    if: needs.classify_changes.outputs.run_labs == 'true'
    name: Prepare exact BIRD 2.19.2 archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Restore exact BIRD 2.19.2 archive cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bird2192-cache/bird-2.19.2.tar.gz
          key: bird2192-v2.19.2-source-aff89abba3b92b7637bd57e0168b8d7ae887747f160ada4973378ad72f5f3660
      - name: Prepare exact BIRD 2.19.2 archive
        run: |
          set -euo pipefail
          .github/scripts/install-bird3.sh \
            --version 2.19.2 \
            --sha256 aff89abba3b92b7637bd57e0168b8d7ae887747f160ada4973378ad72f5f3660 \
            --coverage-label "M83 BIRD 2.19.2 image blocked" \
            --prepare-archive \
            "$RUNNER_TEMP/bird2192-cache/bird-2.19.2.tar.gz"
      - name: Upload verified BIRD 2.19.2 archive
        uses: actions/upload-artifact@v7
        with:
          name: bird2192-v2.19.2-source
          path: ${{ runner.temp }}/bird2192-cache/bird-2.19.2.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  bird332_archive:
    needs: classify_changes
    if: needs.classify_changes.outputs.run_labs == 'true'
    name: Prepare exact BIRD 3.3.2 archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Restore exact BIRD 3.3.2 archive cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bird332-cache/bird-3.3.2.tar.gz
          key: bird332-v3.3.2-source-21297d7a02edd700ae82de5a630055a9cb88a99e2e7e45551bc7d6c1e5b4de2c
      - name: Prepare exact BIRD 3.3.2 archive
        run: |
          set -euo pipefail
          .github/scripts/install-bird3.sh \
            --version 3.3.2 \
            --sha256 21297d7a02edd700ae82de5a630055a9cb88a99e2e7e45551bc7d6c1e5b4de2c \
            --coverage-label "M101 BIRD 3.3.2 image blocked" \
            --prepare-archive \
            "$RUNNER_TEMP/bird332-cache/bird-3.3.2.tar.gz"
      - name: Upload verified BIRD 3.3.2 archive
        uses: actions/upload-artifact@v7
        with:
          name: bird332-v3.3.2-source
          path: ${{ runner.temp }}/bird332-cache/bird-3.3.2.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Warm one fixed-scope cache per source SHA; jobs still build and load their
  # own image, falling back to an uncached build if the cache is unavailable.
  prime_dev_image:
    needs: classify_changes
    if: needs.classify_changes.outputs.run_labs == 'true'
    name: Prime rustbgpd:dev build cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: rustbgpd-dev-image-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Prime rustbgpd:dev build cache
        uses: ./.github/actions/prime-rustbgpd-dev-cache

  m1:
    needs: [grpcurl_archive, prime_dev_image]
    name: M1 — basic session + UPDATE (FRR 10.3.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install containerlab
        uses: ./.github/actions/install-containerlab

      - name: Install exact grpcurl offline
        uses: ./.github/actions/install-grpcurl-artifact

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build rustbgpd:dev
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rustbgpd:dev
          target: dev
          cache-from: type=gha,scope=rustbgpd-dev

      - name: Run M1 (deploy + test + destroy with retry)
        uses: ./.github/actions/run-interop-test
        with:
          label: M1
          topology: tests/interop/m1-frr.clab.yml
          script: tests/interop/scripts/test-m1-frr.sh

  m13:
    needs: [grpcurl_archive, prime_dev_image]
    name: M13 — Policy Engine (FRR 10.3.1, 3-node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install containerlab
        uses: ./.github/actions/install-containerlab

      - name: Install exact grpcurl offline
        uses: ./.github/actions/install-grpcurl-artifact

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build rustbgpd:dev
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rustbgpd:dev
          target: dev
          cache-from: type=gha,scope=rustbgpd-dev

      - name: Run M13 (deploy + test + destroy with retry)
        uses: ./.github/actions/run-interop-test
        with:
          label: M13
          topology: tests/interop/m13-policy-frr.clab.yml
          script: tests/interop/scripts/test-m13-policy-frr.sh

  m80:
    needs: [grpcurl_archive, prime_dev_image]
    name: M80 — rpol policy parity (ADR-0096, FRR 10.3.1, 4-node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install containerlab
        uses: ./.github/actions/install-containerlab

      - name: Install exact grpcurl offline
        uses: ./.github/actions/install-grpcurl-artifact

      - name: Ensure jq
        # jq drives the parity tuple comparisons (rustbgpd gRPC JSON
        # vs FRR vtysh JSON) and the policy test/stats assertions.
        run: |
          command -v jq >/dev/null || { sudo apt-get update -y && sudo apt-get install -y jq; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build rustbgpd:dev
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rustbgpd:dev
          target: dev
          cache-from: type=gha,scope=rustbgpd-dev

      - name: Run M80 (deploy + test + destroy with retry)
        uses: ./.github/actions/run-interop-test
        with:
          label: M80
          topology: tests/interop/m80-rpol-policy-parity-frr.clab.yml
          script: tests/interop/scripts/test-m80-rpol-policy-parity-frr.sh

  m15:
    needs: [grpcurl_archive, prime_dev_image]
    name: M15 — Route Refresh via gRPC SoftResetIn (FRR 10.3.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install containerlab
        uses: ./.github/actions/install-containerlab

      - name: Install exact grpcurl offline
        uses: ./.github/actions/install-grpcurl-artifact

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build rustbgpd:dev
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rustbgpd:dev
          target: dev
          cache-from: type=gha,scope=rustbgpd-dev

      - name: Run M15 (deploy + test + destroy with retry)
        uses: ./.github/actions/run-interop-test
        with:
          label: M15
          topology: tests/interop/m15-rr-frr.clab.yml
          script: tests/interop/scripts/test-m15-rr-frr.sh

  m10:
    needs: [grpcurl_archive, prime_dev_image]
    name: M10/M16 — IPv6 MP-BGP + dual-stack LLGR (FRR 10.3.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install containerlab
        uses: ./.github/actions/install-containerlab

      - name: Install exact grpcurl offline
        uses: ./.github/actions/install-grpcurl-artifact

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build rustbgpd:dev
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rustbgpd:dev
          target: dev
          cache-from: type=gha,scope=rustbgpd-dev

      - name: Run M10 (deploy + test + destroy with retry)
        uses: ./.github/actions/run-interop-test
        with:
          label: M10
          topology: tests/interop/m10-frr-ipv6.clab.yml
          script: tests/interop/scripts/test-m10-frr-ipv6.sh

      - name: Run M16 (deploy + test + destroy with retry)
        uses: ./.github/actions/run-interop-test
        with:
          label: M16
          topology: tests/interop/m16-llgr-frr.clab.yml
          script: tests/interop/scripts/test-m16-llgr-frr.sh

  m14:
    needs: [grpcurl_archive, prime_dev_image]
    name: M14 — Route Reflector (FRR 10.3.1, 3-node iBGP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install containerlab
        uses: ./.github/actions/install-containerlab

      - name: Install exact grpcurl offline
        uses: ./.github/actions/install-grpcurl-artifact

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build rustbgpd:dev
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rustbgpd:dev
          target: dev
          cache-from: type=gha,scope=rustbgpd-dev

      - name: Run M14 (deploy + test + destroy with retry)
        uses: ./.github/actions/run-interop-test
        with:
          label: M14
          topology: tests/interop/m14-rr-frr.clab.yml
          script: tests/interop/scripts/test-m14-rr-frr.sh

  m17:
    needs: [grpcurl_archive, prime_dev_image]
    name: M17/M89 — Add-Path + experimental Paths-Limit (FRR 10.3.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install containerlab
        uses: ./.github/actions/install-containerlab

      - name: Install exact grpcurl offline
        uses: ./.github/actions/install-grpcurl-artifact

      - name: Ensure jq
        run: |
          command -v jq >/dev/null || { sudo apt-get update -y && sudo apt-get install -y jq; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build rustbgpd:dev
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rustbgpd:dev
          target: dev
          cache-from: type=gha,scope=rustbgpd-dev

      - name: Run M17 (deploy + test + destroy with retry)
        uses: ./.github/actions/run-interop-test
        with:
          label: M17
          topology: tests/interop/m17-addpath-frr.clab.yml
          script: tests/interop/scripts/test-m17-addpath-frr.sh

      - name: Run M89 (deploy + test + destroy with retry)
        uses: ./.github/actions/run-interop-test
        with:
          label: M89
          topology: tests/interop/m89-paths-limit-frr.clab.yml
          script: tests/interop/scripts/test-m89-paths-limit-frr.sh

  m73:
    needs: [grpcurl_archive, prime_dev_image]
    name: M73/M87 — GoBGP BGP-LS + exact-export/BIRD
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install containerlab
        uses: ./.github/actions/install-containerlab

      - name: Install exact grpcurl offline
        uses: ./.github/actions/install-grpcurl-artifact

      - name: Ensure jq
        run: |
          command -v jq >/dev/null || { sudo apt-get update -y && sudo apt-get install -y jq; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build rustbgpd:dev
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rustbgpd:dev
          target: dev
          cache-from: type=gha,scope=rustbgpd-dev

      - name: Build gobgp:bgpls
        run: docker build -t gobgp:bgpls -f tests/interop/Dockerfile.gobgp-bgpls tests/interop

      - name: Build bird:2-bookworm
        run: docker build -t bird:2-bookworm -f tests/interop/Dockerfile.bird tests/interop

      - name: Run M73 (deploy + test + destroy with retry)
        uses: ./.github/actions/run-interop-test
