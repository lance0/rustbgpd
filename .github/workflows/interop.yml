          index_json=$(docker buildx imagetools inspect --raw "$OPENBGPD_IMAGE")
          amd64_manifest=$(jq -er '
            [.manifests[] | select(.platform.os == "linux"
              and .platform.architecture == "amd64"
              and ((.platform.variant // "") == ""))]
            | if length == 1 then .[0].digest
              else error("expected exactly one linux/amd64 manifest") end
          ' <<<"$index_json")
          test "$amd64_manifest" = "$OPENBGPD_AMD64_MANIFEST"
          manifest_json=$(docker buildx imagetools inspect --raw \
            "openbgpd/openbgpd@$amd64_manifest")
          test "$(jq -er '.config.digest' <<<"$manifest_json")" = "$OPENBGPD_CONFIG"
          docker pull "$OPENBGPD_IMAGE"

