        run: docker build -t bmpsink:m102 -f tests/interop/Dockerfile.bmpsink tests/interop

      - name: Verify and pull digest-pinned OpenBGPD 9.2 image
        env:
          OPENBGPD_IMAGE: openbgpd/openbgpd@sha256:b2e94bd1538102a89cff96867993eabb6dbb27720de4ab7b588860880e3e3bf9
          OPENBGPD_AMD64_MANIFEST: sha256:3178027d7ca916eacec247c66472a1f95a17d83d4616fe4f118318a912ab8beb
          OPENBGPD_CONFIG: sha256:06317b65d9fadc80f68c5c8e7c82815b0643577fd5441bd55038e43771b5807e
