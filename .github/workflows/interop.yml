    needs: [grpcurl_archive, bird2192_archive, prime_dev_image]
    name: M104 — current ARouteServer route-server differential
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The differential asserts its source contains the post-M103 boundary via
      # `git merge-base --is-ancestor`, which needs history the default shallow
      # checkout does not fetch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/install-protobuf

      - name: Install containerlab
        uses: ./.github/actions/install-containerlab

      - name: Install exact grpcurl offline
        uses: ./.github/actions/install-grpcurl-artifact

