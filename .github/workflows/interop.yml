    needs: [grpcurl_archive, prime_dev_image]
    name: M86 — RR core reflection + GR truth against OpenBGPD 9.1 clients
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install containerlab
        uses: ./.github/actions/install-containerlab

      - name: Install exact grpcurl offline
        uses: ./.github/actions/install-grpcurl-artifact

      - name: Ensure jq
        # jq drives the bgpctl -j and rbgp JSON client-view assertions.
        run: |
          command -v jq >/dev/null || { sudo apt-get update -y && sudo apt-get install -y jq; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build rustbgpd:dev
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rustbgpd:dev
          target: dev
          cache-from: type=gha,scope=rustbgpd-dev

      - name: Verify and pull digest-pinned OpenBGPD 9.1
        # Pin the multi-platform index used by the topology, then prove the
        # hosted linux/amd64 runner resolves the reviewed leaf and config.
        # The OpenBGPD entrypoint execs any non-bgpd command; the topology
        # therefore holds each container with sleep until the driver has
