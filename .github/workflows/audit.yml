name: Security audit

# Two complementary dependency gates:
#   - `cargo audit` (RustSec advisories; ignores in .cargo/audit.toml)
#   - `cargo deny check advisories bans licenses sources` (advisories
#     again via the same DB, plus license allowlist, wildcard/duplicate
#     bans, and registry-source pinning; config in deny.toml)
#
# Triggers:
#   - Daily at 06:00 UTC (catches advisories filed overnight before
#     the next workday starts)
#   - Every push to main (so a freshly-merged dep bump can't slip
#     a regression past the daily window)
#   - Pull requests that touch Cargo manifests / lockfiles / the gate
#     configs (so dependabot PRs and manual bumps get checked at PR
#     time)
#
# Both gates scan the root and independent bench/scale workspaces,
# sharing the repository's advisory and license policies. Each workspace
# has its own lockfile; scanning the root alone does not cover the harnesses.

on:
  schedule:
    # 06:00 UTC every day — early enough to land before EU morning,
    # late enough that the RustSec mirror is settled.
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit (${{ matrix.workspace }})
    strategy:
      fail-fast: false
      matrix:
        workspace: [".", "bench/scale"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # rustsec/audit-check posts findings as a check-run via the
    # GitHub Checks API. Default GITHUB_TOKEN permissions on
    # push-to-main are read-only since GitHub's 2023 default-token
    # change, so the action got `Resource not accessible by
    # integration` and failed the job whenever there was at least
    # one finding to post — even an informational `unmaintained`
    # warning. Granting `checks: write` here lets the action post
    # the check-run cleanly; everything else stays read-only.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      # rustsec/audit-check is the canonical action; it caches the
      # advisory DB and posts findings as a check-run.
      # Pinned to a release tag rather than `@v2` floating so the
      # action contents are reproducible.
      - name: Run cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ matrix.workspace }}

  deny:
    name: cargo deny (${{ matrix.workspace }})
    strategy:
      fail-fast: false
      matrix:
        workspace: [".", "bench/scale"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # EmbarkStudios' official action; installs a pinned cargo-deny
      # and runs the four checks against deny.toml. Pinned to a
      # release tag for reproducibility, matching the audit job.
      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.workspace }}/Cargo.toml
          command: check advisories bans licenses sources
          command-arguments: --config deny.toml
