name: Criterion Bench Nightly

# Nightly perf TRIPWIRE — not a source of published benchmark truth.
#
# DORMANT since 2026-08-21: the `[self-hosted, rustbgpd-bench]` VPS was
# deregistered and reclaimed. The schedule trigger is removed so nothing
# queues against a label with no runner behind it; a scheduled run would
# otherwise sit pending forever instead of failing. Everything else is
# retained deliberately.
#
# TO REVIVE: register a runner carrying the `rustbgpd-bench` label, then
# restore the schedule below. Re-measure the new host's same-SHA noise
# floor before trusting any comparison — the ~11% figure in this file and
# in docs/BENCHMARKS.md is specific to the retired VPS and does not carry
# over. Re-check the nightly ladder for a free slot (fuzz 04:00,
# audit 06:00) rather than assuming 05:00 is still unclaimed.
#
# Runs the same pinned A/B harness as `bench.yml` (bench/compare-criterion.sh)
# on the dedicated self-hosted runner, comparing the current default-branch tip
# against the **latest release tag**. A release-anchored baseline is the right
# fit for this virtualized VPS: a single-commit delta lives inside the ~11%
# noise floor and is meaningless, but a real regression accumulates past the
# advisory band over a release cycle instead of hiding in per-commit noise.
#
# CONFIDENT-REGRESSION TRIPWIRE — still not a source of published benchmark
# truth. The workflow fails only when compare-criterion.sh sees a row with
# enough completed attempts, a min..max range entirely above zero, the last
# run's own 95% CI entirely above zero, and a mean delta above the configured
# regression threshold while stddev stays below the configured noise ceiling.
# Straddle-zero (min..max or CI), high-stddev, or delta-only rows remain
# advisory/inconclusive. bgperf2 stays release-time `/bench` only — it is too
# stateful (Docker, one-at-a-time, shared container names) for unattended runs.
#
# TWO-CONSECUTIVE-NIGHTS RULE — on scheduled runs a confident-regression row
# fails the workflow only when the same row was also confident on the previous
# nightly. With 53 rows per run on a virtualized VPS, one all-positive row
# clears the per-row bar by chance roughly nightly (2026-08-12..14 each fired
# a single different row and the next night contradicted it: rib_pipeline/1000
# +5.81% then -7.43%; loc_rib_recompute/8 -7.97% then +4.65%), while every
# real regression this tripwire has caught repeated identically the following
# night (2026-08-02/03: adj_rib_in_insert/500000 +49.3%/+49.8%,
# best_path_cmp/equal +3.55%/+4.55%). First-night rows stay advisory in the
# run summary. workflow_dispatch runs keep single-run verdicts.

on:
  # schedule:
  #   - cron: "0 5 * * *" # nightly at 05:00 UTC (between fuzz@04:00 and audit@06:00)
  #   ^ restore together with a runner carrying the `rustbgpd-bench` label.
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Baseline ref (blank = latest release tag)"
        required: false
        default: ""
      package:
        description: "Cargo package"
        required: false
        default: "rustbgpd-rib"
      bench:
        description: "Criterion bench target"
        required: false
        default: "rib_ops"
      core:
        description: "CPU core for taskset pinning"
        required: false
        default: "0"
      attempts:
        description: "A/B attempts with alternating order (even N cancels order bias)"
        required: false
        default: "4"

permissions:
  contents: read

# Share bench.yml's group so a nightly run and a manual A/B dispatch never run
# at the same time on the single pinned runner (overlap corrupts both).
concurrency:
  group: criterion-bench-compare
  cancel-in-progress: false

jobs:
  nightly:
    # Defensive: never run on a fork that inherits the runner registration.
    if: github.repository == 'lance0/rustbgpd'
    runs-on: [self-hosted, rustbgpd-bench]
    # Sized against the measured `rib_ops` matrix, not guessed. Four attempts
    # are eight half-runs: ~19.5 min each for the two that pay cold
    # compilation and ~14.3 min at steady state, so a full comparison needs
    # ~127 min. The previous 120 was set when `rib_ops` had 10 bench sites;
    # #1374 took it to 15 (35 of the 53 measured rows are the `attr_*`
    # groups). Runs only began cancelling once v0.63.0 was tagged and the
    # baseline side inherited those rows too — before that the cheaper
    # baseline half kept the total under the cap.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for `git describe` and the A/B worktrees

      - uses: dtolnay/rust-toolchain@v1 # stable

        with:

          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-nightly-${{ inputs.package || 'rustbgpd-rib' }}-${{ inputs.bench || 'rib_ops' }}

      - name: Resolve baseline ref
        env:
          BASE_INPUT: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_INPUT" ]; then
            base="$BASE_INPUT"
          else
            # Match both the vX.Y.Z git-tag convention (RELEASE_CHECKLIST.md step 6)
            # and a bare X.Y.Z form, defensively. The checklist's "no v prefix"
            # note is about the GHCR *image* tag, not the git tag — matching both
            # keeps nightly robust if a git tag ever drops the v.
            base="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --match '[0-9]*' 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "::error::no release tag found (git describe --match 'v[0-9]*') and no base_ref override given" >&2
            exit 1
          fi
          echo "BASE_REF=$base" >> "$GITHUB_ENV"
          echo "Nightly baseline: $base  (head: HEAD = $(git rev-parse --short=12 HEAD))"

      - name: Run Criterion comparison (HEAD vs latest release tag)
        id: compare
        # Inputs via env, never interpolated into shell text (injection-safe even
        # though this trigger is privileged).
        env:
          PACKAGE: ${{ inputs.package || 'rustbgpd-rib' }}
          BENCH: ${{ inputs.bench || 'rib_ops' }}
          CORE: ${{ inputs.core || '0' }}
          ATTEMPTS: ${{ inputs.attempts || '4' }}
        run: |
          # No `-e`: compare-criterion.sh exits 75 (EX_TEMPFAIL) when a soak
          # holds the shared host lock. That single self-hosted box also runs
          # unattended soaks; a soak and this A/B would corrupt both, so on a
          # held lock we skip green rather than fail red. Any other non-zero is
          # a real failure and propagates.
          set -uo pipefail
          rc=0
          harness_args=()
          if [ "$PACKAGE" = "rustbgpd-rib" ] && [ "$BENCH" = "rib_ops" ]; then
            harness_args=(
              --harness-ref HEAD
              --harness-path crates/rib/benches/rib_ops.rs
            )
          fi
          bench/compare-criterion.sh \
            --base "$BASE_REF" \
            --head "HEAD" \
            --package "$PACKAGE" \
            --bench "$BENCH" \
            --core "$CORE" \
            --attempts "$ATTEMPTS" \
            "${harness_args[@]}" \
            --fail-on-regression \
            --out-dir "target/bench-compare" || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "soak_skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::host lock held by an active soak — skipping nightly bench (advisory, non-gating)"
            exit 0
          fi
          # require_performance is intentionally NOT set — the VPS CPU is
          # virtualized and exposes no cpufreq governor (see bench.yml).
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            exit "$rc"
          fi
          # Two-consecutive-nights rule (see the header comment): rc=1 with a
          # confident-regression verdict fails the run only when a fired row
          # also fired on the previous nightly. Streak state lives next to the
          # host lock on this single pinned runner; a run without confident
          # rows resets it. Harness errors (no summary, or rc other than 0/1)
          # propagate untouched.
          summary="$(find target/bench-compare -name summary.md -print 2>/dev/null | sort | tail -n 1 || true)"
          if { [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; } || [ -z "$summary" ]; then
            exit "$rc"
          fi
          current="$(grep -m1 '^Confident regression rows:' "$summary" | grep -o '`[^`]*`' | tr -d '`' | sort -u || true)"
          if [ "$rc" -eq 1 ] && [ -z "$current" ]; then
            exit "$rc"
          fi
          state_file="${HOME}/.local/state/rustbgpd-bench-nightly-confident-rows-${PACKAGE}-${BENCH}.txt"
          previous=""
          if [ -f "$state_file" ]; then
            previous="$(cat "$state_file")"
          fi
          mkdir -p "$(dirname "$state_file")"
          printf '%s' "$current" > "$state_file"
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          confirmed="$(comm -12 <(printf '%s' "$current") <(printf '%s' "$previous") || true)"
          if [ -n "$confirmed" ]; then
            echo "::error::confident regression on two consecutive nightly runs: $(echo "$confirmed" | paste -sd' ' -)"
            exit 1
          fi
          echo "unconfirmed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::confident-regression row(s) not confident on the previous nightly — advisory; the run fails if the same row repeats tomorrow: $(echo "$current" | paste -sd' ' -)"
          exit 0

      - name: Publish summary
        if: always()
        env:
          SOAK_SKIP: ${{ steps.compare.outputs.soak_skip }}
          UNCONFIRMED: ${{ steps.compare.outputs.unconfirmed }}
        run: |
          set -euo pipefail
          if [ "${SOAK_SKIP:-}" = "true" ]; then
            {
              echo "## Nightly criterion tripwire — SKIPPED (soak active)"
              echo
              echo "A soak holds the shared host lock, so the nightly bench skipped"
              echo "to avoid CPU contention corrupting both readings. Advisory and"
              echo "non-gating — run a manual A/B via workflow_dispatch once the"
              echo "soak ends."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Nightly criterion tripwire"
            echo
            echo "HEAD vs latest release tag (\`${BASE_REF:-?}\`). The job fails only"
            echo "for confident regressions: enough attempts, \`min..max\` and the"
            echo "last-run 95% CI both entirely above zero, bounded stddev, and"
            echo "\`mean delta\` above the configured threshold. Straddle-zero (range"
            echo "or CI) and high-stddev rows remain advisory. A scheduled run"
            echo "fails only when the same row is confident on two consecutive"
            echo "nightlies."
            echo "See docs/BENCHMARKS.md."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${UNCONFIRMED:-}" = "true" ]; then
            {
              echo "**Advisory:** confident-regression row(s) fired on this run but"
              echo "were not confident on the previous nightly. The run stays green;"
              echo "it fails if the same row repeats on the next nightly."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          summary="$(find target/bench-compare -name summary.md -print 2>/dev/null | sort | tail -n 1 || true)"
          if [ -n "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No benchmark summary found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Criterion artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-bench-nightly
          path: target/bench-compare/
          if-no-files-found: warn
