name: Release build features

# The release build must not resolve `bench-internals` in the shipped
# packages. Any manifest can change feature unification, so every
# Cargo.toml triggers the check.
on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - .github/workflows/release.yml
      - .github/workflows/release-build-features.yml
      - scripts/check_release_build_features.py
      - scripts/test_check_release_build_features.py
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - .github/workflows/release.yml
      - .github/workflows/release-build-features.yml
      - scripts/check_release_build_features.py
      - scripts/test_check_release_build_features.py

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (stable)
        with:
          toolchain: stable
      - name: Test release build feature guard
        run: python3 -m unittest -v scripts/test_check_release_build_features.py
      - name: Check release build features
        run: python3 scripts/check_release_build_features.py
