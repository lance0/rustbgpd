# Dependabot config — keeps Cargo dependencies and GitHub Actions
# pinned versions current. The primary workspace-root Cargo entry
# covers the daemon and its workspace crates, including the
# published ones, through the shared Cargo.lock. Member manifests
# inherit workspace fields, so a per-crate directory entry cannot
# replace the workspace entry. The independent scale workspace has
# its own entry and lockfile; its path dependencies share root fields.
#
# Cadence: weekly. The Cargo ecosystem tends to produce a steady
# trickle of patch releases (tonic, prost, tokio); weekly avoids
# review fatigue while keeping us within ~7 days of upstream
# advisories. Daily would noise; monthly would let things drift.
#
# Grouping: workspace-internal `rustbgpd-*` crates are excluded
# from updates here because they're path-only deps managed by the
# release process. Other deps land as one PR per group when
# possible to keep review surface small.

version: 2
updates:
  # Workspace root: the daemon and every workspace crate.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Keep direct updates and admit the HTTP stack's lock-only dependencies.
    allow:
      - dependency-type: "direct"
      - dependency-name: "hyper*"
        dependency-type: "indirect"
      - dependency-name: "h2"
        dependency-type: "indirect"
    groups:
      netlink-stack:
        patterns:
          - "rtnetlink"
          - "netlink-*"
      tokio-stack:
        patterns:
          - "tokio*"
          - "tower*"
          - "hyper*"
          - "h2"
      tonic-prost:
        patterns:
          - "tonic*"
          - "prost*"
      tracing-stack:
        patterns:
          - "tracing*"
      serde-stack:
        patterns:
          - "serde*"
      test-deps:
        dependency-type: "development"
      # The MCP SDK gets its own group and never rides along with an
      # unrelated batch: rmcp majors have carried breaking API changes,
      # and `schemars` must stay compatible with the version rmcp itself
      # resolves so its `Json<T>` trait bounds keep unifying.
      mcp-sdk:
        patterns:
          - "rmcp*"
          - "schemars*"
    ignore:
      # An rmcp major is a deliberate, separately reviewed change — the
      # server is not shipped in any release artifact, so an unattended
      # major bump costs more review than it buys.
      - dependency-name: "rmcp"
        update-types: ["version-update:semver-major"]
      - dependency-name: "schemars"
        update-types: ["version-update:semver-major"]
      # Workspace-internal crates are path deps; updates land via the
      # release process, not Dependabot.
      - dependency-name: "rustbgpd-*"

  # Independent scale workspace, including profiling and load harnesses.
  - package-ecosystem: "cargo"
    directory: "/bench/scale"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "rustbgpd-*"

  # GitHub Actions versions in workflows/. Catches deprecation
  # warnings (e.g. Node 20 → Node 24 transition) before they bite.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
