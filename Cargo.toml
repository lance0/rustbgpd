[workspace]
members = [
    "crates/wire",
    "crates/bfd",
    "crates/fsm",
    "crates/transport",
    "crates/rib",
    "crates/policy",
    "crates/api",
    "crates/telemetry",
    "crates/rpki",
    "crates/cli",
    "crates/bmp",
    "crates/mrt",
    "crates/evpn",
    "crates/evpn-linux",
    "bench/evpn-load",
]
resolver = "2"

[workspace.package]
version = "0.29.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lance0/rustbgpd"
keywords = ["bgp", "networking", "routing", "grpc"]
categories = ["network-programming"]

[workspace.dependencies]
# Internal crates
rustbgpd-wire = { path = "crates/wire" }
rustbgpd-bfd = { path = "crates/bfd", version = "0.29.0" }
rustbgpd-fsm = { path = "crates/fsm", version = "0.29.0" }
rustbgpd-transport = { path = "crates/transport", version = "0.29.0" }
rustbgpd-rib = { path = "crates/rib", version = "0.29.0" }
rustbgpd-policy = { path = "crates/policy", version = "0.29.0" }
rustbgpd-api = { path = "crates/api", version = "0.29.0" }
rustbgpd-telemetry = { path = "crates/telemetry", version = "0.29.0" }
rustbgpd-rpki = { path = "crates/rpki", version = "0.29.0" }
rustbgpd-bmp = { path = "crates/bmp", version = "0.29.0" }
rustbgpd-mrt = { path = "crates/mrt", version = "0.29.0" }
rustbgpd-evpn = { path = "crates/evpn", version = "0.29.0" }
rustbgpd-evpn-linux = { path = "crates/evpn-linux", version = "0.29.0" }

# External dependencies — pinned across workspace
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prometheus = "0.14"
socket2 = { version = "0.6", features = ["all"] }
# `uio` gates recvmsg / ControlMessageOwned / cmsg_space! used by the BFD actor
# to read IP_RECVTTL / IPV6_RECVHOPLIMIT + IP_PKTINFO / IPV6_PKTINFO ancillary
# data (RFC 5881 TTL=255 receive check). Linux-only consumer.
nix = { version = "0.30", features = ["socket", "net", "uio"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
axum = "0.8"
tower = "0.5"
libc = "0.2"
x509-parser = "0.18"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
toml_edit = "0.25"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde_json = "1"
owo-colors = { version = "4", features = ["supports-colors"] }
criterion = { version = "0.8", features = ["html_reports"] }
smallvec = "1"
tikv-jemallocator = { version = "0.6", features = ["profiling"] }
dhat = "0.3"
rcgen = "0.14"

[package]
name = "rustbgpd"
description = "API-first BGP daemon with gRPC control plane"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
jemalloc = ["tikv-jemallocator"]
dhat-heap = ["dhat"]

[dependencies]
tikv-jemallocator = { workspace = true, optional = true }
dhat = { workspace = true, optional = true }
rustbgpd-wire.workspace = true
rustbgpd-bfd.workspace = true
rustbgpd-fsm.workspace = true
rustbgpd-transport.workspace = true
rustbgpd-rib.workspace = true
rustbgpd-policy.workspace = true
rustbgpd-api.workspace = true
rustbgpd-telemetry.workspace = true
rustbgpd-rpki.workspace = true
rustbgpd-bmp.workspace = true
rustbgpd-mrt.workspace = true
rustbgpd-evpn.workspace = true
rustbgpd-evpn-linux.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
prometheus.workspace = true
thiserror.workspace = true
bytes.workspace = true
serde_json.workspace = true
owo-colors.workspace = true
axum.workspace = true
socket2.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink = "0.21"
netlink-packet-route = "0.30"
libc.workspace = true
nix.workspace = true
futures = "0.3"

[dev-dependencies]
tempfile = "3"
tower.workspace = true

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[profile.release-prof]
inherits = "release"
strip = false
debug = 1

# Used by the `rustbgpd:dev` container image and any CI / dev / interop
# context that wants release-shaped binaries (no debug_assertions, no
# overflow checks) but does not need the smallest-binary LTO pass.
# Drops fat-LTO and brings codegen-units back to the default so the
# build parallelizes across crates and skips the serial whole-program
# link. The 15 workspace crates plus ~300 deps compile dramatically
# faster than `release` and run fine for our ~10 s interop smokes.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
strip = "symbols"
