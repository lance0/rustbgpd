[workspace]
members = [
    "crates/wire",
    "crates/bfd",
    "crates/fsm",
    "crates/transport",
    "crates/rib",
    "crates/policy",
    "crates/api",
    "crates/telemetry",
    "crates/rpki",
    "crates/cli",
    "crates/bmp",
    "crates/mrt",
    "crates/evpn",
    "crates/evpn-linux",
    "crates/event-history",
    "bench/evpn-load",
    "examples/event-bridge",
    "examples/birdwatcher-adapter",
    "tools/rs-config-render",
]
resolver = "2"

[workspace.package]
version = "0.60.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lance0/rustbgpd"
keywords = ["bgp", "networking", "routing", "grpc"]
categories = ["network-programming"]

[workspace.dependencies]
# Internal crates
rustbgpd-wire = { path = "crates/wire", version = "0.15.0" }
rustbgpd-bfd = { path = "crates/bfd", version = "0.60.0" }
rustbgpd-fsm = { path = "crates/fsm", version = "0.3.0" }
rustbgpd-transport = { path = "crates/transport", version = "0.60.0" }
rustbgpd-rib = { path = "crates/rib", version = "0.60.0" }
rustbgpd-policy = { path = "crates/policy", version = "0.60.0" }
rustbgpd-api = { path = "crates/api", version = "0.60.0" }
rustbgpd-telemetry = { path = "crates/telemetry", version = "0.60.0" }
rustbgpd-rpki = { path = "crates/rpki", version = "0.60.0" }
rustbgpd-bmp = { path = "crates/bmp", version = "0.60.0" }
rustbgpd-mrt = { path = "crates/mrt", version = "0.60.0" }
rustbgpd-evpn = { path = "crates/evpn", version = "0.60.0" }
rustbgpd-evpn-linux = { path = "crates/evpn-linux", version = "0.60.0" }
rustbgpd-event-history = { path = "crates/event-history", version = "0.60.0" }

# External dependencies — pinned across workspace
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
prometheus = "0.14"
socket2 = { version = "0.6", features = ["all"] }
# `uio` gates recvmsg / ControlMessageOwned / cmsg_space! used by the BFD actor
# to read IP_RECVTTL / IPV6_RECVHOPLIMIT + IP_PKTINFO / IPV6_PKTINFO ancillary
# data (RFC 5881 TTL=255 receive check). Linux-only consumer.
nix = { version = "0.31", features = ["socket", "net", "uio"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
axum = "0.8"
tower = "0.5"
libc = "0.2"
x509-parser = "0.18"
serde = { version = "1", features = ["derive"] }
schemars = "1.2"
toml = "1.1"
toml_edit = "0.25"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.3"
serde_json = "1"
# Consumed by tools/rs-config-render: `arouteserver template-context`
# output is YAML (JSON parses through the same path, YAML being a
# superset). Generate-time tooling only — never a daemon dependency.
serde_yaml = "0.9"
sha2 = "0.11"
owo-colors = { version = "4", features = ["supports-colors"] }
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"
smallvec = "1"
rustc-hash = "2"
# Lock-free snapshot swap for policy dataset handles (LAN-305,
# ADR-0103 Decision 8.5): evaluation pins a generation with one
# wait-free load — the Decision 7 purity contract bans lock
# acquisition on the evaluation path.
arc-swap = "1"
prefix-trie = "0.9.2"
ipnet = "2.12.0"
lru = "0.18"
tikv-jemallocator = { version = "0.7", features = ["profiling", "stats"] }
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"] }
dhat = "0.3"
rcgen = "0.14"
tempfile = "3"
flate2 = "1"
# Embedded SQLite for the durable event history outbox (ADR-0072).
# Bundled libsqlite avoids per-distro packaging variance — the outbox
# is a daemon-local file, not something operators expect to inspect
# with a system sqlite3 CLI.
rusqlite = { version = "0.40", features = ["bundled"] }
# Daemon boot ID stamping for restart detection (ADR-0072).
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[package]
name = "rustbgpd"
description = "API-first BGP daemon with gRPC control plane"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# jemalloc is the default allocator: a long-lived routing daemon's
# reload/resync transients are glibc-malloc's worst case (arenas grow to
# absorb them and are never returned — RSS ratchets upward across policy
# reloads while live bytes stay flat), and the shipped artifacts (GHCR
# image, release tarballs) have built with jemalloc since v0.50.0+.
# Defaulting it means local builds, receipts, and shipped binaries are
# the same build, and the jemalloc_* allocator gauges are always on
# /metrics. Build with --no-default-features for a stock-glibc binary
# (CI keeps that build compiling; it also re-arms deny(unsafe_code)).
default = ["jemalloc"]
bench-internals = []
jemalloc = ["tikv-jemallocator", "rustbgpd-telemetry/jemalloc"]
dhat-heap = ["dhat"]

[dependencies]
tikv-jemallocator = { workspace = true, optional = true }
dhat = { workspace = true, optional = true }
rustbgpd-wire.workspace = true
rustbgpd-bfd.workspace = true
rustbgpd-fsm.workspace = true
rustbgpd-transport.workspace = true
rustbgpd-rib.workspace = true
rustbgpd-policy.workspace = true
rustbgpd-api.workspace = true
rustbgpd-telemetry.workspace = true
rustbgpd-rpki.workspace = true
rustbgpd-bmp.workspace = true
rustbgpd-mrt.workspace = true
rustbgpd-evpn.workspace = true
rustbgpd-evpn-linux.workspace = true
rustbgpd-event-history.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
schemars.workspace = true
toml.workspace = true
toml_edit.workspace = true
prometheus.workspace = true
thiserror.workspace = true
bytes.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
owo-colors.workspace = true
axum.workspace = true
socket2.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink = "0.21"
netlink-packet-route = "0.30"
libc.workspace = true
nix = { workspace = true, features = ["fs", "time", "user"] }
futures = "0.3"

[[bin]]
name = "rustbgpd"
path = "src/main.rs"
bench = false

[dev-dependencies]
# The emitted-config gate (tests/rs_config_render_emitted_check.rs)
# renders the tool's fixture and proves the output passes `--check`.
rs-config-render = { path = "tools/rs-config-render" }
# The importer gate (tests/config_import_emitted_check.rs) translates the
# CLI's BIRD/FRR/GoBGP fixtures and proves the output passes `--check`.
rustbgpctl = { path = "crates/cli" }
serde_yaml.workspace = true
tempfile.workspace = true
tower.workspace = true
criterion.workspace = true
# Drives the gRPC services directly (Request/Status/Code) in the tests that
# prove a rejected mutation leaves no observable trace.
tonic.workspace = true
# Enables Tokio's paused-clock test harness (`start_paused`) for deterministic,
# wall-clock-free timer tests (e.g. the confirm-timeout auto-revert).
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "fib_projection"
harness = false
required-features = ["bench-internals"]

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[profile.release-prof]
inherits = "release"
strip = false
debug = 1

# Used by the `rustbgpd:dev` container image and any CI / dev / interop
# context that wants release-shaped binaries (no debug_assertions, no
# overflow checks) but does not need the smallest-binary LTO pass.
# Drops fat-LTO and brings codegen-units back to the default so the
# build parallelizes across crates and skips the serial whole-program
# link. The 15 workspace crates plus ~300 deps compile dramatically
# faster than `release` and run fine for our ~10 s interop smokes.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
strip = "symbols"
