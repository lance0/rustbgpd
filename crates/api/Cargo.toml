[package]
publish = false
name = "rustbgpd-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "gRPC API server — tonic bindings for the rustbgpd management and diagnostic services"
readme = "README.md"

[features]
# Exposes the RIB manager's benchmark-only event-publish driver to the
# event-history producer benchmark. Normal API and daemon builds do not compile
# that surface.
bench-internals = ["rustbgpd-rib/bench-internals"]
vpn-query-allocation = []

[dependencies]
rustbgpd-wire.workspace = true
rustbgpd-fsm.workspace = true
rustbgpd-rib.workspace = true
rustbgpd-policy.workspace = true
rustbgpd-transport.workspace = true
rustbgpd-telemetry.workspace = true
rustbgpd-evpn.workspace = true
rustbgpd-event-history.workspace = true
rustbgpd-rpki.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tower.workspace = true
prost.workspace = true
prost-types.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
tokio-stream.workspace = true
tokio-rustls.workspace = true
libc.workspace = true
arc-swap.workspace = true
futures = "0.3"
prometheus.workspace = true
bytes.workspace = true
x509-parser.workspace = true
serde_json.workspace = true
sha2 = "0.11"
nix = { workspace = true, features = ["fs", "user"] }
uuid.workspace = true
zeroize.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true
protoc-bin-vendored = "3"

[dev-dependencies]
criterion.workspace = true
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tikv-jemallocator.workspace = true

[[bench]]
name = "event_history_producer"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "vpn_query_timing"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "vpn_query_allocation"
harness = false
required-features = ["bench-internals", "vpn-query-allocation"]
