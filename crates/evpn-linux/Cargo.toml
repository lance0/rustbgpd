[package]
publish = false
name = "rustbgpd-evpn-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Linux netlink dataplane reconciler for EVPN VTEP — observes bridge/VXLAN topology and programs remote-MAC FDB entries (RFC 7432 / RFC 8365)"

[dependencies]
rustbgpd-evpn.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing.workspace = true

# Linux-only real netlink; cfg-gating preserves portable trait/test surfaces
# without promising non-Linux daemon support. The four netlink crates form a coherent ecosystem
# released together; bump them as a set or transitive resolution
# pulls in two copies of `netlink-packet-utils`.
[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink = "0.22"
netlink-packet-route = "0.32.1"
netlink-packet-core = "0.9"
netlink-packet-utils = "0.6"
netlink-sys = { version = "0.8", features = ["tokio_socket"] }
futures = "0.3"
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
