[package]
name = "rustbgpd-wire"
version = "0.24.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "BGP message codec — encode/decode OPEN, KEEPALIVE, UPDATE, NOTIFICATION, ROUTE-REFRESH"
readme = "README.md"
# Repository governance audit: it reads the workspace-level canonical registry
# document, which is intentionally outside this published crate package.
exclude = ["tests/path_attribute_registry.rs", "tests/notification_registry.rs"]

[features]
# Enables allocation counters in the codec diagnostic binary. The ordinary
# Criterion benchmark compiles without this feature and has no probe atomics.
codec-allocation-diagnostics = []
# Provides a `tokio_util::codec` adapter without making Tokio integration part
# of the default, runtime-neutral wire crate dependency surface.
tokio-codec = ["dep:tokio-util"]
# Debug-build check that one encoded attribute list carries each type code at
# most once (RFC 4271 §5). Off by default so embedders keep error-free
# encoding of caller-supplied input; the rustbgpd workspace enables it only
# through dev-dependencies, for its own tests.
strict-encode-invariants = []

[dependencies]
bytes.workspace = true
thiserror.workspace = true
tokio-util = { workspace = true, features = ["codec"], optional = true }

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
tikv-jemallocator.workspace = true
syn = { version = "3", features = ["full"] }

[[bench]]
name = "codec"
harness = false

[[example]]
name = "tokio_codec"
required-features = ["tokio-codec"]
