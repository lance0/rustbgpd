[package]
name = "rustbgpd-wire"
version = "0.16.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "BGP message codec — encode/decode OPEN, KEEPALIVE, UPDATE, NOTIFICATION, ROUTE-REFRESH"
readme = "README.md"

[features]
# Enables allocation counters in the codec diagnostic binary. The ordinary
# Criterion benchmark compiles without this feature and has no probe atomics.
codec-allocation-diagnostics = []

[dependencies]
bytes.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "codec"
harness = false
