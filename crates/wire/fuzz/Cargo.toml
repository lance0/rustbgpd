[package]
name = "rustbgpd-wire-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"

[dependencies.rustbgpd-wire]
path = ".."

[[bin]]
name = "decode_message"
path = "fuzz_targets/decode_message.rs"
test = false
doc = false

[[bin]]
name = "decode_update"
path = "fuzz_targets/decode_update.rs"
test = false
doc = false

[[bin]]
name = "decode_flowspec"
path = "fuzz_targets/decode_flowspec.rs"
test = false
doc = false

[[bin]]
name = "decode_evpn"
path = "fuzz_targets/decode_evpn.rs"
test = false
doc = false

[[bin]]
name = "encode_evpn"
path = "fuzz_targets/encode_evpn.rs"
test = false
doc = false

[[bin]]
name = "parse_rd"
path = "fuzz_targets/parse_rd.rs"
test = false
doc = false

[workspace]
