[package]
publish = false
name = "rustbgpctl"
# The package keeps its historical Cargo name, but the shipped CLI binary is
# `rbgp`.
default-run = "rbgp"
autobins = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "CLI tool for rustbgpd — thin gRPC wrapper for daemon management"
readme = "README.md"

[lib]
name = "rustbgpctl"
path = "src/lib.rs"

[[bin]]
name = "rbgp"
path = "src/main.rs"

[dependencies]
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
tokio.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# `rbgp doctor` bundle output (one gzipped tarball).
tar = "0.4"
flate2 = "1"
owo-colors.workspace = true
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
rustbgpd-policy.workspace = true
rustbgpd-wire.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true

[dev-dependencies]
tempfile = "3"
tokio-stream = { workspace = true, features = ["net"] }
rustbgpd-api.workspace = true
rustbgpd-evpn.workspace = true
# Fixture builder for the from-bmp adapter tests: captures are framed by
# the daemon's own RFC-pinned BMP encoder.
rustbgpd-bmp.workspace = true
