frr version 10.3.1
frr defaults traditional
hostname edge1
log syslog informational
service integrated-vtysh-config
!
ip prefix-list OUR-NETS seq 5 permit 198.51.100.0/24
ip prefix-list OUR-NETS seq 10 permit 203.0.113.0/24
!
route-map UPSTREAM-OUT permit 10
 match ip address prefix-list OUR-NETS
route-map UPSTREAM-OUT deny 20
!
router bgp 64500
 bgp router-id 192.0.2.10
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor TRANSIT peer-group
 neighbor TRANSIT remote-as 64496
 neighbor TRANSIT timers 30 90
 neighbor 192.0.2.1 peer-group TRANSIT
 neighbor 192.0.2.1 description transit-a uplink
 neighbor 192.0.2.1 password example-md5-secret
 neighbor 2001:db8::1 remote-as 64497
 neighbor 2001:db8::1 description transit-b v6
 neighbor 2001:db8::1 timers 30 60
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  network 203.0.113.0/24
  neighbor TRANSIT activate
  neighbor TRANSIT maximum-prefix 500000
  neighbor 192.0.2.1 route-map UPSTREAM-OUT out
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 2001:db8::1 activate
  neighbor 2001:db8::1 maximum-prefix 200000
 exit-address-family
!
ip route 192.0.2.0/24 192.0.2.1
!
line vty
!
