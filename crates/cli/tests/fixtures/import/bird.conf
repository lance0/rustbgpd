# Edge router — BIRD 2.0.12. Two transit uplinks (one v4 with MD5, one
# v6) plus an IXP route-server session, exporting two locally-originated
# prefixes through a filter.

log syslog all;
router id 192.0.2.10;

define OUR_NETS = [ 198.51.100.0/24, 203.0.113.0/24 ];

protocol device {
  scan time 10;
}

protocol static statics {
  ipv4;
  route 198.51.100.0/24 blackhole;
  route 203.0.113.0/24 blackhole;
}

filter export_to_upstream {
  if net ~ OUR_NETS then accept;
  reject;
}

template bgp peers_v4 {
  local as 64500;
  hold time 90;
  ipv4 {
    import all;
    import limit 500000 action restart;
  };
}

protocol bgp upstream1 from peers_v4 {
  neighbor 192.0.2.1 as 64496;
  description "transit-a uplink";
  password "example-md5-secret";
  ipv4 {
    import all;
    export filter export_to_upstream;
  };
}

protocol bgp upstream2 {
  local as 64500;
  neighbor 2001:db8::1 as 64497;
  description "transit-b v6";
  hold time 240;
  keepalive time 60;
  ipv6 {
    import all;
    import limit 200000 action restart;
    export where net ~ [ 2001:db8:100::/40+ ];
  };
}

protocol bgp ixp_rs {
  local as 64500;
  neighbor 192.0.2.200 as 64499;
  description "ixp route server";
  enforce first as off;
  ipv4 {
    import filter {
      if bgp_path.len > 40 then reject;
      accept;
    };
    export filter export_to_upstream;
  };
}
