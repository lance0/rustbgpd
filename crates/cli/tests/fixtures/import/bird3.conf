# BIRD 3.3.1 route-server fixture for importer and emitted-config gates.
log stderr all;
router id 10.92.6.12;
threads 2;

protocol device { }

protocol bgp source_member {
  local 10.92.6.12 as 65500;
  neighbor 10.92.6.11 as 64501;
  rs client on;
  ipv4 {
    import all;
    import table on;
    export none;
  };
}

protocol bgp target_member {
  local 10.92.6.12 as 65500;
  neighbor 10.92.6.13 as 64502;
  description "BIRD 3 export target";
  hold time 90;
  rs client on;
  ipv4 {
    import none;
    export all;
    export table on;
  };
}
