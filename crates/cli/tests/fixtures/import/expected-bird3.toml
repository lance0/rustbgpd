# GENERATED by `rbgp config import` — structural translation of bird3.conf (BIRD 2/3).
# Routing POLICY IS NOT translated: every untranslated stanza is listed in
# the import report (re-run the import to reproduce it). Hand-translate
# policy to .rpol (docs/rpol-language.md), then validate with
# `rustbgpd --check` before use.

[global]
asn = 65500
router_id = "10.92.6.12"
listen_port = 179
# RFC 8212 fail-closed (ADR-0112). This config was generated by an importer
# that never translates policy, so nothing here filters anything yet. With
# this set, every eBGP direction that resolves no explicit policy carries no
# routes at all — a deliberately empty session beats a silently wide-open
# one. Each direction starts passing traffic as you configure its
# import_policy_chain / export_policy_chain. Remove this line to run
# permit-all instead. Startup-only: changing it needs a daemon restart, not
# a reload.
ebgp_requires_policy = true

# Local management surface (`rbgp` over UDS, file-permission gated) —
# the same shape as examples/minimal/. Add prometheus_addr here to
# scrape metrics.
[global.telemetry]
log_format = "json"

[global.telemetry.grpc_uds]
path = "/var/lib/rustbgpd/grpc.sock"
principal = "operator"

[security.grpc]
enforcement = "tier"

[security.grpc.roles]
operator = "operator"

[[neighbors]]
address = "10.92.6.11"
remote_asn = 64501
families = ["ipv4_unicast"]

[[neighbors]]
address = "10.92.6.13"
remote_asn = 64502
description = "BIRD 3 export target"
hold_time = 90
families = ["ipv4_unicast"]
