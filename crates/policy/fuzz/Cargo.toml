[package]
name = "rustbgpd-policy-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }

[dependencies.rustbgpd-policy]
path = ".."

[dependencies.rustbgpd-wire]
path = "../../wire"

[[bin]]
name = "rpol_compile"
path = "fuzz_targets/rpol_compile.rs"
test = false
doc = false

[workspace]

[[bin]]
name = "dataset_parse"
path = "fuzz_targets/dataset_parse.rs"
test = false
doc = false

[[bin]]
name = "compile_chain"
path = "fuzz_targets/compile_chain.rs"
test = false
doc = false

[[bin]]
name = "explain_walk"
path = "fuzz_targets/explain_walk.rs"
test = false
doc = false
