[package]
publish = false
name = "rustbgpd-rib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "RIB data structures — Adj-RIB-In, Loc-RIB best-path selection, Adj-RIB-Out"
readme = "README.md"

[dependencies]
rustbgpd-wire.workspace = true
rustbgpd-policy.workspace = true
rustbgpd-telemetry.workspace = true
rustbgpd-rpki.workspace = true
rustbgpd-bmp.workspace = true
bytes.workspace = true
smallvec.workspace = true
rustc-hash.workspace = true
prefix-trie.workspace = true
ipnet.workspace = true
lru.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

tokio-stream.workspace = true

[features]
# Exposes RibManager fanout-driver helpers (synthetic peer registration +
# Loc-RIB seed + distribute_changes) to the `fanout` distribution microbench.
# Off by default — none of it is reachable outside the crate in a normal build.
bench-internals = []

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }
criterion.workspace = true

[[bench]]
name = "rib_ops"
harness = false
