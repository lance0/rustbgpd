[package]
publish = false
name = "rustbgpd-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "TCP connection management — tokio read/write loops, session runtime, bounded channels"
readme = "README.md"

[dependencies]
rustbgpd-wire.workspace = true
rustbgpd-fsm.workspace = true
rustbgpd-rib.workspace = true
rustbgpd-rpki.workspace = true
rustbgpd-policy.workspace = true
rustbgpd-telemetry.workspace = true
rustbgpd-bmp.workspace = true
bytes.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
prometheus.workspace = true
socket2.workspace = true
libc.workspace = true
lru.workspace = true
rustc-hash.workspace = true

[features]
# Exposes `RouteAttrBundle` + `materialize_attrs` (inbound attribute
# handling) to the `inbound_attrs` microbench. Off by default — nothing
# is reachable outside the crate in a normal build.
bench-internals = []

[dev-dependencies]
rustbgpd-rib.workspace = true
tokio = { workspace = true, features = ["test-util"] }
criterion.workspace = true

[[bench]]
name = "inbound_attrs"
harness = false
required-features = ["bench-internals"]
