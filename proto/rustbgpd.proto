// ---------------------------------------------------------------------------
// RibService — RIB queries (paginated + streaming)
// ---------------------------------------------------------------------------

service RibService {
  rpc ListReceivedRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  rpc ListBestRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  rpc ListAdvertisedRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  rpc ExplainAdvertisedRoute(ExplainAdvertisedRouteRequest) returns (ExplainAdvertisedRouteResponse);
  rpc ExplainBestPath(ExplainBestPathRequest) returns (ExplainBestPathResponse);
  rpc ListBlackholeDiscards(ListBlackholeDiscardsRequest) returns (ListBlackholeDiscardsResponse);
  rpc ListFibRoutes(ListFibRoutesRequest) returns (ListFibRoutesResponse);
  rpc ListRouteEvents(ListRouteEventsRequest) returns (ListRouteEventsResponse);
  rpc WatchRoutes(WatchRoutesRequest) returns (stream RouteEvent);
  rpc ListFlowSpecRoutes(ListFlowSpecRequest) returns (ListFlowSpecResponse);
  rpc ListEvpnRoutes(ListEvpnRequest) returns (ListEvpnResponse);
}

// ---------------------------------------------------------------------------
// EventService — unified live event stream
// ---------------------------------------------------------------------------

service EventService {
  rpc WatchEvents(WatchEventsRequest) returns (stream BgpEvent);
  rpc ListSessionEvents(ListSessionEventsRequest) returns (ListSessionEventsResponse);
}

message ListRoutesRequest {
  string neighbor_address = 1;
  AddressFamily afi_safi = 2;
  uint32 page_size = 3;
  string page_token = 4;

  // Route filters — all are optional; when set, only matching routes are returned.

  // Prefix filter (e.g. "10.0.0.0" with prefix_filter_length=24).
  // Empty string = no prefix filter.
  string prefix_filter = 5;
  uint32 prefix_filter_length = 6;
  // If true, return all routes whose prefix falls within prefix_filter/prefix_filter_length
  // (longer or equal match). If false, exact match only.
  bool longer_prefixes = 7;

  // Origin ASN filter — match routes whose AS_PATH originates from this ASN
  // (last ASN in the path). 0 = no filter.
  uint32 origin_asn = 8;

  // Community filter — match routes containing this community (e.g. (65001 << 16) | 100).
  // Empty = no filter. Multiple values are OR-matched.
  repeated uint32 community_filter = 9;

  // Large community filter — match routes containing this large community.
  // Format: "global_admin:local_data1:local_data2". Empty = no filter.
  repeated string large_community_filter = 10;
}

message ListRoutesResponse {
  repeated Route routes = 1;
  string next_page_token = 2;
  uint64 total_count = 3;
}

enum ExplainDecision {
  EXPLAIN_DECISION_UNSPECIFIED = 0;
  EXPLAIN_DECISION_ADVERTISE = 1;
  EXPLAIN_DECISION_DENY = 2;
  EXPLAIN_DECISION_NO_BEST_ROUTE = 3;
  EXPLAIN_DECISION_UNSUPPORTED_FAMILY = 4;
}

message ExplainAdvertisedRouteRequest {
  string peer_address = 1;
  string prefix = 2;
  uint32 prefix_length = 3;
}

message ExplainReason {
  string code = 1;
  string message = 2;
}

message ExplainModifications {
  optional uint32 set_local_pref = 1;
  optional uint32 set_med = 2;
  string set_next_hop = 3;
  repeated uint32 communities_add = 4;
  repeated uint32 communities_remove = 5;
  repeated uint64 extended_communities_add = 6;
  repeated uint64 extended_communities_remove = 7;
  repeated string large_communities_add = 8;
  repeated string large_communities_remove = 9;
  optional uint32 as_path_prepend_asn = 10;
  optional uint32 as_path_prepend_count = 11;
}

message ExplainAdvertisedRouteResponse {
  ExplainDecision decision = 1;
  string peer_address = 2;
  string prefix = 3;
  uint32 prefix_length = 4;
  string next_hop = 5;
  uint32 path_id = 6;
  string route_peer_address = 7;
  string route_type = 8;
  repeated ExplainReason reasons = 9;
  ExplainModifications modifications = 10;
}

message ExplainBestPathRequest {
  string prefix = 1;
  uint32 prefix_length = 2;
  // Optional IP address (IPv4 or IPv6 literal) of the peer to
  // scope the explanation to. The response shape is unchanged
  // from the v0.7.0 form: the Loc-RIB best for this prefix lives
  // in `best_route`, and `candidates` lists every *non-best*
  // route the RIB knows about for this prefix (the winner is
  // never repeated in `candidates`). When set, the explanation
  // additionally tags peer-aware advertisement: every candidate
  // that the named peer would receive — passes the peer's
  // export policy + sendable-family check + split-horizon / RR
  // suppression and falls within the peer's effective
  // `add_path_send_max` — gets a non-zero
  // `advertised_path_id` reflecting its advertised rank.
  // Everything else stays at `advertised_path_id = 0`. Note
  // that ranks in `candidates` may start at 2 when the
  // Loc-RIB winner (in `best_route`) is itself advertised at
  // rank 1 to the peer; rank 1 is therefore not always present
  // in the `candidates` list. Empty = global view, the v0.7.0
  // behavior. Unknown peer → NOT_FOUND. Named `peer_address`
  // to match the convention used elsewhere in this file (see
  // e.g. `ExplainAdvertisedRouteRequest.peer_address`).
  string peer_address = 3;
}

message BestPathCandidate {
  Route route = 1;
  string vs_best_reason = 2;
  string vs_best_ordering = 3;
  // Set on responses scoped to a peer with Add-Path send mode
  // (`add_path_send_max > 0`). Non-zero = this candidate would be
  // advertised at this rank. Zero = filtered (export policy
  // reject, family mismatch, split-horizon, iBGP / RFC 4456
  // route-reflector suppression, or beyond `send_max`). Always
  // zero in single-best send mode (`add_path_send_max == 0`) —
  // single-best advertises only the Loc-RIB best (`best_route`)
  // at `path_id = 0`, and never falls back to the next-best
  // candidate when the winner is suppressed, so this field cannot
  // represent that selection. In single-best mode operators infer
  // winner-advertisement from `best_route` plus their knowledge
  // of the peer's policy state.
  uint32 advertised_path_id = 4;
}

message ExplainBestPathResponse {
  string prefix = 1;
  uint32 prefix_length = 2;
  Route best_route = 3;
  repeated BestPathCandidate candidates = 4;
  // Echoed from the request when the explanation is peer-scoped.
  // Empty for global-view responses.
  string peer_address = 5;
  // Effective Add-Path `send_max` for this prefix and peer (0 in
  // any of: global-view response, peer in single-best mode,
  // peer's `add_path_send_families` doesn't include the prefix's
  // AFI/SAFI, prefix is for an AFI/SAFI not in the peer's
  // `sendable_families`). When non-zero, up to that many
  // candidates by best-path preference will carry a non-zero
  // `BestPathCandidate.advertised_path_id`. The "effective"
  // qualifier matters because a peer with `add_path_send_max=4`
  // but no Add-Path families negotiated for this prefix's AFI
  // gets `add_path_send_max = 0` here — the response reflects
  // what would actually happen, not the bare config knob.
  uint32 add_path_send_max = 6;
}

message ListBlackholeDiscardsRequest {}

enum BlackholeDiscardState {
  BLACKHOLE_DISCARD_STATE_UNSPECIFIED = 0;
  BLACKHOLE_DISCARD_STATE_INSTALLED = 1;
  BLACKHOLE_DISCARD_STATE_REJECTED = 2;
  BLACKHOLE_DISCARD_STATE_FAILED = 3;
}

message BlackholeDiscard {
  string prefix = 1;
  uint32 prefix_length = 2;
  string peer_address = 3;
  BlackholeDiscardState state = 4;
  // Human-readable reason: installed/owned, broad_prefix, not_ebgp, or
  // a kernel error summary.
  string reason = 5;
}

message ListBlackholeDiscardsResponse {
  repeated BlackholeDiscard discards = 1;
}

message ListFibRoutesRequest {}

enum FibRouteState {
  FIB_ROUTE_STATE_UNSPECIFIED = 0;
  // Route is daemon-owned and currently matches the configured kernel table.
  FIB_ROUTE_STATE_INSTALLED = 1;
  // Route candidate was intentionally withheld before kernel apply.
  FIB_ROUTE_STATE_REJECTED = 2;
  // Runtime hit a RIB, dump, or kernel boundary error.
  FIB_ROUTE_STATE_FAILED = 3;
}

message FibRouteStatus {
  string table_name = 1;
  uint32 table_id = 2;
  uint32 metric = 3;
  string prefix = 4;
  uint32 prefix_length = 5;
  string next_hop = 6;
  string peer_address = 7;
  FibRouteState state = 8;
  // Operator-facing reason code. Stable values include "owned",
  // "next_hop_family_unsupported", "peer_not_allowed",
  // "route_limit_exceeded", "foreign_route_exists", and
  // "owned_route_drifted"; failure values are prefixed diagnostics such as "dump_failed:DETAIL",
  // "rib_query_failed:DETAIL", "install_failed:DETAIL",
  // "replace_failed:DETAIL", or "remove_failed:DETAIL". Treat text after
  // ':' as diagnostic detail.
  string reason = 9;
}

message ListFibRoutesResponse {
  repeated FibRouteStatus routes = 1;
}

message ListRouteEventsRequest {
  // Optional neighbor address filter. Empty = all peers. Matches both
  // current and previous peer, so a peer-scoped query includes
  // BestChanged/Withdrawn events where the route moved away.
  string neighbor_address = 1;
  AddressFamily afi_safi = 2;
  // Maximum events to return from the bounded in-memory history. 0
  // uses the daemon default. Responses are ordered oldest-to-newest
  // within the selected recent window.
  uint32 limit = 3;
  // Optional exact prefix filter. Empty = no prefix filter.
  string prefix = 4;
  uint32 prefix_length = 5;
}

message ListRouteEventsResponse {
  repeated RouteEvent events = 1;
}

message Route {
  string prefix = 1;
  uint32 prefix_length = 2;
  string next_hop = 3;
  string peer_address = 4;
  uint32 origin = 5;
  repeated uint32 as_path = 6;
  uint32 local_pref = 7;
  uint32 med = 8;
  bool best = 9;
  repeated uint32 communities = 10;
  repeated uint64 extended_communities = 11;
  // Format: "global_admin:local_data1:local_data2" (e.g. "65001:100:200").
  repeated string large_communities = 12;
  // Add-Path path identifier (RFC 7911). 0 = no Add-Path.
  uint32 path_id = 13;
  // RPKI validation state: "valid", "invalid", or "not_found".
  string validation_state = 14;
  // ASPA path verification state: "valid", "invalid", or "unknown".
  string aspa_state = 15;
  // Distinguishes "explicit LOCAL_PREF attribute set on the wire or by
  // policy" (Some(value)) from "no LOCAL_PREF attribute" (absent).
  // EBGP-received routes have no LOCAL_PREF on the wire, so without
  // this distinction `local_pref = 0` could mean either "policy set
  // it to zero" (e.g. RFC 8326 implicit demotion fired) or "no
  // attribute". Used by the M35 interop test to assert the implicit
  // honor rule actually fired on a tagged route.
  optional uint32 local_pref_attr = 16;
}

message WatchRoutesRequest {
  string neighbor_address = 1;
  AddressFamily afi_safi = 2;
}

enum RouteEventType {
  ROUTE_EVENT_TYPE_UNSPECIFIED = 0;
  ROUTE_EVENT_TYPE_ADDED = 1;
  ROUTE_EVENT_TYPE_WITHDRAWN = 2;
  ROUTE_EVENT_TYPE_BEST_CHANGED = 3;
}

message RouteEvent {
  RouteEventType event_type = 1;
  string prefix = 2;
  uint32 prefix_length = 3;
  string peer_address = 4;
  AddressFamily afi_safi = 5;
  // Unix epoch seconds.
  string timestamp = 6;
  string previous_peer_address = 7;
  // Add-Path path identifier (RFC 7911). 0 = no Add-Path.
  uint32 path_id = 8;
  // Monotonic process-local route event identifier. Resets on daemon restart.
  uint64 event_id = 9;
}

enum EventCategory {
  EVENT_CATEGORY_UNSPECIFIED = 0;
  EVENT_CATEGORY_ROUTE = 1;
  EVENT_CATEGORY_SESSION = 2;
  EVENT_CATEGORY_POLICY = 3;
  EVENT_CATEGORY_DATAPLANE = 4;
}

enum BgpEventType {
  BGP_EVENT_TYPE_UNSPECIFIED = 0;
  BGP_EVENT_TYPE_ROUTE_ADDED = 1;
  BGP_EVENT_TYPE_ROUTE_WITHDRAWN = 2;
  BGP_EVENT_TYPE_ROUTE_BEST_CHANGED = 3;
  BGP_EVENT_TYPE_SESSION_STATE_CHANGED = 10;
  BGP_EVENT_TYPE_SESSION_ESTABLISHED = 11;
  BGP_EVENT_TYPE_SESSION_LOST = 12;
  BGP_EVENT_TYPE_PEER_ENABLED = 13;
  BGP_EVENT_TYPE_PEER_DISABLED = 14;
  BGP_EVENT_TYPE_NOTIFICATION_SENT = 20;
  BGP_EVENT_TYPE_NOTIFICATION_RECEIVED = 21;
  BGP_EVENT_TYPE_POLICY_CHANGED = 22;
  BGP_EVENT_TYPE_DATAPLANE_STATUS_CHANGED = 30;
  // A WatchEvents subscriber fell behind a bounded source stream and
  // missed one or more events. The payload identifies the source
  // category and missed count.
  BGP_EVENT_TYPE_STREAM_LAGGED = 100;
}

enum EventSeverity {
  EVENT_SEVERITY_UNSPECIFIED = 0;
  EVENT_SEVERITY_INFO = 1;
  EVENT_SEVERITY_WARNING = 2;
  EVENT_SEVERITY_ERROR = 3;
}

message WatchEventsRequest {
  // Empty categories with empty event_types = default live categories
  // (route + session). A non-empty event_types filter narrows the
  // result; BGP_EVENT_TYPE_POLICY_CHANGED or
  // BGP_EVENT_TYPE_DATAPLANE_STATUS_CHANGED with empty categories
  // selects those streams. Add EVENT_CATEGORY_POLICY or
  // EVENT_CATEGORY_DATAPLANE explicitly to combine them with the
  // default route + session categories.
  repeated EventCategory categories = 1;
  // Empty = all event types for the selected categories.
  repeated BgpEventType event_types = 2;
  // Optional neighbor address filter. Empty = all peers. Route events
  // match both current and previous peer, same as WatchRoutes and
  // ListRouteEvents. Session events match their peer address. Policy
  // events match only when tied to one peer. Dataplane summary events
  // are peerless and do not match this filter.
  string neighbor_address = 3;
  // Optional family filter. Applies only to route events; session and
  // dataplane events do not match a family-filtered request.
  AddressFamily afi_safi = 4;
  // Optional exact prefix filter. Applies only to route events; session
  // and dataplane events do not match a prefix-filtered request.
  string prefix = 5;
  uint32 prefix_length = 6;
}

message ListSessionEventsRequest {
  // Optional neighbor address filter. Empty = all peers.
  string neighbor_address = 1;
  // Empty = all session event types.
  repeated BgpEventType event_types = 2;
  // Maximum events to return from the bounded 4096-event in-memory
  // history. 0 uses the daemon default/full bounded window. Larger
  // values are clamped to the same 4096-event ceiling. Responses
  // contain the most recent matching events, ordered oldest-to-newest
  // within that selected recent window.
  uint32 limit = 3;
}

message ListSessionEventsResponse {
  repeated BgpEvent events = 1;
}

message SessionEvent {
  BgpEventType event_type = 1;
  string peer_address = 2;
  // Unix epoch seconds, matching existing RouteEvent timestamp shape.
  string timestamp = 3;
  // BGP FSM state names from the transport layer (`Idle`, `Connect`,
  // `Active`, `OpenSent`, `OpenConfirm`, `Established`). Empty for
  // peer enable/disable events that are not tied to a specific FSM
  // transition.
  string old_state = 4;
  string new_state = 5;
  // `primary` for the managed peer session, `inbound_candidate` for a
  // collision-resolution candidate, empty for peer enable/disable
  // events.
  string session_role = 6;
  // Stable operator-facing reason/summary string for this event.
  string reason = 7;
}

message StreamLagEvent {
  // Source stream that lagged. This is the same value copied into the
  // top-level BgpEvent.category field so category-agnostic clients can
  // filter without unpacking the payload.
  EventCategory source_category = 1;
  // Count reported by tokio broadcast lag detection. It is the number
  // of source events skipped by this subscriber, before any
  // WatchEvents filters could be applied.
  uint64 missed_count = 2;
  // Stable operator-facing reason/summary string for this event.
  string reason = 3;
}

message NotificationEvent {
  BgpEventType event_type = 1;
  string peer_address = 2;
  // Unix epoch seconds, matching existing RouteEvent timestamp shape.
  string timestamp = 3;
  // "sent" or "received".
  string direction = 4;
  // BGP NOTIFICATION error code and subcode (RFC 4271 section 4.5).
  uint32 code = 5;
  uint32 subcode = 6;
  // Human-readable code/subcode description.
  string description = 7;
  // `primary` for the managed peer session, `inbound_candidate` for a
  // collision-resolution candidate.
  string session_role = 8;
  // RFC 8203 shutdown communication reason, when present.
  string shutdown_reason = 9;
  // Stable operator-facing reason/summary string for this event.
  string reason = 10;
}

message PolicyEvent {
  BgpEventType event_type = 1;
  // Operation label such as `set`, `delete`, or `clear`.
  string operation = 2;
  // Target class such as `policy`, `neighbor_set`, `peer_group`,
  // `global_import_chain`, or `neighbor_export_chain`.
  string target_type = 3;
  // Target name or address-scoped target string.
  string target = 4;
  // Peer address when this mutation is scoped to one peer. Empty for
  // global policy / peer-group / neighbor-set mutations.
  string peer_address = 5;
  // Number of currently managed peers the runtime mutation touched.
  uint32 affected_peer_count = 6;
  // Unix epoch seconds, matching existing RouteEvent timestamp shape.
  string timestamp = 7;
  // Stable operator-facing reason/summary string for this event.
  string reason = 8;
}

message DataplaneEvent {
  // Summary source. Current values: "fib" and "blackhole".
  string source = 1;
  // Count of currently installed rows for this source.
  uint64 installed = 2;
  // Count of currently rejected rows for this source.
  uint64 rejected = 3;
  // Count of currently failed rows for this source.
  uint64 failed = 4;
}

message BgpEvent {
  // Unix epoch seconds, matching existing RouteEvent timestamp shape.
  string timestamp = 1;
  // Common fields are duplicated from the category-specific payload on purpose:
  // category-agnostic consumers can filter/render without unpacking the oneof,
  // while payloads preserve the full source event shape for category-specific
  // clients.
  EventCategory category = 2;
  BgpEventType event_type = 3;
  EventSeverity severity = 4;
  string peer_address = 5;
  string previous_peer_address = 6;
  string prefix = 7;
  uint32 prefix_length = 8;
  AddressFamily afi_safi = 9;
  string summary = 10;

  oneof payload {
    RouteEvent route = 11;
    SessionEvent session = 12;
    StreamLagEvent stream_lag = 13;
    NotificationEvent notification = 14;
    PolicyEvent policy = 15;
    DataplaneEvent dataplane = 16;
  }
}

// ---------------------------------------------------------------------------
// InjectionService — Programmatic route injection
// ---------------------------------------------------------------------------

service InjectionService {
  rpc AddPath(AddPathRequest) returns (AddPathResponse);
  rpc DeletePath(DeletePathRequest) returns (DeletePathResponse);
  rpc AddFlowSpec(AddFlowSpecRequest) returns (AddFlowSpecResponse);
  rpc DeleteFlowSpec(DeleteFlowSpecRequest) returns (DeleteFlowSpecResponse);
  // Inject a locally-originated EVPN route (RFC 7432). SDN controllers
  // push Type 2 / Type 5 / etc. routes to the RR's Loc-RIB, and the RR
  // reflects them to iBGP peers negotiating L2VPN/EVPN.
  rpc AddEvpnRoute(AddEvpnRouteRequest) returns (AddEvpnRouteResponse);
  rpc DeleteEvpnRoute(DeleteEvpnRouteRequest) returns (DeleteEvpnRouteResponse);
}

message AddPathRequest {
  string prefix = 1;
  uint32 prefix_length = 2;
  string next_hop = 3;
  repeated uint32 as_path = 4;
  uint32 origin = 5;
  optional uint32 local_pref = 6;
  optional uint32 med = 7;
  repeated uint32 communities = 8;
  repeated uint64 extended_communities = 9;
  // Format: "global_admin:local_data1:local_data2" (e.g. "65001:100:200").
  repeated string large_communities = 10;
  // Add-Path path identifier (RFC 7911). 0 = default path.
  uint32 path_id = 11;
}

message AddPathResponse {
  reserved 1;
}

message DeletePathRequest {
  string prefix = 1;
  uint32 prefix_length = 2;
  reserved 3;
  // Add-Path path identifier (RFC 7911). 0 = delete the default path.
  uint32 path_id = 4;
}

message DeletePathResponse {}

// FlowSpec match component (RFC 8955).
message FlowSpecComponent {
  // Component type (1=destination, 2=source, 3=protocol, 4=port, etc.)
  uint32 type = 1;
  // For type 1/2: IP prefix string (e.g. "10.0.0.0/24" or "2001:db8::/32").
  string prefix = 2;
  // For numeric/bitmask types: human-readable operator expression
  // (e.g. "=80", ">=1024 & <=65535").
  string value = 3;
  // For type 1/2 with IPv6: prefix bit offset (RFC 8956 §3.1). Default 0.
  uint32 offset = 4;
}

// FlowSpec traffic action (RFC 8955 extended communities).
message FlowSpecAction {
  oneof action {
    FlowSpecTrafficRate traffic_rate = 1;
    FlowSpecTrafficAction traffic_action = 2;
    FlowSpecTrafficMarking traffic_marking = 3;
    FlowSpecRedirect redirect = 4;
  }
}

message FlowSpecTrafficRate {
  float rate = 1; // bytes/sec; 0.0 = drop
}

message FlowSpecTrafficAction {
  bool sample = 1;
  bool terminal = 2;
}

message FlowSpecTrafficMarking {
  uint32 dscp = 1;
}

message FlowSpecRedirect {
  // Route target string: "ASN:value" (e.g. "65001:100").
  string route_target = 1;
}

// FlowSpec route as seen in the RIB.
message FlowSpecRouteEntry {
  repeated FlowSpecComponent components = 1;
  repeated FlowSpecAction actions = 2;
  string peer_address = 3;
  AddressFamily afi_safi = 4;
  repeated uint32 as_path = 5;
  repeated uint32 communities = 6;
  repeated uint64 extended_communities = 7;
}

message AddFlowSpecRequest {
  // Address family: IPV4_FLOWSPEC or IPV6_FLOWSPEC.
  AddressFamily afi_safi = 1;
  repeated FlowSpecComponent components = 2;
  repeated FlowSpecAction actions = 3;
  repeated uint32 communities = 4;
  repeated uint64 extended_communities = 5;
}

message AddFlowSpecResponse {}

message DeleteFlowSpecRequest {
  AddressFamily afi_safi = 1;
  repeated FlowSpecComponent components = 2;
}

message DeleteFlowSpecResponse {}

message ListFlowSpecRequest {
  AddressFamily afi_safi = 1;
}

message ListFlowSpecResponse {
  repeated FlowSpecRouteEntry routes = 1;
}

// ---------------------------------------------------------------------------
// EVPN (RFC 7432) — typed route entries for route-reflector observability.
// Full RFC 7432 encoding surface is complex; this gRPC surface exposes the
// identifying fields of each route type as strings + small scalars, rather
// than re-encoding the entire wire payload. Wire round-trip fidelity is
// preserved by the RIB; this gRPC view is for human-readable inspection.
// ---------------------------------------------------------------------------

// EVPN route entry in the RIB (any of 5 RFC 7432 route types).
message EvpnRouteEntry {
  // RFC 7432 route type (1..=5).
  uint32 route_type = 1;
  // Route Distinguisher (RFC 4364) in "asn:value" / "ip:value" display format.
  string rd = 2;
  // Ethernet Segment Identifier (hex-coded 10 bytes separated by ':') —
  // empty for Type 3 IMET, which has no ESI.
  string esi = 3;
  // Ethernet Tag ID ("MAX_ET" or a 32-bit decimal value) — empty for Type 4.
  string ethernet_tag = 4;
  // MAC address (Type 2 only), "aa:bb:cc:dd:ee:ff".
  string mac = 5;
  // Host IP (Type 2 and Type 3 and Type 4 and Type 5), may be empty.
  string ip = 6;
  // IP prefix (Type 5 only), formatted as "ADDR/LEN" (e.g. "10.0.0.0/24").
  string prefix = 7;
  // Gateway IP (Type 5 only), may be empty.
  string gateway = 8;
  // Primary label / VNI (Type 1/2/5).
  uint32 label = 9;
  // Secondary label (Type 2 symmetric IRB), 0 when absent.
  uint32 label2 = 10;
  // VTEP loopback IP (next-hop from MP_REACH_NLRI).
  string next_hop = 11;
  // Peer that advertised this route.
  string peer_address = 12;
  // AS_PATH (4-octet ASNs, flattened across AS_SEQUENCE segments).
  repeated uint32 as_path = 13;
  // Standard communities (RFC 1997).
  repeated uint32 communities = 14;
  // Extended communities (RFC 4360) as raw u64.
  repeated uint64 extended_communities = 15;
  // Decoded tunnel type from the BGP Encapsulation ext community, 0 if absent.
  // (VXLAN = 8 per RFC 8365.)
  uint32 tunnel_type = 16;
}

// Filter EVPN route listings. All filters are optional.
message ListEvpnRequest {
  // Only routes matching this route type (1..=5). 0 = no filter.
  uint32 route_type_filter = 1;
  // Only routes from this peer, empty = any.
  string peer_filter = 2;
  // Only routes with this Route Distinguisher (display format). Empty = any.
  string rd_filter = 3;
}

message ListEvpnResponse {
  repeated EvpnRouteEntry routes = 1;
}

// Controller-injected EVPN route. Phase 1 supports Type 2 (MAC/IP)
// and Type 3 (IMET); later phases extend to Type 5 IP-Prefix.
message AddEvpnRouteRequest {
  // RFC 7432 route type. Only 2 and 3 are accepted in Phase 1; other
  // values return INVALID_ARGUMENT.
  uint32 route_type = 1;
  // Route Distinguisher, "asn:value" / "ip:value". Required.
  string rd = 2;
  // Ethernet Tag ID (decimal). Default 0.
  uint32 ethernet_tag = 3;
  // MAC address "aa:bb:cc:dd:ee:ff" (Type 2 only). Required for Type 2.
  string mac = 4;
  // Host IP (Type 2 optional, Type 3 required as originator_ip). Empty
  // for Type 2 means MAC-only (no IP advertised).
  string ip = 5;
  // Primary label / VNI (Type 2). Required for Type 2.
  uint32 label = 6;
  // Secondary label for symmetric IRB (RFC 9135). 0 = absent.
  uint32 label2 = 7;
  // Next-hop (VTEP loopback). Required.
  string next_hop = 8;
  // Optional route targets as "asn:value" — encoded as extended
  // communities on the advertised route.
  repeated string route_targets = 9;
  // Optional: when true, suppress the RFC 8365 §5.1.2 VXLAN
  // Encapsulation extended community (tunnel-type=8) on the
  // originated route. Default (proto3 false) attaches the community,
  // matching the VXLAN-EVPN deployment target. Set true only if the
  // caller wants MPLS-over-GRE / non-VXLAN semantics. The field name
  // is inverted (vs. "vxlan_encap") so proto3's default-false yields
  // the operationally correct behavior for clients that omit it.
  bool disable_vxlan_encap = 10;
}

message AddEvpnRouteResponse {}

message DeleteEvpnRouteRequest {
  // Identify the route to withdraw by its RFC 7432 key: route_type + RD
  // + ethernet_tag + MAC (Type 2) or originator IP (Type 3).
  uint32 route_type = 1;
  string rd = 2;
  uint32 ethernet_tag = 3;
  string mac = 4;
  string ip = 5;
}

message DeleteEvpnRouteResponse {}

