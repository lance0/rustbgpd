// ---------------------------------------------------------------------------
// ExplainImportPolicy — ADR-0073 per-session decision-cache surface.
// ---------------------------------------------------------------------------

// Outcome of a single cached import decision. See ADR-0073 for the
// full state contract; in short:
//
//   PERMIT     — the chain admitted this prefix; the route is in
//                Adj-RIB-In (modulo subsequent withdraw or session
//                state changes since).
//   DENY       — the chain rejected this prefix; the route never
//                reached RIB.
//   WITHDRAWN  — was previously permitted, then withdrawn by the
//                peer. Retained as a tombstone instead of dropping
//                to NOT_SEEN — the distinction is operationally
//                meaningful.
//   EVICTED    — was in the cache; pushed out by the per-peer LRU
//                cap. The decision is gone; the eviction marker is
//                the honest answer (rather than NOT_SEEN, which
//                would lie).
//   STALE      — a cached decision exists, but the session's
//                import-policy generation (session-local, not a global
//                registry) has advanced since it was recorded.
//                The cached decision is still returned (operator
//                value is "here's what was decided then, against
//                the policy as it was then"), with the caveat that
//                it no longer reflects current policy.
//   NOT_SEEN   — the peer has not advertised this prefix on this
//                session and the cache has no record of an
//                eviction.
enum ImportExplainOutcome {
  IMPORT_EXPLAIN_OUTCOME_UNSPECIFIED = 0;
  IMPORT_EXPLAIN_OUTCOME_PERMIT      = 1;
  IMPORT_EXPLAIN_OUTCOME_DENY        = 2;
  IMPORT_EXPLAIN_OUTCOME_WITHDRAWN   = 3;
  IMPORT_EXPLAIN_OUTCOME_EVICTED     = 4;
  IMPORT_EXPLAIN_OUTCOME_STALE       = 5;
  IMPORT_EXPLAIN_OUTCOME_NOT_SEEN    = 6;
}

message ExplainImportPolicyRequest {
  // IPv4 or IPv6 literal of the peer whose import-decision cache
  // should be consulted. Required.
  string peer_address = 1;
  // Address-family / sub-address-family scope. v1 supports
  // IPv4-unicast and IPv6-unicast only; FlowSpec and EVPN need
  // their own request shapes and are tracked separately.
  AddressFamily afi_safi = 2;
  // Prefix and prefix length. Required.
  string prefix = 3;
  uint32 prefix_length = 4;
  // Add-Path path identifier (RFC 7911). When absent, the response
  // returns every matching path_id for the prefix — useful when the
  // caller doesn't know which path they're asking about, or when
  // Add-Path is not negotiated and the implicit path_id is 0.
  optional uint32 path_id = 5;
}

message ImportExplainMatch {
  ImportExplainOutcome outcome = 1;
  string peer_address          = 2;
  string prefix                = 3;
  uint32 prefix_length         = 4;
  uint32 path_id               = 5;
  AddressFamily afi_safi       = 6;

  // Terminal-decision policy label from
  // `PolicyEvaluation.matched_policy`. Empty when the terminal
  // policy is inline / anonymous (read as "inline" by the operator).
  // Unset on NOT_SEEN / EVICTED outcomes.
  string matched_policy        = 7;

  // RPKI origin-validation state at evaluation time, as a stable
  // snake_case string: "valid", "invalid", "not_found", "unknown".
  // Unset on NOT_SEEN / EVICTED.
  string rpki_validation       = 8;

  // ASPA upstream-path verification state at evaluation time, as a
  // stable snake_case string: "valid", "invalid", "unknown",
  // "unverified". Unset on NOT_SEEN / EVICTED.
  string aspa_validation       = 9;

  // Modifications the chain applied (PERMIT) or would have applied
  // (DENY, before the deny terminator fired). Shape mirrors
  // `ExplainModifications` on the export-explain surface for
  // operator parity.
  ExplainModifications modifications = 10;

  // Evaluation wall-clock time as Unix nanoseconds — matches the
  // durable event outbox's `timestamp_ns` convention rather than a
  // string, so collectors don't have to parse. Zero for NOT_SEEN /
  // EVICTED outcomes (no decision was recorded).
  int64 evaluated_at_unix_ns   = 11;

  // The session's import-policy generation at the time of evaluation.
  // This is a session-local counter bumped only when this peer's
  // import chain is hot-applied — not a global policy-registry
  // generation (a global counter would mark a peer STALE when an
  // unrelated peer's chain changed). The response also carries the
  // session's current generation; STALE is the outcome when these
  // disagree.
  uint64 policy_generation     = 12;

  // Statement-level attribution within the matched chain: one step
  // per policy the chain evaluated, in chain order (a deny terminates
  // the walk, so policies after a denying one carry no step). The
  // trace is re-derived at query time from the cached pre-policy
  // policy-context fields against the session's import chain — the live
  // import path records no extra statement-trace state for it.
  // Populated only on PERMIT /
  // DENY outcomes at the current policy generation: STALE entries
  // were decided by a chain that no longer exists, WITHDRAWN
  // tombstones have shed the context the re-derivation needs, and
  // NOT_SEEN / EVICTED have no decision at all. Empty also when the
  // peer has no import chain (implicit permit — nothing to attribute).
  repeated ImportExplainStatementStep statements = 13;
}

// One step of the statement-level import-chain trace: how a single
// policy in the chain disposed of the route. Mirrors the granularity
// of the export-side policy-clause reasons and the best-path
// tiebreaker detail: structured identity fields are machine-stable,
// the rendered condition / modification strings carry a stable leading
// label with human-oriented detail (not a machine-parsable grammar).
message ImportExplainStatementStep {
  // 0-based position of the policy within the resolved import chain.
  uint32 policy_index = 1;
  // Configured policy name. Empty when the policy is inline /
  // anonymous (operators read "inline", matching `matched_policy`).
  string policy_name = 2;
  // True when no statement in this policy matched and the policy's
  // default action decided (fallthrough). `statement_index` is
  // meaningless in that case and `matched_conditions` is empty.
  bool default_action = 3;
  // 0-based index of the first matching statement within the policy.
  // Valid only when `default_action` is false.
  uint32 statement_index = 4;
  // The action this policy contributed: "permit" or "deny" (stable).
  string action = 5;
  // Rendered summaries of every condition the matched statement
  // carries — all matched (statement conditions AND together). Each
  // entry leads with a stable label (`prefix`, `community`, `as_path`,
  // `neighbor_set`, `route_type`, `evpn_route_type`, `rpki`, `aspa`,
  // `as_path_len`, `local_pref`, `med`, `next_hop`); an unconditional
  // statement renders as the single entry "any".
  repeated string matched_conditions = 6;
  // Rendered attribute modifications this statement contributes, with
  // "before -> after" for scalar attributes (the before side is the
  // route's pre-policy value — chain modifications accumulate and
  // apply once, so later statements never see earlier edits).
  repeated string modifications = 7;
}

message ExplainImportPolicyResponse {
  // Echo of the request scope.
  string peer_address    = 1;
  string prefix          = 2;
  uint32 prefix_length   = 3;
  AddressFamily afi_safi = 4;

  // The session's current import-policy generation (a per-session
  // counter bumped on each import-policy reload, not a global registry
  // value). Clients compare this to each match's `policy_generation` to
  // confirm freshness; when they disagree the outcome is STALE.
  uint64 current_policy_generation = 5;

  // One match per cached (peer, prefix, path_id) entry the
  // request resolves to. Always populated with at least one
  // element — a NOT_SEEN outcome carries a synthetic match with
  // empty fields beyond the echoed request. When the request
  // specifies `path_id` the response has exactly one element;
  // when it does not, every matching path_id appears (Add-Path
  // disambiguation).
  repeated ImportExplainMatch matches = 6;
}

// ---------------------------------------------------------------------------
// RibService — RIB queries (paginated + streaming)
// ---------------------------------------------------------------------------

service RibService {
  rpc ListReceivedRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  rpc ListBestRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  rpc ListAdvertisedRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  rpc ExplainAdvertisedRoute(ExplainAdvertisedRouteRequest) returns (ExplainAdvertisedRouteResponse);
  rpc ExplainBestPath(ExplainBestPathRequest) returns (ExplainBestPathResponse);
  rpc ListBlackholeDiscards(ListBlackholeDiscardsRequest) returns (ListBlackholeDiscardsResponse);
  rpc ListFibRoutes(ListFibRoutesRequest) returns (ListFibRoutesResponse);
  // Runtime CRUD for `[[fib_tables]]` (ADR-0061). Hot-applies through the FIB
  // reconciler and persists to the TOML config, mirroring dynamic-neighbor
  // CRUD. SetFibTable is a create-or-replace upsert keyed on table name;
  // DeleteFibTable removes by name. Both require the reconciler to be running
  // (at least one table present at startup) — otherwise FAILED_PRECONDITION.
  rpc SetFibTable(SetFibTableRequest) returns (ListFibTablesResponse);
  rpc DeleteFibTable(DeleteFibTableRequest) returns (ListFibTablesResponse);
  rpc ListFibTables(ListFibTablesRequest) returns (ListFibTablesResponse);
  rpc ListRouteEvents(ListRouteEventsRequest) returns (ListRouteEventsResponse);
  rpc WatchRoutes(WatchRoutesRequest) returns (stream RouteEvent);
  rpc WatchRouteEvents(WatchRoutesRequest) returns (stream BgpEvent);
  rpc ListFlowSpecRoutes(ListFlowSpecRequest) returns (ListFlowSpecResponse);
  rpc ListEvpnRoutes(ListEvpnRequest) returns (ListEvpnResponse);
  rpc ListBgpLsRoutes(ListBgpLsRequest) returns (ListBgpLsResponse);
  rpc ListVpnRoutes(ListVpnRoutesRequest) returns (ListVpnRoutesResponse);
  rpc ListRtcRoutes(ListRtcRoutesRequest) returns (ListRtcRoutesResponse);
  // RFC 9107 ORR topology graph, built on demand from every peer's BGP-LS
  // Adj-RIB-In (the union view, not Loc-RIB best-only). Nodes are keyed by
  // canonical descriptor bytes; links carry the IGP Metric (TLV 1095) that
  // the SPF engine uses. Links without an IGP Metric are unusable and are
  // not listed, but their endpoint nodes still appear.
  rpc ListTopologyNodes(ListTopologyNodesRequest) returns (ListTopologyNodesResponse);
  rpc ListTopologyLinks(ListTopologyLinksRequest) returns (ListTopologyLinksResponse);
}

// ---------------------------------------------------------------------------
// BfdService — single-hop BFD session inspection (ADR-0067)
// ---------------------------------------------------------------------------

service BfdService {
  rpc GetBfdSessions(GetBfdSessionsRequest) returns (GetBfdSessionsResponse);
}

message GetBfdSessionsRequest {
  // Optional exact peer-address filter. Empty = all sessions.
  string peer_address = 1;
}

message BfdSession {
  string peer_address = 1;
  BfdSessionState state = 2;
  // Local diagnostic for the last state change (RFC 5880 section 4.1), as a
  // stable snake_case name: "none", "control_detection_time_expired",
  // "echo_function_failed", "neighbor_signaled_session_down",
  // "forwarding_plane_reset", "path_down", "concatenated_path_down",
  // "administratively_down", "reverse_concatenated_path_down", or "reserved"
  // for an unassigned RFC 5880 diagnostic code.
  string diagnostic = 3;
  // RFC 5882 strict mode: BGP is withheld from Established until BFD is Up.
  bool strict = 4;
}

message GetBfdSessionsResponse {
  repeated BfdSession sessions = 1;
}

// ---------------------------------------------------------------------------
// EventService — unified live event stream
// ---------------------------------------------------------------------------

service EventService {
  rpc WatchEvents(WatchEventsRequest) returns (stream BgpEvent);
  rpc ListEvpnEvents(ListEvpnEventsRequest) returns (ListEvpnEventsResponse);
  rpc ListSessionEvents(ListSessionEventsRequest) returns (ListSessionEventsResponse);
  rpc ListPolicyEvents(ListPolicyEventsRequest) returns (ListPolicyEventsResponse);

  // SubscribeFromEvent — durable cursor replay then live (ADR-0072).
  // Replays events with event_id > from_event_id, then transitions to
  // live broadcast. The handoff is actor-ordered inside the daemon's
  // EventHistoryManager: live subscriber registered first, high-water
  // captured next, replay drained, live forwarded with the cursor floor
  // enforced. The same payload bytes go to both halves of the stream
  // (the byte-equality invariant from ADR-0072).
  //
  // The `from_event_id` field uses proto3 explicit-presence: absent ⇒
  // live-only (matches WatchEvents); value 0 ⇒ replay everything
  // retained, then live (fresh-collector case); value N > 0 ⇒ replay
  // event_id > N, then live (normal reconnect case).
  //
  // Returns UNIMPLEMENTED until the daemon wires EventHistoryManager
  // into the service.
  rpc SubscribeFromEvent(SubscribeFromEventRequest) returns (stream BgpEvent);
}

message ListRoutesRequest {
  string neighbor_address = 1;
  AddressFamily afi_safi = 2;
  uint32 page_size = 3;
  string page_token = 4;

  // Route filters — all are optional; when set, only matching routes are returned.

  // Prefix filter (e.g. "10.0.0.0" with prefix_filter_length=24).
  // Empty string = no prefix filter.
  string prefix_filter = 5;
  uint32 prefix_filter_length = 6;
  // If true, return all routes whose prefix falls within prefix_filter/prefix_filter_length
  // (longer or equal match). If false, exact match only.
  bool longer_prefixes = 7;

  // Origin ASN filter — match routes whose AS_PATH originates from this ASN
  // (last ASN in the path). 0 = no filter.
  uint32 origin_asn = 8;

  // Community filter — match routes containing this community (e.g. (65001 << 16) | 100).
  // Empty = no filter. Multiple values are OR-matched.
  repeated uint32 community_filter = 9;

  // Large community filter — match routes containing this large community.
  // Format: "global_admin:local_data1:local_data2". Empty = no filter.
  repeated string large_community_filter = 10;
}

message ListRoutesResponse {
  repeated Route routes = 1;
  string next_page_token = 2;
  uint64 total_count = 3;
}

enum ExplainDecision {
  EXPLAIN_DECISION_UNSPECIFIED = 0;
  EXPLAIN_DECISION_ADVERTISE = 1;
  EXPLAIN_DECISION_DENY = 2;
  EXPLAIN_DECISION_NO_BEST_ROUTE = 3;
  EXPLAIN_DECISION_UNSUPPORTED_FAMILY = 4;
}

message ExplainAdvertisedRouteRequest {
  string peer_address = 1;
  string prefix = 2;
  uint32 prefix_length = 3;
}

message ExplainReason {
  string code = 1;
  string message = 2;
}

message ExplainModifications {
  optional uint32 set_local_pref = 1;
  optional uint32 set_med = 2;
  string set_next_hop = 3;
  repeated uint32 communities_add = 4;
  repeated uint32 communities_remove = 5;
  repeated uint64 extended_communities_add = 6;
  repeated uint64 extended_communities_remove = 7;
  repeated string large_communities_add = 8;
  repeated string large_communities_remove = 9;
  optional uint32 as_path_prepend_asn = 10;
  optional uint32 as_path_prepend_count = 11;
}

message ExplainAdvertisedRouteResponse {
  ExplainDecision decision = 1;
  string peer_address = 2;
  string prefix = 3;
  uint32 prefix_length = 4;
  string next_hop = 5;
  uint32 path_id = 6;
  string route_peer_address = 7;
  string route_type = 8;
  repeated ExplainReason reasons = 9;
  ExplainModifications modifications = 10;
}

message ExplainBestPathRequest {
  // Prefix to explain. A prefix with no paths in any Adj-RIB-In
  // returns NOT_FOUND (there is nothing to explain).
  string prefix = 1;
  uint32 prefix_length = 2;
  // Optional IP address (IPv4 or IPv6 literal) of the peer to
  // scope the explanation to. The response shape is unchanged
  // from the v0.7.0 form: the Loc-RIB best for this prefix lives
  // in `best_route`, and `candidates` lists every *non-best*
  // route the RIB knows about for this prefix (the winner is
  // never repeated in `candidates`). When set, the explanation
  // additionally tags peer-aware advertisement: every candidate
  // that the named peer would receive — passes the peer's
  // export policy + sendable-family check + split-horizon / RR
  // suppression and falls within the peer's effective
  // `add_path_send_max` — gets a non-zero
  // `advertised_path_id` reflecting its advertised rank.
  // Everything else stays at `advertised_path_id = 0`. Note
  // that ranks in `candidates` may start at 2 when the
  // Loc-RIB winner (in `best_route`) is itself advertised at
  // rank 1 to the peer; rank 1 is therefore not always present
  // in the `candidates` list. Empty = global view, the v0.7.0
  // behavior. Unknown peer → NOT_FOUND. Named `peer_address`
  // to match the convention used elsewhere in this file (see
  // e.g. `ExplainAdvertisedRouteRequest.peer_address`).
  string peer_address = 3;
}

message BestPathCandidate {
  Route route = 1;
  string vs_best_reason = 2;
  string vs_best_ordering = 3;
  // Compared values behind vs_best_reason, candidate's value first,
  // e.g. "local_pref 100 < 200" or "as_path_len 3 > 1". Categorical
  // steps render as "x vs y" (e.g. "ibgp vs ebgp", "rpki invalid vs
  // valid"). Human-oriented diagnostic text — not a stable
  // machine-parsable grammar; consume vs_best_reason for the step
  // identity.
  string vs_best_detail = 5;
  // Whether this candidate survives the equal-cost multipath cut vs
  // the best route (ADR-0066): "eligible" (groups under the strict
  // default, exact AS_PATH match), "relax_only" (groups only with
  // as-path multipath-relax), or "none". Reported for both grouping
  // modes because the explain query does not know which relax knob a
  // given FIB table uses; the live cut still applies the configured
  // knob and maximum_paths bound.
  string multipath = 6;
  // Set on responses scoped to a peer with Add-Path send mode
  // (`add_path_send_max > 0`). Non-zero = this candidate would be
  // advertised at this rank. Zero = filtered (export policy
  // reject, family mismatch, split-horizon, iBGP / RFC 4456
  // route-reflector suppression, or beyond `send_max`). Always
  // zero in single-best send mode (`add_path_send_max == 0`) —
  // single-best advertises only the Loc-RIB best (`best_route`)
  // at `path_id = 0`, and never falls back to the next-best
  // candidate when the winner is suppressed, so this field cannot
  // represent that selection. In single-best mode operators infer
  // winner-advertisement from `best_route` plus their knowledge
  // of the peer's policy state.
  uint32 advertised_path_id = 4;
}

message ExplainBestPathResponse {
  string prefix = 1;
  uint32 prefix_length = 2;
  Route best_route = 3;
  repeated BestPathCandidate candidates = 4;
  // Echoed from the request when the explanation is peer-scoped.
  // Empty for global-view responses.
  string peer_address = 5;
  // Effective Add-Path `send_max` for this prefix and peer (0 in
  // any of: global-view response, peer in single-best mode,
  // peer's `add_path_send_families` doesn't include the prefix's
  // AFI/SAFI, prefix is for an AFI/SAFI not in the peer's
  // `sendable_families`). When non-zero, up to that many
  // candidates by best-path preference will carry a non-zero
  // `BestPathCandidate.advertised_path_id`. The "effective"
  // qualifier matters because a peer with `add_path_send_max=4`
  // but no Add-Path families negotiated for this prefix's AFI
  // gets `add_path_send_max = 0` here — the response reflects
  // what would actually happen, not the bare config knob.
  uint32 add_path_send_max = 6;
  // The decision step that selected the winner: the step at which the
  // runner-up — the last surviving competitor by best-path order — was
  // eliminated. Same snake_case step vocabulary as vs_best_reason
  // (stale_preference, rpki_preference, aspa_preference,
  // higher_local_pref, shorter_as_path, lower_origin, lower_med,
  // ebgp_over_ibgp, shorter_cluster_list, lower_originator_id,
  // lower_peer_address). "only_path" when the prefix has exactly one
  // path (trivial winner, no competing candidates). A prefix with no
  // paths at all is NOT_FOUND at the RPC layer, so this field is never
  // empty on a successful response.
  string best_reason = 7;
  // Compared values behind best_reason, winner's value first
  // (e.g. "local_pref 200 > 100"). Empty when best_reason is
  // "only_path". Human-oriented diagnostic text, like vs_best_detail.
  string best_reason_detail = 8;
}

message ListBlackholeDiscardsRequest {}

enum BlackholeDiscardState {
  BLACKHOLE_DISCARD_STATE_UNSPECIFIED = 0;
  BLACKHOLE_DISCARD_STATE_INSTALLED = 1;
  BLACKHOLE_DISCARD_STATE_REJECTED = 2;
  BLACKHOLE_DISCARD_STATE_FAILED = 3;
}

message BlackholeDiscard {
  string prefix = 1;
  uint32 prefix_length = 2;
  string peer_address = 3;
  BlackholeDiscardState state = 4;
  // Human-readable reason: installed/owned, broad_prefix, not_ebgp, or
  // a kernel error summary.
  string reason = 5;
}

message ListBlackholeDiscardsResponse {
  repeated BlackholeDiscard discards = 1;
}

message ListFibRoutesRequest {
  // Optional exact table-name filter. Empty = all configured FIB tables.
  string table_name = 1;
  // Optional state filter. UNSPECIFIED = all states.
  FibRouteState state = 2;
  // Optional exact reason filter, e.g. "owned",
  // "route_limit_exceeded", or "foreign_route_exists". Empty = all reasons.
  string reason = 3;
  // Optional exact prefix filter. Empty = all prefixes and requires
  // prefix_length = 0. This is an exact prefix+length match, not
  // longest-prefix / containment.
  string prefix = 4;
  uint32 prefix_length = 5;
  // Optional source peer-address filter. Empty = all peers.
  string peer_address = 6;
  // Optional page size. 0 preserves legacy behavior and returns the full
  // filtered snapshot.
  uint32 page_size = 7;
  // Decimal offset returned by next_page_token. Requires page_size > 0.
  string page_token = 8;
}

enum FibRouteState {
  FIB_ROUTE_STATE_UNSPECIFIED = 0;
  // Route is daemon-owned and currently matches the configured kernel table.
  FIB_ROUTE_STATE_INSTALLED = 1;
  // Route candidate was intentionally withheld before kernel apply.
  FIB_ROUTE_STATE_REJECTED = 2;
  // Runtime hit a RIB, dump, or kernel boundary error.
  FIB_ROUTE_STATE_FAILED = 3;
}

message FibRouteStatus {
  string table_name = 1;
  uint32 table_id = 2;
  uint32 metric = 3;
  string prefix = 4;
  uint32 prefix_length = 5;
  string next_hop = 6;
  string peer_address = 7;
  FibRouteState state = 8;
  // Operator-facing reason code. Stable values include "owned",
  // "next_hop_family_unsupported", "peer_not_allowed",
  // "route_limit_exceeded", "foreign_route_exists", and
  // "owned_route_drifted"; failure values are prefixed diagnostics such as "dump_failed:DETAIL",
  // "rib_query_failed:DETAIL", "install_failed:DETAIL",
  // "replace_failed:DETAIL", or "remove_failed:DETAIL". Treat text after
  // ':' as diagnostic detail.
  string reason = 9;
  // Non-zero when this row belongs to a sampled high-cardinality status set
  // such as route_limit_exceeded. Counts are scoped to the row's
  // table/metric/reason, not to the current pagination page.
  uint64 sampling_sampled_rows = 10;
  // Rows suppressed after the status sample cap was reached.
  uint64 sampling_suppressed_rows = 11;
  // Total rows in the sampled status set before sampling.
  uint64 sampling_total_rows = 12;
  // Configured max_routes value that triggered route_limit_exceeded sampling.
  uint32 sampling_max_routes = 13;
  // Status-row sample cap applied to this status set.
  uint32 sampling_sample_limit = 14;
  // True when no rows were suppressed for this sampled status set.
  bool sampling_complete = 15;
  // All equal-cost next-hops installed for this row (unicast multipath /
  // ECMP, ADR-0066). One entry == single-path; more == kernel RTA_MULTIPATH.
  // The list is canonical (sorted, deduplicated). The scalar `next_hop` above
  // stays populated for back-compat with clients that predate multipath — it
  // is the selected best route's next-hop and is a member of `next_hops` when
  // the set is non-empty (not necessarily `next_hops[0]`).
  repeated string next_hops = 16;
}

message ListFibRoutesResponse {
  repeated FibRouteStatus routes = 1;
  // Decimal offset for the next page when explicit pagination is active.
  string next_page_token = 2;
  // Number of rows after filtering and before pagination.
  uint64 total_count = 3;
}

// Full mirror of a `[[fib_tables]]` config block. SetFibTable carries the
// complete definition (not a patch), so defaults and validation stay legible.
message FibTableConfig {
  // Operator-facing handle, unique across the table set.
  string name = 1;
  // Linux route table id (reserved ids are rejected at validation).
  uint32 table_id = 2;
  // Kernel route metric / priority for daemon-owned rows.
  uint32 metric = 3;
  // Address families eligible for install, e.g. "ipv4_unicast" /
  // "ipv6_unicast". Empty defaults to both unicast families.
  repeated string families = 4;
  // Optional peer-group allow-list. Empty = all peer groups.
  repeated string allowed_peer_groups = 5;
  // Optional neighbor-address allow-list. Empty = all neighbors.
  repeated string allowed_neighbors = 6;
  // Optional hard row cap. Unset = no cap. Zero is rejected.
  optional uint32 max_routes = 7;
  // Optional ECMP caps (ADR-0066), each 1..=256. Unset/1 = single next-hop.
  // Per-class caps override the global one for their best-path class.
  optional uint32 maximum_paths = 8;
  optional uint32 maximum_paths_ebgp = 9;
  optional uint32 maximum_paths_ibgp = 10;
}

message SetFibTableRequest {
  // Full table definition, upserted by name (create-or-replace). A change to
  // table_id/metric for an existing name is a real table-key move: old kernel
  // rows withdraw and the new table back-fills through the reconciler.
  FibTableConfig table = 1;
}

message DeleteFibTableRequest {
  // Name of the table to remove. NOT_FOUND if no table has this name.
  string name = 1;
}

message ListFibTablesRequest {}

message ListFibTablesResponse {
  // For Set/Delete: the full accepted runtime table set after the operation.
  // For List: the current configured set.
  repeated FibTableConfig tables = 1;
  // True when the FIB reconciler is running and can hot-apply table edits.
  // False on List means edits are restart-required: either no table was
  // present at startup (the reconciler isn't spawned) or the runtime is
  // unavailable (non-Linux platform / netlink setup failure).
  bool runtime_available = 2;
}

message ListRouteEventsRequest {
  // Optional neighbor address filter. Empty = all peers. Matches both
  // current and previous peer, so a peer-scoped query includes
  // BestChanged/Withdrawn events where the route moved away.
  string neighbor_address = 1;
  AddressFamily afi_safi = 2;
  // Maximum events to return from the bounded in-memory history. 0
  // uses the daemon default. Responses are ordered oldest-to-newest
  // within the selected recent window.
  uint32 limit = 3;
  // Optional exact prefix filter. Empty = no prefix filter.
  string prefix = 4;
  uint32 prefix_length = 5;
}

message ListRouteEventsResponse {
  repeated RouteEvent events = 1;
}

message Route {
  string prefix = 1;
  uint32 prefix_length = 2;
  string next_hop = 3;
  string peer_address = 4;
  uint32 origin = 5;
  repeated uint32 as_path = 6;
  uint32 local_pref = 7;
  uint32 med = 8;
  bool best = 9;
  repeated uint32 communities = 10;
  repeated uint64 extended_communities = 11;
  // Format: "global_admin:local_data1:local_data2" (e.g. "65001:100:200").
  repeated string large_communities = 12;
  // Add-Path path identifier (RFC 7911). 0 = no Add-Path.
  uint32 path_id = 13;
  // RPKI validation state: "valid", "invalid", or "not_found".
  string validation_state = 14;
  // ASPA path verification state: "valid", "invalid", or "unknown".
  string aspa_state = 15;
  // Distinguishes "explicit LOCAL_PREF attribute set on the wire or by
  // policy" (Some(value)) from "no LOCAL_PREF attribute" (absent).
  // EBGP-received routes have no LOCAL_PREF on the wire, so without
  // this distinction `local_pref = 0` could mean either "policy set
  // it to zero" (e.g. RFC 8326 implicit demotion fired) or "no
  // attribute". Used by the M35 interop test to assert the implicit
  // honor rule actually fired on a tagged route.
  optional uint32 local_pref_attr = 16;
}

message WatchRoutesRequest {
  string neighbor_address = 1;
  AddressFamily afi_safi = 2;
}

enum RouteEventType {
  ROUTE_EVENT_TYPE_UNSPECIFIED = 0;
  ROUTE_EVENT_TYPE_ADDED = 1;
  ROUTE_EVENT_TYPE_WITHDRAWN = 2;
  ROUTE_EVENT_TYPE_BEST_CHANGED = 3;
  ROUTE_EVENT_TYPE_POLICY_FILTERED = 4;
}

message RouteEvent {
  RouteEventType event_type = 1;
  string prefix = 2;
  uint32 prefix_length = 3;
  string peer_address = 4;
  AddressFamily afi_safi = 5;
  // Unix epoch seconds.
  string timestamp = 6;
  string previous_peer_address = 7;
  // Add-Path path identifier (RFC 7911). 0 = no Add-Path.
  uint32 path_id = 8;
  // Monotonic process-local route event identifier. Resets on daemon restart.
  uint64 event_id = 9;
  // Outbound peer whose export policy filtered this route. Empty for
  // source-peer best-path events.
  string target_peer_address = 10;
  // Stable operator-facing reason, e.g. "policy_denied".
  string reason = 11;
}

enum EventCategory {
  EVENT_CATEGORY_UNSPECIFIED = 0;
  EVENT_CATEGORY_ROUTE = 1;
  EVENT_CATEGORY_SESSION = 2;
  EVENT_CATEGORY_POLICY = 3;
  EVENT_CATEGORY_DATAPLANE = 4;
  EVENT_CATEGORY_EVPN = 5;
  EVENT_CATEGORY_BFD = 6;
}

enum BgpEventType {
  BGP_EVENT_TYPE_UNSPECIFIED = 0;
  BGP_EVENT_TYPE_ROUTE_ADDED = 1;
  BGP_EVENT_TYPE_ROUTE_WITHDRAWN = 2;
  BGP_EVENT_TYPE_ROUTE_BEST_CHANGED = 3;
  BGP_EVENT_TYPE_ROUTE_POLICY_FILTERED = 4;
  BGP_EVENT_TYPE_SESSION_STATE_CHANGED = 10;
  BGP_EVENT_TYPE_SESSION_ESTABLISHED = 11;
  BGP_EVENT_TYPE_SESSION_LOST = 12;
  BGP_EVENT_TYPE_PEER_ENABLED = 13;
  BGP_EVENT_TYPE_PEER_DISABLED = 14;
  BGP_EVENT_TYPE_NOTIFICATION_SENT = 20;
  BGP_EVENT_TYPE_NOTIFICATION_RECEIVED = 21;
  BGP_EVENT_TYPE_POLICY_CHANGED = 22;
  // OTC route-leak rule (RFC 9234 §5) blocked one or more unicast
  // routes at either an ingress or egress decision site. Payload
  // is OtcRouteBlockedEvent. Category: EVENT_CATEGORY_POLICY.
  BGP_EVENT_TYPE_OTC_ROUTE_BLOCKED = 23;
  BGP_EVENT_TYPE_DATAPLANE_STATUS_CHANGED = 30;
  BGP_EVENT_TYPE_DATAPLANE_ROUTE_INSTALLED = 31;
  BGP_EVENT_TYPE_DATAPLANE_ROUTE_WITHDRAWN = 32;
  BGP_EVENT_TYPE_DATAPLANE_ROUTE_FAILED = 33;
  BGP_EVENT_TYPE_EVPN_ROUTE_ADDED = 40;
  BGP_EVENT_TYPE_EVPN_ROUTE_WITHDRAWN = 41;
  BGP_EVENT_TYPE_EVPN_ROUTE_BEST_CHANGED = 42;
  BGP_EVENT_TYPE_BFD_SESSION_UP = 50;
  BGP_EVENT_TYPE_BFD_SESSION_DOWN = 51;
  BGP_EVENT_TYPE_BFD_SESSION_STATE_CHANGED = 52;
  // A WatchEvents subscriber fell behind a bounded source stream and
  // missed one or more events. The payload identifies the source
  // category and missed count.
  BGP_EVENT_TYPE_STREAM_LAGGED = 100;
}

enum EventSeverity {
  EVENT_SEVERITY_UNSPECIFIED = 0;
  EVENT_SEVERITY_INFO = 1;
  EVENT_SEVERITY_WARNING = 2;
  EVENT_SEVERITY_ERROR = 3;
}

message WatchEventsRequest {
  // Empty categories with empty event_types = default live categories
  // (route + session). A non-empty event_types filter narrows the
  // result; BGP_EVENT_TYPE_POLICY_CHANGED,
  // BGP_EVENT_TYPE_DATAPLANE_STATUS_CHANGED, or
  // BGP_EVENT_TYPE_DATAPLANE_ROUTE_* with empty categories selects
  // those streams. Add EVENT_CATEGORY_POLICY or EVENT_CATEGORY_DATAPLANE
  // explicitly to combine them with the default route + session
  // categories.
  //
  // BGP_EVENT_TYPE_OTC_ROUTE_BLOCKED is NOT served by this RPC: the
  // OTC route-leak decision is published only through the durable
  // outbox (ADR-0072). Filtering for it here would produce an empty
  // live stream. Use SubscribeFromEvent with
  // categories=[EVENT_CATEGORY_POLICY] and
  // event_types=[BGP_EVENT_TYPE_OTC_ROUTE_BLOCKED].
  repeated EventCategory categories = 1;
  // Empty = all event types for the selected categories.
  repeated BgpEventType event_types = 2;
  // Optional neighbor address filter. Empty = all peers. Route events
  // match both current and previous peer, same as WatchRoutes,
  // WatchRouteEvents, and ListRouteEvents. Session events match their
  // peer address. Policy events match only when tied to one peer.
  // EVPN route events match both current and previous peer, same as route
  // events. Per-route FIB dataplane events match their source peer.
  // Dataplane summary events are peerless and do not match this filter.
  string neighbor_address = 3;
  // Optional family filter. Applies to route events and per-route FIB
  // dataplane events; session, policy, EVPN, and peerless dataplane summary
  // events do not match a family-filtered request.
  AddressFamily afi_safi = 4;
  // Optional exact prefix filter. Applies to route events and per-route
  // FIB dataplane events; session, policy, EVPN, and peerless dataplane
  // summary events do not match a prefix-filtered request.
  string prefix = 5;
  uint32 prefix_length = 6;
}

// SubscribeFromEvent cursor request (ADR-0072).
//
// Carries the same filter field surface as WatchEventsRequest, plus
// an explicit-presence cursor field. See the RPC doc on EventService
// for the presence semantics.
message SubscribeFromEventRequest {
  // Explicit-presence cursor. proto3 `optional` distinguishes
  // "field absent on the wire" (live-only subscription) from
  // "value = 0" (replay all retained events, then live).
  // See ADR-0072 § "Cursor API" for the contract.
  optional uint64 from_event_id = 1;

  // Filters. All set filters are AND-combined.
  //
  // Default-filter semantics diverge from WatchEventsRequest on
  // purpose: SubscribeFromEvent treats an empty `categories` +
  // empty `event_types` as **all categories** — the natural
  // default for a durable replay client that wants to see
  // everything the outbox emits. WatchEventsRequest's empty-
  // filter default of "route + session only" exists for
  // historical live-stream ergonomics and would surprise a
  // cursor-driven collector that loses non-route/non-session
  // events on first connect. Clients that want to scope the
  // stream name the categories explicitly.
  //
  // This default applies regardless of whether `from_event_id`
  // is set. The cursor field above only changes replay behavior
  // (absent ⇒ live-only, present ⇒ replay-then-live); it does
  // NOT swap in WatchEventsRequest's category default for the
  // live half of an absent-cursor subscription. Empty filters
  // select all categories for this RPC in every case.
  //
  // An empty `categories` filter selects every EHM-fed category:
  // route, EVPN, session, policy, BFD, and dataplane. All six are
  // produced through the durable outbox when
  // `[event_history].enabled = true`.
  repeated EventCategory categories = 2;
  repeated BgpEventType event_types = 3;
  string neighbor_address = 4;
  AddressFamily afi_safi = 5;
  string prefix = 6;
  uint32 prefix_length = 7;
}

message ListEvpnEventsRequest {
  // Optional neighbor address filter. Matches both current and previous
  // best-path peer so peer-scoped queries include withdraws and best-path
  // moves away from the peer.
  string neighbor_address = 1;
  // Empty = all EVPN event types. Current valid values:
  // BGP_EVENT_TYPE_EVPN_ROUTE_ADDED / WITHDRAWN / BEST_CHANGED.
  repeated BgpEventType event_types = 2;
  // Maximum events to return from the bounded 4096-event in-memory EVPN
  // history. 0 uses the daemon default/full bounded window. Larger values
  // are clamped to the same 4096-event ceiling. Responses contain the most
  // recent matching events, ordered oldest-to-newest within that window.
  uint32 limit = 3;
  // RFC 7432/9136 EVPN route type filter (1..=5). 0 = no filter.
  uint32 route_type_filter = 4;
  // Route Distinguisher filter in display format. Empty = no filter.
  string rd_filter = 5;
}

message ListEvpnEventsResponse {
  repeated BgpEvent events = 1;
}

message ListSessionEventsRequest {
  // Optional neighbor address filter. Empty = all peers.
  string neighbor_address = 1;
  // Empty = all session event types.
  repeated BgpEventType event_types = 2;
  // Maximum events to return from the bounded 4096-event in-memory
  // history. 0 uses the daemon default/full bounded window. Larger
  // values are clamped to the same 4096-event ceiling. Responses
  // contain the most recent matching events, ordered oldest-to-newest
  // within that selected recent window.
  uint32 limit = 3;
}

message ListSessionEventsResponse {
  repeated BgpEvent events = 1;
}

message ListPolicyEventsRequest {
  // Optional neighbor address filter. Empty = all policy mutation events.
  // Only peer-scoped policy events match a peer filter.
  string neighbor_address = 1;
  // Empty = all policy event types. Current valid value:
  // BGP_EVENT_TYPE_POLICY_CHANGED.
  repeated BgpEventType event_types = 2;
  // Maximum events to return from the bounded 4096-event in-memory
  // history. 0 uses the daemon default/full bounded window. Larger
  // values are clamped to the same 4096-event ceiling. Responses
  // contain the most recent matching events, ordered oldest-to-newest
  // within that selected recent window.
  uint32 limit = 3;
}

message ListPolicyEventsResponse {
  repeated BgpEvent events = 1;
}

message SessionEvent {
  BgpEventType event_type = 1;
  string peer_address = 2;
  // Unix epoch seconds, matching existing RouteEvent timestamp shape.
  string timestamp = 3;
  // BGP FSM state names from the transport layer (`Idle`, `Connect`,
  // `Active`, `OpenSent`, `OpenConfirm`, `Established`). Empty for
  // peer enable/disable events that are not tied to a specific FSM
  // transition.
  string old_state = 4;
  string new_state = 5;
  // `primary` for the managed peer session, `inbound_candidate` for a
  // collision-resolution candidate, empty for peer enable/disable
  // events.
  string session_role = 6;
  // Stable operator-facing reason/summary string for this event.
  string reason = 7;
}

message StreamLagEvent {
  // Source stream that lagged. This is the same value copied into the
  // top-level BgpEvent.category field so category-agnostic clients can
  // filter without unpacking the payload.
  EventCategory source_category = 1;
  // Count reported by tokio broadcast lag detection. It is the number
  // of source events skipped by this subscriber, before any
  // WatchEvents filters could be applied.
  uint64 missed_count = 2;
  // Stable operator-facing reason/summary string for this event.
  string reason = 3;
}

message NotificationEvent {
  BgpEventType event_type = 1;
  string peer_address = 2;
  // Unix epoch seconds, matching existing RouteEvent timestamp shape.
  string timestamp = 3;
  // "sent" or "received".
  string direction = 4;
  // BGP NOTIFICATION error code and subcode (RFC 4271 section 4.5).
  uint32 code = 5;
  uint32 subcode = 6;
  // Human-readable code/subcode description.
  string description = 7;
  // `primary` for the managed peer session, `inbound_candidate` for a
  // collision-resolution candidate.
  string session_role = 8;
  // RFC 8203 shutdown communication reason, when present.
  string shutdown_reason = 9;
  // Stable operator-facing reason/summary string for this event.
  string reason = 10;
}

message PolicyEvent {
  BgpEventType event_type = 1;
  // Operation label such as `set`, `delete`, or `clear`.
  string operation = 2;
  // Target class such as `policy`, `neighbor_set`, `peer_group`,
  // `global_import_chain`, or `neighbor_export_chain`.
  string target_type = 3;
  // Target name or address-scoped target string.
  string target = 4;
  // Peer address when this mutation is scoped to one peer. Empty for
  // global policy / peer-group / neighbor-set mutations.
  string peer_address = 5;
  // Number of currently managed peers the runtime mutation touched.
  uint32 affected_peer_count = 6;
  // Unix epoch seconds, matching existing RouteEvent timestamp shape.
  string timestamp = 7;
  // Stable operator-facing reason/summary string for this event.
  string reason = 8;
}

message DataplaneEvent {
  // Summary source. Current values: "fib" and "blackhole".
  string source = 1;
  // Count of currently surfaced installed status rows for this source.
  uint64 installed = 2;
  // Count of currently surfaced rejected status rows for this source. Some
  // sources may sample high-cardinality rejection reasons.
  uint64 rejected = 3;
  // Count of currently surfaced failed status rows for this source.
  uint64 failed = 4;
}

message DataplaneRouteEvent {
  // Runtime source. Current value: "fib".
  string source = 1;
  // Stable operation label: installed, withdrawn, or failed.
  string action = 2;
  string table_name = 3;
  uint32 table_id = 4;
  uint32 metric = 5;
  string prefix = 6;
  uint32 prefix_length = 7;
  string next_hop = 8;
  string peer_address = 9;
  // Unix epoch seconds, matching existing RouteEvent timestamp shape.
  string timestamp = 10;
  // Stable operator-facing reason/summary string for this event.
  string reason = 11;
}

message EvpnRouteEvent {
  BgpEventType event_type = 1;
  string peer_address = 2;
  string previous_peer_address = 3;
  // Unix epoch seconds, matching existing RouteEvent timestamp shape.
  string timestamp = 4;
  // RFC 7432 route type (1..=5).
  uint32 route_type = 5;
  // Route Distinguisher in display format.
  string rd = 6;
  // Stable operator-facing key summary, derived from the EVPN route key.
  string route_key = 7;
  // Current best path. Absent for withdrawals.
  EvpnRouteEntry route = 8;
  // Best path immediately before this change. Present for withdrawals and
  // best-path moves when the RIB retained the prior path.
  EvpnRouteEntry previous_route = 9;
  // Stable operator-facing reason/summary string for this event.
  string reason = 10;
}

message BfdSessionEvent {
  BgpEventType event_type = 1;
  string peer_address = 2;
  // Unix epoch seconds, matching existing RouteEvent timestamp shape.
  string timestamp = 3;
  BfdSessionState old_state = 4;
  BfdSessionState new_state = 5;
  // Local diagnostic for this transition (RFC 5880 section 4.1), as a stable
  // snake_case name (see BfdSession.diagnostic).
  string diagnostic = 6;
  // Stable operator-facing reason/summary string for this event.
  string reason = 7;
}

// Emitted whenever an OTC route-leak rule (RFC 9234 §5) blocks one
// or more unicast routes at either an ingress or egress decision
// site. The legacy `bgp_otc_routes_blocked_total{peer, reason}`
// counter and the `otc_routes_blocked` scalar on NeighborState are
// unchanged — this structured event is the per-decision surface
// needed for incident reconstruction.
message OtcRouteBlockedEvent {
  BgpEventType event_type = 1;
  string peer_address = 2;
  // Unix epoch seconds, matching existing RouteEvent timestamp shape.
  string timestamp = 3;
  // "ingress" | "egress" — which decision site fired.
  string direction = 4;
  // Bounded reason vocabulary, matching the
  // `bgp_otc_routes_blocked_total{reason=…}` label:
  //   - "ingress_from_customer_rsclient"
  //   - "ingress_peer_mismatch"
  //   - "malformed_length"
  //   - "egress_to_upstream_via_otc"
  string reason = 5;
  // Wire-format prefix strings ("203.0.113.0/24"). For ingress this
  // is every announced unicast prefix in the rejected UPDATE; for
  // egress this is a single prefix (the loop runs per route).
  repeated string prefixes = 6;
  // Convenience count — `prefixes.size()` would also work, but
  // collectors that filter on count without parsing the array benefit
  // from the explicit field.
  uint32 count = 7;
  // Local BGP role at the moment of the decision (RFC 9234 §4 names:
  // "provider", "route_server", "route_server_client", "customer",
  // "peer"). Empty when no local role is configured.
  string local_role = 8;
  // Peer's negotiated BGP role. Empty when the peer did not advertise
  // the Role capability.
  string remote_role = 9;
  // The OTC attribute value (ASN). Omitted on the malformed_length
  // path because the attribute couldn't be decoded.
  optional uint32 otc_value = 10;
  // AS_PATH in the same wire-string form used by gRPC matchers
  // (`{…}` notation preserves AS_SET / confederation segments).
  // Empty when the UPDATE / route carried no AS_PATH attribute.
  string as_path = 11;
  // Stable operator-facing reason/summary string for this event.
  string summary = 12;
}

message BgpEvent {
  // Unix epoch seconds, matching existing RouteEvent timestamp shape.
  string timestamp = 1;
  // Common fields are duplicated from the category-specific payload on purpose:
  // category-agnostic consumers can filter/render without unpacking the oneof,
  // while payloads preserve the full source event shape for category-specific
  // clients.
  EventCategory category = 2;
  BgpEventType event_type = 3;
  EventSeverity severity = 4;
  string peer_address = 5;
  string previous_peer_address = 6;
  string prefix = 7;
  uint32 prefix_length = 8;
  AddressFamily afi_safi = 9;
  string summary = 10;
  // Outbound peer affected by target-scoped route events such as
  // export-policy filtering. Empty for ordinary source-peer route events.
  string target_peer_address = 19;

  // Durable monotonic event_id (ADR-0072). Carried at the envelope
  // level rather than duplicated onto every nested payload — see
  // the ADR's "Envelope strategy" section for the rationale.
  //
  // `optional uint64` (proto3 explicit-presence) so clients can
  // tell whether the daemon emitted this event through the durable
  // outbox. Events from EHM-fed broadcasts (PR5+) set the field on
  // every event. Events from pre-ADR-0072 surfaces — including the
  // legacy in-memory ring path used by ListRouteEvents and the
  // existing WatchEvents stream until producer wiring lands — omit
  // the field. The allocator starts at 0 and the first committed
  // event gets id 1, so a present-but-zero value should never
  // appear on an emitted BgpEvent in practice.
  //
  // RouteEvent.event_id continues to mirror this value for wire
  // backwards-compatibility with route-only consumers, but the
  // envelope-level field is the source of truth.
  optional uint64 event_id = 21;

  oneof payload {
    RouteEvent route = 11;
    SessionEvent session = 12;
    StreamLagEvent stream_lag = 13;
    NotificationEvent notification = 14;
    PolicyEvent policy = 15;
    DataplaneEvent dataplane = 16;
    EvpnRouteEvent evpn = 17;
    DataplaneRouteEvent dataplane_route = 18;
    BfdSessionEvent bfd = 20;
    // Tag 21 is reserved at the message level for `event_id`; the
    // next free oneof variant tag is 22.
    OtcRouteBlockedEvent otc_route_blocked = 22;
  }
}

// ---------------------------------------------------------------------------
// InjectionService — Programmatic route injection
// ---------------------------------------------------------------------------

service InjectionService {
  rpc AddPath(AddPathRequest) returns (AddPathResponse);
  rpc DeletePath(DeletePathRequest) returns (DeletePathResponse);
  rpc AddFlowSpec(AddFlowSpecRequest) returns (AddFlowSpecResponse);
  rpc DeleteFlowSpec(DeleteFlowSpecRequest) returns (DeleteFlowSpecResponse);
  // Inject a locally-originated EVPN route (RFC 7432). SDN controllers
  // push Type 2 / Type 5 / etc. routes to the RR's Loc-RIB, and the RR
  // reflects them to iBGP peers negotiating L2VPN/EVPN.
  rpc AddEvpnRoute(AddEvpnRouteRequest) returns (AddEvpnRouteResponse);
  rpc DeleteEvpnRoute(DeleteEvpnRouteRequest) returns (DeleteEvpnRouteResponse);
}

message AddPathRequest {
  string prefix = 1;
  uint32 prefix_length = 2;
  string next_hop = 3;
  repeated uint32 as_path = 4;
  uint32 origin = 5;
  optional uint32 local_pref = 6;
  optional uint32 med = 7;
  repeated uint32 communities = 8;
  repeated uint64 extended_communities = 9;
  // Format: "global_admin:local_data1:local_data2" (e.g. "65001:100:200").
  repeated string large_communities = 10;
  // Add-Path path identifier (RFC 7911). 0 = default path.
  uint32 path_id = 11;
}

message AddPathResponse {
  reserved 1;
}

message DeletePathRequest {
  string prefix = 1;
  uint32 prefix_length = 2;
  reserved 3;
  // Add-Path path identifier (RFC 7911). 0 = delete the default path.
  uint32 path_id = 4;
}

message DeletePathResponse {}

// FlowSpec match component (RFC 8955).
message FlowSpecComponent {
  // Component type (1=destination, 2=source, 3=protocol, 4=port, etc.)
  uint32 type = 1;
  // For type 1/2: IP prefix string (e.g. "10.0.0.0/24" or "2001:db8::/32").
  string prefix = 2;
  // For numeric/bitmask types: human-readable operator expression
  // (e.g. "=80", ">=1024 & <=65535").
  string value = 3;
  // For type 1/2 with IPv6: prefix bit offset (RFC 8956 §3.1). Default 0.
  uint32 offset = 4;
}

// FlowSpec traffic action (RFC 8955 extended communities).
message FlowSpecAction {
  oneof action {
    FlowSpecTrafficRate traffic_rate = 1;
    FlowSpecTrafficAction traffic_action = 2;
    FlowSpecTrafficMarking traffic_marking = 3;
    FlowSpecRedirect redirect = 4;
  }
}

message FlowSpecTrafficRate {
  float rate = 1; // bytes/sec; 0.0 = drop
}

message FlowSpecTrafficAction {
  bool sample = 1;
  bool terminal = 2;
}

message FlowSpecTrafficMarking {
  uint32 dscp = 1;
}

message FlowSpecRedirect {
  // Route target string: "ASN:value" (e.g. "65001:100").
  string route_target = 1;
}

// FlowSpec route as seen in the RIB.
message FlowSpecRouteEntry {
  repeated FlowSpecComponent components = 1;
  repeated FlowSpecAction actions = 2;
  string peer_address = 3;
  AddressFamily afi_safi = 4;
  repeated uint32 as_path = 5;
  repeated uint32 communities = 6;
  repeated uint64 extended_communities = 7;
}

message AddFlowSpecRequest {
  // Address family: IPV4_FLOWSPEC or IPV6_FLOWSPEC.
  AddressFamily afi_safi = 1;
  repeated FlowSpecComponent components = 2;
  repeated FlowSpecAction actions = 3;
  repeated uint32 communities = 4;
  repeated uint64 extended_communities = 5;
}

message AddFlowSpecResponse {}

message DeleteFlowSpecRequest {
  AddressFamily afi_safi = 1;
  repeated FlowSpecComponent components = 2;
}

message DeleteFlowSpecResponse {}

message ListFlowSpecRequest {
  AddressFamily afi_safi = 1;
}

message ListFlowSpecResponse {
  repeated FlowSpecRouteEntry routes = 1;
}

// ---------------------------------------------------------------------------
// EVPN (RFC 7432) — typed route entries for route-reflector observability.
// Full RFC 7432 encoding surface is complex; this gRPC surface exposes the
// identifying fields of each route type as strings + small scalars, rather
// than re-encoding the entire wire payload. Wire round-trip fidelity is
// preserved by the RIB; this gRPC view is for human-readable inspection.
// ---------------------------------------------------------------------------

// EVPN route entry in the RIB (any of 5 RFC 7432 route types).
message EvpnRouteEntry {
  // RFC 7432 route type (1..=5).
  uint32 route_type = 1;
  // Route Distinguisher (RFC 4364) in "asn:value" / "ip:value" display format.
  string rd = 2;
  // Ethernet Segment Identifier (hex-coded 10 bytes separated by ':') —
  // empty for Type 3 IMET, which has no ESI.
  string esi = 3;
  // Ethernet Tag ID ("MAX_ET" or a 32-bit decimal value) — empty for Type 4.
  string ethernet_tag = 4;
  // MAC address (Type 2 only), "aa:bb:cc:dd:ee:ff".
  string mac = 5;
  // Host IP (Type 2 and Type 3 and Type 4 and Type 5), may be empty.
  string ip = 6;
  // IP prefix (Type 5 only), formatted as "ADDR/LEN" (e.g. "10.0.0.0/24").
  string prefix = 7;
  // Gateway IP (Type 5 only), may be empty.
  string gateway = 8;
  // Primary label / VNI (Type 1/2/5).
  uint32 label = 9;
  // Secondary label (Type 2 symmetric IRB), 0 when absent.
  uint32 label2 = 10;
  // VTEP loopback IP (next-hop from MP_REACH_NLRI).
  string next_hop = 11;
  // Peer that advertised this route.
  string peer_address = 12;
  // AS_PATH (4-octet ASNs, flattened across AS_SEQUENCE segments).
  repeated uint32 as_path = 13;
  // Standard communities (RFC 1997).
  repeated uint32 communities = 14;
  // Extended communities (RFC 4360) as raw u64.
  repeated uint64 extended_communities = 15;
  // Decoded tunnel type from the BGP Encapsulation ext community, 0 if absent.
  // (VXLAN = 8 per RFC 8365.)
  uint32 tunnel_type = 16;
}

// Filter EVPN route listings. All filters are optional.
message ListEvpnRequest {
  // Only routes matching this route type (1..=5). 0 = no filter.
  uint32 route_type_filter = 1;
  // Only routes from this peer, empty = any.
  string peer_filter = 2;
  // Only routes with this Route Distinguisher (display format). Empty = any.
  string rd_filter = 3;
}

message ListEvpnResponse {
  repeated EvpnRouteEntry routes = 1;
}

// BGP-LS route entry in the RIB (RFC 9552). The route identity stays opaque:
// unknown NLRI types and TLVs are exported as bytes instead of being projected
// into unicast prefixes or synthetic topology structs.
message BgpLsRouteEntry {
  AddressFamily afi_safi = 1;
  string family = 2;
  uint32 nlri_type = 3;
  string nlri_type_name = 4;
  bytes route_distinguisher = 5;
  bytes payload = 6;
  bytes descriptor = 7;
  string next_hop = 8;
  string peer_address = 9;
  repeated uint32 as_path = 10;
  repeated uint32 communities = 11;
  repeated uint64 extended_communities = 12;
  bool stale = 13;
  bool llgr_stale = 14;
  uint32 path_id = 15;
  // Raw BGP-LS Attribute path attribute payload (type 29), when present.
  bytes bgp_ls_attribute = 16;
}

// Filter BGP-LS route listings. All filters are optional.
message ListBgpLsRequest {
  // BGP-LS or BGP-LS VPN. Unspecified = all.
  AddressFamily afi_safi = 1;
  // Only routes from this peer, empty = any.
  string peer_filter = 2;
  // Only routes with this raw NLRI type. 0 = no filter.
  uint32 nlri_type_filter = 3;
}

message ListBgpLsResponse {
  repeated BgpLsRouteEntry routes = 1;
}

// VPNv4/VPNv6 route entry in the RIB (RFC 4364 / RFC 4659, SAFI 128).
// Reflected route-reflector state: the Route Distinguisher, MPLS label
// stack, and next-hop are preserved verbatim (ADR-0077) — no VRF import.
message VpnRouteEntry {
  // "l3vpn_ipv4_unicast" or "l3vpn_ipv6_unicast".
  string afi_safi = 1;
  // Raw 8-byte Route Distinguisher.
  bytes route_distinguisher = 2;
  // Human-readable RD per RFC 4364 §4.2, e.g. "65000:1".
  string route_distinguisher_str = 3;
  // Inner IP prefix, e.g. "10.1.0.0/24".
  string prefix = 4;
  // MPLS label values (20-bit), outermost first.
  repeated uint32 labels = 5;
  string next_hop = 6;
  string peer_address = 7;
  repeated uint32 as_path = 8;
  // Standard communities as "high:low" strings.
  repeated string communities = 9;
  // Extended communities; Route Targets render as "RT:65000:1".
  repeated string extended_communities = 10;
  bool stale = 11;
  bool llgr_stale = 12;
  uint32 path_id = 13;
}

// Filter VPN route listings. All filters are optional.
message ListVpnRoutesRequest {
  // "l3vpn_ipv4_unicast" or "l3vpn_ipv6_unicast"; empty = both.
  string afi_safi = 1;
  // Only routes from this peer, empty = any.
  string peer_filter = 2;
}

message ListVpnRoutesResponse {
  repeated VpnRouteEntry routes = 1;
}

// RT-Constrain route entry in the RIB (RFC 4684, AFI 1 / SAFI 132): a
// 0-96-bit prefix over origin AS + Route Target expressing RT membership
// interest. The zero-length default NLRI means "every Route Target".
message RtcRouteEntry {
  // True for the zero-length default/wildcard membership NLRI.
  bool is_default = 1;
  // Origin AS field of the NLRI (zero for the default NLRI).
  uint32 origin_as = 2;
  // Route Target rendered for display, e.g. "RT:65001:100" (empty for the
  // default NLRI).
  string route_target = 3;
  // Prefix length in bits: 0 (default) or 32..=96.
  uint32 prefix_len = 4;
  string next_hop = 5;
  // Advertising peer; "0.0.0.0" for the locally-originated default.
  string peer_address = 6;
  repeated uint32 as_path = 7;
  // Standard communities as "high:low" strings.
  repeated string communities = 8;
  bool stale = 9;
  bool llgr_stale = 10;
  uint32 path_id = 11;
}

// RT-Constrain is a single family (AFI 1 only), so there is no family
// filter.
message ListRtcRoutesRequest {
  // Only routes from this peer, empty = any.
  string peer_filter = 1;
}

message ListRtcRoutesResponse {
  repeated RtcRouteEntry routes = 1;
}

message ListTopologyNodesRequest {}

// One ORR topology node (RFC 9107 over RFC 9552 BGP-LS).
message TopologyNodeEntry {
  // Canonical node key: protocol-id + identifier + raw node-descriptor
  // container bytes, lowercase hex. Byte equality is the identity contract.
  string key = 1;
  // Autonomous System node-descriptor sub-TLV 512; 0 when absent.
  uint32 asn = 2;
  // BGP-LS Identifier node-descriptor sub-TLV 513; 0 when absent.
  uint32 bgp_ls_id = 3;
  // IGP Router-ID node-descriptor sub-TLV 515 as lowercase hex; empty when
  // absent. Display only — never used for graph identity.
  string router_id = 4;
  // Number of usable outgoing links (links carrying an IGP Metric).
  uint32 link_count = 5;
}

message ListTopologyNodesResponse {
  repeated TopologyNodeEntry nodes = 1;
}

message ListTopologyLinksRequest {}

// One usable directed ORR topology link.
message TopologyLinkEntry {
  // Local endpoint canonical node key, lowercase hex.
  string local_key = 1;
  // Local endpoint IGP Router-ID, lowercase hex; empty when absent.
  string local_router_id = 2;
  // Remote endpoint canonical node key, lowercase hex.
  string remote_key = 3;
  // Remote endpoint IGP Router-ID, lowercase hex; empty when absent.
  string remote_router_id = 4;
  // IGP Metric (TLV 1095) — the SPF edge cost.
  uint32 cost = 5;
  // Link interface and neighbor addresses (TLVs 259-262).
  repeated string addresses = 6;
}

message ListTopologyLinksResponse {
  repeated TopologyLinkEntry links = 1;
}

// Controller-injected EVPN route. Supports Type 2 (MAC/IP), Type 3
// (IMET), and Type 5 (IP Prefix). Type 5 may be pure/interface-less
// (empty gateway) or carry a controller-supplied overlay-index gateway.
message AddEvpnRouteRequest {
  // EVPN route type. Only 2, 3, and 5 are accepted; other values
  // return INVALID_ARGUMENT.
  uint32 route_type = 1;
  // Route Distinguisher, "asn:value" / "ip:value". Required.
  string rd = 2;
  // Ethernet Tag ID (decimal). Default 0. Must be 0 for Type 5 injection.
  uint32 ethernet_tag = 3;
  // MAC address "aa:bb:cc:dd:ee:ff" (Type 2 only). Required for Type 2.
  string mac = 4;
  // Host IP (Type 2 optional, Type 3 required as originator_ip). Empty
  // for Type 2 means MAC-only (no IP advertised).
  string ip = 5;
  // Primary label / VNI (Type 2 and Type 5). Required for Type 2 and
  // Type 5.
  uint32 label = 6;
  // Secondary label for symmetric IRB (RFC 9135). 0 = absent.
  uint32 label2 = 7;
  // Next-hop (VTEP loopback). Required.
  string next_hop = 8;
  // Optional route targets as "asn:value" — encoded as extended
  // communities on the advertised route. Type 5 injection requires at
  // least one route target.
  repeated string route_targets = 9;
  // Optional: when true, suppress the RFC 8365 §5.1.2 VXLAN
  // Encapsulation extended community (tunnel-type=8) on the
  // originated route. Default (proto3 false) attaches the community,
  // matching the VXLAN-EVPN deployment target. Set true only if the
  // caller wants MPLS-over-GRE / non-VXLAN semantics. The field name
  // is inverted (vs. "vxlan_encap") so proto3's default-false yields
  // the operationally correct behavior for clients that omit it.
  bool disable_vxlan_encap = 10;
  // IP prefix address (Type 5 only), without slash length. Pair with
  // `prefix_length`.
  string prefix = 11;
  // IP prefix length (Type 5 only). 0 is valid for default routes.
  uint32 prefix_length = 12;
  // Router MAC extended community value (Type 5 VXLAN only),
  // "aa:bb:cc:dd:ee:ff". Required when `disable_vxlan_encap` is false.
  string router_mac = 13;
  // Optional Gateway IP (Type 5 only). Omit (empty) for interface-less
  // Type 5 — the server encodes the zero gateway for the prefix family.
  // When set it must be a non-zero unicast address in the same family as
  // `prefix` and `next_hop`, and enables overlay-index Type 5 injection.
  string gateway = 14;
}

message AddEvpnRouteResponse {}

message DeleteEvpnRouteRequest {
  // Identify the route to withdraw by its EVPN key: route_type + RD +
  // ethernet_tag + MAC + optional IP (Type 2), originator IP (Type 3),
  // or IP prefix (Type 5).
  uint32 route_type = 1;
  string rd = 2;
  // Ethernet Tag ID (decimal). Must be 0 for Type 5 withdrawals.
  uint32 ethernet_tag = 3;
  string mac = 4;
  string ip = 5;
  string prefix = 6;
  uint32 prefix_length = 7;
}

message DeleteEvpnRouteResponse {}

// ---------------------------------------------------------------------------
// ControlService — Daemon lifecycle and health
// ---------------------------------------------------------------------------

service ControlService {
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  rpc GetHealth(HealthRequest) returns (HealthResponse);
  rpc GetMetrics(MetricsRequest) returns (MetricsResponse);
  rpc TriggerMrtDump(TriggerMrtDumpRequest) returns (TriggerMrtDumpResponse);
}

message ShutdownRequest {
  string reason = 1;
}

message ShutdownResponse {}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  uint64 uptime_seconds = 2;
  uint32 active_peers = 3;
  uint32 total_routes = 4;
}

message MetricsRequest {}

message MetricsResponse {
  string prometheus_text = 1;
}

message TriggerMrtDumpRequest {}

message TriggerMrtDumpResponse {
  string file_path = 1;
}

// ---------------------------------------------------------------------------
// EvpnService — Local EVPN instance state (Phase 2 VTEP alpha).
//
// The daemon's local EVI/VNI state is the declarative `[[evpn_instances]]`
// config plus the committed runtime model exposed by ADR-0063. Linux kernel
// reconciliation, Type 2/3 local origination, Gate 9 Type 5 / IP-VRF state,
// and Ethernet Segment actors consume the resolved tables through daemon
// actors. Runtime mutation uses the command-driven full-model
// `ApplyEvpnRuntime` coordinator, not a direct shared-table swap. The
// duplicate-MAC clear RPC is a bounded actor command against local suppression
// state, not an instance-table mutation. Empty when the daemon is acting purely
// as an EVPN route reflector — RR mode does not need local instance state.
// ---------------------------------------------------------------------------

service EvpnService {
  // ADR-0063 — read the committed EVPN runtime generation. This is
  // the read-only view of the coordinator state; this RPC does not
  // mutate the committed model.
  rpc GetEvpnRuntime(GetEvpnRuntimeRequest) returns (EvpnRuntimeState);
  rpc ListEvpnInstances(ListEvpnInstancesRequest) returns (ListEvpnInstancesResponse);
  // ADR-0059 — list the FDB nexthop groups rustbgpd currently owns
  // in the Linux dataplane reconciler. The `groups` list is empty
  // when no FDB-NHG state is installed (RR-only deployment,
  // single-homed VTEP, or every multi-homed VNI flipped to
  // `apply_aliasing_ecmp = false`) or when the dataplane actor is
  // not running. The top-level `orphan_nexthops_count`,
  // `pending_delete_count`, and `drift_recovery_disabled` fields
  // are always populated and may be non-zero / `true` even when
  // `groups` is empty.
  rpc ListEvpnNexthops(ListEvpnNexthopsRequest) returns (ListEvpnNexthopsResponse);
  // ADR-0083/0085 — list configured Ethernet Segments joined with
  // current multi-homing runtime state: composed drain reasons,
  // DF/BUM role rows, whole-port AC-gate intent, same-ESI local-bias
  // eligibility, and the owned FDB-nexthop group summary. Read-only
  // diagnose surface; mutations stay on SetEthernetSegmentDrain and
  // ApplyEvpnRuntime.
  rpc ListEthernetSegments(ListEthernetSegmentsRequest) returns (ListEthernetSegmentsResponse);
  // Gate 9 — list every `[[evpn_ip_vrfs]]` entry the daemon has
  // resolved, with the live readiness verdict from the reconcile
  // actor's most recent `probe_ip_vrfs` pass.
  rpc ListIpVrfs(ListIpVrfsRequest) returns (ListIpVrfsResponse);
  // ADR-0091 — list desired and rustbgpd-stamped managed EVPN
  // netdevs joined with the latest kernel link snapshot. This RPC is
  // read-only status; managed-netdev lifecycle execution happens in
  // the dataplane reconciler from committed config.
  rpc ListManagedNetdevs(ListManagedNetdevsRequest) returns (ListManagedNetdevsResponse);
  // Gate 9 — fetch one IP-VRF by operator-facing `name`.
  // Returns `NotFound` when the name is not in the resolved table.
  rpc GetIpVrf(GetIpVrfRequest) returns (IpVrfState);
  // RFC 7432 section 15.1 duplicate-MAC loop protection — manually
  // clear local-origin suppression for one `(VNI, MAC)`. Returns
  // `cleared = false` when no active quarantine exists. This does
  // not clear all VNIs and does not mutate the resolved EVPN
  // instance table.
  rpc ClearDuplicateMacQuarantine(ClearDuplicateMacQuarantineRequest) returns (ClearDuplicateMacQuarantineResponse);
  // ADR-0084 — manually drain (or undrain) one configured Ethernet
  // Segment before access-circuit maintenance. Draining withdraws the
  // ES's Type 4 + EAD-per-ES + EAD-per-EVI routes (exiting DF
  // election) and the local Type 2 MAC/MAC+IP routes for its member
  // VNIs, while suppressing new local-MAC originations; remote PEs'
  // single-active backup swap then repairs around this PE. Undraining
  // re-originates the ES routes, re-runs DF election, and replays the
  // cached local MAC/IP state. Drain state is runtime-only and
  // in-memory: a daemon restart clears it and replays configured
  // state. Unknown/unconfigured ESIs return NOT_FOUND; repeating the
  // current state is an idempotent no-op (`changed = false`).
  rpc SetEthernetSegmentDrain(SetEthernetSegmentDrainRequest) returns (SetEthernetSegmentDrainResponse);
  // ADR-0063 — validate or apply a full candidate EVPN runtime model
  // through the coordinator. The request carries full candidate TOML
  // so the daemon can reuse the config layer's validation and table
  // resolution. Current live shapes include single L2VNI add/delete/
  // redefine, single IP-VRF add/delete/redefine with unchanged
  // L3VNI/device/table identity, single Ethernet Segment add/delete/
  // redefine, additive build-up, atomic tenant teardown, `ip_vrf`
  // relink, and L2VNI-only mixed compositions with intrinsic IP-VRF
  // link metadata for added/deleted VNIs. L3VNI/device/table identity
  // changes are restart-required, and ES/IP-VRF row mixed edits fail
  // closed without advancing generation. Use validate_only to inspect
  // the plan without mutating.
  rpc ApplyEvpnRuntime(ApplyEvpnRuntimeRequest) returns (ApplyEvpnRuntimeResponse);
}

message GetEvpnRuntimeRequest {}

// Committed EVPN runtime generation summary (ADR-0063). Generation 1
// is the startup snapshot. Future coordinator mutations will allocate
// later generations only after validation succeeds and downstream
// actors have a converge plan.
message EvpnRuntimeState {
  uint64 generation = 1;
  EvpnRuntimeLifecycle lifecycle = 2;
  EvpnRuntimeMutationState mutation_state = 3;
  uint32 evpn_instances_count = 4;
  uint32 evpn_ip_vrfs_count = 5;
  uint32 ethernet_segments_count = 6;
  uint32 ethernet_segment_member_vnis_count = 7;
  string message = 8;
}

enum EvpnRuntimeLifecycle {
  EVPN_RUNTIME_LIFECYCLE_UNKNOWN = 0;
  EVPN_RUNTIME_LIFECYCLE_ACTIVE = 1;
  EVPN_RUNTIME_LIFECYCLE_ACTIVATING = 2;
  EVPN_RUNTIME_LIFECYCLE_DELETING = 3;
  EVPN_RUNTIME_LIFECYCLE_DEGRADED = 4;
}

enum EvpnRuntimeMutationState {
  EVPN_RUNTIME_MUTATION_UNKNOWN = 0;
  EVPN_RUNTIME_MUTATION_DISABLED = 1;
  EVPN_RUNTIME_MUTATION_IDLE = 2;
  EVPN_RUNTIME_MUTATION_IN_PROGRESS = 3;
  EVPN_RUNTIME_MUTATION_FAILED = 4;
}

message ListEvpnInstancesRequest {}

message ListEvpnInstancesResponse {
  repeated EvpnInstanceState instances = 1;
}

message ListManagedNetdevsRequest {}

message ListManagedNetdevsResponse {
  repeated ManagedNetdevState netdevs = 1;
}

enum ManagedNetdevClass {
  MANAGED_NETDEV_CLASS_UNKNOWN = 0;
  MANAGED_NETDEV_CLASS_BRIDGE = 1;
  MANAGED_NETDEV_CLASS_VXLAN = 2;
  MANAGED_NETDEV_CLASS_VRF = 3;
  MANAGED_NETDEV_CLASS_L3VXLAN = 4;
  MANAGED_NETDEV_CLASS_VLAN_UPPER = 5;
  MANAGED_NETDEV_CLASS_SVD_VXLAN = 6;
}

enum ManagedNetdevLifecycleState {
  MANAGED_NETDEV_STATE_UNKNOWN = 0;
  MANAGED_NETDEV_STATE_DESIRED_ABSENT = 1;
  MANAGED_NETDEV_STATE_OWNED_SAFE = 2;
  MANAGED_NETDEV_STATE_FOREIGN_PRESENT = 3;
  MANAGED_NETDEV_STATE_OWNED_UNSAFE = 4;
  MANAGED_NETDEV_STATE_ORPHANED = 5;
}

// One desired or observed ADR-0091 managed netdev row.
message ManagedNetdevState {
  ManagedNetdevClass class = 1;
  string name = 2;
  bool desired = 3;
  string ownership_stamp = 4;
  ManagedNetdevLifecycleState state = 5;
  string reason = 6;
  optional uint32 ifindex = 7;
  optional bool observed_vlan_filtering = 8;
  repeated string observed_stamps = 9;
  optional uint32 observed_vni = 10;
  optional string observed_local = 11;
  optional uint32 observed_dstport = 12;
  optional bool observed_learning_disabled = 13;
  optional bool observed_collect_metadata = 14;
  optional bool observed_vnifilter = 15;
  optional string observed_bridge = 16;
  optional uint32 observed_table_id = 17;
  optional bool observed_up = 18;
  optional string observed_master = 19;
  optional string observed_router_mac = 20;
  optional uint32 observed_vlan = 21;
}

message ListEvpnNexthopsRequest {}

message ListEvpnNexthopsResponse {
  // One row per rustbgpd-owned FDB nexthop group.
  repeated EvpnFdbNexthopGroup groups = 1;
  // Rustbgpd-tagged kernel nexthops discovered during startup
  // adoption / drift recovery but not currently associated with an
  // owned group. These are retained or cleaned by the reconciler
  // depending on live kernel FDB references.
  uint32 orphan_nexthops_count = 2;
  // Tagged nexthop IDs queued for retry because kernel deletion
  // failed during teardown / GC.
  uint32 pending_delete_count = 3;
  // True after steady-state RTM_GETNEXTHOP drift recovery latched off
  // due to a permanent dump failure. Normal apply paths may still
  // work; this only describes the periodic drift-recovery loop.
  bool drift_recovery_disabled = 4;
}

message EvpnFdbNexthopGroup {
  // L2VNI scoping this Linux-owned alias group.
  uint32 vni = 1;
  // Ethernet Segment Identifier in canonical colon-hex form.
  string esi = 2;
  // Ethernet Tag ID as rendered in the EVPN NLRI key.
  string ethernet_tag = 3;
  // Kernel FDB nexthop group ID (`NHG_TAG | bitmap_id`).
  uint32 group_id = 4;
  // Per-VTEP member nexthops that compose this group.
  repeated EvpnFdbNexthopMember members = 5;
  // MACs whose FDB rows point at `group_id`.
  repeated string ref_macs = 6;
}

message EvpnFdbNexthopMember {
  // Remote VTEP gateway address.
  string gateway = 1;
  // Kernel per-VTEP nexthop ID (`VTEP_NH_TAG | bitmap_id`).
  uint32 nexthop_id = 2;
}

message ListEthernetSegmentsRequest {
  // Optional ESI filter in canonical colon-hex form. Empty lists all
  // configured Ethernet Segments.
  string esi = 1;
}

message ListEthernetSegmentsResponse {
  repeated EthernetSegmentState segments = 1;
}

message EthernetSegmentState {
  // Ethernet Segment Identifier in canonical colon-hex form.
  string esi = 1;
  // Configured member VNIs, sorted ascending.
  repeated uint32 member_vnis = 2;
  // Configured redundancy mode (`all-active` or `single-active`).
  string redundancy_mode = 3;
  // Configured DF algorithm (`default-modulo`, `hrw`,
  // `highest-preference`, or `lowest-preference`).
  string df_algorithm = 4;
  // Configured DF preference value advertised for preference-based
  // DF election.
  uint32 df_preference = 5;
  // RFC 9785 Don't-Preempt bit configured for this segment.
  bool df_dont_preempt = 6;
  // Configured local Type 4 originator IP.
  string originator_ip = 7;
  // True while any drain reason is held.
  bool drained = 8;
  // Composed drain reasons (`operator`, `link`), sorted for stable
  // output. Empty when not drained.
  repeated string drain_reasons = 9;
  // Per-member live BUM/DF/bias state. A member can exist without a
  // role row during cold start or before the segment actor publishes
  // its first snapshot.
  repeated EthernetSegmentMemberState members = 10;
  // Desired whole-port AC-gate state (`blocked`, `forwarding`,
  // `mixed-roles`). Empty when the segment is all-active or lacks an
  // interface binding.
  string ac_gate_state = 11;
  // Attachment-circuit interface tied to `ac_gate_state`, when a
  // gate row exists.
  string ac_gate_interface = 12;
  // Owned FDB nexthop groups whose ESI matches this segment.
  uint32 fdb_nexthop_groups_count = 13;
  // MAC refs across those owned FDB nexthop groups.
  uint32 fdb_nexthop_ref_macs_count = 14;
}

message EthernetSegmentMemberState {
  uint32 vni = 1;
  // Local DF role (`df`, `nondf`) or empty when no role row has been
  // published yet.
  string df_role = 2;
  // Desired BUM action (`allow`, `suppress`) or empty when no role row
  // has been published yet.
  string bum_forwarding_action = 3;
  // Configured bridge for this VNI, if known.
  string bridge = 4;
  // True when ADR-0085 same-ESI local-bias suppresses remote FDB
  // programming for this `(ESI, VNI)`.
  bool same_esi_bias_eligible = 5;
}

message ListIpVrfsRequest {}

message ListIpVrfsResponse {
  repeated IpVrfState ip_vrfs = 1;
}

message IpVrfRemotePrefixDropCount {
  // Stable bounded projection reason label, e.g.
  // "unresolved_overlay_index_gateway".
  string reason = 1;
  // Current number of remote EVPN Type 5 routes for this IP-VRF
  // that were kept out of dataplane intent for `reason`.
  uint64 count = 2;
}

message GetIpVrfRequest {
  // Operator-facing handle (`name` field on `[[evpn_ip_vrfs]]`).
  string name = 1;
}

message ClearDuplicateMacQuarantineRequest {
  // L2VNI for the duplicate-MAC key.
  uint32 vni = 1;
  // MAC address in canonical colon-hex form, e.g. `aa:bb:cc:dd:ee:ff`.
  string mac = 2;
}

message ClearDuplicateMacQuarantineResponse {
  // True when an active quarantine was cleared and live local state
  // was replayed. False means the key was valid but no active
  // quarantine existed.
  bool cleared = 1;
  // Operator-facing summary of the result.
  string message = 2;
}

message SetEthernetSegmentDrainRequest {
  // Ethernet Segment Identifier in the operator text form used across
  // this proto: 10 colon-separated hex octets, e.g.
  // `00:11:22:33:44:55:66:77:88:99`.
  string esi = 1;
  // Desired drain state: true drains the segment, false undrains it.
  // This RPC adds/removes the `operator` drain reason only (ADR-0085
  // decision 2); a `link` reason held by the interface binding is
  // never overridden by this request.
  bool drained = 2;
}

message SetEthernetSegmentDrainResponse {
  // Composed drain state after the request: true while ANY drain
  // reason is held (ADR-0085 decision 2). An operator undrain against
  // a segment whose bound link is down reports drained = true.
  bool drained = 1;
  // False when the operator drain reason already matched the request
  // (idempotent no-op for this RPC's reason).
  bool changed = 2;
  // Number of member VNIs of the targeted Ethernet Segment whose
  // local Type 2 origination is governed by the drain.
  uint32 member_vni_count = 3;
  // Operator-facing summary, including the withdrawn (or
  // re-originated) route classes and any remaining drain reasons.
  string message = 4;
  // Drain reasons held after the request, as lowercase strings
  // (`operator`, `link`). Empty when the segment is not drained.
  repeated string reasons = 5;
}

message ApplyEvpnRuntimeRequest {
  // Full candidate rustbgpd TOML. This may contain credentials in
  // unrelated sections and must be redacted from audit logs.
  string candidate_toml = 1;
  // When true, validate and plan the candidate without attempting to
  // advance the committed EVPN runtime generation.
  bool validate_only = 2;
}

message ApplyEvpnRuntimeResponse {
  EvpnRuntimeApplyOutcome outcome = 1;
  EvpnRuntimeState runtime = 2;
  EvpnRuntimePlanSummary plan = 3;
  string message = 4;
}

enum EvpnRuntimeApplyOutcome {
  EVPN_RUNTIME_APPLY_UNKNOWN = 0;
  EVPN_RUNTIME_APPLY_VALIDATED = 1;
  EVPN_RUNTIME_APPLY_NOOP = 2;
  EVPN_RUNTIME_APPLY_COMMITTED = 3;
}

message EvpnRuntimePlanSummary {
  uint64 current_generation = 1;
  uint64 proposed_generation = 2;
  EvpnRuntimeChangeSummary evpn_instances = 3;
  EvpnRuntimeChangeSummary evpn_ip_vrfs = 4;
  EvpnRuntimeChangeSummary ethernet_segments = 5;
  // True when the L2VNI->IP-VRF link references changed (an `ip_vrf` relink).
  // A pure relink leaves every row changeset empty, so this is the only field
  // that signals the apply was not a no-op.
  bool ip_vrf_references_changed = 6;
}

message EvpnRuntimeChangeSummary {
  repeated string added = 1;
  repeated string deleted = 2;
  repeated string redefined = 3;
  repeated string unchanged = 4;
}

// One installed IP-VRF (Gate 9, ADR-0058). Joins the resolved
// `[[evpn_ip_vrfs]]` config with the live readiness verdict from the
// Linux dataplane reconciler's most recent pass. The readiness
// fields are populated from the same probe surface
// `crates/evpn-linux::Dataplane::probe_ip_vrfs` returns.
message IpVrfState {
  // Operator-facing handle.
  string name = 1;
  // L3VNI (RFC 9136 §4.4.2 symmetric Interface-less IRB).
  uint32 vni = 2;
  // Route Distinguisher in canonical textual form (RFC 4364 §4.2).
  string rd = 3;
  // Bidirectional Route Targets (import + export).
  repeated string route_targets = 4;
  // VXLAN tunnel source IP for outbound Type 5 NEXT_HOP.
  string local_vtep_ip = 5;
  // Router MAC value advertised via the RFC 9135 §4.2 Router MAC
  // extended community.
  string router_mac = 6;
  // Linux VRF device name (operator-managed, observe-only).
  string vrf_device = 7;
  // Linux L3 VXLAN device name (operator-managed, observe-only).
  string l3vxlan_device = 8;
  // VRF route table id, cross-checked against `vrf_device`.
  uint32 table_id = 9;
  // Live readiness state from the most recent reconcile pass.
  IpVrfReadinessState readiness_state = 10;
  // Populated when `readiness_state == READY` — kernel ifindex of
  // the VRF master device (`IFLA_VRF_TABLE` already cross-checked
  // against the configured `table_id`).
  uint32 vrf_ifindex = 11;
  // Populated when `readiness_state == READY` — kernel ifindex of
  // the L3 VXLAN device.
  uint32 l3vxlan_ifindex = 12;
  // Populated when `readiness_state == NOT_READY`. One human-readable
  // line per failing predicate from ADR-0058 §3.
  repeated string not_ready_reasons = 13;
  // Locally-originated EVPN Type 5 routes for this IP-VRF (Gate 9
  // slice 6b). Bumped on every `RibUpdate::InjectEvpn` the RIB
  // accepts; decremented on `WithdrawEvpn`. Eventually consistent:
  // the originator drives the count toward zero whenever the IP-VRF
  // is NotReady, but during a Ready→NotReady transition (and
  // especially while the originator is retrying a rejected
  // withdraw) the value can still be non-zero alongside
  // `readiness_state = NOT_READY`. Treat it as the originator's
  // last-known view of the RIB, not as a synchronous mirror of
  // `readiness_state`.
  uint32 originated_routes_count = 14;
  // Remote EVPN Type 5 routes currently installed in this IP-VRF's
  // kernel route table (Gate 9 slice 6c). Updated on every
  // reconcile pass from the L3 reconciler's owned-set bookkeeping.
  // Eventually consistent with `readiness_state`: a Ready→NotReady
  // transition drains the count on the next reconcile pass, but
  // during that pass (or while retrying a rejected withdraw) the
  // value can be non-zero alongside NOT_READY.
  uint32 installed_routes_count = 15;
  // Current bounded receive-side projection drops for remote EVPN
  // Type 5 routes scoped to this IP-VRF. Reasons reuse the stable
  // labels exported by the Prometheus
  // `evpn_ip_vrf_remote_prefix_drops{vrf,reason}` gauge; per-route
  // values such as prefixes, gateways, next-hops, MACs, RDs, and RTs
  // are intentionally omitted.
  repeated IpVrfRemotePrefixDropCount remote_prefix_drop_counts = 16;
}

// Coarse readiness verdict for an IP-VRF. The detailed predicate
// failures are surfaced as `not_ready_reasons` on `IpVrfState`.
enum IpVrfReadinessState {
  // No probe verdict is on file yet. The two real cases:
  // (a) cold start — the daemon-side snapshot reader has not yet
  // received its first `DataplaneReport` (e.g., the gRPC handler
  // ran before the first reconcile pass), or
  // (b) RR-only / dataplane-disabled deployments where no reconcile
  // actor is running. Netlink dump failures synthesize
  // `IP_VRF_READINESS_NOT_READY` with a concrete reason, not
  // `UNKNOWN`.
  IP_VRF_READINESS_UNKNOWN = 0;
  // All seven ADR-0058 §3 predicates hold.
  IP_VRF_READINESS_READY = 1;
  // At least one predicate failed. See `not_ready_reasons`.
  IP_VRF_READINESS_NOT_READY = 2;
}

// Coarse readiness verdict for a local L2 EVPN instance. The daemon
// derives this from the Linux dataplane reconciler's latest
// `instance_status` report when one exists. Bound instances with no
// report yet surface as UNKNOWN; unbound instances are UNBOUND even
// before the reconciler reports.
enum EvpnInstanceReadinessState {
  // No dataplane verdict is on file for this bound instance yet. The
  // usual cases are cold start before the first reconcile report, or
  // RR-only / dataplane-disabled deployments where no reconciler is
  // running. Probe failures report NOT_READY with a reason instead.
  EVPN_INSTANCE_READINESS_UNKNOWN = 0;
  // The ADR-0054 L2 bridge/VXLAN readiness predicates hold.
  EVPN_INSTANCE_READINESS_READY = 1;
  // At least one L2 readiness predicate failed. See
  // `not_ready_reason`.
  EVPN_INSTANCE_READINESS_NOT_READY = 2;
  // The instance has no bridge binding and is intentionally outside
  // the local Linux dataplane.
  EVPN_INSTANCE_READINESS_UNBOUND = 3;
}

// One installed local EVPN instance. Mirrors the shape of the
// `[[evpn_instances]]` TOML block but rendered through the same
// resolution pass that validates uniqueness and parses RD/RT, then
// joined with the latest L2 dataplane readiness report when present.
// A listed instance is always one the daemon would actually act on.
message EvpnInstanceState {
  // 24-bit VNI (RFC 8365 §5).
  uint32 vni = 1;
  // Route Distinguisher in canonical textual form (RFC 4364 §4.2).
  string rd = 2;
  // Bidirectional Route Targets — RFC 4360 §4 / RFC 5668 §2 textual form.
  repeated string route_targets = 3;
  // VXLAN tunnel source IP for this EVI.
  string local_vtep_ip = 4;
  // Optional Linux bridge name. Empty string when unset (proto3 has no
  // bare `optional` for strings without explicit `optional` keyword;
  // empty == not configured).
  string bridge = 5;
  // RFC 9135 §6.1 SVI MAC origination flag. When `true`, the daemon's
  // SVI task originates a Type 2 for the bridge link-layer address
  // (captured from the Linux dataplane) on instance-Ready and
  // withdraws on `Ready → NotReady` or bridge MAC drift.
  bool advertise_svi_mac = 6;
  // Number of MAC-only Type 2 routes currently locally originated by
  // this daemon for the instance and accepted by the RIB.
  uint64 originated_local_macs_count = 7;
  // Live L2 dataplane readiness from the most recent reconcile pass,
  // or UNKNOWN when no bound-instance report is available yet.
  EvpnInstanceReadinessState readiness_state = 8;
  // Populated when `readiness_state == NOT_READY`. Human-readable
  // diagnostic from the L2 readiness probe, such as a missing bridge
  // or unsupported VLAN-aware bridge.
  string not_ready_reason = 9;
  // Optional local Linux bridge VLAN selector (`1..=4094`) configured
  // by `[[evpn_instances]].bridge_vlan`. This is a dataplane
  // attribution key only; EVPN Ethernet Tag ID remains zero in the
  // ADR-0089 v1 service model.
  optional uint32 bridge_vlan = 10;
}
