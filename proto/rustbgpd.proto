service PolicyService {
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  rpc SetPolicy(SetPolicyRequest) returns (SetPolicyResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
  rpc ListNeighborSets(ListNeighborSetsRequest) returns (ListNeighborSetsResponse);
  rpc GetNeighborSet(GetNeighborSetRequest) returns (GetNeighborSetResponse);
  rpc SetNeighborSet(SetNeighborSetRequest) returns (SetNeighborSetResponse);
  rpc DeleteNeighborSet(DeleteNeighborSetRequest) returns (DeleteNeighborSetResponse);
  rpc GetGlobalPolicyChains(GetGlobalPolicyChainsRequest) returns (GlobalPolicyChains);
  rpc SetGlobalImportChain(SetGlobalImportChainRequest) returns (SetGlobalImportChainResponse);
  rpc SetGlobalExportChain(SetGlobalExportChainRequest) returns (SetGlobalExportChainResponse);
  rpc ClearGlobalImportChain(ClearGlobalImportChainRequest) returns (ClearGlobalImportChainResponse);
  rpc ClearGlobalExportChain(ClearGlobalExportChainRequest) returns (ClearGlobalExportChainResponse);
  rpc GetNeighborPolicyChains(GetNeighborPolicyChainsRequest) returns (NeighborPolicyChains);
  rpc SetNeighborImportChain(SetNeighborImportChainRequest) returns (SetNeighborImportChainResponse);
  rpc SetNeighborExportChain(SetNeighborExportChainRequest) returns (SetNeighborExportChainResponse);
  rpc ClearNeighborImportChain(ClearNeighborImportChainRequest) returns (ClearNeighborImportChainResponse);
  rpc ClearNeighborExportChain(ClearNeighborExportChainRequest) returns (ClearNeighborExportChainResponse);

  // ExplainImportPolicy — answer "why didn't this prefix come in?"
  // (or "what did the chain do to this one when it did?") from the
  // per-session import-decision cache populated at the transport
  // eval site. The cache is bounded, process-local, and resets on
  // peer session reset — see ADR-0073 ("Import policy explain via
  // per-session decision cache") for the contract, including the
  // "not durable event history" scope and the operator-facing knob
  // [policy.explain] cache_size.
  //
  // Side-effect free read. Does not touch RIB, does not increment
  // any policy counter, does not log a new policy decision. A live
  // session that misses the bounded read deadline returns
  // DEADLINE_EXCEEDED rather than NO_SESSION.
  rpc ExplainImportPolicy(ExplainImportPolicyRequest) returns (ExplainImportPolicyResponse);

  // ListRejectedRoutes — the looking-glass filtered-route surface
  // (LAN-472): every rejected inbound route the peer's session has
  // retained, tagged with its canonical reject-reason token. The
  // enumeration complement to ExplainImportPolicy's point lookup —
  // "show me everything of mine you filtered, and why" without
  // knowing a prefix in advance. Backs `rbgp rib received <peer>
  // --rejected` and Alice-LG-style member-support views.
  //
  // Retention is bounded per peer ([policy.reject_retention]
  // capacity, LRU on rejection recency) and covers unicast only,
  // matching the v1 ExplainImportPolicy scope. Returns NOT_FOUND
  // when the peer has no live session (the session-local store is
  // gone, honestly distinct from "nothing rejected").
  //
  // Side-effect free read. Does not touch RIB, does not increment
  // any policy counter, does not log a new policy decision. A live
  // session that misses the bounded read deadline returns
  // DEADLINE_EXCEEDED rather than NOT_FOUND.
  rpc ListRejectedRoutes(ListRejectedRoutesRequest) returns (ListRejectedRoutesResponse);

  // TestPolicy — dry-run a candidate .rpol policy against a snapshot
  // of the live RIB (ADR-0096 Decision 6). The daemon compiles the
  // submitted source server-side (compile diagnostics are returned in
  // the response instead of routes), snapshots matching routes through
  // the existing RIB query machinery, evaluates the selected policy
  // read-only, and reports accepted / rejected / modified counts,
  // per-term hit counters, and up to show_changes before/after
  // attribute diffs.
  //
  // Side-effect free: no route state is touched, no session is
  // affected, no policy counters increment. V1 scope is IPv4 / IPv6
  // unicast routes.
  rpc TestPolicy(TestPolicyRequest) returns (TestPolicyResponse);

  // GetPolicyStats — live per-term guard-hit counters for installed
  // policy chains (ADR-0096 Decision 3.3, the IOS-XR "show pcl" idea).
  // Counters accumulate on the live evaluation path since a chain
  // instance was installed and reset when the chain is replaced
  // (policy reload / hot-apply installs a fresh instance). Export
  // chains are read from the RIB manager; import chains are read from
  // selected live session tasks. A session with no installed import
  // chain contributes no row. A bounded session-read timeout returns
  // DEADLINE_EXCEEDED; a selected session that exits during the query
  // returns UNAVAILABLE. An explicit address that does not resolve to
  // one unique managed static or accepted dynamic peer returns
  // NOT_FOUND.
  //
  // Side-effect free read; does not reset any counter. Explain queries
  // and TestPolicy dry runs never move these counters either — only
  // live route evaluation counts.
  rpc GetPolicyStats(GetPolicyStatsRequest) returns (GetPolicyStatsResponse);
}

