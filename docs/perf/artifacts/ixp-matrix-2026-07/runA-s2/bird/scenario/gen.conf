# IXP-matrix policy generation - generated by gen-bird-scenario.py.
# member_in rejects one out-of-table prefix (192.0.2.0/24): content-real,
# output-neutral. member_out tags every advertised route with the generation
# community; the harness tracks it to timestamp reload completion.
filter member_in {
    if net = 192.0.2.0/24 then reject;
    accept;
}

filter member_out {
    bgp_community.add((65500, 1000));
    accept;
}
