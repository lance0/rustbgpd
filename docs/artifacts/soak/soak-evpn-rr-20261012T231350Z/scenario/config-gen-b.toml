# reload-stall iBGP route-reflector scenario — generated by gen-scenario.py.
# Stock daemon config: worker_threads unset => min(CPU, 8), matching the
# receipt. Start load-gated (1-min loadavg < 2.0), --release.

config_epoch = 2

[global]
asn = 64512
router_id = "10.0.0.1"
cluster_id = "10.0.0.1"
ebgp_requires_policy = true
listen_port = 1790
runtime_state_dir = "/tmp/evrr.1iuazB"

[global.telemetry]
log_format = "json"
prometheus_addr = "127.0.0.1:9179"

[global.telemetry.grpc_uds]
path = "/tmp/evrr.1iuazB/grpc.sock"

[[neighbors]]
address = "127.1.0.1"
remote_asn = 64512
route_reflector_client = true
families = ["l2vpn_evpn"]
hold_time = 180
