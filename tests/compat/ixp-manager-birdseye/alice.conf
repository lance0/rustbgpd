[server]
listen_http = 0.0.0.0:7340
http_timeout = 15
enable_prefix_lookup = true
routes_store_refresh_interval = 1
neighbors_store_refresh_interval = 1
enable_metrics = false
asn = 65001

[pagination]
routes_filtered_page_size = 100
routes_accepted_page_size = 100
routes_not_exported_page_size = 100

[rejection_reasons]
64496:65520:0 = Unrecognized rejection reason
64496:65520:1 = Denied by import policy
64496:65520:2 = Only-to-Customer role leak
64496:65520:3 = NEXT_HOP is not the peer address
64496:65520:4 = Receiver AS appears in AS_PATH
64496:65520:5 = Route-reflection loop
64496:65520:6 = Malformed attribute treatment

[noexport]
load_on_demand = true

[noexport_reasons]
64496:65521:0 = Unrecognized export suppression
64496:65521:1 = Route originated from the target peer
64496:65521:2 = Route-reflection rules
64496:65521:3 = Address family not negotiated
64496:65521:4 = Long-lived stale route
64496:65521:5 = Outbound route filter
64496:65521:6 = RT membership
64496:65521:7 = Denied by export policy

[rpki]
enabled = true
invalid = 65001:1000:4-*

[source.rs0]
name = rustbgpd contract route server
group = rustbgpd-contract

[source.rs0.birdwatcher]
api = http://198.51.100.1:__ADAPTER_PORT__
type = single_table
main_table4 = master4
main_table6 = master6
