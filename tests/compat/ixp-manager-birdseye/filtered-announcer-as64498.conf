# Live-only fifth member for the populated Alice-LG filtered-route proof.
# There is deliberately no BIRD/oracle neighbor: the four-peer oracle and its
# captures remain frozen before this runtime-only session is introduced.
# Both routes are rejected for different reasons: the first carries the
# receiver AS in its path, the second is denied by the member's import
# policy (rendered in run-oracle-leg.sh).
neighbor 198.51.100.1 {
    router-id 198.51.100.6;
    local-address 198.51.100.6;
    local-as 64498;
    peer-as 65001;
    passive true;
    family {
        ipv4 unicast;
    }
    static {
        route 198.18.0.0/24 {
            next-hop 198.51.100.6;
            origin igp;
            as-path [ 64498 65001 ];
        }
        route 198.18.1.0/24 {
            next-hop 198.51.100.6;
            origin igp;
            as-path [ 64498 ];
        }
    }
}
