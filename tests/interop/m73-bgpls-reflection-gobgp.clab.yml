# Containerlab topology: GoBGP source ↔ rustbgpd RR ↔ GoBGP sink
# (M73 — BGP-LS reflection / withdraw receipt)
#
# Validates: rustbgpd reflects an RFC 9552 BGP-LS Node NLRI learned from one
# negotiated iBGP RR client to another negotiated iBGP RR client, preserves the
# opaque BGP-LS Attribute payload, and withdraws it cleanly.
#
# Usage:
#   docker build --target dev -t rustbgpd:dev .
#   docker build -t gobgp:bgpls -f tests/interop/Dockerfile.gobgp-bgpls tests/interop
#   containerlab deploy -t tests/interop/m73-bgpls-reflection-gobgp.clab.yml
#   bash tests/interop/scripts/test-m73-bgpls-reflection-gobgp.sh
#   containerlab destroy -t tests/interop/m73-bgpls-reflection-gobgp.clab.yml

name: m73-bgpls-reflection-gobgp

topology:
  nodes:
    rustbgpd:
      kind: linux
      image: rustbgpd:dev
      cmd: sleep infinity
      binds:
        - ./configs/rustbgpd-m73-bgpls-rr.toml:/etc/rustbgpd/config.toml:ro
        - ./scripts/start-rustbgpd.sh:/usr/local/bin/start-rustbgpd.sh:ro
      exec:
        - ip addr add 10.0.0.1/24 dev eth1
        - ip link set eth1 up
        - ip addr add 10.0.1.1/24 dev eth2
        - ip link set eth2 up
      env:
        RUST_LOG: info

    gobgp-src:
      kind: linux
      image: gobgp:bgpls
      cmd: sleep infinity
      binds:
        - ./configs/gobgp-m73-src.toml:/config/gobgp.toml:ro
      exec:
        - ip addr add 10.0.0.2/24 dev eth1
        - ip link set eth1 up

    gobgp-sink:
      kind: linux
      image: gobgp:bgpls
      cmd: sleep infinity
      binds:
        - ./configs/gobgp-m73-sink.toml:/config/gobgp.toml:ro
      exec:
        - ip addr add 10.0.1.2/24 dev eth1
        - ip link set eth1 up

  links:
    - endpoints: ["rustbgpd:eth1", "gobgp-src:eth1"]
    - endpoints: ["rustbgpd:eth2", "gobgp-sink:eth1"]
