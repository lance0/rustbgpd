# FastNetMon Community configuration for M126. Options left out keep the
# binary's defaults.

logging_level = info
# No usage reports from the lab.
disable_usage_report = on

# Detection: incoming packets per second on the mirror interface.
enable_ban = on
enable_ban_ipv6 = on
process_incoming_traffic = on
process_outgoing_traffic = off
networks_list_path = /etc/networks_list
white_list_path = /etc/networks_whitelist
check_period = 1
average_calculation_time = 5
enable_connection_tracking = off
ban_for_pps = on
ban_for_bandwidth = off
ban_for_flows = off
threshold_pps = 1000

# A short ban, kept alive while the replay runs. The unban watchdog wakes
# every ban_time / 2 seconds.
ban_time = 20
unban_only_if_attack_finished = on

mirror_afpacket = on
interfaces = fnmmirror1

# GoBGP action. FastNetMon dials localhost:50051, where
# rustbgpd-gobgp-bridge listens. 0.0.0.0 is the shipped IPv4 default and means
# next-hop self; :: does the same for IPv6 (the shipped IPv6 default is
# 100::1).
gobgp = on
gobgp_next_hop = 0.0.0.0
gobgp_next_hop_ipv6 = ::
gobgp_announce_host = on
gobgp_announce_whole_subnet = off
gobgp_community_host = 65535:666
gobgp_announce_host_ipv6 = on
gobgp_announce_whole_subnet_ipv6 = off
gobgp_community_host_ipv6 = 65535:666

enable_api = off
prometheus = off
