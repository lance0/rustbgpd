# Containerlab topology: 2-PE rustbgpd Ethernet Segment running the
# RFC 8584 §3.2 Highest Random Weight (HRW) DF algorithm (M46 — Gate 8
# HRW smoke).
#
# Two rustbgpd PEs share the same ESI for VNI 10 and peer iBGP
# L2VPN/EVPN, both configured `df_algorithm = "highest-random-weight"`.
# The HRW weights for (ESI 00:..:01, VNI 10) elect the HIGHER-IP PE
# (PE2, 10.0.0.2) as DF. Default service carving would instead elect
# PE1 (`10 mod 2` = slot 0 → lower IP). So asserting PE2 is the DF
# proves the HRW algorithm — negotiated over the DF Election Extended
# Community on Type 4 ES routes — is actually running, not modulo.
#
# Asserts (see scripts/test-m46-evpn-df-hrw.sh):
#   1. Both peers reach Established and exchange both Type 4 ES candidates.
#   2. PE2 reports `evpn_df_role{...,role="df"} 1` (the HRW winner).
#   3. PE1 reports `evpn_df_role{...,role="nondf"} 1` (loser under HRW,
#      where modulo would have made it DF).
#   4. After PE2 (the DF) shuts down, PE1 promotes to DF and
#      `evpn_df_role_changes_total{...}` increments.
#
# Topology:
#   PE1 (10.0.0.1, AS 65000) ── iBGP L2VPN/EVPN ── PE2 (10.0.0.2, AS 65000)
#
# Control-plane focused (Type 4 visibility + Prometheus surface); the
# minimal startup script creates br10 so the EVPN instance reaches
# Ready. No VXLAN data-plane forwarding.
#
# Usage:
#   docker build --target dev -t rustbgpd:dev .
#   sudo containerlab deploy -t tests/interop/m46-evpn-df-hrw.clab.yml
#   bash tests/interop/scripts/test-m46-evpn-df-hrw.sh
#   sudo containerlab destroy -t tests/interop/m46-evpn-df-hrw.clab.yml

name: m46-evpn-df-hrw

topology:
  nodes:
    pe1:
      kind: linux
      image: rustbgpd:dev
      cmd: sleep infinity
      binds:
        - ./configs/rustbgpd-m46-pe1.toml:/etc/rustbgpd/config.toml:ro
        - ./scripts/start-rustbgpd-segment.sh:/usr/local/bin/start-rustbgpd-segment.sh:ro
      exec:
        - ip addr add 10.0.0.1/24 dev eth1
        - ip link set eth1 up
        - /usr/local/bin/start-rustbgpd-segment.sh 10
      env:
        RUST_LOG: info,rustbgpd::evpn_segment=debug,rustbgpd_evpn::df_election=debug

    pe2:
      kind: linux
      image: rustbgpd:dev
      cmd: sleep infinity
      binds:
        - ./configs/rustbgpd-m46-pe2.toml:/etc/rustbgpd/config.toml:ro
        - ./scripts/start-rustbgpd-segment.sh:/usr/local/bin/start-rustbgpd-segment.sh:ro
      exec:
        - ip addr add 10.0.0.2/24 dev eth1
        - ip link set eth1 up
        - /usr/local/bin/start-rustbgpd-segment.sh 10
      env:
        RUST_LOG: info,rustbgpd::evpn_segment=debug,rustbgpd_evpn::df_election=debug

  links:
    - endpoints: ["pe1:eth1", "pe2:eth1"]
