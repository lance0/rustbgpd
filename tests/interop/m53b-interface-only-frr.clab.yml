# Containerlab topology: rustbgpd ↔ 2× FRR (M53b — interface-only neighbors)
#
# Validates RA-discovered IPv6 link-local / BGP unnumbered interop against FRR:
#
#   * no IPv4 addresses on the fabric links;
#   * rustbgpd discovers two FRR interface neighbors over fe80::/10 only;
#   * IPv4 routes are exchanged using RFC 8950 Extended Next Hop;
#   * link-local next-hops carry their output interface scope into the FIB;
#   * Linux installs two-way ECMP via the discovered link-local addresses;
#   * carrier loss removes the failed leg and restoration recovers ECMP;
#   * a lab-owned bridge on eth2 permits a third RA source without host links.
#
# Usage:
#   docker build --target dev -t rustbgpd:dev .
#   containerlab deploy -t tests/interop/m53b-interface-only-frr.clab.yml
#   bash tests/interop/scripts/test-m53b-interface-only-frr.sh
#   containerlab destroy -t tests/interop/m53b-interface-only-frr.clab.yml --cleanup

name: m53b-interface-only-frr

topology:
  nodes:
    rustbgpd:
      kind: linux
      image: rustbgpd:dev
      cmd: sleep infinity
      binds:
        - ./configs/rustbgpd-m53b-interface-only.toml:/etc/rustbgpd/config.toml:ro
        - ../fixtures/grpc-test-only-operator.token:/run/rustbgpd/grpc-test-only-operator.token:ro
        - ./scripts/start-rustbgpd.sh:/usr/local/bin/start-rustbgpd.sh:ro
      exec:
        - ip -4 addr flush dev eth1
        - ip -4 addr flush dev eth2
        - ip link set eth1 addrgenmode eui64
        - ip link set eth2 addrgenmode eui64
        - ip link set eth1 up
        - ip link set eth2 up
      env:
        RUST_LOG: info,rustbgpd::ra_discovery=debug

    frr1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      binds:
        - ./configs/frr-daemons:/etc/frr/daemons:ro
        - ./configs/frr-bgpd-m53b-1.conf:/etc/frr/frr.conf:ro
        - /dev/null:/etc/frr/vtysh.conf:ro
      exec:
        - ip -4 addr flush dev eth1
        - ip link set eth1 addrgenmode eui64
        - ip link set eth1 up

    frr2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      binds:
        - ./configs/frr-daemons:/etc/frr/daemons:ro
        - ./configs/frr-bgpd-m53b-2.conf:/etc/frr/frr.conf:ro
        - /dev/null:/etc/frr/vtysh.conf:ro
      exec:
        - ip -4 addr flush dev eth1
        - ip link set eth1 addrgenmode eui64
        - ip link set eth1 up

    switch:
      kind: linux
      image: rustbgpd:dev
      cmd: sleep infinity

    rogue:
      kind: linux
      image: rustbgpd:dev
      cmd: sleep infinity
      exec:
        - ip -4 addr flush dev eth1
        - ip link set eth1 addrgenmode eui64
        - ip link set eth1 up

  links:
    - endpoints: ["rustbgpd:eth1", "frr1:eth1"]
    - endpoints: ["rustbgpd:eth2", "switch:eth1"]
    - endpoints: ["frr2:eth1", "switch:eth2"]
    - endpoints: ["rogue:eth1", "switch:eth3"]
