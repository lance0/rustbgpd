# Containerlab topology: rustbgpd ↔ FRR
# (M35c — RFC 8326 Graceful Shutdown on EVPN outbound updates)
#
# Validates that the runtime SetGracefulShutdown toggle attaches and
# clears the GRACEFUL_SHUTDOWN community on L2VPN/EVPN MP_REACH
# advertisements. M35 covers IPv4 unicast; M35b covers FlowSpec; this
# pins the EVPN-specific outbound emission path.
#
# Usage:
#   containerlab deploy -t tests/interop/m35c-graceful-shutdown-evpn-frr.clab.yml
#   bash tests/interop/scripts/test-m35c-graceful-shutdown-evpn-frr.sh
#   containerlab destroy -t tests/interop/m35c-graceful-shutdown-evpn-frr.clab.yml --cleanup

name: m35c-graceful-shutdown-evpn-frr

topology:
  nodes:
    rustbgpd:
      kind: linux
      image: rustbgpd:dev
      cmd: sleep infinity
      binds:
        - ./configs/rustbgpd-m35c-graceful-shutdown-evpn.toml:/etc/rustbgpd/config.toml:ro
        - ./scripts/start-rustbgpd.sh:/usr/local/bin/start-rustbgpd.sh:ro
      exec:
        - ip addr add 10.0.0.1/24 dev eth1
        - ip link set eth1 up
      env:
        RUST_LOG: info

    frr:
      kind: linux
      image: quay.io/frrouting/frr:10.3.1
      binds:
        - ./configs/frr-daemons:/etc/frr/daemons:ro
        - ./configs/frr-bgpd-m35c-graceful-shutdown-evpn.conf:/etc/frr/frr.conf:ro
      exec:
        - ip addr add 10.0.0.2/24 dev eth1
        - ip link set eth1 up

  links:
    - endpoints: ["rustbgpd:eth1", "frr:eth1"]

# Network: 10.0.0.0/24 — rustbgpd (10.0.0.1, AS 65001) ↔ FRR (10.0.0.2, AS 65002)
