frr version 10.3.1
frr defaults traditional
hostname frr-m89-source-a
log stdout informational

router bgp 65002
 bgp router-id 10.89.1.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.89.1.1 remote-as 65001
 neighbor 10.89.1.1 timers 30 90
 no neighbor 10.89.1.1 enforce-first-as
 !
 address-family ipv4 unicast
  network 192.0.2.89/32
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 10.89.1.1 activate
  network 2001:db8:89::/48
 exit-address-family
!
