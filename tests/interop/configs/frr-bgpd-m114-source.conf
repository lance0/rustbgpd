frr defaults traditional
hostname frr-m114-source
log stdout informational

router bgp 65002
 bgp router-id 10.114.0.2
 no bgp ebgp-requires-policy
 neighbor 10.114.0.1 remote-as 65001
 neighbor 10.114.0.1 description rustbgpd-m114
 neighbor 10.114.0.1 timers 30 90
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  network 198.51.101.0/24
 exit-address-family
!
ip route 198.51.100.0/24 blackhole
ip route 198.51.101.0/24 blackhole
!
