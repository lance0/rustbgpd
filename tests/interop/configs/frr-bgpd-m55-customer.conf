frr version 10.3.1
frr defaults traditional
hostname frr-customer-m55
log stdout informational

router bgp 65002
 bgp router-id 10.55.1.2
 no bgp ebgp-requires-policy
 neighbor 10.55.1.1 remote-as 65001
 neighbor 10.55.1.1 description rustbgpd-provider
 neighbor 10.55.1.1 timers 30 90
 neighbor 10.55.1.1 local-role customer
 !
 address-family ipv4 unicast
 exit-address-family
!
