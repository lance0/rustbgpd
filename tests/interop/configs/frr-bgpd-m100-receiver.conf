frr version 10.3.1
frr defaults traditional
hostname frr-m100
log stdout informational

router bgp 65005
 bgp router-id 10.105.0.5
 bgp ebgp-requires-policy
 neighbor 10.105.0.10 remote-as 64512
 neighbor 10.105.0.10 description m100-source
 neighbor 10.105.0.10 timers 30 90
 no neighbor 10.105.0.10 enforce-first-as
 neighbor 10.105.0.10 local-role rs-server strict-mode
 neighbor 10.105.0.11 remote-as 64513
 neighbor 10.105.0.11 description m100-observer
 neighbor 10.105.0.11 timers 30 90
 no neighbor 10.105.0.11 enforce-first-as
 neighbor 10.105.0.11 local-role rs-server strict-mode
 !
 address-family ipv4 unicast
  neighbor 10.105.0.10 route-server-client
  neighbor 10.105.0.10 route-map M100-PERMIT in
  neighbor 10.105.0.10 route-map M100-PERMIT out
  neighbor 10.105.0.11 route-server-client
  neighbor 10.105.0.11 route-map M100-PERMIT in
  neighbor 10.105.0.11 route-map M100-PERMIT out
 exit-address-family
!
route-map M100-PERMIT permit 10
!
