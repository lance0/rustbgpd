# M67 PE1 (rustbgpd) — preferred-DF member of the single-active
# Ethernet Segment under ADR-0085 link-driven drain test. RFC 9785
# highest-preference election with df_preference 200 (> pe2's 100)
# makes this PE the deterministic DF. Unlike M66, the segment binds
# its attachment circuit: `interface = "eth2"` (the CE-facing AC)
# with a short, testable `recovery_delay_secs = 5`, so the driver's
# `ip link set eth2 down` inside this container — not an RPC — is
# the drain stimulus, and carrier return is held off 5 s before
# origination resumes (ADR-0085 decisions 1–3).
#
# gRPC runs ADR-0064 `enforcement = "tier"` with two principals (M66
# shape) so the driver can compose the ADR-0084 operator drain with
# the link reason via rbgp: the TCP listener authenticates the
# operator via bearer token; the UDS listener is the observer.
#
# This file is bind-mounted as a read-only TEMPLATE; the start script
# copies it to /etc/rustbgpd/config.toml (M58 pattern, shared with
# M66 — M67 never edits it, but the start script is common).
[global]
asn = 65000
router_id = "10.0.1.2"
listen_port = 179

[global.telemetry]
log_format = "json"
prometheus_addr = "0.0.0.0:9179"

[global.telemetry.grpc_tcp]
address = "0.0.0.0:50051"
token_file = "/etc/rustbgpd/grpc-operator.token"
principal = "rustbgpd://operator/ci"

[global.telemetry.grpc_uds]
path = "/var/lib/rustbgpd/grpc-observer.sock"
principal = "rustbgpd://observer/ci"

[security.grpc.roles]
"rustbgpd://operator/ci" = "operator"
"rustbgpd://observer/ci" = "observer"

[[evpn_instances]]
vni = 100
rd = "10.0.1.2:100"
route_targets = ["65000:100"]
local_vtep_ip = "10.0.1.2"
bridge = "br100"
advertise_svi_mac = false

[[ethernet_segments]]
esi = "00:00:00:00:00:00:00:00:00:01"
member_vnis = [100]
df_preference = 200
df_algorithm = "highest-preference"
redundancy_mode = "single-active"
originator_ip = "10.0.1.2"
# ADR-0085 binding: eth2 is the CE-facing attachment circuit the
# start script enslaves to br100. Carrier loss drains the ES
# immediately; recovery holds 5 s (short so the driver can observe
# the hold-off without slowing the job).
interface = "eth2"
recovery_delay_secs = 5

[[neighbors]]
address = "10.0.1.1"
remote_asn = 65000
description = "vtep-rr"
hold_time = 30
families = ["l2vpn_evpn"]
