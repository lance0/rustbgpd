# M102 — OpenBGPD 9.2 route-server member (AS 4200000201).

AS 4200000201
router-id 10.102.1.2
fib-update no

neighbor 10.102.1.1 {
	descr "rustbgpd-rs"
	remote-as 4200000102
	local-address 10.102.1.2
	local-address 2001:db8:102:1::2
	holdtime 90
	announce IPv4 unicast enforce
	announce IPv6 unicast enforce
	announce policy enforce
	announce as-4byte enforce
	enforce neighbor-as no
	role rs-client
}

allow to any set { community 64512:102, large-community 4200000201:102:1 }
allow from any
