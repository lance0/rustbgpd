# Soak variant of the M3 injection config. Single IPv4 eBGP peer
# (FRR receiver). gRPC injection path is exercised by the soak
# harness via rbgp rib add / rib delete.
[global]
asn = 65001
router_id = "10.0.0.1"
listen_port = 179

[global.telemetry]
prometheus_addr = "0.0.0.0:9179"
log_format = "json"

# No gRPC listener: the soak's rbgp rib add/delete calls run inside the
# container and use the implicit owner-only UDS socket (local-operator).

[[neighbors]]
address = "10.0.0.2"
remote_asn = 65002
description = "frr-soak-inject"
hold_time = 90
