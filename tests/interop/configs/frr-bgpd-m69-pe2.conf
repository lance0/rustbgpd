!
! M69 PE2: FRR higher-preference side of a cross-vendor
! preference-DF smoke against rustbgpd.
!
frr version 10.3.1
frr defaults traditional
hostname pe2
log stdout
no ipv6 forwarding
!
! The esdummy bond is created by start-frr-vtep-mh.sh. The script also
! reapplies this interface stanza after creation to avoid the FRR
! startup race documented by the existing M32 harness.
interface esdummy
 evpn mh es-id 1
 evpn mh es-sys-mac aa:bb:cc:dd:ee:ff
 evpn mh es-df-pref 200
!
router bgp 65000
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 timers 30 90
 !
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
  advertise-all-vni
 exit-address-family
!
end
