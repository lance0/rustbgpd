!
! M68: PE2 (FRR, router-id 10.0.0.2) — consume-side proof for
! rustbgpd-originated GW-IP overlay-index Type 5 routes.
!
! FRR must import both:
!   - L2VNI 10 Type 2 MAC/IP routes (RT 65000:10), which name the
!     Gateway Address host.
!   - L3VNI 100 Type 5 routes (RT 65000:100), which carry that Gateway
!     Address and are resolved by `enable-resolve-overlay-index`.
!
frr version 10.3.1
frr defaults traditional
hostname pe2
log stdout
no ipv6 forwarding
!
vrf vrf1
 vni 100
 exit-vrf
!
router bgp 65000
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 timers 30 90
 !
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
  advertise-all-vni
  enable-resolve-overlay-index
  vni 10
   rd 65000:10
   route-target import 65000:10
   route-target export 65000:10
  exit-vni
 exit-address-family
!
router bgp 65000 vrf vrf1
 bgp router-id 10.0.0.2
 !
 address-family ipv4 unicast
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  rd 65000:100
  route-target both 65000:100
 exit-address-family
!
end
