[global]
asn = 65001
router_id = "10.115.0.1"
listen_port = 179

[global.telemetry]
prometheus_addr = "0.0.0.0:9179"
log_format = "json"

[global.telemetry.grpc_tcp]
address = "0.0.0.0:50051"
token_file = "/run/rustbgpd/grpc-test-only-operator.token"
principal = "rustbgpd://operator/test-only"

# Predicate selecting the controlled (payload) route. Its default deny keeps
# every other route, including the control prefix, outside the definition.
[policy.definitions.m115-payload]
default_action = "deny"

[[policy.definitions.m115-payload.statements]]
prefix = "198.51.100.0/24"
action = "permit"

# Backup semantics: advertise the payload only while the condition is absent.
# The condition is a prefix range, so frr-a's 192.0.2.0/24 counts as one /24
# inside 192.0.0.0/16; the payload and the control fall outside it.
[policy.conditional_advertisements.m115-backup]
advertise_policy = "m115-payload"
advertise_if = "absent"
condition_prefixes = [{ prefix = "192.0.0.0/16", ge = 24, le = 24 }]
settle_time = 2

# Source of the condition, the payload and the control.
[[neighbors]]
address = "10.115.0.2"
remote_asn = 65002
description = "frr-m115-a"
hold_time = 90

# Receiver with the definition attached.
[[neighbors]]
address = "10.115.1.2"
remote_asn = 65003
description = "frr-m115-b"
hold_time = 90
conditional_advertisements = ["m115-backup"]

[security.grpc]
enforcement = "tier"

[security.grpc.roles]
"rustbgpd://operator/test-only" = "operator"
