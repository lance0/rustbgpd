frr version 10.3.1
frr defaults traditional
hostname frr-m83
log stdout informational

router bgp 65003
 bgp router-id 10.83.3.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.83.3.1 remote-as 65500
 neighbor 10.83.3.1 description rustbgpd-rs
 neighbor 10.83.3.1 timers 30 90
 no neighbor 10.83.3.1 enforce-first-as
 neighbor 10.83.3.1 local-role rs-client
 !
 address-family ipv4 unicast
  network 100.67.0.0/24
  network 100.68.0.0/24
  network 100.70.0.0/24
 exit-address-family
!
