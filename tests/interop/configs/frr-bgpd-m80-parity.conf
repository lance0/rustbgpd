frr version 10.3.1
frr defaults traditional
hostname frr-m80-parity
log stdout informational

! Parity mirror (AS 65011). RPOL-IN / RPOL-OUT express the SAME
! intent as rustbgpd's customer-in / edge-out rpol policies
! (rustbgpd-m80-policy.rpol) as classic FRR route-maps. The M80
! script asserts route-for-route agreement between the two engines.
router bgp 65011
 bgp router-id 10.0.2.1
 no bgp ebgp-requires-policy
 neighbor 10.0.2.2 remote-as 65002
 neighbor 10.0.2.2 description frr-src-m80
 neighbor 10.0.2.2 timers 30 90
 neighbor 10.0.3.2 remote-as 65003
 neighbor 10.0.3.2 description frr-down-m80
 neighbor 10.0.3.2 timers 30 90
 !
 address-family ipv4 unicast
  neighbor 10.0.2.2 route-map RPOL-IN in
  ! Nothing back toward the source — keeps src's table (and through
  ! it, rustbgpd's) free of parity-echo paths.
  neighbor 10.0.2.2 route-map DENY-ALL out
  neighbor 10.0.3.2 route-map RPOL-OUT out
 exit-address-family
 !
 ! The same route-maps applied in the v6 AF — the family-discriminated
 ! entries (32/34 in, 15 out) are what rpol expresses as route.family.
 address-family ipv6 unicast
  neighbor 10.0.2.2 activate
  neighbor 10.0.3.2 activate
  neighbor 10.0.2.2 route-map RPOL-IN in
  neighbor 10.0.2.2 route-map DENY-ALL out
  neighbor 10.0.3.2 route-map RPOL-OUT out
 exit-address-family
!
! rpol: prefix-set customers { 10.10.0.0/16 ge 24 le 26, 192.168.1.0/24 }
ip prefix-list CUSTOMERS seq 5 permit 10.10.0.0/16 ge 24 le 26
ip prefix-list CUSTOMERS seq 10 permit 192.168.1.0/24
!
ip prefix-list NO-LEAK seq 5 permit 198.51.100.0/24
!
! rpol: community-set tagged { 65000:100, 65000:200 }
bgp community-list standard TAGGED seq 5 permit 65000:100
bgp community-list standard TAGGED seq 10 permit 65000:200
! rpol: community-set scrub-marks { 65000:666 }
bgp community-list standard SCRUB-MARKS seq 5 permit 65000:666
!
! rpol: term transit-guard (as-path regex reject)
bgp as-path access-list TRANSIT seq 5 permit _65500_
!
! rpol: asn-set partners { 64999 } probed by route.origin-as — the
! classic route-map spelling is an anchored as-path regex.
bgp as-path access-list PARTNERS seq 5 permit _64999$
!
! Family discriminators: rpol's `route.family == ipv4-unicast` /
! `== ipv6-unicast` have no direct route-map keyword; the classic
! spelling is an any-prefix match of the wanted family (a v4
! prefix-list entry never matches a v6 route and vice versa).
ip prefix-list ANY-V4 seq 5 permit 0.0.0.0/0 le 32
ipv6 prefix-list ANY-V6 seq 5 permit ::/0 le 128
!
! rpol policy customer-in(200), term for term:
route-map RPOL-IN deny 10
 match as-path TRANSIT
!
! term med-scrub: modify-and-continue
route-map RPOL-IN permit 20
 match community SCRUB-MARKS
 set metric 0
 set comm-list SCRUB-MARKS delete
 on-match next
!
! term customer-routes
route-map RPOL-IN permit 30
 match ip address prefix-list CUSTOMERS
 match community TAGGED
 set local-preference 200
 set community 65001:999 additive
!
! term partner-v4 (route.family == ipv4-unicast && route.origin-as in partners)
route-map RPOL-IN permit 32
 match as-path PARTNERS
 match ip address prefix-list ANY-V4
 set local-preference 210
 set community 65001:604 additive
!
! term partner-v6 (route.family == ipv6-unicast && route.origin-as in partners)
route-map RPOL-IN permit 34
 match as-path PARTNERS
 match ipv6 address prefix-list ANY-V6
 set local-preference 220
 set community 65001:606 additive
!
! term default-accept
route-map RPOL-IN permit 40
!
! rpol policy edge-out, term for term:
route-map RPOL-OUT deny 10
 match ip address prefix-list NO-LEAK
!
! term med-v6 (route.family == ipv6-unicast)
route-map RPOL-OUT permit 15
 match ipv6 address prefix-list ANY-V6
 set metric 60
 set community 65001:777 additive
!
route-map RPOL-OUT permit 20
 set metric 50
 set community 65001:777 additive
!
route-map DENY-ALL deny 10
!
