# Soak variant of the M16 GR + LLGR config. Mirrors
# rustbgpd-m16-llgr.toml but lives at a distinct bind path so the
# soak topology (soak-gr-restart) does not collide with a hosted CI
# run of the M16 interop smoke.
[global]
asn = 65001
router_id = "10.0.0.1"
listen_port = 179

[global.telemetry]
prometheus_addr = "0.0.0.0:9179"
log_format = "json"

[global.telemetry.grpc_tcp]
address = "0.0.0.0:50051"

[[neighbors]]
address = "10.0.0.2"
remote_asn = 65002
description = "frr-soak-gr-restart"
hold_time = 30
graceful_restart = true
gr_restart_time = 15
gr_stale_routes_time = 20
llgr_stale_time = 60

# Legacy: the GR-restart soak observes via Prometheus and FRR only, with no gRPC client or token.
[security.grpc]
enforcement = "legacy"
