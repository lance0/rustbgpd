config_epoch = 2

[global]
asn = 65001
router_id = "10.112.0.1"
listen_port = 179
cluster_id = "10.112.0.1"
ebgp_requires_policy = true

[global.telemetry]
prometheus_addr = "0.0.0.0:9179"
log_format = "json"

[global.telemetry.grpc_tcp]
address = "0.0.0.0:50051"
token_file = "/run/rustbgpd/grpc-test-only-operator.token"
principal = "rustbgpd://operator/test-only"

[[neighbors]]
address = "2001:db8:112:10::2"
remote_asn = 65001
description = "srv6-l2-controlled-source"
hold_time = 90
route_reflector_client = true
families = ["l2vpn_evpn"]

[[neighbors]]
address = "2001:db8:112:20::2"
remote_asn = 65001
description = "srv6-l2-gobgp-observer"
hold_time = 90
route_reflector_client = true
families = ["l2vpn_evpn"]

[security.grpc]
enforcement = "tier"

[security.grpc.roles]
"rustbgpd://operator/test-only" = "operator"
