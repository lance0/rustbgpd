!
! M117: FRR 10.7.1 VTEP peering with the rustbgpd VTEP at 10.0.117.1
! over iBGP. `advertise-all-vni` makes zebra originate Type 2 / Type 3
! for br117 / vxlan117 and build its own flood list from rustbgpd's
! IMET; no static flood rows on either side.
!
frr version 10.7.1
frr defaults traditional
hostname m117-frr
log stdout
no ipv6 forwarding
!
router bgp 65000
 bgp router-id 10.0.117.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.117.1 remote-as 65000
 neighbor 10.0.117.1 timers 10 30
 !
 address-family l2vpn evpn
  neighbor 10.0.117.1 activate
  advertise-all-vni
 exit-address-family
!
end
