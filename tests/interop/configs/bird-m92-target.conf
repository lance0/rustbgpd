# M92 independent target/control. Both route servers use AS64496 but
# never peer with each other; distinct protocol names keep their
# Adj-RIB-In inventories independently queryable.
log stderr all;
router id 192.0.2.11;

protocol device { scan time 10; }

protocol bgp incumbent {
  local 192.0.2.11 as 64510;
  neighbor 192.0.2.10 as 64496;
  local role rs_client;
  enforce first as off;
  graceful restart on;
  graceful restart time 30;
  ipv4 { import all; export none; };
  ipv6 { import all; export none; };
}

protocol bgp candidate {
  local 192.0.2.11 as 64510;
  neighbor 192.0.2.9 as 64496;
  local role rs_client;
  enforce first as off;
  graceful restart on;
  graceful restart time 30;
  ipv4 { import all; export none; };
  ipv6 { import all; export none; };
}
