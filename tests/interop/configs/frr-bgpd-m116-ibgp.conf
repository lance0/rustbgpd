frr defaults traditional
hostname frr-m116-ibgp
log stdout informational

router bgp 65001
 bgp router-id 10.116.1.2
 no bgp ebgp-requires-policy
 neighbor 10.116.1.1 remote-as 65001
 neighbor 10.116.1.1 description rustbgpd-m116
 neighbor 10.116.1.1 timers 30 90
 !
 address-family ipv6 unicast
  neighbor 10.116.1.1 activate
  ! Keep the pre-policy Adj-RIB-In so `received-routes` shows the wire next hop.
  neighbor 10.116.1.1 soft-reconfiguration inbound
 exit-address-family
!
