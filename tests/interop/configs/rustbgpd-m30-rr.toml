# M30 interop: rustbgpd as EVPN RR between two FRR VTEPs
[global]
asn = 65000
router_id = "10.0.0.1"
listen_port = 179
cluster_id = "10.0.0.100"

[global.telemetry]
prometheus_addr = "0.0.0.0:9179"
log_format = "json"

[global.telemetry.grpc_tcp]
address = "0.0.0.0:50051"

[[neighbors]]
address = "10.0.0.2"
remote_asn = 65000
description = "vtep-a"
hold_time = 180
families = ["l2vpn_evpn"]
route_reflector_client = true

[[neighbors]]
address = "10.0.1.2"
remote_asn = 65000
description = "vtep-b"
hold_time = 180
families = ["l2vpn_evpn"]
route_reflector_client = true
