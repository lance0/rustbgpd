frr version 10.3.1
frr defaults traditional
hostname frr-norole-m55
log stdout informational

router bgp 65006
 bgp router-id 10.55.5.2
 no bgp ebgp-requires-policy
 neighbor 10.55.5.1 remote-as 65001
 neighbor 10.55.5.1 description rustbgpd-strict-role
 neighbor 10.55.5.1 timers 30 90
 !
 address-family ipv4 unicast
 exit-address-family
!
