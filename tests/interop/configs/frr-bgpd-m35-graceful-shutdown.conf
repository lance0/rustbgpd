frr version 10.3.1
frr defaults traditional
hostname frr-m35
log stdout informational

! RFC 8326 well-known community
bgp community-list standard GSHUT permit 65535:0

! Outbound route-map: tag 192.168.1.0/24 with GRACEFUL_SHUTDOWN, leave
! 192.168.2.0/24 untagged. The receiver-leg test asserts rustbgpd's
! implicit head-of-import-chain rule honors it (local_pref = 0 on the
! tagged prefix, default local_pref on the untagged one).
ip prefix-list GSHUT-TAGGED permit 192.168.1.0/24
!
route-map TO-RUSTBGPD permit 10
 match ip address prefix-list GSHUT-TAGGED
 set community 65535:0 additive
route-map TO-RUSTBGPD permit 20

router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 description rustbgpd-m35
 neighbor 10.0.0.1 timers 30 90
 !
 address-family ipv4 unicast
  network 192.168.1.0/24
  network 192.168.2.0/24
  neighbor 10.0.0.1 route-map TO-RUSTBGPD out
  ! Track communities on inbound so the initiator-leg test can read
  ! them via `show ip bgp <prefix>`.
  neighbor 10.0.0.1 send-community
 exit-address-family
!
ip route 192.168.1.0/24 10.0.0.2
ip route 192.168.2.0/24 10.0.0.2
!
