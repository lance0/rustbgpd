# M94 — a high-ASN route server between two RFC 6793 OLD speakers.

[global]
asn = 4200000094
router_id = "10.94.0.1"
listen_port = 179

[global.telemetry]
log_format = "json"

[global.telemetry.grpc_tcp]
address = "0.0.0.0:50051"
token_file = "/run/rustbgpd/grpc-test-only-operator.token"
principal = "rustbgpd://operator/test-only"

[policy.reject_retention]
enabled = true
capacity = 16

[[neighbors]]
address = "10.94.0.2"
remote_asn = 65094
description = "M94 OLD ExaBGP source"
route_server_client = true

[[neighbors]]
address = "10.94.1.3"
remote_asn = 65095
description = "M94 independent OLD-speaker sink"
route_server_client = true

[security.grpc]
enforcement = "tier"

[security.grpc.roles]
"rustbgpd://operator/test-only" = "operator"
