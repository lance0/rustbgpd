[global]
asn = 65001
router_id = "10.0.0.1"
listen_port = 179

[global.telemetry]
prometheus_addr = "0.0.0.0:9179"
log_format = "json"

[global.telemetry.grpc_tcp]
address = "0.0.0.0:50051"
token_file = "/run/rustbgpd/grpc-test-only-operator.token"
principal = "rustbgpd://operator/test-only"

# Peer A: TCP MD5 authentication
[[neighbors]]
address = "10.0.0.2"
remote_asn = 65002
description = "frr-a-md5"
hold_time = 90
md5_password = "interop-secret-m25"

# Peer B: GTSM / TTL security
[[neighbors]]
address = "10.0.1.2"
remote_asn = 65003
description = "frr-b-gtsm"
hold_time = 90
ttl_security = true

# Peer C has no static neighbor. FRR-C must active-open into this dynamic
# range; the accepted IPv6 socket inherits both transport protections.
[peer_groups.ipv6-dynamic-auth]
hold_time = 90
md5_password = "interop-secret-m25-v6"
ttl_security = true
families = ["ipv6_unicast"]
disable_ipv4_unicast = true

[[dynamic_neighbors]]
prefix = "2001:db8:25::/64"
peer_group = "ipv6-dynamic-auth"
remote_asn = 65004
description = "frr-c-ipv6-dynamic-md5-gtsm"

[security.grpc]
enforcement = "tier"

[security.grpc.roles]
"rustbgpd://operator/test-only" = "operator"
