# M94 source: suppress capability 65 so this is an RFC 6793 OLD session.
# rustbgpd's high local ASN is represented by AS_TRANS in its OPEN.
process m94-capture {
    run /usr/local/bin/python3 /usr/local/bin/m94_capture.py;
    encoder json;
}

neighbor 10.94.2.1 {
    router-id 10.94.0.2;
    local-address 10.94.2.2;
    local-as 65094;
    peer-as 23456;
    hold-time 90;

    family {
        ipv4 unicast;
    }

    capability {
        asn4 disable;
    }

    api {
        processes [ m94-capture ];
    }

    static {
        route 203.0.113.94/32 {
            next-hop 10.94.0.2;
            as-path [ 65010 4200000094 ];
        }
        route 203.0.113.95/32 {
            next-hop 10.94.0.2;
            as-path [ 65010 4200000194 ];
            aggregator 4200000294:10.94.0.2;
        }
    }
}
