!
! M30b: VTEP-A (router-id 10.0.0.2) — EVPN Type 5 origination
!
! Two BGP instances:
!   - global (router bgp 65000): the iBGP L2VPN/EVPN session toward
!     the route reflector at 10.0.0.1.
!   - per-VRF (router bgp 65000 vrf vrf1): the VRF that owns L3VNI
!     100; its `address-family l2vpn evpn` block exports the VRF's
!     IPv4 RIB as Type 5 NLRIs via `advertise ipv4 unicast`.
!
! The kernel VRF + L3VNI + bridge + SVI + VXLAN are set up by
! /usr/local/bin/start-frr-vtep-l3.sh before frr.service starts.
! The tenant prefix 192.0.2.1/32 lives on lo-vrf1 (created by that
! script); `redistribute connected` picks it up and the per-VRF
! L2VPN/EVPN block re-originates it as Type 5 with explicit RD and RT.
!
frr version 10.3.1
frr defaults traditional
hostname vtep-a
log stdout
no ipv6 forwarding
!
vrf vrf1
 vni 100
 exit-vrf
!
router bgp 65000
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 timers 30 90
 !
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65000 vrf vrf1
 bgp router-id 10.0.0.2
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  rd 65000:100
  route-target both 65000:100
 exit-address-family
!
end
