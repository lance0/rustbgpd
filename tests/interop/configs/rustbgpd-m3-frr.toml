[global]
asn = 65001
router_id = "10.0.0.1"
listen_port = 179

[global.telemetry]
prometheus_addr = "0.0.0.0:9179"
log_format = "json"

[global.telemetry.grpc_tcp]
address = "0.0.0.0:50051"
token_file = "/run/rustbgpd/grpc-test-only-operator.token"
principal = "rustbgpd://operator/test-only"

[[neighbors]]
address = "10.0.0.2"
remote_asn = 65002
description = "frr-a"
hold_time = 90

[[neighbors]]
address = "10.0.1.2"
remote_asn = 65003
description = "frr-b"
hold_time = 90

# iBGP receiver for the next-hop-self injection test. IPv6 unicast runs over
# IPv4 transport with no local_ipv6_nexthop, so an injected IPv6 route with
# next hop :: has no self address here and is refused, not sent with ::.
[[neighbors]]
address = "10.0.2.2"
remote_asn = 65001
description = "frr-c"
hold_time = 90
families = ["ipv4_unicast", "ipv6_unicast"]

[security.grpc]
enforcement = "tier"

[security.grpc.roles]
"rustbgpd://operator/test-only" = "operator"
