# M32 interop: rustbgpd as EVPN RR for a 3-VTEP multi-homing test
[global]
asn = 65000
router_id = "10.0.0.1"
listen_port = 179
cluster_id = "10.0.0.100"

[global.telemetry]
prometheus_addr = "0.0.0.0:9179"
log_format = "json"

[global.telemetry.grpc_tcp]
address = "0.0.0.0:50051"
token_file = "/run/rustbgpd/grpc-test-only-operator.token"
principal = "rustbgpd://operator/test-only"

[[neighbors]]
address = "10.0.0.2"
remote_asn = 65000
description = "vtep-a-es1"
hold_time = 180
families = ["l2vpn_evpn"]
route_reflector_client = true

[[neighbors]]
address = "10.0.1.2"
remote_asn = 65000
description = "vtep-b-observer"
hold_time = 180
families = ["l2vpn_evpn"]
route_reflector_client = true

[[neighbors]]
address = "10.0.2.2"
remote_asn = 65000
description = "vtep-c-es1"
hold_time = 180
families = ["l2vpn_evpn"]
route_reflector_client = true

[security.grpc]
enforcement = "tier"

[security.grpc.roles]
"rustbgpd://operator/test-only" = "operator"
