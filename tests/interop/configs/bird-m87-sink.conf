# M87 — BIRD 2.0.12 route-server member and independent wire receiver.
#
# Extended Messages are explicitly disabled, pinning the negotiated maximum
# at RFC 4271's 4,096 bytes.  Transparent route-server exports retain the
# GoBGP member's first AS and next hop, so first-AS enforcement is disabled
# and the source subnet is resolved recursively through the route server.

log stderr all;
router id 10.87.2.2;

protocol device {
  scan time 10;
}

protocol static igp4 {
  ipv4;
  route 10.87.1.0/24 via 10.87.2.1;
}

protocol bgp routeserver {
  local 10.87.2.2 as 65003;
  neighbor 10.87.2.1 as 65500;
  hold time 90;
  enable extended messages off;
  enforce first as off;

  ipv4 {
    gateway recursive;
    import all;
    export none;
  };
}
