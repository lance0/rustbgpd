[global.config]
as = 65001
router-id = "10.0.0.2"

# Linkstate-only source, peered with BOTH RRs so both LSDBs hold the full
# square (a non-client inter-RR session would not reflect BGP-LS across).
[[neighbors]]
[neighbors.config]
neighbor-address = "10.0.0.1"
peer-as = 65001
description = "rustbgpd-rr1"

[[neighbors.afi-safis]]
[neighbors.afi-safis.config]
afi-safi-name = "ls"

[[neighbors]]
[neighbors.config]
neighbor-address = "10.0.5.1"
peer-as = 65001
description = "rustbgpd-rr2"

[[neighbors.afi-safis]]
[neighbors.afi-safis.config]
afi-safi-name = "ls"
