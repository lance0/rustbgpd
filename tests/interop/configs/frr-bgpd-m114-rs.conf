frr defaults traditional
hostname frr-m114-rs
log stdout informational

router bgp 65003
 bgp router-id 10.114.2.2
 no bgp ebgp-requires-policy
 neighbor 10.114.2.1 remote-as 65001
 neighbor 10.114.2.1 description rustbgpd-m114-rs
 neighbor 10.114.2.1 timers 30 90
 ! A transparent route server does not prepend its ASN, so relayed routes
 ! begin with the source's AS 65002. FRR enforces first-AS per neighbor by
 ! default and would treat them as withdrawn.
 no neighbor 10.114.2.1 enforce-first-as
 !
 address-family ipv4 unicast
  neighbor 10.114.2.1 soft-reconfiguration inbound
 exit-address-family
!
