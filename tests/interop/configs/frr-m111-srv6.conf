frr defaults traditional
hostname srv6-source
log stdout informational
!
segment-routing
 srv6
  locators
   locator srv6-proof
    prefix 2001:db8:111:1::/64 block-len 40 node-len 24 func-bits 16
   exit
  exit
 exit
exit
!
router bgp 65001
 bgp router-id 10.111.0.2
 no bgp default ipv4-unicast
 neighbor 2001:db8:111:10::1 remote-as 65001
 neighbor 2001:db8:111:10::1 timers 3 90
 neighbor 2001:db8:111:10::1 timers connect 1
 neighbor 2001:db8:111:10::1 update-source 2001:db8:111:10::2
 neighbor 2001:db8:111:10::1 capability extended-nexthop
 address-family ipv4 vpn
  neighbor 2001:db8:111:10::1 activate
 exit-address-family
 address-family ipv6 vpn
  neighbor 2001:db8:111:10::1 activate
 exit-address-family
 segment-routing srv6
  locator srv6-proof
 exit
exit
!
router bgp 65001 vrf vrf111
 bgp router-id 10.111.0.2
 address-family ipv4 unicast
  network 198.51.111.0/24
  sid vpn export auto
  rd vpn export 65001:111
  rt vpn export 65001:111
  export vpn
 exit-address-family
 address-family ipv6 unicast
  network 2001:db8:111:1000::/64
  sid vpn export auto
  rd vpn export 65001:111
  rt vpn export 65001:111
  export vpn
 exit-address-family
exit
