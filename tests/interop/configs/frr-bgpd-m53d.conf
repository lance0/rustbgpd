frr version 10.7.1
frr defaults traditional
hostname frr-m53d
log stdout informational

! One router on two parallel links. Both interfaces share a MAC address and
! therefore one EUI-64 link-local address, which FRR's Router Advertisements
! carry on both links.
router bgp 65002
 bgp router-id 10.53.0.2
 no bgp ebgp-requires-policy
 neighbor eth1 interface v6only remote-as external
 neighbor eth1 capability extended-nexthop
 neighbor eth2 interface v6only remote-as external
 neighbor eth2 capability extended-nexthop
 !
 address-family ipv4 unicast
  network 198.51.100.53/32
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor eth1 activate
  neighbor eth2 activate
 exit-address-family
!
ip route 198.51.100.53/32 Null0
