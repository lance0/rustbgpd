frr defaults traditional
hostname frr-m3-c
log stdout informational

router bgp 65001
 bgp router-id 10.0.2.2
 no bgp ebgp-requires-policy
 neighbor 10.0.2.1 remote-as 65001
 neighbor 10.0.2.1 description rustbgpd-m3
 neighbor 10.0.2.1 timers 30 90
 !
 address-family ipv4 unicast
  ! Keep the pre-policy Adj-RIB-In so `received-routes` shows the wire next hop.
  neighbor 10.0.2.1 soft-reconfiguration inbound
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 10.0.2.1 activate
  neighbor 10.0.2.1 soft-reconfiguration inbound
 exit-address-family
!
