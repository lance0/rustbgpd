# M85 — BIRD 2 RR client 2 (AS 65001, 10.85.2.2). Advertises one v4 and
# one v6 prefix to the rustbgpd RR.
#
# GR shape: BIRD's DEFAULT `graceful restart aware` (nothing configured)
# — BIRD still sends the GR capability, but with restart time 0 and NO
# address families. The driver kills this client and asserts the RR does
# NOT stale-preserve its routes (no AF was advertised as preserved), the
# withdraw propagating to the other clients immediately.

log stderr all;
router id 10.85.2.2;

protocol device {
  scan time 10;
}

protocol static statics4 {
  ipv4;
  route 100.85.2.0/24 blackhole;
}

protocol static statics6 {
  ipv6;
  route 2001:db8:852::/48 blackhole;
}

protocol static igp4 {
  ipv4;
  route 10.85.1.0/24 via 10.85.2.1;
  route 10.85.3.0/24 via 10.85.2.1;
}

protocol static igp6 {
  ipv6;
  route 2001:db8:85:1::/64 via 2001:db8:85:2::1;
  route 2001:db8:85:3::/64 via 2001:db8:85:2::1;
}

protocol bgp reflector {
  local 10.85.2.2 as 65001;
  neighbor 10.85.2.1 as 65001;
  hold time 90;

  ipv4 {
    import all;
    export filter {
      if source != RTS_STATIC then reject;
      if net ~ [ 10.85.0.0/16+ ] then reject;
      accept;
    };
  };

  ipv6 {
    import all;
    export filter {
      if source != RTS_STATIC then reject;
      if net ~ [ 2001:db8:85::/48+ ] then reject;
      accept;
    };
  };
}
