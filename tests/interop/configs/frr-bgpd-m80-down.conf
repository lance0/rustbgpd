frr version 10.3.1
frr defaults traditional
hostname frr-m80-down
log stdout informational

! Downstream comparator (AS 65003). Receives the exported routes
! from BOTH rustbgpd (rpol edge-out) and the parity node (route-map
! RPOL-OUT); the script asserts the two paths per prefix carry the
! same MED and communities. Also announces 10.10.3.0/24 tagged
! 65000:100 so rustbgpd's customer-in(300) instantiation (vs the src
! peer's customer-in(200)) is observable.
router bgp 65003
 bgp router-id 10.0.1.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.0.1.1 remote-as 65001
 neighbor 10.0.1.1 description rustbgpd-m80
 neighbor 10.0.1.1 timers 30 90
 neighbor 10.0.3.1 remote-as 65011
 neighbor 10.0.3.1 description frr-parity-m80
 neighbor 10.0.3.1 timers 30 90
 !
 address-family ipv4 unicast
  network 10.10.3.0/24 route-map ORIG-CUSTOMER
  ! Stub discipline: advertise only the locally-originated prefix.
  ! Without this, down would re-advertise rustbgpd's exports to
  ! parity (and vice versa), polluting the parity comparison with
  ! echo paths.
  neighbor 10.0.1.1 route-map OWN-ONLY out
  neighbor 10.0.3.1 route-map OWN-ONLY out
 exit-address-family
 !
 ! v6 receiver only — OWN-ONLY's v4-only match denies every v6 route
 ! outbound, so down stays a pure comparator for the v6 exports.
 address-family ipv6 unicast
  neighbor 10.0.1.1 activate
  neighbor 10.0.3.1 activate
  neighbor 10.0.1.1 route-map OWN-ONLY out
  neighbor 10.0.3.1 route-map OWN-ONLY out
 exit-address-family
!
ip prefix-list OWN seq 5 permit 10.10.3.0/24
!
route-map OWN-ONLY permit 10
 match ip address prefix-list OWN
!
route-map ORIG-CUSTOMER permit 10
 set community 65000:100
!
