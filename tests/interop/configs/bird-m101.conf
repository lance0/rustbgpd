# M101: BIRD 3.3.2 route-server member and real-wire malformed type-40
# originator. The custom attribute is deliberately limited to IPv4 unicast.

log stderr all;
router id 10.101.1.2;

# BIRD emits unknown locally-originated attributes as optional, transitive,
# partial bytestrings. `hex:00` therefore has the exact tuple e0 28 01 00.
attribute bgp 40 bytestring m101_bad;

protocol device {
  scan time 10;
}

# Kept separate so the driver can withdraw the malformed announcement
# deterministically without disturbing the policy-control prefixes.
protocol static malformed_probe {
  ipv4;
  route 198.51.100.0/24 blackhole;
}

protocol static policy_probes {
  ipv4;
  route 198.51.101.0/24 blackhole;
  route 198.51.102.0/24 blackhole;
  route 198.51.103.0/24 blackhole;
}

# The transparent route server preserves BIRD's NEXT_HOP toward FRR.
protocol static member_glue {
  ipv4;
  route 10.101.2.0/24 via 10.101.1.1;
}

protocol bgp routeserver {
  local 10.101.1.2 as 65001;
  neighbor 10.101.1.1 as 65500;
  hold time 90;
  local role rs_client;
  enforce first as off;

  ipv4 {
    gateway recursive;
    import all;
    export filter {
      if source != RTS_STATIC then reject;
      if net ~ [ 10.101.0.0/16+ ] then reject;

      if net = 198.51.100.0/24 then {
        m101_bad = hex:00;
        bgp_community.add((65001,101));
        bgp_large_community.add((65001,101,40));
      }
      if net = 198.51.101.0/24 then bgp_community.add((65001,201));
      if net = 198.51.102.0/24 then bgp_community.add((65001,202));
      if net = 198.51.103.0/24 then bgp_community.add((65001,203));
      accept;
    };
  };
}
