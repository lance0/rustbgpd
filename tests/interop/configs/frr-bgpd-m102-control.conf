frr version 10.3.1
frr defaults traditional
hostname frr-m102
log stdout informational

router bgp 4200000202
 bgp router-id 10.102.2.2
 bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.102.2.1 remote-as 4200000102
 neighbor 10.102.2.1 description rustbgpd-rs
 neighbor 10.102.2.1 timers 30 90
 no neighbor 10.102.2.1 enforce-first-as
 neighbor 10.102.2.1 local-role rs-client
 !
 address-family ipv4 unicast
  network 198.18.102.0/24 route-map M102-ORIGIN
  neighbor 10.102.2.1 route-map M102-PERMIT in
  neighbor 10.102.2.1 route-map M102-PERMIT out
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 10.102.2.1 activate
  network 2001:db8:2102::/48 route-map M102-ORIGIN
  neighbor 10.102.2.1 route-map M102-PERMIT in
  neighbor 10.102.2.1 route-map M102-PERMIT out
 exit-address-family
!
route-map M102-ORIGIN permit 10
 set community 64512:202 additive
 set large-community 4200000202:102:1 additive
!
route-map M102-PERMIT permit 10
!
