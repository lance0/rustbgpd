frr defaults traditional
hostname frr-m115-b
log stdout informational

router bgp 65003
 bgp router-id 10.115.1.2
 no bgp ebgp-requires-policy
 neighbor 10.115.1.1 remote-as 65001
 neighbor 10.115.1.1 description rustbgpd-m115
 neighbor 10.115.1.1 timers 30 90
 !
 address-family ipv4 unicast
  ! Keep the pre-policy Adj-RIB-In so `received-routes` shows the wire next hop.
  neighbor 10.115.1.1 soft-reconfiguration inbound
 exit-address-family
!
