!
! M40: pe-a (router-id 10.0.0.2) — FRR VTEP, shared ES1 with pe-c.
!
! Single iBGP session to rustbgpd (10.0.0.1). pe-a learns the
! tester-injected MAC locally on `esdummy` and originates a Type 2
! with ESI=ES1. rustbgpd resolves the alias set via pe-c's
! EAD-per-EVI and installs an FDB nexthop group.
!
frr version 10.3.1
frr defaults traditional
hostname pe-a
log stdout
no ipv6 forwarding
!
! The esdummy interface is created by start-frr-vtep-mh.sh as a
! bond with one dummy slave and enslaved to br100 (FRR EVPN-MH
! requires a bond as the ES carrier — see start-frr-vtep-mh.sh
! header comment for the rationale).
interface esdummy
 evpn mh es-id 1
 evpn mh es-sys-mac aa:bb:cc:dd:ee:ff
!
router bgp 65000
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 timers 30 90
 !
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
  advertise-all-vni
 exit-address-family
!
end
