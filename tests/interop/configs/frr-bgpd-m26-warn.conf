frr version 10.3.1
frr defaults traditional
hostname frr-m26-warn
log stdout informational

router bgp 65004
 bgp router-id 10.0.2.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.0.2.1 remote-as 65001
 neighbor 10.0.2.1 description rustbgpd-m26-warn
 neighbor 10.0.2.1 timers 30 90
 !
 address-family ipv4 unicast
  network 172.17.1.0/24
  network 172.17.2.0/24
 exit-address-family
!
