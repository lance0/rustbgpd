frr version 10.3.1
frr defaults traditional
hostname frr-m84
log stdout informational

! M84 probe prefixes — each cache's data becomes observable through a
! route validation state on the rustbgpd side:
!   203.0.113.0/24  — VRP at routinator (AS65003)   → valid
!   198.51.100.0/24 — VRP at stayrtr (AS65003)      → valid
!   192.0.2.0/24    — VRP at rtr-v2 says AS65999    → invalid
!   198.18.9.0/24   — VRP appears in rtr-v2 phase 2, vanishes after
!                     the phase-5 serial regression
!   198.18.4.0/24   — prepend 65004 → AS_PATH [65003, 65004]; the
!                     rtr-v2 ASPA record for customer 65004 drives
!                     aspaState valid → invalid → unknown

ip prefix-list PFX-ASPA seq 10 permit 198.18.4.0/24

route-map M84-OUT permit 10
 match ip address prefix-list PFX-ASPA
 set as-path prepend 65004
!
route-map M84-OUT permit 100
!

router bgp 65003
 bgp router-id 10.84.0.2
 no bgp ebgp-requires-policy
 neighbor 10.84.0.1 remote-as 65001
 neighbor 10.84.0.1 description rustbgpd-m84
 neighbor 10.84.0.1 timers 30 90
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  network 198.51.100.0/24
  network 192.0.2.0/24
  network 198.18.9.0/24
  network 198.18.4.0/24
  neighbor 10.84.0.1 route-map M84-OUT out
 exit-address-family
!
ip route 203.0.113.0/24 10.84.0.2
ip route 198.51.100.0/24 10.84.0.2
ip route 192.0.2.0/24 10.84.0.2
ip route 198.18.9.0/24 10.84.0.2
ip route 198.18.4.0/24 10.84.0.2
!
