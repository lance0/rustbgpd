frr defaults traditional
hostname member3-frr-non-enhe
log stdout informational

router bgp 64502
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 2001:db8:107::9 remote-as 64496
 neighbor 2001:db8:107::9 description rustbgpd-rs
 neighbor 2001:db8:107::9 timers 30 90
 ! A transparent route server does not prepend its own ASN, so every route
 ! relayed here begins with the originating member's AS (64500), not the
 ! route server's 64496. FRR enforces first-AS per neighbor by default and
 ! answers "incorrect first AS (must be 64496)" with treat-as-withdraw, which
 ! empties both families. The relaxation is per neighbor; the global
 ! `bgp enforce-first-as` form does not cover this session.
 no neighbor 2001:db8:107::9 enforce-first-as
 !
 address-family ipv4 unicast
  neighbor 2001:db8:107::9 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 2001:db8:107::9 activate
 exit-address-family
!
