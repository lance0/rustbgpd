frr version 10.7.1
frr defaults traditional
hostname frr-m53c
log stdout informational

! One router on two parallel links. Both interfaces share a MAC address and
! therefore one EUI-64 link-local address. rustbgpd is fe80::1 on eth1 and
! fe80::2 on eth2.
router bgp 65002
 bgp router-id 10.53.0.2
 no bgp ebgp-requires-policy
 neighbor fe80::1 remote-as 65001
 neighbor fe80::1 interface eth1
 neighbor fe80::1 capability extended-nexthop
 neighbor fe80::2 remote-as 65001
 neighbor fe80::2 interface eth2
 neighbor fe80::2 capability extended-nexthop
 !
 address-family ipv4 unicast
  network 198.51.100.53/32
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor fe80::1 activate
  neighbor fe80::2 activate
 exit-address-family
!
ip route 198.51.100.53/32 Null0
