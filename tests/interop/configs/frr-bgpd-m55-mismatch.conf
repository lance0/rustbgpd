frr version 10.3.1
frr defaults traditional
hostname frr-mismatch-m55
log stdout informational

router bgp 65005
 bgp router-id 10.55.4.2
 no bgp ebgp-requires-policy
 neighbor 10.55.4.1 remote-as 65001
 neighbor 10.55.4.1 description rustbgpd-provider-mismatch
 neighbor 10.55.4.1 timers 30 90
 neighbor 10.55.4.1 local-role provider
 !
 address-family ipv4 unicast
 exit-address-family
!
