frr version 10.3.1
frr defaults traditional
hostname frr-m53-rustbgpd-2
log stdout informational

router bgp 65002
 bgp router-id 10.53.0.3
 no bgp ebgp-requires-policy
 neighbor fe80::1 remote-as 65001
 neighbor fe80::1 interface eth1
 neighbor fe80::1 capability extended-nexthop
 !
 address-family ipv4 unicast
  network 198.51.100.53/32
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor fe80::1 activate
 exit-address-family
!
ip route 198.51.100.53/32 Null0
