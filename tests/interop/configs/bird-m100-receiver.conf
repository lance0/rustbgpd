# M100: BIRD 2.19.2 receiver with a separate observation peer.
log stderr all;
router id 10.105.0.2;

protocol device { scan time 10; }

protocol bgp source_peer {
  local 10.105.0.2 as 65002;
  neighbor 10.105.0.10 as 64512;
  hold time 90;
  local role rs_server;
  require roles on;
  rs client on;
  enforce first as off;

  ipv4 {
    import all;
    export all;
  };
}

protocol bgp observer_peer {
  local 10.105.0.2 as 65002;
  neighbor 10.105.0.11 as 64513;
  hold time 90;
  local role rs_server;
  require roles on;
  rs client on;
  enforce first as off;

  ipv4 {
    import all;
    export all;
  };
}
