# M86 — OpenBGPD 9.1 RR client 1 (AS 65001, 10.86.1.2). Announces one
# v4 and one v6 prefix to the rustbgpd RR over a single v4-transport
# session (IPv4 + IPv6 unicast MP families).
#
# fib-update no: control-plane-only lab node — bgpd still validates
# next hops against the kernel FIB, which is why the topology installs
# static glue routes toward the other clients' subnets.

AS 65001
router-id 10.86.1.2
fib-update no

network 100.86.1.0/24
network 2001:db8:861::/48

# Two local-address statements, one per AF: without the IPv6 one,
# bgpd cannot derive a v6 next hop for the v6 NLRI carried over the
# v4 transport session and drops the announcement at update
# generation ("generating update failed, prefix ... dropped").
neighbor 10.86.1.1 {
	descr "rr"
	remote-as 65001
	local-address 10.86.1.2
	local-address 2001:db8:86:1::2
	holdtime 90
	announce IPv4 unicast
	announce IPv6 unicast
}

# iBGP RR client: accept everything from the RR, announce the locally
# originated networks.
allow to any
allow from any
