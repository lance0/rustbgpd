!
! M40: pe-c (router-id 10.0.1.2) — FRR VTEP, shared ES1 with pe-a.
!
! Single iBGP session to rustbgpd (10.0.1.1). pe-c originates
! EAD-per-EVI for ES1 (no local MAC) so rustbgpd sees pe-c as an
! alias VTEP for any Type 2 routes carrying ESI=ES1 from pe-a.
!
frr version 10.3.1
frr defaults traditional
hostname pe-c
log stdout
no ipv6 forwarding
!
interface esdummy
 evpn mh es-id 1
 evpn mh es-sys-mac aa:bb:cc:dd:ee:ff
!
router bgp 65000
 bgp router-id 10.0.1.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.1.1 remote-as 65000
 neighbor 10.0.1.1 timers 30 90
 !
 address-family l2vpn evpn
  neighbor 10.0.1.1 activate
  advertise-all-vni
 exit-address-family
!
end
