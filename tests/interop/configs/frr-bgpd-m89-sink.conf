frr version 10.3.1
frr defaults traditional
hostname frr-m89-sink
log stdout informational

router bgp 65005
 bgp router-id 10.89.4.2
 no bgp ebgp-requires-policy
 neighbor 10.89.4.1 remote-as 65001
 neighbor 10.89.4.1 timers 30 90
 no neighbor 10.89.4.1 enforce-first-as
 !
 address-family ipv4 unicast
  neighbor 10.89.4.1 addpath-rx-paths-limit 2
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 10.89.4.1 activate
  neighbor 10.89.4.1 addpath-rx-paths-limit 3
 exit-address-family
!
