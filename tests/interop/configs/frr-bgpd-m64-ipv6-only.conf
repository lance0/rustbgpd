frr version 10.3.1
frr defaults traditional
hostname frr-m64
log stdout informational

! M64 — true IPv6-only peering. Two sessions to the same rustbgpd:
!
!  * fd00:64::1 — IPv6-only: deactivated in ipv4 unicast, activated in
!    ipv6 unicast. rustbgpd runs disable_ipv4_unicast = true, so the
!    capability exchange must contain no IPv4-unicast MP capability in
!    either direction.
!  * 10.64.0.1 — §8 regression guard: dont-capability-negotiate makes
!    FRR send an OPEN with no capabilities at all, so IPv4 unicast can
!    only come from the RFC 4760 §8 implicit fallback on the rustbgpd
!    side (rustbgpd runs this neighbor without the flag).

router bgp 65002
 bgp router-id 10.64.0.2
 no bgp ebgp-requires-policy
 neighbor fd00:64::1 remote-as 65001
 neighbor fd00:64::1 description rustbgpd-m64-v6only
 neighbor fd00:64::1 timers 30 90
 neighbor 10.64.0.1 remote-as 65001
 neighbor 10.64.0.1 description rustbgpd-m64-v4-regression
 neighbor 10.64.0.1 timers 30 90
 neighbor 10.64.0.1 dont-capability-negotiate
 !
 address-family ipv4 unicast
  no neighbor fd00:64::1 activate
  neighbor 10.64.0.1 activate
  network 10.99.1.0/24
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor fd00:64::1 activate
  network 2001:db8:64::/48
 exit-address-family
!
ip route 10.99.1.0/24 Null0
ipv6 route 2001:db8:64::/48 Null0
!
