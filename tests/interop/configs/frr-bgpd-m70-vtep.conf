!
! M70: FRR traditional per-VNI VTEP peering with rustbgpd's
! ADR-0089 VLAN-aware bridge VTEP at 10.0.0.1.
!
! FRR deliberately uses the proven one-bridge / one-VXLAN-device
! topology per VNI here. The VLAN-aware side is rustbgpd; FRR is
! only the cross-vendor Type 2 originator.
!
frr version 10.3.1
frr defaults traditional
hostname m70-frr
log stdout
no ipv6 forwarding
!
router bgp 65000
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 timers 10 30
 !
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
  advertise-all-vni
  vni 100
   rd 10.0.0.2:100
   route-target import 65000:100
   route-target export 65000:100
  exit-vni
  vni 200
   rd 10.0.0.2:200
   route-target import 65000:200
   route-target export 65000:200
  exit-vni
 exit-address-family
!
end
