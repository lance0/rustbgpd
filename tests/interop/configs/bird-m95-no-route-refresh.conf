# M95 — BIRD 2 eBGP peer (AS 65003, 10.95.2.2) that deliberately does NOT
# advertise the RFC 2918 Route Refresh capability.
#
# `enable route refresh off` is the whole reason this node exists: ADR-0112
# rejects a live RFC 8212 import policy-presence edit against an Established
# peer that cannot be asked to re-advertise, and a real speaker refusing the
# capability in its OPEN is the only honest way to exercise that. Every other
# BGP speaker in this repository's labs advertises it.

log stderr all;
router id 10.95.2.2;

protocol device {
  scan time 10;
}

protocol static statics4 {
  ipv4;
  route 203.0.113.0/24 blackhole;
  route 198.51.100.0/24 blackhole;
}

protocol bgp edge {
  local 10.95.2.2 as 65003;
  neighbor 10.95.2.1 as 65001;
  hold time 90;
  enable route refresh off;

  ipv4 {
    import all;
    export filter {
      if source != RTS_STATIC then reject;
      accept;
    };
  };
}
