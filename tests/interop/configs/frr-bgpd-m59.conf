frr version 10.3.1
frr defaults traditional
hostname frr-m59
log stdout informational

! FRR is AS 65003 — rustbgpd's provider. It always prepends its own ASN on
! eBGP out, so rustbgpd sees AS_PATH = [65003, <prepended>, <origin>]. The
! outbound route-map crafts the rest of the path to exercise role-aware
! DOWNSTREAM ASPA verification at rustbgpd (which is configured role=customer).
! No crafted path contains 65001 (rustbgpd's ASN) — that would trip loop check.
!
!   192.168.20.0/24 → prepend "65011 65010" → [65003, 65011, 65010]  (Valid)
!   192.168.21.0/24 → prepend "65007 65008" → [65003, 65007, 65008]  (Invalid)
ip prefix-list PFX-VALID seq 10 permit 192.168.20.0/24
ip prefix-list PFX-INVALID seq 10 permit 192.168.21.0/24

route-map ASPA-OUT permit 10
 match ip address prefix-list PFX-VALID
 set as-path prepend 65011 65010
!
route-map ASPA-OUT permit 20
 match ip address prefix-list PFX-INVALID
 set as-path prepend 65007 65008
!

router bgp 65003
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 description rustbgpd-m59
 neighbor 10.0.0.1 timers 30 90
 !
 address-family ipv4 unicast
  network 192.168.20.0/24
  network 192.168.21.0/24
  neighbor 10.0.0.1 route-map ASPA-OUT out
 exit-address-family
!
ip route 192.168.20.0/24 10.0.0.2
ip route 192.168.21.0/24 10.0.0.2
!
