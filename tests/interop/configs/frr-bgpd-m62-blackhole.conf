frr version 10.3.1
frr defaults traditional
hostname frr-m62
log stdout informational

! RFC 7999 well-known BLACKHOLE community
bgp community-list standard BLACKHOLE permit 65535:666

! Outbound route-map: tag both host routes with BLACKHOLE. The M62
! kill-and-restart driver keeps 203.0.113.66/32 (prefix A) advertised
! across the cycle and withdraws 203.0.113.68/32 (prefix B) while
! rustbgpd is down, so the restarted daemon re-claims A's adopted
! kernel discard and reaps B's after the deferral.
ip prefix-list BLACKHOLE-TAGGED permit 203.0.113.66/32
ip prefix-list BLACKHOLE-TAGGED permit 203.0.113.68/32
!
route-map TO-RUSTBGPD permit 10
 match ip address prefix-list BLACKHOLE-TAGGED
 set community 65535:666 additive
route-map TO-RUSTBGPD permit 20

router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 description rustbgpd-m62
 neighbor 10.0.0.1 timers 30 90
 !
 address-family ipv4 unicast
  network 203.0.113.66/32
  network 203.0.113.68/32
  neighbor 10.0.0.1 route-map TO-RUSTBGPD out
  neighbor 10.0.0.1 send-community
 exit-address-family
!
ip route 203.0.113.66/32 10.0.0.2
ip route 203.0.113.68/32 10.0.0.2
!
