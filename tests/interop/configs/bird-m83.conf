# M83 — BIRD 2 as an IXP member (AS 65001) of the rustbgpd route
# server. Announces the RPKI-valid transparency probe with MED +
# standard/large communities, the overlap best (tagged 65001:666 so
# the RS denies it toward the FRR member), the member-scoped-deny
# prefix, and one half of the Add-Path pair.
#
# First-AS: `enforce first as off` is explicit for the receipt (it is
# also BIRD 2.0.12's default) — routes from the RS carry the
# originating member's ASN first, not 65500 (RFC 7947 §2.2.2.1).
# Role: rs_client (RFC 9234) — pairs with the RS's route_server role.

log stderr all;
router id 10.83.1.2;

protocol device {
  scan time 10;
}

# The withdraw-propagation probe lives in its own static protocol so
# the driver can `birdc disable statics_uniq` to withdraw exactly it.
protocol static statics_uniq {
  ipv4;
  route 203.0.113.0/24 blackhole;
}

protocol static statics {
  ipv4;
  route 100.65.0.0/24 blackhole;
  route 100.69.0.0/24 blackhole;
  route 100.70.0.0/24 blackhole;
}

# IGP reachability for the other members' subnets (via the RS). The
# transparent RS preserves cross-subnet next hops; with BIRD's default
# eBGP `gateway direct` those are "not directly reachable" and every
# reflected route is rejected as Invalid NEXT_HOP — `gateway recursive`
# below plus these statics is the documented BIRD RS-member shape.
protocol static statics_igp {
  ipv4;
  route 10.83.2.0/24 via 10.83.1.1;
  route 10.83.3.0/24 via 10.83.1.1;
}

protocol bgp routeserver {
  local 10.83.1.2 as 65001;
  neighbor 10.83.1.1 as 65500;
  hold time 90;
  local role rs_client;
  enforce first as off;

  ipv4 {
    # Channel option in BIRD 2 (protocol-level placement is a syntax
    # error): recursive next-hop resolution via the statics_igp routes.
    gateway recursive;
    import all;
    export filter {
      if source != RTS_STATIC then reject;
      # Never announce the IGP glue routes to the IXP.
      if net ~ [ 10.83.0.0/16+ ] then reject;
      if net = 203.0.113.0/24 then {
        bgp_med = 120;
        bgp_community.add((65001,111));
        bgp_large_community.add((65001,1,1));
      }
      if net = 100.65.0.0/24 then bgp_community.add((65001,666));
      accept;
    };
  };
}
