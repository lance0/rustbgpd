[global]
asn = 65001
router_id = "10.0.0.1"
listen_port = 179

[global.telemetry]
prometheus_addr = "0.0.0.0:9179"
log_format = "json"

[global.telemetry.grpc_tcp]
address = "0.0.0.0:50051"

[[neighbors]]
address = "10.0.0.2"
remote_asn = 65002
description = "frr-m26-cease"
hold_time = 90
# Harness starts FRR at this exact bound, then injects a third prefix.
max_prefixes = 2

[security.grpc]
enforcement = "legacy"
