!
! M32: VTEP-A (router-id 10.0.0.2) — EVPN multi-homing endpoint 1
!
frr version 10.3.1
frr defaults traditional
hostname vtep-a
log stdout
no ipv6 forwarding
!
! The esdummy interface is created by start-frr-vtep-mh.sh and
! attached to br100. Configuring `evpn mh` on it identifies this
! interface as a member of the shared Ethernet Segment.
interface esdummy
 evpn mh es-id 1
 evpn mh es-sys-mac aa:bb:cc:dd:ee:ff
!
router bgp 65000
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 timers 30 90
 !
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
  advertise-all-vni
 exit-address-family
!
end
