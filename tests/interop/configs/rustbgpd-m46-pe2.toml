# M46 PE2: higher-IP candidate of a 2-PE Ethernet Segment running the
# RFC 8584 §3.2 Highest Random Weight DF algorithm. For VNI 10 the
# HRW weights elect this PE (10.0.0.2) as DF, even though default
# service carving (`10 mod 2` = slot 0 → lower IP) would elect
# 10.0.0.1. Asserting this PE is DF proves HRW is in effect.
[global]
asn = 65000
router_id = "10.0.0.2"
listen_port = 179

[global.telemetry]
log_format = "json"
prometheus_addr = "0.0.0.0:9179"

[global.telemetry.grpc_tcp]
address = "0.0.0.0:50051"
token_file = "/run/rustbgpd/grpc-test-only-operator.token"
principal = "rustbgpd://operator/test-only"

[[evpn_instances]]
vni = 10
rd = "10.0.0.2:10"
route_targets = ["65000:10"]
local_vtep_ip = "10.0.0.2"
bridge = "br10"
advertise_svi_mac = false

[[ethernet_segments]]
esi = "00:00:00:00:00:00:00:00:00:01"
member_vnis = [10]
df_preference = 32768
df_algorithm = "highest-random-weight"
originator_ip = "10.0.0.2"

[[neighbors]]
address = "10.0.0.1"
remote_asn = 65000
description = "pe1"
hold_time = 30
families = ["l2vpn_evpn"]

[security.grpc]
enforcement = "tier"

[security.grpc.roles]
"rustbgpd://operator/test-only" = "operator"
