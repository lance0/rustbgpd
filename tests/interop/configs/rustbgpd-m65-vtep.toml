# M65 failover proof: rustbgpd as the remote EVPN VTEP (receive
# side, the ADR-0083 device under test), peering iBGP L2VPN/EVPN
# with the two GoBGP segment PEs. Same VTEP shape as M36/M60 plus
# the Prometheus listener — the driver asserts the single-active
# swap/teardown counters and the backup-active gauge
# (`evpn_single_active_backup_swaps_total` /
# `evpn_single_active_teardowns_total` /
# `evpn_single_active_backup_active`) across the failover.
[global]
asn = 65000
router_id = "10.0.1.1"
listen_port = 179

[global.telemetry]
log_format = "json"
prometheus_addr = "0.0.0.0:9179"

[global.telemetry.grpc_tcp]
address = "0.0.0.0:50051"
token_file = "/run/rustbgpd/grpc-test-only-operator.token"
principal = "rustbgpd://operator/test-only"

# Single EVPN instance bound to br100 / vxlan100 — the start script
# pre-creates the topology in this container's netns. The single-active
# NHG indirection rides the default `apply_aliasing_ecmp = true`.
[[evpn_instances]]
vni = 100
rd = "10.0.1.1:100"
route_targets = ["65000:100"]
local_vtep_ip = "10.0.1.1"
bridge = "br100"
advertise_svi_mac = false

[[neighbors]]
address = "10.0.1.2"
remote_asn = 65000
description = "pe1-gobgp-active"
hold_time = 30
families = ["l2vpn_evpn"]

[[neighbors]]
address = "10.0.2.2"
remote_asn = 65000
description = "pe2-gobgp-backup"
hold_time = 30
families = ["l2vpn_evpn"]

[security.grpc]
enforcement = "tier"

[security.grpc.roles]
"rustbgpd://operator/test-only" = "operator"
