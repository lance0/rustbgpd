# M44 smoke: rustbgpd with ADR-0064 tier enforcement over native mTLS.
#
# enforcement = "tier" (the v0.24.0 default, set explicitly here for
# documentation) maps each authenticated mTLS principal to a role
# ceiling. The M44 driver presents client certs whose rustbgpd:// URI
# SANs match these principals and asserts the per-tier allow/deny
# contract over the wire.
[global]
asn = 65001
router_id = "10.0.0.1"
listen_port = 179

[global.telemetry]
prometheus_addr = "0.0.0.0:9179"
log_format = "json"

[global.telemetry.grpc_tcp]
address = "0.0.0.0:50051"
tls_cert_file = "/etc/rustbgpd/certs/server.pem"
tls_key_file = "/etc/rustbgpd/certs/server.key"
tls_client_ca_file = "/etc/rustbgpd/certs/ca.pem"

[security.grpc]
enforcement = "tier"

[security.grpc.roles]
"rustbgpd://observer/ci" = "observer"
"rustbgpd://automation/ci" = "automation"
"rustbgpd://operator/ci" = "operator"

# A single configured neighbor so sensitive-read RPCs have a target to
# resolve. No session is expected to establish; the test only exercises
# the gRPC authorization boundary.
[[neighbors]]
address = "10.0.0.2"
remote_asn = 65002
description = "authz-fixture-peer"
hold_time = 90
