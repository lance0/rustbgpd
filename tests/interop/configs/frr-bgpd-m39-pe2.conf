!
! M39: PE2 (FRR, router-id 10.0.0.2) — bidirectional EVPN Type 5
! against rustbgpd PE1 at 10.0.0.1.
!
! Mirrors the M30b PE config but with PE1 as a regular iBGP peer
! (not a Route Reflector). Two BGP instances:
!   - global (router bgp 65000): direct iBGP L2VPN/EVPN session
!     toward PE1 at 10.0.0.1.
!   - per-VRF (router bgp 65000 vrf vrf1): exports vrf1's IPv4
!     RIB as Type 5 NLRI via `advertise ipv4 unicast`.
!
! Kernel VRF + L3VNI + bridge + SVI + VXLAN are set up by
! start-frr-vtep-l3.sh before FRR boots. The tenant prefix
! 192.0.2.2/32 lives on lo-vrf1; `redistribute connected` picks
! it up and the per-VRF L2VPN/EVPN block re-originates as Type 5.
!
frr version 10.3.1
frr defaults traditional
hostname pe2
log stdout
no ipv6 forwarding
!
vrf vrf1
 vni 100
 exit-vrf
!
router bgp 65000
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 timers 30 90
 !
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65000 vrf vrf1
 bgp router-id 10.0.0.2
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  rd 65000:100
  route-target both 65000:100
 exit-address-family
!
end
