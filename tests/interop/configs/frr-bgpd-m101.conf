frr version 10.3.1
frr defaults traditional
hostname frr-m101
log stdout informational

router bgp 65002
 bgp router-id 10.101.2.2
 no bgp ebgp-requires-policy
 neighbor 10.101.2.1 remote-as 65500
 neighbor 10.101.2.1 description rustbgpd-rs
 neighbor 10.101.2.1 timers 30 90
 no neighbor 10.101.2.1 enforce-first-as
 neighbor 10.101.2.1 local-role rs-client
 !
 address-family ipv4 unicast
 exit-address-family
!
