frr version 10.3.1
frr defaults traditional
hostname frr-m57
log stdout informational

! Inbound prefix-list, pushed to rustbgpd as an Address-Prefix ORF.
! Phase 1 permits only 10.10.1.0/24; the test widens it at runtime to
! exercise re-expansion.
ip prefix-list ORF-IN seq 5 permit 10.10.1.0/24

router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 description rustbgpd-m57
 neighbor 10.0.0.1 timers 30 90
 !
 address-family ipv4 unicast
  ! Negotiate Address-Prefix ORF (send + receive) and push our inbound
  ! prefix-list to the peer so it pre-filters what it advertises to us.
  neighbor 10.0.0.1 capability orf prefix-list both
  neighbor 10.0.0.1 prefix-list ORF-IN in
 exit-address-family
!
