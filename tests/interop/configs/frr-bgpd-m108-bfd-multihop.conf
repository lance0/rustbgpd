frr version 10.3.1
frr defaults traditional
hostname frr1-m108
log stdout informational

bfd
 profile fast
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
 exit
exit
!
router bgp 65001
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 neighbor 10.255.0.1 remote-as 65001
 neighbor 10.255.0.1 description rustbgpd-m108-multihop
 neighbor 10.255.0.1 update-source lo
 neighbor 10.255.0.1 timers 30 90
 neighbor 10.255.0.1 bfd
 neighbor 10.255.0.1 bfd profile fast
!
