! M37 consumer FRR configuration.
!
! Pure BGP consumer for L2VPN/EVPN — no VXLAN dataplane on this side,
! we just want `vtysh -c "show bgp l2vpn evpn route"` to surface the
! Type 2 + Type 3 routes rustbgpd originates.
!
! iBGP/AS65000 — same AS as rustbgpd so EVPN routes propagate without
! having to fight FRR's default eBGP export policy.

frr defaults traditional
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
router bgp 65000
 bgp router-id 10.0.0.2
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 description rustbgpd-originator
 !
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
 exit-address-family
!
end
