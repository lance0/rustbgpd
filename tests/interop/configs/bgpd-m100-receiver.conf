# M100: OpenBGPD 9.2 receiver with a separate observation peer.
AS 65003
router-id 10.105.0.3
fib-update no

neighbor 10.105.0.10 {
	descr "m100-source"
	remote-as 64512
	local-address 10.105.0.3
	holdtime 90
	announce IPv4 unicast enforce
	announce policy enforce
	announce as-4byte enforce
	enforce neighbor-as no
	transparent-as yes
	role rs
}

neighbor 10.105.0.11 {
	descr "m100-observer"
	remote-as 64513
	local-address 10.105.0.3
	holdtime 90
	announce IPv4 unicast enforce
	announce policy enforce
	announce as-4byte enforce
	enforce neighbor-as no
	transparent-as yes
	role rs
}

allow from any
allow to any
