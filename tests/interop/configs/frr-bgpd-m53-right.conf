frr version 10.3.1
frr defaults traditional
hostname frr-m53-right
log stdout informational

router bgp 65002
 bgp router-id 10.53.0.2
 no bgp ebgp-requires-policy
 neighbor eth1 interface remote-as 65001
 neighbor eth1 capability extended-nexthop
 !
 address-family ipv4 unicast
  network 198.51.100.1/32
 exit-address-family
!
ip route 198.51.100.1/32 Null0
