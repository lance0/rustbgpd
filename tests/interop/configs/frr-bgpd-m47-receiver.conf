!
! M47: FRR receiving an EVPN tenant (Type 3 IMET + Type 1/4 EAD/ES)
! from rustbgpd over an iBGP L2VPN/EVPN session, then observing the
! whole tenant withdraw when rustbgpd tears it down at runtime via
! EvpnService/ApplyEvpnRuntime.
!
! Pure control plane — no kernel VRF / L3VNI / VXLAN. The tenant's
! routes land in the global BGP EVPN RIB (`show bgp l2vpn evpn`); the
! smoke asserts they appear and then disappear on the teardown. This
! keeps the test runnable without the `vrf`/`vxlan` kernel modules.
!
frr version 10.3.1
frr defaults traditional
hostname frr
log stdout
no ipv6 forwarding
!
interface lo
 ip address 10.0.0.2/32
!
router bgp 65000
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 timers 30 90
 !
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
 exit-address-family
!
end
