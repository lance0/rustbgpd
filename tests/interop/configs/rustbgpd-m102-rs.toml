# M102: dual-stack route-server proof with an OpenBGPD 9.2 member and FRR control.
config_epoch = 2

[global]
asn = 4200000102
router_id = "10.102.0.1"
listen_port = 179
ebgp_requires_policy = true

[global.telemetry]
prometheus_addr = "0.0.0.0:9179"
log_format = "json"

[global.telemetry.grpc_tcp]
address = "0.0.0.0:50051"
token_file = "/run/rustbgpd/grpc-test-only-operator.token"
principal = "rustbgpd://operator/test-only"

[security.grpc]
enforcement = "tier"

[security.grpc.roles]
"rustbgpd://operator/test-only" = "operator"

[policy.definitions.m102-import]
default_action = "permit"
[[policy.definitions.m102-import.statements]]
prefix = "198.51.102.0/24"
action = "deny"

[policy.definitions.m102-export-to-frr]
default_action = "permit"
[[policy.definitions.m102-export-to-frr.statements]]
prefix = "203.0.102.0/24"
action = "deny"

[policy.definitions.m102-export-openbgpd]
default_action = "permit"

[policy.definitions.m102-import-frr]
default_action = "permit"

[policy]
import_chain = ["m102-import"]

[policy.explain]
enabled = true

[[neighbors]]
address = "10.102.1.2"
remote_asn = 4200000201
description = "m102-openbgpd-92-member"
hold_time = 90
families = ["ipv4_unicast", "ipv6_unicast"]
route_server_client = true
role = "route_server"
strict_role = true
import_policy_chain = ["m102-import"]
export_policy_chain = ["m102-export-openbgpd"]

[[neighbors]]
address = "10.102.2.2"
remote_asn = 4200000202
description = "m102-frr-control-member"
hold_time = 90
families = ["ipv4_unicast", "ipv6_unicast"]
route_server_client = true
role = "route_server"
strict_role = true
import_policy_chain = ["m102-import-frr"]
export_policy_chain = ["m102-export-to-frr"]
