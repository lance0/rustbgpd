# M86 — OpenBGPD 9.1 RR client 2 (AS 65001, 10.86.2.2). Announces one
# v4 and one v6 prefix to the rustbgpd RR over a single v4-transport
# session (IPv4 + IPv6 unicast MP families).

AS 65001
router-id 10.86.2.2
fib-update no

network 100.86.2.0/24
network 2001:db8:862::/48

# Two local-address statements, one per AF (see bgpd-m86-c1.conf).
neighbor 10.86.2.1 {
	descr "rr"
	remote-as 65001
	local-address 10.86.2.2
	local-address 2001:db8:86:2::2
	holdtime 90
	announce IPv4 unicast
	announce IPv6 unicast
}

allow to any
allow from any
