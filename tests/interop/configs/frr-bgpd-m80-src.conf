frr version 10.3.1
frr defaults traditional
hostname frr-m80-src
log stdout informational

! Route matrix source (AS 65002). Announces the same routes to
! rustbgpd (10.0.0.1) and to the FRR parity node (10.0.2.1):
!   10.10.1.0/24   65000:100                     -> customer term
!   10.10.2.0/27   65000:100, /27 outside le 26  -> prefix-set miss
!   192.168.1.0/24 65000:100 + 65000:666, MED 300 -> scrub + customer
!   203.0.113.0/24 as-path 65500                  -> regex reject
!   198.51.100.0/24 untagged                      -> default accept
!   10.20.1.0/24     origin 64999                 -> partner-v4 term
!   2001:db8:64::/48 origin 64999 (IPv6 unicast)  -> partner-v6 term
!   2001:db8:99::/48 origin 65002 (IPv6 unicast)  -> v6 fallthrough
router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 description rustbgpd-m80
 neighbor 10.0.0.1 timers 30 90
 neighbor 10.0.2.1 remote-as 65011
 neighbor 10.0.2.1 description frr-parity-m80
 neighbor 10.0.2.1 timers 30 90
 !
 address-family ipv4 unicast
  network 10.10.1.0/24 route-map ORIG-CUSTOMER
  network 10.10.2.0/27 route-map ORIG-CUSTOMER
  network 192.168.1.0/24 route-map ORIG-SCRUBBED
  network 203.0.113.0/24 route-map ORIG-TRANSIT
  network 198.51.100.0/24
  network 10.20.1.0/24 route-map ORIG-PARTNER
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 10.0.0.1 activate
  neighbor 10.0.2.1 activate
  network 2001:db8:64::/48 route-map ORIG-PARTNER
  network 2001:db8:99::/48
 exit-address-family
!
route-map ORIG-CUSTOMER permit 10
 set community 65000:100
!
route-map ORIG-SCRUBBED permit 10
 set community 65000:100 65000:666
 set metric 300
!
route-map ORIG-TRANSIT permit 10
 set as-path prepend 65500
!
! Partner routes carry origin AS 64999 (prepended at origination, so
! the path rustbgpd sees is "65002 64999" — origin = rightmost ASN).
route-map ORIG-PARTNER permit 10
 set as-path prepend 64999
!
