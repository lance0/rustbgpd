# Local origination supplies both families over one eBGP session to the validator.
[global]
asn = 65003
router_id = "10.0.1.2"
listen_port = 179

[global.telemetry]
prometheus_addr = "0.0.0.0:9179"
log_format = "json"

[global.telemetry.grpc_tcp]
address = "0.0.0.0:50051"
token_file = "/run/rustbgpd/grpc-test-only-operator.token"
principal = "rustbgpd://operator/test-only"

[flowspec]
validation = "off"

[[neighbors]]
address = "10.0.1.1"
remote_asn = 65001
hold_time = 90
families = ["ipv4_unicast", "ipv4_flowspec"]

[security.grpc]
enforcement = "tier"

[security.grpc.roles]
"rustbgpd://operator/test-only" = "operator"
