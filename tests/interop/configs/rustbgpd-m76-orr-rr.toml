# M76 — RFC 9107 ORR divergent-best receipt.
#
# iBGP route reflector with five clients: a linkstate-only BGP-LS source,
# two IPv4-unicast PEs announcing the same prefix with different next-hops,
# and two IPv4-unicast clients pinned to different ORR vantages (nodes A and
# B of the injected square topology).

[global]
asn = 65001
router_id = "10.0.0.1"
listen_port = 179
cluster_id = "10.0.0.1"

[global.telemetry]
prometheus_addr = "0.0.0.0:9179"
log_format = "json"

[global.telemetry.grpc_tcp]
address = "0.0.0.0:50051"

[[neighbors]]
address = "10.0.0.2"
remote_asn = 65001
description = "bgpls-source"
hold_time = 90
route_reflector_client = true
families = ["linkstate"]

[[neighbors]]
address = "10.0.1.2"
remote_asn = 65001
description = "pe1"
hold_time = 90
route_reflector_client = true
families = ["ipv4_unicast"]

[[neighbors]]
address = "10.0.2.2"
remote_asn = 65001
description = "pe2"
hold_time = 90
route_reflector_client = true
families = ["ipv4_unicast"]

[[neighbors]]
address = "10.0.3.2"
remote_asn = 65001
description = "client-1"
hold_time = 90
route_reflector_client = true
families = ["ipv4_unicast"]
orr_vantage = "10.0.8.1"

[[neighbors]]
address = "10.0.4.2"
remote_asn = 65001
description = "client-2"
hold_time = 90
route_reflector_client = true
families = ["ipv4_unicast"]
orr_vantage = "10.0.8.2"

[security.grpc]
enforcement = "legacy"
