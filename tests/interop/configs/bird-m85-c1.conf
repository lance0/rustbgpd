# M85 — BIRD 2 RR client 1 (AS 65001, 10.85.1.2). Advertises one v4 and
# one v6 prefix to the rustbgpd RR over a single v4-transport session
# (ipv4 + ipv6 channels).
#
# GR shape: `graceful restart on` — BIRD lists the ipv4/ipv6 unicast
# AFs in its GR capability (contrast with c2's default aware-only
# advertisement), so the RR stale-preserves this client's routes
# through a kill.

log stderr all;
router id 10.85.1.2;

protocol device {
  scan time 10;
}

protocol static statics4 {
  ipv4;
  route 100.85.1.0/24 blackhole;
}

protocol static statics6 {
  ipv6;
  route 2001:db8:851::/48 blackhole;
}

# IGP glue: reflected routes keep the originating client's NEXT_HOP
# (RFC 4456 §7); resolve the other clients' subnets via the RR.
protocol static igp4 {
  ipv4;
  route 10.85.2.0/24 via 10.85.1.1;
  route 10.85.3.0/24 via 10.85.1.1;
}

protocol static igp6 {
  ipv6;
  route 2001:db8:85:2::/64 via 2001:db8:85:1::1;
  route 2001:db8:85:3::/64 via 2001:db8:85:1::1;
}

protocol bgp reflector {
  local 10.85.1.2 as 65001;
  neighbor 10.85.1.1 as 65001;
  hold time 90;
  graceful restart on;
  graceful restart time 60;

  ipv4 {
    import all;
    export filter {
      if source != RTS_STATIC then reject;
      if net ~ [ 10.85.0.0/16+ ] then reject;
      accept;
    };
  };

  ipv6 {
    import all;
    export filter {
      if source != RTS_STATIC then reject;
      if net ~ [ 2001:db8:85::/48+ ] then reject;
      accept;
    };
  };
}
