!
! M109 — FRR VTEP on an IPv6-only VXLAN underlay, peering with the
! rustbgpd VTEP at fd00:109::1 over iBGP (same AS 65000).
!
! iBGP for the same reason M36 gives: FRR's EVPN advertise behavior
! differs across an eBGP boundary, and that detour is unrelated to the
! underlay address family under test.
!
! `advertise-all-vni` makes zebra originate Type 3 IMET plus Type 2 from
! the local bridge FDB. start-frr-vtep.sh pre-creates br109 / vxlan109
! (with `local fd00:109::2`) / dummy109, so a
! `bridge fdb add ... dev dummy109 master static` triggers Type 2
! origination and the VXLAN device's IPv6 tunnel source becomes the
! EVPN next hop.
!
! `bgp router-id` is set explicitly. No interface in this topology holds
! an IPv4 address, so leaving it to auto-selection would pick up the
! container's management address and make the identifier depend on the
! lab runtime.
!
frr version 10.7.1
frr defaults traditional
hostname m109-frr
log stdout
!
router bgp 65000
 bgp router-id 10.109.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor fd00:109::1 remote-as 65000
 neighbor fd00:109::1 description rustbgpd-m109-vtep6
 neighbor fd00:109::1 timers 10 30
 !
 address-family l2vpn evpn
  neighbor fd00:109::1 activate
  advertise-all-vni
 exit-address-family
!
end
