frr version 10.7.1
frr defaults traditional
hostname frr-m53b-3
log stdout informational
log file /tmp/frr.log informational

! No RAs: rustbgpd can learn this peer only from its inbound connection.
! The static neighbor toward rustbgpd's EUI-64 link-local address is added
! by the driver once the lab is deployed and that address is known.
interface eth1
 ipv6 nd suppress-ra
!

router bgp 65003
 bgp router-id 10.53.0.4
 no bgp ebgp-requires-policy
 no bgp ipv6-auto-ra
 !
 address-family ipv4 unicast
  network 198.51.100.54/32
 exit-address-family
!
ip route 198.51.100.54/32 Null0
