# M101: reduced IPv4-unicast route-server proof for a real BIRD 3.3.2
# malformed optional-transitive type-40 attribute and two policy boundaries.

[global]
asn = 65500
router_id = "10.101.0.1"
listen_port = 179

[global.telemetry]
prometheus_addr = "0.0.0.0:9179"
log_format = "json"

[global.telemetry.grpc_tcp]
address = "0.0.0.0:50051"
token_file = "/run/rustbgpd/grpc-test-only-operator.token"
principal = "rustbgpd://operator/test-only"

[security.grpc]
enforcement = "tier"

[security.grpc.roles]
"rustbgpd://operator/test-only" = "operator"

[policy.definitions.m101-import]
default_action = "permit"
[[policy.definitions.m101-import.statements]]
prefix = "198.51.101.0/24"
action = "deny"

[policy.definitions.m101-export-to-frr]
default_action = "permit"
[[policy.definitions.m101-export-to-frr.statements]]
prefix = "198.51.102.0/24"
action = "deny"

[policy]
import_chain = ["m101-import"]

[policy.explain]
enabled = true

[[neighbors]]
address = "10.101.1.2"
remote_asn = 65001
description = "m101-bird-332-member"
hold_time = 90
route_server_client = true
role = "route_server"

[[neighbors]]
address = "10.101.2.2"
remote_asn = 65002
description = "m101-frr-control-member"
hold_time = 90
route_server_client = true
role = "route_server"
export_policy_chain = ["m101-export-to-frr"]
