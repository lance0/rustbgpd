frr version 10.3.1
frr defaults traditional
hostname frr-m95
log stdout informational

router bgp 65002
 bgp router-id 10.95.1.2
 no bgp ebgp-requires-policy
 bgp graceful-restart
 bgp graceful-restart restart-time 120
 neighbor 10.95.1.1 remote-as 65001
 neighbor 10.95.1.1 description rustbgpd-m95
 neighbor 10.95.1.1 timers 30 90
 !
 address-family ipv4 unicast
  network 192.168.95.0/24
  network 192.168.96.0/24
  network 10.95.100.0/24
 exit-address-family
!
ip route 192.168.95.0/24 10.95.1.2
ip route 192.168.96.0/24 10.95.1.2
ip route 10.95.100.0/24 10.95.1.2
!
