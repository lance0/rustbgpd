log stderr all;
router id 10.0.43.2;

protocol device {
  scan time 10;
}

protocol direct {
  ipv4;
  interface "eth1";
}

protocol static m43_static {
  ipv4;
  route 203.0.113.43/32 blackhole;
}

protocol bgp rustbgpd {
  local 10.0.43.2 as 65043;
  neighbor 10.0.43.1 as 65001;
  source address 10.0.43.2;
  hold time 90;
  authentication ao;
  keys {
    key {
      send id 11;
      recv id 1;
      secret "interop-old-secret-m43";
      algorithm hmac sha256;
      deprecated;
    };
    key {
      send id 12;
      recv id 2;
      secret "interop-next-secret-m43";
      algorithm hmac sha256;
      preferred;
    };
    key {
      send id 13;
      recv id 3;
      secret "interop-successor-secret-m43";
      algorithm hmac sha256;
    };
  };

  ipv4 {
    import all;
    export all;
  };
}
