frr version 10.3.1
frr defaults traditional
hostname frr-m99-rfc9072
log stdout informational

router bgp 65002
 bgp router-id 10.99.0.2
 no bgp ebgp-requires-policy
 neighbor 10.99.0.1 remote-as 65001
 neighbor 10.99.0.1 description rustbgpd-m99-extended
 neighbor 10.99.0.1 timers 30 90
 neighbor 10.99.0.1 passive
 neighbor 10.99.0.1 extended-optional-parameters
 neighbor 10.99.1.1 remote-as 65001
 neighbor 10.99.1.1 description rustbgpd-m99-classic-control
 neighbor 10.99.1.1 timers 30 90
 neighbor 10.99.1.1 passive
 !
 address-family ipv4 unicast
  neighbor 10.99.0.1 activate
  neighbor 10.99.1.1 activate
 exit-address-family
!
