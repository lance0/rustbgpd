frr version 10.3.1
frr defaults traditional
hostname frr-peer-m56
log stdout informational

router bgp 65002
 bgp router-id 10.56.0.2
 no bgp ebgp-requires-policy
 neighbor 10.56.0.1 remote-as 65001
 neighbor 10.56.0.1 description rustbgpd-m56
 neighbor 10.56.0.1 timers 30 90
 !
 address-family ipv4 unicast
 exit-address-family
!
