frr version 10.3.1
frr defaults traditional
hostname frr-peer-m55
log stdout informational

router bgp 65004
 bgp router-id 10.55.3.2
 no bgp ebgp-requires-policy
 neighbor 10.55.3.1 remote-as 65001
 neighbor 10.55.3.1 description rustbgpd-peer
 neighbor 10.55.3.1 timers 30 90
 neighbor 10.55.3.1 local-role peer
 !
 address-family ipv4 unicast
 exit-address-family
!
