frr defaults traditional
hostname frr-m116-source
log stdout informational

router bgp 65002
 bgp router-id 10.116.0.2
 no bgp ebgp-requires-policy
 neighbor 10.116.0.1 remote-as 65001
 neighbor 10.116.0.1 description rustbgpd-m116
 neighbor 10.116.0.1 timers 30 90
 !
 ! IPv6 unicast over the IPv4 session: FRR sends the interface's global
 ! 2001:db8:116::2 as the MP_REACH_NLRI next hop.
 address-family ipv6 unicast
  network 2001:db8:1160::/48
  network 2001:db8:1161::/48
  network 2001:db8:1162::/48
  neighbor 10.116.0.1 activate
 exit-address-family
!
ipv6 route 2001:db8:1160::/48 blackhole
ipv6 route 2001:db8:1161::/48 blackhole
ipv6 route 2001:db8:1162::/48 blackhole
!
