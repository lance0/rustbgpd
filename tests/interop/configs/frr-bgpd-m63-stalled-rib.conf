frr version 10.3.1
frr defaults traditional
hostname frr-m63
log stdout informational

! M63 — ADR-0078 stalled-RIB hold-timer survival. The driver script
! injects waves of /32 Null0 statics at runtime (vtysh -f), which
! redistribute into BGP and flood rustbgpd while its RIB manager is
! artificially stalled. Timers match rustbgpd's hold_time = 9
! (keepalive 3 s) so hold-timer survival is provable in seconds —
! FRR's hold timer for rustbgpd must keep being fed by the
! writer-task-owned KEEPALIVE cadence even while rustbgpd's session
! task is parked on the saturated RIB channel.

router bgp 65002
 bgp router-id 10.63.0.2
 no bgp ebgp-requires-policy
 neighbor 10.63.0.1 remote-as 65001
 neighbor 10.63.0.1 description rustbgpd-m63
 neighbor 10.63.0.1 timers 3 9
 !
 address-family ipv4 unicast
  redistribute static
 exit-address-family
!
