# M93 dual-stack source. The driver removes the marked block for v4-only phases.

log stderr all;
router id 10.93.0.2;

protocol device { }

protocol bgp rustbgpd {
  local 10.93.0.2 as 65093;
  neighbor 10.93.0.1 as 65093;

  ipv4 {
    import all;
    export none;
  };

  # M93_V6_BEGIN
  ipv6 {
    import all;
    export none;
  };
  # M93_V6_END
}
