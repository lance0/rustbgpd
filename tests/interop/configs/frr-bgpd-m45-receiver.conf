!
! M45: FRR receiving a controller-injected EVPN Type 5 (IP Prefix)
! route from rustbgpd over an iBGP L2VPN/EVPN session.
!
! Pure control plane — no kernel VRF / L3VNI / VXLAN. The received
! Type 5 lands in the global BGP EVPN RIB (`show bgp l2vpn evpn`)
! without VRF import, which is all this smoke asserts. Skipping the
! VRF keeps the test runnable on the hosted CI runner (no `vrf`
! kernel module). Kernel install of a received Type 5 is covered by
! the M39 symmetric-IRB dataplane test.
!
frr version 10.3.1
frr defaults traditional
hostname frr
log stdout
no ipv6 forwarding
!
interface lo
 ip address 10.0.0.2/32
!
router bgp 65000
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 timers 30 90
 !
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
 exit-address-family
!
end
