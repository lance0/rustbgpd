frr version 10.7.1
frr defaults traditional
hostname frr-m53b-2
log stdout informational
log file /tmp/frr.log informational

! Non-default 900s keeps BGP auto-RA from replacing this with a 10s interval.
interface eth1
 ipv6 nd ra-interval 900
 ipv6 nd ra-lifetime 1800
 no ipv6 nd ra-fast-retrans
!

router bgp 65002
 bgp router-id 10.53.0.3
 no bgp ebgp-requires-policy
 neighbor eth1 interface v6only remote-as external
 neighbor eth1 capability extended-nexthop
 !
 address-family ipv4 unicast
  network 198.51.100.53/32
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor eth1 activate
 exit-address-family
!
ip route 198.51.100.53/32 Null0
