[global]
asn = 65001
router_id = "10.0.0.1"
listen_port = 179
# Receiver leg: routes carrying BLACKHOLE get an implicit chain-tail
# rule that preserves BLACKHOLE and adds NO_ADVERTISE. EBGP-only
# (this peer is EBGP — remote_asn 65002).
honor_blackhole = true
# FIB leg: accepted EBGP BLACKHOLE host routes install kernel
# RTN_BLACKHOLE rows. Broad prefixes remain rejected by default.
install_blackhole_discard = true

[global.telemetry]
prometheus_addr = "0.0.0.0:9179"
log_format = "json"

[global.telemetry.grpc_tcp]
address = "0.0.0.0:50051"
token_file = "/run/rustbgpd/grpc-test-only-operator.token"
principal = "rustbgpd://operator/test-only"

[[neighbors]]
address = "10.0.0.2"
remote_asn = 65002
description = "frr-m41"
hold_time = 90

[security.grpc]
enforcement = "tier"

[security.grpc.roles]
"rustbgpd://operator/test-only" = "operator"
