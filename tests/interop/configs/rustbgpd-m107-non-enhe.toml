[global]
asn = 64496
router_id = "192.0.2.10"
listen_port = 179

[global.telemetry]
prometheus_addr = "0.0.0.0:9179"
log_format = "json"

[global.telemetry.grpc_uds]
path = "/var/lib/rustbgpd/grpc.sock"
token_file = "/run/rustbgpd/grpc-test-only-operator.token"
principal = "rustbgpd://operator/test-only"

[policy.definitions.permit-all]
default_action = "permit"

[[neighbors]]
address = "2001:db8:107::11"
remote_asn = 64500
description = "member1-gobgp-enhe"
hold_time = 90
families = ["ipv4_unicast", "ipv6_unicast"]
route_server_client = true
import_policy_chain = ["permit-all"]
export_policy_chain = ["permit-all"]

[[neighbors]]
address = "2001:db8:107::12"
remote_asn = 64501
description = "member2-gobgp-enhe"
hold_time = 90
families = ["ipv4_unicast", "ipv6_unicast"]
route_server_client = true
import_policy_chain = ["permit-all"]
export_policy_chain = ["permit-all"]

[[neighbors]]
address = "2001:db8:107::13"
remote_asn = 64502
description = "member3-frr-non-enhe"
hold_time = 90
families = ["ipv4_unicast", "ipv6_unicast"]
route_server_client = true
import_policy_chain = ["permit-all"]
export_policy_chain = ["permit-all"]

[security.grpc]
enforcement = "tier"

[security.grpc.roles]
"rustbgpd://operator/test-only" = "operator"
