!
! M36 smoke: FRR originator peers with rustbgpd VTEP at 10.0.0.1
! over iBGP (same AS 65000). Same pattern as M30 — FRR's EVPN
! advertise behavior differs across eBGP boundaries; iBGP avoids
! that detour and keeps the test focused on Gate 7b's kernel
! programming, not FRR export-policy quirks.
!
! `advertise-all-vni` makes zebra originate Type 2 / Type 3 from
! the local bridge FDB; the start-frr-vtep.sh script pre-creates
! br100 / vxlan100 / dummy100 so MAC injections via
! `bridge fdb add ... dev dummy100` trigger Type 2 origination.
!
frr version 10.3.1
frr defaults traditional
hostname m36-originator
log stdout
no ipv6 forwarding
!
router bgp 65000
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 timers 10 30
 !
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
  advertise-all-vni
 exit-address-family
!
end
