!
! M110: PE2 (FRR) — bidirectional EVPN Type 5 symmetric Interface-less
! IRB against rustbgpd PE1 at fd00:110::1, on an IPv6-only VXLAN
! underlay.
!
! Mirrors the M39 PE2 config with two changes, both forced by the
! underlay family:
!
!   * the iBGP L2VPN/EVPN session is over IPv6 transport;
!   * the per-VRF instance exports vrf1's IPv6 RIB
!     (`advertise ipv6 unicast` over `address-family ipv6 unicast`)
!     rather than its IPv4 RIB. The Interface-less IRB model requires
!     the prefix, gateway, and next-hop families to agree, and the
!     next hop here is the IPv6 VTEP address.
!
! `no ipv6 forwarding` is deliberately absent: the symmetric IRB
! datapath forwards tenant IPv6 between lo-vrf1 and the L3VNI.
!
! Kernel VRF + L3VNI + bridge + SVI + VXLAN are set up by
! start-frr-vtep-l3.sh before FRR boots. The tenant address
! 2001:db8:110:2::1/64 lives on lo-vrf1; `redistribute connected`
! picks up the resulting 2001:db8:110:2::/64 connected route and the
! per-VRF L2VPN/EVPN block re-originates it as Type 5.
!
! `bgp router-id` is set explicitly — no interface in this topology
! holds an IPv4 address, so auto-selection would pick up the
! container's management address.
!
frr version 10.7.1
frr defaults traditional
hostname pe2
log stdout
!
vrf vrf1
 vni 110
 exit-vrf
!
router bgp 65000
 bgp router-id 10.110.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor fd00:110::1 remote-as 65000
 neighbor fd00:110::1 description rustbgpd-m110-pe1
 neighbor fd00:110::1 timers 10 30
 !
 address-family l2vpn evpn
  neighbor fd00:110::1 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65000 vrf vrf1
 bgp router-id 10.110.0.2
 !
 address-family ipv6 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv6 unicast
  rd 65000:110
  route-target both 65000:110
 exit-address-family
!
end
