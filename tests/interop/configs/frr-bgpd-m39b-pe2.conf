!
! M39b: PE2 (FRR, router-id 10.0.0.2) — auto-derived Route Target
! cross-vendor smoke against rustbgpd PE1 at 10.0.0.1.
!
! Same shape as the M39 PE2 config, but instead of an explicit
! `route-target both 65000:100` the per-VRF L2VPN/EVPN block uses
! `route-target both auto`. For an L3VNI / tenant VRF FRR derives the
! RT as plain `AS:VNI` (65000:100) — this is FRR's default and is NOT
! affected by `autort rfc8365-compatible` (that knob is MAC-VRF/L2VNI
! only). rustbgpd's `auto_derive_route_target` for `[[evpn_ip_vrfs]]`
! derives the same `AS:VNI` form, so the Type 5 routes import both ways.
!
! Kernel VRF + L3VNI + bridge + SVI + VXLAN are set up by
! start-frr-vtep-l3.sh before FRR boots (reused as-is).
!
frr version 10.3.1
frr defaults traditional
hostname pe2
log stdout
no ipv6 forwarding
!
vrf vrf1
 vni 100
 exit-vrf
!
router bgp 65000
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 timers 30 90
 !
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65000 vrf vrf1
 bgp router-id 10.0.0.2
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  rd 65000:100
  route-target both auto
 exit-address-family
!
end
