frr defaults traditional
hostname frr-m115-a
log stdout informational

router bgp 65002
 bgp router-id 10.115.0.2
 no bgp ebgp-requires-policy
 neighbor 10.115.0.1 remote-as 65001
 neighbor 10.115.0.1 description rustbgpd-m115
 neighbor 10.115.0.1 timers 30 90
 !
 address-family ipv4 unicast
  ! The condition and the control. The M115 driver adds the payload
  ! 198.51.100.0/24 once the condition has settled, then withdraws and
  ! re-announces the condition.
  network 192.0.2.0/24
  network 198.51.101.0/24
 exit-address-family
!
ip route 192.0.2.0/24 blackhole
ip route 198.51.100.0/24 blackhole
ip route 198.51.101.0/24 blackhole
!
