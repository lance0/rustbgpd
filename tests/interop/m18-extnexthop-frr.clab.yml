# Containerlab topology: rustbgpd ↔ FRR (M18 — Extended Next-Hop, RFC 8950)
#
# Validates: rustbgpd advertises Extended Next Hop for IPv4 unicast and, when
# the peer does not reciprocate, sends IPv4 routes with an IPv4 next hop.
#
# Dual-stack link: IPv4 (10.0.0.0/24) + IPv6 (fd00::/64); the one BGP session
# runs over IPv4 transport. FRR advertises Extended Next Hop only over IPv6
# transport, so it receives rustbgpd's capability without advertising its own
# and the capability is not negotiated (see the driver header).
#
# Usage:
#   containerlab deploy -t tests/interop/m18-extnexthop-frr.clab.yml
#   containerlab destroy -t tests/interop/m18-extnexthop-frr.clab.yml

name: m18-extnexthop-frr

topology:
  nodes:
    rustbgpd:
      kind: linux
      image: rustbgpd:dev
      cmd: sleep infinity
      binds:
        - ./configs/rustbgpd-m18-extnexthop.toml:/etc/rustbgpd/config.toml:ro
        - ./scripts/start-rustbgpd.sh:/usr/local/bin/start-rustbgpd.sh:ro
        - ../fixtures/grpc-test-only-operator.token:/run/rustbgpd/grpc-test-only-operator.token:ro
      exec:
        - ip addr add 10.0.0.1/24 dev eth1
        - ip -6 addr add fd00::1/64 dev eth1
        - ip link set eth1 up
      env:
        RUST_LOG: info

    frr:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      binds:
        - ./configs/frr-daemons:/etc/frr/daemons:ro
        - ./configs/frr-bgpd-m18-extnexthop.conf:/etc/frr/frr.conf:ro
        # Without this, vtysh prints "Can't open configuration file
        # /etc/frr/vtysh.conf" on stdout and the driver's `json | jq`
        # scrapes fail to parse.
        - /dev/null:/etc/frr/vtysh.conf:ro
      exec:
        - ip addr add 10.0.0.2/24 dev eth1
        - ip -6 addr add fd00::2/64 dev eth1
        - ip link set eth1 up

  links:
    - endpoints: ["rustbgpd:eth1", "frr:eth1"]

# Network: 10.0.0.0/24 + fd00::/64 — rustbgpd (10.0.0.1/fd00::1) ↔ FRR (10.0.0.2/fd00::2)
