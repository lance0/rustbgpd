# M101 — real BIRD 3.3.2 malformed-attribute route-server proof.
#
# Both peers remain asleep until the driver verifies configured/local image
# identity and exact runtime versions. Capture is then armed before any BGP
# daemon starts. BIRD emits one optional-transitive-partial type-40 attribute;
# digest-pinned FRR 10.3.1 is the independent downstream control member.

name: m101-routeserver-bird332

topology:
  nodes:
    rustbgpd:
      kind: linux
      image: rustbgpd:dev
      cmd: sleep infinity
      binds:
        - ./configs/rustbgpd-m101-rs.toml:/etc/rustbgpd/config.toml:ro
        - ../fixtures/grpc-test-only-operator.token:/run/rustbgpd/grpc-test-only-operator.token:ro
        - ./scripts/start-rustbgpd.sh:/usr/local/bin/start-rustbgpd.sh:ro
      exec:
        - ip addr add 10.101.1.1/24 dev eth1
        - ip link set eth1 up
        - ip addr add 10.101.2.1/24 dev eth2
        - ip link set eth2 up
      env:
        RUST_LOG: info
        RUSTBGPD_TOKEN_FILE: /run/rustbgpd/grpc-test-only-operator.token

    bird:
      kind: linux
      image: bird:v3.3.2-m101
      cmd: sleep infinity
      binds:
        - ./configs/bird-m101.conf:/etc/bird/bird.conf:ro
      exec:
        - ip addr add 10.101.1.2/24 dev eth1
        - ip link set eth1 up
        - ip route add 10.101.2.0/24 via 10.101.1.1
        - mkdir -p /run/bird

    frr:
      kind: linux
      # quay.io/frrouting/frr:10.3.1, immutable for this receipt.
      image: quay.io/frrouting/frr@sha256:f90d26a9fd5c14fc5795a73b4254ac88bc3186c45bbeb220a225fb6182de812c
      cmd: sleep infinity
      binds:
        - ./configs/frr-daemons:/etc/frr/daemons:ro
        - ./configs/frr-bgpd-m101.conf:/etc/frr/frr.conf:ro
        - /dev/null:/etc/frr/vtysh.conf:ro
      exec:
        - ip addr add 10.101.2.2/24 dev eth1
        - ip link set eth1 up
        - ip route add 10.101.1.0/24 via 10.101.2.1

  links:
    - endpoints: ["rustbgpd:eth1", "bird:eth1"]
    - endpoints: ["rustbgpd:eth2", "frr:eth1"]
