# Containerlab topology: GoBGP source ↔ rustbgpd RR ↔ GoBGP sink
# (M74 — VPNv4 route reflection / withdraw receipt)
#
# Validates: rustbgpd reflects RFC 4364 VPNv4 routes learned from one iBGP RR
# client to another iBGP RR client with Route Distinguisher, MPLS label stack,
# Route Target extended communities, and next-hop preserved verbatim
# (ADR-0077 §6), withdraws them cleanly, and installs nothing into any
# dataplane.
#
# Usage:
#   docker build --target dev -t rustbgpd:dev .
#   docker build -t gobgp:interop -f tests/interop/Dockerfile.gobgp tests/interop
#   containerlab deploy -t tests/interop/m74-vpnv4-reflection-gobgp.clab.yml
#   bash tests/interop/scripts/test-m74-vpnv4-reflection-gobgp.sh
#   containerlab destroy -t tests/interop/m74-vpnv4-reflection-gobgp.clab.yml

name: m74-vpnv4-reflection-gobgp

topology:
  nodes:
    rustbgpd:
      kind: linux
      image: rustbgpd:dev
      cmd: sleep infinity
      binds:
        - ./configs/rustbgpd-m74-vpnv4-rr.toml:/etc/rustbgpd/config.toml:ro
        - ./scripts/start-rustbgpd.sh:/usr/local/bin/start-rustbgpd.sh:ro
      exec:
        - ip addr add 10.0.0.1/24 dev eth1
        - ip link set eth1 up
        - ip addr add 10.0.1.1/24 dev eth2
        - ip link set eth2 up
      env:
        RUST_LOG: info

    gobgp-src:
      kind: linux
      image: gobgp:interop
      cmd: sleep infinity
      binds:
        - ./configs/gobgp-m74-src.toml:/config/gobgp.toml:ro
      exec:
        - ip addr add 10.0.0.2/24 dev eth1
        - ip link set eth1 up

    gobgp-sink:
      kind: linux
      image: gobgp:interop
      cmd: sleep infinity
      binds:
        - ./configs/gobgp-m74-sink.toml:/config/gobgp.toml:ro
      exec:
        - ip addr add 10.0.1.2/24 dev eth1
        - ip link set eth1 up

  links:
    - endpoints: ["rustbgpd:eth1", "gobgp-src:eth1"]
    - endpoints: ["rustbgpd:eth2", "gobgp-sink:eth1"]
