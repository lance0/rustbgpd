# Containerlab topology: rustbgpd ↔ FRR (M41 — RFC 7999 BLACKHOLE)
#
# Validates the receiver leg plus the opt-in Linux FIB discard path:
#
#   * FRR advertises 203.0.113.66/32 with BLACKHOLE (65535:666).
#   * FRR advertises 203.0.113.67/32 without BLACKHOLE.
#   * FRR advertises 198.51.100.0/24 with BLACKHOLE to exercise the
#     broad-prefix reject guard.
#   * rustbgpd is configured with `[global] honor_blackhole = true` and
#     `[global] install_blackhole_discard = true`.
#   * rustbgpd must retain BLACKHOLE and add NO_ADVERTISE on import.
#   * rustbgpd must install a kernel blackhole route only for the host
#     BLACKHOLE prefix and remove it after withdrawal.
#
# Usage:
#   containerlab deploy -t tests/interop/m41-blackhole-frr.clab.yml
#   bash tests/interop/scripts/test-m41-blackhole-frr.sh
#   containerlab destroy -t tests/interop/m41-blackhole-frr.clab.yml --cleanup

name: m41-blackhole-frr

topology:
  nodes:
    rustbgpd:
      kind: linux
      image: rustbgpd:dev
      cmd: sleep infinity
      binds:
        - ./configs/rustbgpd-m41-blackhole.toml:/etc/rustbgpd/config.initial.toml:ro
        - ./scripts/start-rustbgpd.sh:/usr/local/bin/start-rustbgpd.sh:ro
      exec:
        - ip addr add 10.0.0.1/24 dev eth1
        - ip link set eth1 up
        - cp /etc/rustbgpd/config.initial.toml /etc/rustbgpd/config.toml
      env:
        RUST_LOG: info

    frr:
      kind: linux
      image: quay.io/frrouting/frr:10.3.1
      binds:
        - ./configs/frr-daemons:/etc/frr/daemons:ro
        - ./configs/frr-bgpd-m41-blackhole.conf:/etc/frr/frr.conf:ro
      exec:
        - ip addr add 10.0.0.2/24 dev eth1
        - ip link set eth1 up

  links:
    - endpoints: ["rustbgpd:eth1", "frr:eth1"]

# Network: 10.0.0.0/24 — rustbgpd (10.0.0.1, AS 65001) ↔ FRR (10.0.0.2, AS 65002)
