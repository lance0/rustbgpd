# M107 RFC 8950 uniform-fleet lab — hand-authored `arouteserver
# template-context` fixture for the site described by general.yml +
# clients.yml, in the renderer's single-document form.
#
# The REAL dump of the same site is checked in verbatim next to this
# file as context-sectioned.yml (captured from the pinned
# pierky/arouteserver image via
#     arouteserver template-context --cfg arouteserver.yml --output ...
# with the lab's bogons.yml and bgpq4 stub in place); rs-config-render
# ingests both forms and must render them identically — the renderer's
# test suite and prove-context-ingestion.sh assert exactly that.
#
# Shape: top-level keys pinned by rs-config-render's
# EXPECTED_TOP_LEVEL_KEYS fingerprint.
ip_ver: null
list_ip_vers: [4, 6]
live_tests: false
rtt_based_functions_are_used: false
perform_graceful_shutdown: false
any_reject_cause_map_community_set: false
asn3216_map: {}
arin_whois_records: {}
registrobr_whois_records: {}
rpki_roas: {}
reject_reasons:
  "1": "Invalid AS_PATH length"
  "2": "Prefix is bogon"
never_via_route_servers_asns: [65551]
bogons:
  # Must match the lab's bogons.yml (NOT arouteserver's default list,
  # which rightly treats the documentation prefixes as bogons).
  - {prefix: "10.0.0.0", length: 8, comment: "RFC 1918"}
  - {prefix: "192.168.0.0", length: 16, comment: "RFC 1918"}
  - {prefix: "fc00::", length: 7, comment: "unique local"}
cfg:
  rs_as: 64496
  router_id: "192.0.2.10"
  prepend_rs_as: false
  path_hiding: true
  passive: true
  gtsm: false
  multihop: null
  add_path: false
  # The uniform-fleet knob: every IPv6 session carries IPv4 unicast with
  # an IPv6 next hop.
  rfc8950: true
  graceful_shutdown:
    enabled: false
  blackhole_filtering:
    policy_ipv4: null
    policy_ipv6: null
  rtt_thresholds: null
  communities:
    rejected_route_announced_by: {std: null, lrg: null, ext: null}
  filtering:
    next_hop:
      policy: strict
    ipv4_pref_len: {min: 8, max: 28}
    ipv6_pref_len: {min: 12, max: 48}
    global_black_list_pref:
      - {prefix: "2001:db8:107::", length: 64, comment: "IXP peering LAN"}
    max_as_path_len: 32
    reject_invalid_as_in_as_path: false
    transit_free:
      action: null
      asns: null
    irrdb:
      enforce_origin_in_as_set: true
      enforce_prefix_in_as_set: true
      allow_longer_prefixes: false
      tag_as_set: true
    rpki_bgp_origin_validation:
      enabled: false
      reject_invalid: true
    max_prefix:
      action: shutdown
      count_rejected_routes: false
      peering_db: {enabled: false}
    reject_policy:
      policy: reject
asns:
  AS64500: {as_sets: ["AS-M107-ONE"]}
  AS64501: {as_sets: ["AS-M107-TWO"]}
clients:
  - id: AS64500_1
    asn: 64500
    ip: "2001:db8:107::11"
    description: "member1 - RFC 8950 member"
    cfg:
      rfc8950: true
      filtering:
        irrdb:
          as_set_bundle_ids: ["AS64500_bundle"]
        max_prefix: {limit_ipv4: 100, limit_ipv6: 100, action: shutdown, count_rejected_routes: false}
  - id: AS64501_1
    asn: 64501
    ip: "2001:db8:107::12"
    description: "member2 - RFC 8950 member"
    cfg:
      rfc8950: true
      filtering:
        irrdb:
          as_set_bundle_ids: ["AS64501_bundle"]
        max_prefix: {limit_ipv4: 100, limit_ipv6: 100, action: shutdown, count_rejected_routes: false}
irrdb_info:
  AS64500_bundle:
    asns: [64500]
    prefixes:
      - {prefix: "198.51.100.0", length: 24, le: 25}
      - {prefix: "2001:db8:1::", length: 48, exact: true}
  AS64501_bundle:
    asns: [64501]
    prefixes:
      - {prefix: "203.0.113.0", length: 24, exact: true}
      - {prefix: "2001:db8:2::", length: 48, exact: true}
