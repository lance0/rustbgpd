# M107 RFC 8950 uniform-fleet lab — arouteserver site policy (general.yml).
#
# An IPv6-only peering LAN whose members carry IPv4 unicast over their
# IPv6 sessions with an IPv6 next hop (RFC 8950): `rfc8950: True` is the
# only knob that differs from an ordinary dual-family site. rustbgpd's
# configuration is rendered from this site by tools/rs-config-render
# (via the checked-in template-context dump, see README.md); the
# renderer emits both unicast families on every IPv6 session and binds
# `next_hop_ownership = "strict_peer"` to the session's IPv6 address.
#
# Documentation ranges throughout (RFC 5398 ASNs, RFC 3849 / RFC 5737
# prefixes), hence `reject_invalid_as_in_as_path: False` and the lab-local
# bogons.yml (arouteserver's default list rightly treats 2001:db8::/32 and
# the RFC 5737 blocks as bogons).
cfg:
  rs_as: 64496
  router_id: "192.0.2.10"
  passive: True
  path_hiding: True
  gtsm: False
  add_path: False
  rfc8950: True
  filtering:
    next_hop:
      policy: "strict"
    ipv4_pref_len:
      min: 8
      max: 28
    ipv6_pref_len:
      min: 12
      max: 48
    global_black_list_pref:
      - prefix: "2001:db8:107::"
        length: 64
        comment: "IXP peering LAN"
    max_as_path_len: 32
    reject_invalid_as_in_as_path: False
    irrdb:
      enforce_origin_in_as_set: True
      enforce_prefix_in_as_set: True
      allow_longer_prefixes: False
    rpki_bgp_origin_validation:
      enabled: False
    never_via_route_servers:
      peering_db: False
      asns:
        - 65551
    max_prefix:
      action: "shutdown"
      count_rejected_routes: False
      peering_db:
        enabled: False
    reject_policy:
      policy: "reject"
