# Containerlab topology: rustbgpd PE1 ↔ FRR PE2, ADR-0079 EVPN L3
# adoption sweep kill-and-restart (M61)
#
# Validates the ADR-0079 slice-3 L3 adoption sweep against a real
# Linux kernel: rustbgpd imports FRR-originated Type 5 prefixes into
# vrf1's kernel table over the M39/M48 symmetric Interface-less IRB
# datapath, is then SIGKILLed so the kernel rows (VRF routes, L3
# neighbor, L3VXLAN FDB) outlive the process, and is restarted in the
# same netns with a short adoption-reap deferral. The driver asserts:
#
# 1. rustbgpd ↔ FRR L2VPN/EVPN session reaches Established and both
#    FRR-originated Type 5 prefixes A and B land as `proto bgp onlink`
#    routes in vrf1's kernel table, with the shared resolution rows —
#    the `PERMANENT` + `extern_learn` L3 neighbor (FRR's VTEP IP →
#    router MAC) and the `extern_learn` + `self` L3VXLAN FDB row.
# 2. After `kill -9` of the rustbgpd process (container and netns
#    survive), every marker row is still in the kernel — the
#    crash-leftover premise.
# 3. While rustbgpd is down, FRR withdraws prefix B. On restart with
#    RUSTBGPD_EVPN_ADOPTION_REAP_DEFERRAL_SECS=5 prefix A's route and
#    the shared resolution rows stay present continuously (adopted +
#    re-claimed) while B's route is reaped after the deferral.
# 4. Foreign rows (a `proto static` route in the VRF table and a
#    permanent neighbor without `extern_learn`) survive the whole
#    cycle — adoption never claims unmarked rows.
# 5. Prometheus reports the six `evpn_l3_*_adopted_total` /
#    `_reaped_total` counters for the restarted process.
#
# Topology (M48 shape, minus the runtime-teardown leg):
#   PE1 (rustbgpd)              PE2 (FRR 10.3.1)
#   10.0.0.1, AS 65000          10.0.0.2, AS 65000
#       └─── iBGP L2VPN/EVPN ────────┘
#   vrf1 / L3VNI 100             vrf1 / L3VNI 100
#   advertises 192.0.2.0/24      advertises 198.51.100.0/24 (A) and,
#                                driver-injected, 203.0.113.0/24 (B)
#
# PE1 reuses the M48 rustbgpd config (it already carries the
# Prometheus listener the counter asserts need). The daemon runs
# nohup'd in the background with `sleep infinity` as PID 1, so a
# SIGKILL leaves the container (and its kernel rows) intact and
# nothing auto-restarts the daemon — the test script controls the
# restart.
#
# Requires CAP_NET_ADMIN + the kernel `vrf`/`vxlan` modules, same as
# M39/M48 — runs on the hosted kernel-dataplane runner (GitHub Actions).
#
# Usage:
#   docker build -t rustbgpd:dev .
#   containerlab deploy -t tests/interop/m61-evpn-l3-adoption-sweep.clab.yml
#   bash tests/interop/scripts/test-m61-evpn-l3-adoption-sweep.sh
#   containerlab destroy -t tests/interop/m61-evpn-l3-adoption-sweep.clab.yml

name: m61-evpn-l3-adoption-sweep

topology:
  nodes:
    pe1:
      kind: linux
      image: rustbgpd:dev
      cmd: sleep infinity
      binds:
        - ./configs/rustbgpd-m48-pe1.toml:/etc/rustbgpd/config.toml:ro
        - ./scripts/start-rustbgpd-m39-pe1.sh:/usr/local/bin/start-rustbgpd-m39-pe1.sh:ro
      exec:
        - ip addr add 10.0.0.1/24 dev eth1
        - ip link set eth1 up
      env:
        RUST_LOG: info,rustbgpd_evpn_linux=debug

    pe2:
      kind: linux
      image: quay.io/frrouting/frr:10.3.1
      binds:
        - ./configs/frr-daemons:/etc/frr/daemons:ro
        - ./configs/frr-bgpd-m39-pe2.conf:/etc/frr/frr.conf:ro
        - ./scripts/start-frr-vtep-l3.sh:/usr/local/bin/start-frr-vtep-l3.sh:ro
      exec:
        - ip addr add 10.0.0.2/24 dev eth1
        - ip link set eth1 up
        - /usr/local/bin/start-frr-vtep-l3.sh 10.0.0.2 100 vrf1 198.51.100.1/24
      env:
        VTEP_LOOPBACK: 10.0.0.2
        VTEP_VNI: "100"
        TENANT_VRF: vrf1
        TENANT_PREFIX: 198.51.100.1/24

  links:
    - endpoints: ["pe1:eth1", "pe2:eth1"]

# Underlay 10.0.0.0/24. L3VNI 100 (vrf1) on both PEs. PE1 tenant
# 192.0.2.1/24 on lo-vrf1 → Type 5; PE2 tenant 198.51.100.1/24 (A) →
# Type 5 imported into PE1's vrf1 kernel table. The driver adds
# 203.0.113.1/24 (B) on PE2's lo-vrf1 at runtime and deletes it while
# rustbgpd is down — both prefixes resolve via PE2's single VTEP IP /
# router MAC, so one neighbor + one FDB row serve both.
