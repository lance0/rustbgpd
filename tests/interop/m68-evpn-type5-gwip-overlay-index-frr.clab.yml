# Containerlab topology: rustbgpd PE1 → FRR PE2, native GW-IP
# overlay-index Type 5 consume-side proof (M68 — ADR-0087).
#
# Validates the cross-vendor behavior that ADR-0087 deliberately left
# as a follow-up after the pure self-consistency test:
#
#   1. rustbgpd originates a Type 5 for 203.0.113.0/24 from a static
#      VRF route via 10.1.1.5. Because `overlay_index_mode =
#      "gateway_ip"` and 10.1.1.5 lands on PE1's connected br10
#      subnet, the outbound Type 5 carries Gateway Address 10.1.1.5
#      and no Router-MAC extcomm.
#   2. Before the companion Type 2 exists, FRR receives the Type 5 but
#      does not install it into vrf1.
#   3. rustbgpd then originates a MAC+IP Type 2 for 10.1.1.5 on linked
#      L2VNI 10. FRR has `enable-resolve-overlay-index`, so it resolves
#      the Type 5 through that Type 2 and installs the prefix via
#      10.1.1.5 in vrf1.
#   4. Withdrawing the static route withdraws the Type 5 and FRR drops
#      the imported VRF route.
#
# Usage:
#   containerlab deploy -t tests/interop/m68-evpn-type5-gwip-overlay-index-frr.clab.yml
#   bash tests/interop/scripts/test-m68-evpn-type5-gwip-overlay-index-frr.sh
#   containerlab destroy -t tests/interop/m68-evpn-type5-gwip-overlay-index-frr.clab.yml

name: m68-evpn-type5-gwip-overlay-index-frr

topology:
  nodes:
    pe1:
      kind: linux
      image: rustbgpd:dev
      cmd: sleep infinity
      binds:
        - ./configs/rustbgpd-m68-pe1.toml:/etc/rustbgpd/config.toml:ro
        - ../fixtures/grpc-test-only-operator.token:/run/rustbgpd/grpc-test-only-operator.token:ro
        - ./scripts/start-rustbgpd-m68-pe1.sh:/usr/local/bin/start-rustbgpd-m68-pe1.sh:ro
        - ./scripts/start-rustbgpd.sh:/usr/local/bin/start-rustbgpd.sh:ro
      exec:
        - ip addr add 10.0.0.1/24 dev eth1
        - ip link set eth1 up
      env:
        RUST_LOG: info,rustbgpd_evpn_linux=debug,rustbgpd::evpn_l3_originator=debug,rustbgpd::evpn_originator=debug

    pe2:
      kind: linux
      image: quay.io/frrouting/frr:10.3.1
      binds:
        - ./configs/frr-daemons:/etc/frr/daemons:ro
        - ./configs/frr-bgpd-m68-pe2.conf:/etc/frr/frr.conf:ro
        - ./scripts/start-frr-vtep-gwip.sh:/usr/local/bin/start-frr-vtep-gwip.sh:ro
      exec:
        - ip addr add 10.0.0.2/24 dev eth1
        - ip link set eth1 up
        - /usr/local/bin/start-frr-vtep-gwip.sh 10.0.0.2 100 vrf1 10 10.1.1.2/24
      env:
        VTEP_LOOPBACK: 10.0.0.2
        VTEP_L3VNI: "100"
        VTEP_L2VNI: "10"
        TENANT_VRF: vrf1

  links:
    - endpoints: ["pe1:eth1", "pe2:eth1"]

# Underlay: 10.0.0.0/24. L3VNI 100 / vrf1 and linked L2VNI 10
# exist on both PEs. PE1 bridge br10 owns 10.1.1.1/24, PE2 bridge br10
# owns 10.1.1.2/24, and PE1 originates a Type 2 for gateway host
# 10.1.1.5 from a static FDB + bridge-neighbor row.
