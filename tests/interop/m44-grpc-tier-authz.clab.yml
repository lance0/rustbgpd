# Containerlab topology: rustbgpd ADR-0064 gRPC tier authorization
# (M44 — over-the-wire per-principal role enforcement).
#
# Single rustbgpd node with native mTLS on the gRPC listener and
# enforcement = "tier". No BGP peer is needed: the test exercises the
# gRPC authorization boundary, not a routing session. The mTLS PKI
# fixture is generated by tests/interop/scripts/gen-m44-certs.sh into
# ./configs/m44-certs/ before deploy and bind-mounted read-only.
#
# Usage:
#   docker build -t rustbgpd:dev .
#   bash tests/interop/scripts/gen-m44-certs.sh
#   containerlab deploy -t tests/interop/m44-grpc-tier-authz.clab.yml
#   bash tests/interop/scripts/test-m44-grpc-tier-authz.sh
#   containerlab destroy -t tests/interop/m44-grpc-tier-authz.clab.yml --cleanup

name: m44-grpc-tier-authz

topology:
  nodes:
    rustbgpd:
      kind: linux
      image: rustbgpd:dev
      cmd: sleep infinity
      binds:
        - ./configs/rustbgpd-m44-tier-authz.toml:/etc/rustbgpd/config.toml:ro
        - ./configs/m44-certs:/etc/rustbgpd/certs:ro
        - ./scripts/start-rustbgpd.sh:/usr/local/bin/start-rustbgpd.sh:ro
      # No `exec` data-plane setup and no `links:` — this is a
      # single-node topology that only exercises the gRPC management
      # listener over the container's management network. The
      # configured neighbor never establishes a session; it exists
      # only so sensitive-read RPCs have a target to resolve.
      env:
        RUST_LOG: info,rustbgpd_api=debug
