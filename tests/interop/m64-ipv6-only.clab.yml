# Containerlab topology: rustbgpd ↔ FRR (M64 — true IPv6-only peering
# via disable_ipv4_unicast)
#
# Two BGP sessions over one wire:
#
#   * fd00:64::1 ↔ fd00:64::2 — the IPv6-only session. rustbgpd sets
#     families = ["ipv6_unicast"] + disable_ipv4_unicast = true; FRR
#     deactivates the neighbor in ipv4 unicast and activates it in
#     ipv6 unicast. The session must Establish with NO IPv4-unicast
#     MultiProtocol capability received by FRR (the RFC 4760 §8
#     implicit-IPv4 fallback is suppressed), and IPv6 routes must
#     flow both directions.
#
#   * 10.64.0.1 ↔ 10.64.0.2 — the §8 regression guard. rustbgpd uses
#     defaults (no flag); FRR sends NO capabilities at all
#     (dont-capability-negotiate), so IPv4 unicast can only be
#     negotiated through the implicit fallback — which must still
#     work, proven by IPv4 routes flowing both directions.
#
# Usage:
#   containerlab deploy -t tests/interop/m64-ipv6-only.clab.yml
#   bash tests/interop/scripts/test-m64-ipv6-only.sh
#   containerlab destroy -t tests/interop/m64-ipv6-only.clab.yml --cleanup

name: m64-ipv6-only

topology:
  nodes:
    rustbgpd:
      kind: linux
      image: rustbgpd:dev
      cmd: sleep infinity
      binds:
        - ./configs/rustbgpd-m64-ipv6-only.toml:/etc/rustbgpd/config.toml:ro
        - ../fixtures/grpc-test-only-operator.token:/run/rustbgpd/grpc-test-only-operator.token:ro
        - ./scripts/start-rustbgpd.sh:/usr/local/bin/start-rustbgpd.sh:ro
      exec:
        - ip addr add 10.64.0.1/24 dev eth1
        - ip -6 addr add fd00:64::1/64 dev eth1
        - ip link set eth1 up
      env:
        RUST_LOG: info

    frr:
      kind: linux
      image: quay.io/frrouting/frr:10.3.1
      binds:
        - ./configs/frr-daemons:/etc/frr/daemons:ro
        - ./configs/frr-bgpd-m64-ipv6-only.conf:/etc/frr/frr.conf:ro
      exec:
        - ip addr add 10.64.0.2/24 dev eth1
        - ip -6 addr add fd00:64::2/64 dev eth1
        - ip link set eth1 up

  links:
    - endpoints: ["rustbgpd:eth1", "frr:eth1"]

# Network: fd00:64::/64 + 10.64.0.0/24
# rustbgpd: fd00:64::1 / 10.64.0.1, AS 65001
# FRR:      fd00:64::2 / 10.64.0.2, AS 65002
