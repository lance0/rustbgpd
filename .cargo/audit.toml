# cargo-audit configuration.
#
# Advisories listed under `ignore` are known to the project and have
# a tracked follow-up; they are NOT silently dismissed. The gate
# stays useful for surfacing *new* advisories filed against the
# dependency tree without blocking every PR on the existing triaged
# set. Each entry MUST point to a tracking item (commit message,
# ROADMAP bullet, or issue) so it is auditable.
#
# Process to remove an entry:
#   1. Bump the offending dependency or accept the soundness call
#      with documented reasoning.
#   2. Run `cargo audit` locally to confirm the advisory clears.
#   3. Delete the entry from this file in the same PR.

[advisories]
ignore = [
    # RUSTSEC-2024-0436 — `paste` 1.0.15 unmaintained (the upstream
    # author archived the repo). Informational, no security
    # vulnerability. The netlink stack no longer carries it; the sole
    # remaining chain is tikv-jemalloc-ctl → paste. We accept this
    # build-time proc-macro surface while tracking its removal under the
    # "`cargo deny` for license / dependency / advisory audit" bullet.
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0543 — `chrono` unmaintained, all versions affected.
    # Informational, no security vulnerability; alternatives are `jiff`
    # and `time`. Remaining chains: direct in the MRT writer; transitive
    # through rmcp and schemars; a dev-dependency through bgpkit-parser.
    # Revisit when rmcp and schemars drop chrono and the MRT writer has
    # moved off it, or when a real vulnerability is published against
    # chrono. Tracked under the "Unmaintained-crate advisory ignores"
    # bullet in docs/project/roadmap.md.
    "RUSTSEC-2026-0543",
]
