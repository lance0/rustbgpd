[package]
name = "rrharness"
version = "0.1.0"
edition = "2021"

[dependencies]
rustbgpd-rib = { path = "../../../crates/rib" }
rustbgpd-wire = { path = "../../../crates/wire" }
rustbgpd-telemetry = { path = "../../../crates/telemetry" }
tokio = { version = "1", features = ["full"] }
pprof = { version = "0.14", features = ["flamegraph"] }
libc = "0.2"

[profile.release]
debug = 1

[workspace]
