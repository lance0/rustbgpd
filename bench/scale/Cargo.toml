[workspace]
members = [
    "enhanced-route-refresh",
    "reloadstall",
    "rrharness",
    "rrtransport",
]
resolver = "2"

[workspace.dependencies]
socket2 = "0.6"

# Carried over from the former per-crate manifests: the profiling harnesses
# need line tables in release builds for folded-stack output.
[profile.release]
debug = 1
