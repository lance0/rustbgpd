# IXP-matrix BIRD 3.3.1 route server - generated by gen-bird-scenario.py.
# Run: docker run -d --network=host -v <out_dir>:/etc/bird <bird-image> \
#          bird -f -c /etc/bird/bird.conf
# Reload: overwrite gen.conf, then `birdc configure`.

router id 10.0.0.1;
threads 8;
log stderr all;

protocol device { scan time 10; }

# NEXT_HOP glue: device routes over lo so the stubs' synthetic
# 10.9.x.y next hops (and, with multihop, the 127.1.x.y neighbor
# addresses) resolve; sessions use `gateway recursive` below.
protocol static nh_glue {
    ipv4;
    route 10.9.0.0/16 via "lo";
    route 127.1.0.0/16 via "lo";
}

include "/etc/bird/gen.conf";

template bgp rs_member {
    local 127.0.0.1 port 1797 as 65500;
    rs client;
    passive;
    multihop;
    hold time 180;
    ipv4 {
        import filter member_in;
        export filter member_out;
        next hop keep;
        gateway recursive;
    };
}

protocol bgp peer0 from rs_member { neighbor 127.1.0.1 as 64512; }
protocol bgp peer1 from rs_member { neighbor 127.1.0.2 as 64513; }
protocol bgp peer2 from rs_member { neighbor 127.1.0.3 as 64514; }
protocol bgp peer3 from rs_member { neighbor 127.1.0.4 as 64515; }
protocol bgp peer4 from rs_member { neighbor 127.1.0.5 as 64516; }
protocol bgp peer5 from rs_member { neighbor 127.1.0.6 as 64517; }
protocol bgp peer6 from rs_member { neighbor 127.1.0.7 as 64518; }
protocol bgp peer7 from rs_member { neighbor 127.1.0.8 as 64519; }
protocol bgp peer8 from rs_member { neighbor 127.1.0.9 as 64520; }
protocol bgp peer9 from rs_member { neighbor 127.1.0.10 as 64521; }
protocol bgp peer10 from rs_member { neighbor 127.1.0.11 as 64522; }
protocol bgp peer11 from rs_member { neighbor 127.1.0.12 as 64523; }
protocol bgp peer12 from rs_member { neighbor 127.1.0.13 as 64524; }
protocol bgp peer13 from rs_member { neighbor 127.1.0.14 as 64525; }
protocol bgp peer14 from rs_member { neighbor 127.1.0.15 as 64526; }
protocol bgp peer15 from rs_member { neighbor 127.1.0.16 as 64527; }
protocol bgp peer16 from rs_member { neighbor 127.1.0.17 as 64528; }
protocol bgp peer17 from rs_member { neighbor 127.1.0.18 as 64529; }
protocol bgp peer18 from rs_member { neighbor 127.1.0.19 as 64530; }
protocol bgp peer19 from rs_member { neighbor 127.1.0.20 as 64531; }
