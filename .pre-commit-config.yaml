# Pre-commit hooks — local-only, no third-party hook-repo deps.
# Mirror lance0/prefixd and lance0/ttl, with the clippy / test
# invocations adapted to this workspace's CI flags from
# `.github/workflows/ci.yml` (cargo clippy --workspace --all-targets
# -- -D warnings; cargo test --workspace; cargo doc --workspace --lib
# --no-deps --document-private-items plus the rustbgpd and rbgp binaries).
#
# `cargo test --lib` + rustdoc are at pre-push (not pre-commit) so commits
# stay fast; Rust hooks run only when their inputs change.
#
# Rustdoc warning denial comes from `.cargo/config.toml`
# (build.rustdocflags), NOT an inline RUSTDOCFLAGS env: setting the env
# var only here gave the hook's doc build a different fingerprint from
# manual `cargo doc` runs, so each flavor invalidated the other's doc
# cache and pushes paid a full workspace re-doc.
#
# Every hook that compiles runs under `scripts/build-lock.sh`, so a commit or
# push waits for a concurrent `just gate` instead of compiling the same
# workspace at the same time. `cargo fmt` is exempt: it never builds.
#
# These hooks are the only local fmt/clippy pass. prek's shim also runs
# `.git/hooks/<hook>.legacy` when one exists, and an older setup left a
# `cargo fmt --check` plus `cargo clippy` script there, so every commit ran
# both checks twice. `just hooks` installs the shim and clears the leftover.
#
# Setup: see CONTRIBUTING.md "Pre-commit hooks", or run `just hooks`.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: bash scripts/build-lock.sh cargo clippy --locked --workspace --all-targets -- -D warnings
        language: system
        files: '(^|/)([^/]+\.rs|Cargo\.toml|Cargo\.lock)$'
        types: [file]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: bash scripts/build-lock.sh cargo test --locked --workspace --lib
        language: system
        files: '(^|/)([^/]+\.rs|Cargo\.toml|Cargo\.lock)$'
        types: [file]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-doc
        name: cargo doc
        entry: bash scripts/build-lock.sh cargo doc --locked --workspace --lib --no-deps --document-private-items
        language: system
        files: &rustdoc-inputs '(^|/)([^/]+\.rs|Cargo\.toml|Cargo\.lock)$|^(\.cargo/config(\.toml)?|rust-toolchain(\.toml)?|proto/.*\.proto|examples/route-server/hygiene\.rpol)$'
        types: [file]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-doc-rustbgpd-bin
        name: cargo doc (rustbgpd binary)
        entry: bash scripts/build-lock.sh cargo doc --locked -p rustbgpd --bin rustbgpd --no-deps
        language: system
        files: *rustdoc-inputs
        types: [file]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-doc-rbgp-bin
        name: cargo doc (rbgp binary)
        entry: bash scripts/build-lock.sh cargo doc --locked -p rustbgpctl --bin rbgp --no-deps
        language: system
        files: *rustdoc-inputs
        types: [file]
        pass_filenames: false
        stages: [pre-push]
