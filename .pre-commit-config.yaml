# Pre-commit hooks — local-only, no third-party hook-repo deps.
# Mirror lance0/prefixd and lance0/ttl, with the clippy / test
# invocations adapted to this workspace's CI flags from
# `.github/workflows/ci.yml` (cargo clippy --workspace --all-targets
# -- -D warnings; cargo test --workspace; cargo doc --workspace --lib
# --bin rustbgpd --bin rbgp --no-deps --document-private-items).
#
# A commit runs only `cargo fmt`. Clippy, `cargo test --lib` and rustdoc run
# at pre-push, so a round of several commits pays for them once; Rust hooks
# run only when their inputs change.
#
# The pre-push hooks go through `scripts/hook-once.sh`, which skips a check
# that already passed for the same clean tree and toolchain (a re-push, a
# second worktree at the same commit). `HOOK_ONCE_DISABLE=1 git push` forces
# them to run. `verbose: true` keeps its one-line run/skip verdict visible.
#
# Rustdoc warning denial comes from `.cargo/config.toml`
# (build.rustdocflags), NOT an inline RUSTDOCFLAGS env: setting the env
# var only here gave the hook's doc build a different fingerprint from
# manual `cargo doc` runs, so each flavor invalidated the other's doc
# cache and pushes paid a full workspace re-doc.
#
# Every hook that compiles runs under `scripts/build-lock.sh`, so a commit or
# push waits for a concurrent `just gate` instead of compiling the same
# workspace at the same time. `cargo fmt` is exempt: it never builds.
#
# These hooks are the only local fmt/clippy pass. prek's shim also runs
# `.git/hooks/<hook>.legacy` when one exists, and an older setup left a
# `cargo fmt --check` plus `cargo clippy` script there, so every commit ran
# both checks twice. `just hooks` installs the shim and clears the leftover.
#
# Setup: see CONTRIBUTING.md "Pre-commit hooks", or run `just hooks`.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: bash scripts/hook-once.sh clippy -- bash scripts/build-lock.sh cargo clippy --locked --workspace --all-targets -- -D warnings
        language: system
        files: '(^|/)([^/]+\.rs|Cargo\.toml|Cargo\.lock)$'
        types: [file]
        pass_filenames: false
        stages: [pre-push]
        verbose: true

      - id: cargo-test
        name: cargo test
        entry: bash scripts/hook-once.sh test -- bash scripts/build-lock.sh cargo test --locked --workspace --lib
        language: system
        files: '(^|/)([^/]+\.rs|Cargo\.toml|Cargo\.lock)$'
        types: [file]
        pass_filenames: false
        stages: [pre-push]
        verbose: true

      - id: cargo-doc
        name: cargo doc
        entry: bash scripts/hook-once.sh doc -- bash scripts/build-lock.sh cargo doc --locked --workspace --lib --bin rustbgpd --bin rbgp --no-deps --document-private-items
        language: system
        files: '(^|/)([^/]+\.rs|Cargo\.toml|Cargo\.lock)$|^(\.cargo/config(\.toml)?|rust-toolchain(\.toml)?|proto/.*\.proto|examples/route-server/hygiene\.rpol)$'
        types: [file]
        pass_filenames: false
        stages: [pre-push]
        verbose: true
