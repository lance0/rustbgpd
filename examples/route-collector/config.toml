# Route collector / looking glass configuration
#
# rustbgpd as a passive route collector. Accepts full tables from upstream
# peers, exports nothing. Provides route data via gRPC queries, MRT dumps,
# and BMP streaming.
#
# Architecture:
#   Upstreams (eBGP) → rustbgpd (collector) → gRPC / MRT / BMP
#
# See docs/USE_CASES.md for detailed walkthrough and API examples.

[global]
asn = 65534                      # Collector ASN (private, or use your own)
router_id = "10.255.0.1"
listen_port = 179
# RFC 8212: an eBGP neighbor with no explicit policy carries nothing in
# that direction. Both directions are spelled out below, so losing the
# export chain leaves a silent collector rather than a collector that
# re-advertises its upstreams to each other. Startup-only — SIGHUP keeps
# the running value, so changing it takes a daemon restart.
ebgp_requires_policy = true

[global.telemetry]
prometheus_addr = "0.0.0.0:9179"
log_format = "json"

# Local gRPC over a filesystem-gated Unix socket — the working default under
# the tier authorization mode. The collector is read-only, so its principal
# maps to the observer role (a sensitive_read ceiling).
[global.telemetry.grpc_uds]
path = "/var/lib/rustbgpd/grpc.sock"
principal = "looking-glass"

[security.grpc]
# Per-principal gRPC authorization (ADR-0064; default since v0.24.0).
# Roles: observer (sensitive_read) | automation (mutating) | operator (operator_only)
enforcement = "tier"

[security.grpc.roles]
looking-glass = "observer"

# Public looking-glass over TCP. A 0.0.0.0 listener must not be unauthenticated
# under tier — provide a bearer token + matching principal (or native mTLS),
# create the token file, then uncomment. Prefer an mTLS proxy for exposure.
# [global.telemetry.grpc_tcp]
# enabled = true
# address = "0.0.0.0:50051"
# token_file = "/etc/rustbgpd/grpc-token"
# principal = "looking-glass"

# RPKI — annotate every route with validation state
[rpki]
[[rpki.cache_servers]]
address = "127.0.0.1:3323"

# MRT periodic dumps for offline analysis and archival
# Compatible with bgpdump, BGPKIT parser, RouteViews/RIPE RIS tooling
[mrt]
output_dir = "/var/lib/rustbgpd/mrt"
dump_interval = 7200             # Every 2 hours
compress = true
file_prefix = "collector"

# BMP stream to OpenBMP or pmacct
[bmp]
sys_name = "rustbgpd-collector"
[[bmp.collectors]]
address = "10.0.0.100:5000"

# --- Global import policy: accept everything, on purpose ---
# A collector's job is to observe the table as its peers actually send it,
# so filtering on import would corrupt the archive it exists to produce.
# Permit-all is therefore the right import posture here — and it is stated
# rather than left off, so nothing downstream has to guess whether an
# unfiltered collector was intended. Add denies here only for data you
# deliberately refuse to record.

[policy.definitions.observe-all]
default_action = "permit"

# --- Global export policy: deny everything ---
# A collector never advertises routes to peers.

[policy]
import_chain = ["observe-all"]
export_chain = ["deny-all"]

[policy.definitions.deny-all]
[[policy.definitions.deny-all.statements]]
action = "deny"
prefix = "0.0.0.0/0"
le = 32

[[policy.definitions.deny-all.statements]]
action = "deny"
prefix = "::/0"
le = 128

# Import-decision explain, off. A collector's job is full tables, and the
# per-session cache defaults to 4096 entries — orders of magnitude short
# of one, so an explain query here would mostly report an evicted answer
# while the retention is billed per session anyway. Sizing it honestly for
# this shape means `cache_size` near the table size, times every upstream:
# an explicit choice, not a default. MRT dumps and BMP below are the
# collector-scale record; explain is the point query you switch on for a
# session while you are debugging one.
[policy.explain]
enabled = false

# --- Upstream peers ---
# Accept full tables. Adjust max_prefixes to your expected table size.

[[neighbors]]
address = "10.0.0.1"
remote_asn = 64501
description = "upstream-a"
families = ["ipv4_unicast", "ipv6_unicast"]
max_prefixes = 1000000

[[neighbors]]
address = "10.0.0.2"
remote_asn = 64502
description = "upstream-b"
families = ["ipv4_unicast", "ipv6_unicast"]
max_prefixes = 1000000
