# Linux edge FIB example
#
# rustbgpd as a BGP control plane on a Linux edge box. Unlike the
# route-injector examples, this config opts into ADR-0061 general unicast
# FIB programming: selected Loc-RIB best routes are installed into an
# explicit non-reserved Linux route table. The main table is never written.
#
# The operator is still responsible for policy, forwarding setup, and any
# `ip rule` entries that point traffic at table 1000.

[global]
asn = 65010
router_id = "192.0.2.10"
listen_port = 179
runtime_state_dir = "/var/lib/rustbgpd"
# RFC 8212: an eBGP neighbor with no explicit policy carries nothing in
# that direction. On a box that programs the kernel FIB, deleting the
# import chain must not quietly mean "install whatever arrives" and
# deleting the export chain must not quietly mean "announce transit to
# transit" — with this on, both fail closed. Startup-only — SIGHUP keeps
# the running value, so changing it takes a daemon restart.
ebgp_requires_policy = true

[global.telemetry]
prometheus_addr = "127.0.0.1:9179"
log_format = "json"

# Local-only gRPC is still the safest default for an edge host. Use a
# read-only mTLS TCP listener or mTLS proxy only when remote monitoring needs it.
[global.telemetry.grpc_uds]
path = "/var/lib/rustbgpd/grpc.sock"
mode = 0o600
# Audit principal for this local socket (UDS access is gated by file perms);
# mapped to a role in [security.grpc.roles] below.
principal = "operator"

[security.grpc]
# Per-principal gRPC authorization (ADR-0064; default since v0.24.0).
# Roles: observer (sensitive_read) | automation (mutating) | operator (operator_only)
enforcement = "tier"

[security.grpc.roles]
operator = "operator"

# --- Policy for transit peers ---
#
# Import: accept what transit sends minus the default route. A box that
# installs best routes into the kernel has no business taking 0.0.0.0/0 or
# ::/0 from a transit session by accident; add RPKI, AS_PATH, and bogon
# rules here as your filtering matures.
[policy.definitions.from-transit]
default_action = "permit"

[[policy.definitions.from-transit.statements]]
action = "deny"
prefix = "0.0.0.0/0"

[[policy.definitions.from-transit.statements]]
action = "deny"
prefix = "::/0"

# Export: deny by default, and empty on purpose. This is an edge box, not
# a transit provider — re-advertising one transit's table to the other is
# the classic leak, and an empty deny-all chain cannot do it. Add one
# permit statement per prefix this AS originates:
#
#   [[policy.definitions.to-transit.statements]]
#   action = "permit"
#   prefix = "192.0.2.0/24"
[policy.definitions.to-transit]
default_action = "deny"

# Shared transport / policy defaults for transit peers. The FIB table below
# also uses this name as an allow-list, so only best routes learned from this
# peer group are eligible for kernel install. Keep a peer import cap alongside
# the FIB max_routes guardrail so route leaks are bounded before kernel export.
# The chains attach here rather than per neighbor so a new transit session
# inherits both directions by joining the group.
[peer_groups.transit]
hold_time = 90
max_prefixes = 100000
import_policy_chain = ["from-transit"]
export_policy_chain = ["to-transit"]

[[neighbors]]
address = "198.51.100.1"
remote_asn = 64501
description = "transit-a"
peer_group = "transit"
families = ["ipv4_unicast"]

[[neighbors]]
address = "2001:db8:100::1"
remote_asn = 64502
description = "transit-b"
peer_group = "transit"
families = ["ipv6_unicast"]

# Explicit opt-in for ordinary unicast FIB programming. The actor writes only
# this table_id + metric pair, marks routes RTPROT_BGP, preserves foreign
# rows, drains daemon-owned rows on coordinated shutdown, and persists
# owned-state receipts under runtime_state_dir for crash recovery.
[[fib_tables]]
name = "edge"
table_id = 1000
metric = 200
families = ["ipv4_unicast", "ipv6_unicast"]
allowed_peer_groups = ["transit"]
max_routes = 100000
