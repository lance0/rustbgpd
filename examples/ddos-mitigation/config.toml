# DDoS mitigation configuration
#
# rustbgpd as a FlowSpec + RTBH route injector for automated DDoS mitigation.
# A mitigation platform (e.g., prefixd, custom automation) pushes FlowSpec
# rules and blackhole routes via gRPC. rustbgpd distributes them to edge
# routers that enforce filtering at line rate.
#
# Architecture:
#   Detection → Mitigation platform → rustbgpd (gRPC) → Edge routers (eBGP)
#
# See docs/USE_CASES.md for detailed walkthrough and API examples.

[global]
asn = 65500
router_id = "10.255.0.1"
listen_port = 179
# RFC 7999 receiver scoping. When an EBGP peer sends BLACKHOLE
# (65535:666), rustbgpd preserves BLACKHOLE and adds NO_ADVERTISE so
# the route is not propagated beyond this mitigation domain.
#
# This is control-plane scoping only: rustbgpd does not install a local
# kernel discard route for BLACKHOLE-tagged prefixes.
honor_blackhole = true

[global.telemetry]
prometheus_addr = "127.0.0.1:9179"
log_format = "json"

# gRPC TCP listener for mitigation platform access.
# Secure with a bearer token. For remote access, use an mTLS proxy
# (see examples/envoy-mtls/).
[global.telemetry.grpc_tcp]
enabled = true
address = "127.0.0.1:50051"
# Uncomment and create the token file for bearer-token auth:
# token_file = "/etc/rustbgpd/grpc-token"

# BMP export for audit trail — stream every rule change to your collector
[bmp]
sys_name = "rustbgpd-ddos"
[[bmp.collectors]]
address = "10.0.0.100:5000"

# --- RTBH safety guard ---
# Keep BLACKHOLE strict at the import policy edge: allow only exact host
# routes and reject broader BLACKHOLE-tagged prefixes. The global
# honor_blackhole knob above still appends the implicit RFC 7999 scoping rule
# after this chain, so accepted BLACKHOLE routes also get NO_ADVERTISE.
[policy.definitions.blackhole-host-routes]
default_action = "permit"

[[policy.definitions.blackhole-host-routes.statements]]
prefix = "0.0.0.0/0"
ge = 32
le = 32
match_community = ["BLACKHOLE"]
action = "permit"

[[policy.definitions.blackhole-host-routes.statements]]
prefix = "::/0"
ge = 128
le = 128
match_community = ["BLACKHOLE"]
action = "permit"

[[policy.definitions.blackhole-host-routes.statements]]
prefix = "0.0.0.0/0"
ge = 0
le = 31
match_community = ["BLACKHOLE"]
action = "deny"

[[policy.definitions.blackhole-host-routes.statements]]
prefix = "::/0"
ge = 0
le = 127
match_community = ["BLACKHOLE"]
action = "deny"

[policy]
import_chain = ["blackhole-host-routes"]

# --- Edge routers ---
# These enforce FlowSpec rules in hardware. Use short hold times so
# rustbgpd can detect and react to router failures quickly.

[[neighbors]]
address = "10.0.0.1"
remote_asn = 65001
description = "edge-router-1"
families = ["ipv4_unicast", "ipv4_flowspec", "ipv6_flowspec"]
hold_time = 30

[[neighbors]]
address = "10.0.0.2"
remote_asn = 65001
description = "edge-router-2"
families = ["ipv4_unicast", "ipv4_flowspec", "ipv6_flowspec"]
hold_time = 30
