# Quick-start: rustbgpd + FRR peer
#
# Spins up rustbgpd with an FRR neighbor that advertises sample prefixes.
# Useful for trying out rbgp commands without real routers.
#
# Usage:
#   docker compose up -d
# The rustbgpd service sets RUSTBGPD_TOKEN_FILE for in-container rbgp calls.
#   docker compose exec rustbgpd rbgp -s http://127.0.0.1:50051 neighbor
#   docker compose exec rustbgpd rbgp -s http://127.0.0.1:50051 top
#
# From the host (gRPC exposed on localhost:50051):
#   export RUSTBGPD_TOKEN_FILE="$PWD/../../tests/fixtures/grpc-test-only-operator.token"
#   cargo run -p rustbgpctl --bin rbgp -- -s http://127.0.0.1:50051 neighbor
#   cargo run -p rustbgpctl --bin rbgp -- -s http://127.0.0.1:50051 top

services:
  rustbgpd:
    build: ../..
    # The daemon persists runtime mutations (`rbgp neighbor add`, policy edits,
    # gNMI Set) back to its config file with a temp-file + rename write, so the
    # config must live in a directory the daemon user can write. A bind-mounted
    # file cannot be one: the mount is read-only and its parent is the image's
    # root-owned /etc. So the checked-in file is mounted as a template and
    # copied once into the daemon's writable state directory, which is where
    # the running config lives. `-n` keeps a restart from discarding runtime
    # edits already made in the volume.
    command:
      - /bin/sh
      - -c
      - cp -n /etc/rustbgpd/config.template.toml /var/lib/rustbgpd/config.toml
        && exec rustbgpd /var/lib/rustbgpd/config.toml
    volumes:
      - ./rustbgpd.toml:/etc/rustbgpd/config.template.toml:ro
      # Named volume so runtime config edits survive `docker compose restart`.
      # It inherits the image directory's rustbgpd ownership on first use.
      - rustbgpd-state:/var/lib/rustbgpd
      # Public test-only credential shared with the interop harness. It is a
      # runnable example, never a production secret.
      - ../../tests/fixtures/grpc-test-only-operator.token:/run/rustbgpd/grpc-test-only-operator.token:ro
    environment:
      RUSTBGPD_TOKEN_FILE: /run/rustbgpd/grpc-test-only-operator.token
    networks:
      bgp:
        ipv4_address: 10.99.0.10
        ipv6_address: fd99::10
    ports:
      - "127.0.0.1:50051:50051"   # gRPC (host loopback only)
      - "127.0.0.1:9179:9179"     # Prometheus metrics
    cap_add:
      - NET_BIND_SERVICE

  frr:
    image: quay.io/frrouting/frr:10.3.1
    volumes:
      - ./frr-daemons:/etc/frr/daemons:ro
      - ./frr.conf:/etc/frr/frr.conf:ro
    networks:
      bgp:
        ipv4_address: 10.99.0.20
        ipv6_address: fd99::20
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN

networks:
  bgp:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.99.0.0/24
        - subnet: fd99::/64

volumes:
  rustbgpd-state:
