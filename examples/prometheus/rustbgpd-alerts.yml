# Prometheus alert rules for rustbgpd.
#
# Load via prometheus.yml:
#
#   rule_files:
#     - rustbgpd-alerts.yml
#
# Every expression references only metrics the daemon actually exports
# (crates/telemetry/src/metrics.rs). The rules assume the scrape config
# from docs/GRAFANA.md (`job_name: rustbgpd`) — adjust the `job` label
# in RustbgpdDown if yours differs.
#
# The daemon does not export a per-peer session-state gauge; session
# health is derived from the counter pair
# `bgp_session_established_total` / `bgp_session_flaps_total`
# (entering Established increments the former, leaving it increments
# the latter, so an Established peer always reads established = flaps + 1).
# Session-level metrics label peers as "<addr>:<port>" (the transport
# remote address); RIB metrics use the bare configured neighbor address.
#
# Unit tests: rustbgpd-alerts_test.yml (`promtool test rules`).

groups:
  - name: rustbgpd
    rules:
      - alert: RustbgpdDown
        expr: up{job="rustbgpd"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "rustbgpd is down ({{ $labels.instance }})"
          description: >-
            Prometheus has been unable to scrape rustbgpd at
            {{ $labels.instance }} for 2 minutes. The daemon is down,
            unreachable, or `prometheus_addr` is no longer configured.

      - alert: BgpSessionNotEstablished
        # A peer that has left Established and not returned reads
        # flaps >= established (an Established peer reads
        # established = flaps + 1). A peer that has never reached
        # Established since daemon start has neither series and cannot
        # fire — pair with RustbgpdDown and BgpPeerAdjRibInEmpty.
        expr: bgp_session_flaps_total >= bgp_session_established_total
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "BGP session to {{ $labels.peer }} not Established"
          description: >-
            The BGP session to peer {{ $labels.peer }} on
            {{ $labels.instance }} left Established more than 2 minutes
            ago and has not re-established.

      - alert: BgpSessionFlapping
        expr: increase(bgp_session_flaps_total[15m]) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "BGP session to {{ $labels.peer }} is flapping"
          description: >-
            The BGP session to peer {{ $labels.peer }} on
            {{ $labels.instance }} left Established
            {{ $value | printf "%.0f" }} times in the last 15 minutes.

      - alert: BgpPeerSlow
        # Session metrics label `peer` as the transport endpoint
        # (IPv4 addr:port or bracketed-IPv6 addr:port), not the bare
        # configured neighbor address used by RIB metrics.
        expr: bgp_peer_slow == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "BGP peer endpoint {{ $labels.peer }} is slow"
          description: >-
            The Established session endpoint {{ $labels.peer }} on
            {{ $labels.instance }} has remained slow for 5 minutes because
            its outbound coalesced-frame queue is not draining. Updates are
            still buffered; inspect bgp_peer_outbound_queue_depth and the
            remote receiver before the backlog reaches its bound.

      - alert: BgpPeerAdjRibInEmpty
        # Established (established > flaps) but zero prefixes in
        # Adj-RIB-In across all families (afi_safi="all" is the
        # aggregate series). Session metrics label peers as
        # "<addr>:<port>" while RIB metrics use the bare neighbor
        # address, so label_replace strips the transport port before
        # the join. Expected for send-only peers — silence or drop
        # this rule for those.
        expr: >-
          bgp_rib_prefixes{afi_safi="all"} == 0
          and on (instance, peer)
          label_replace(
            bgp_session_established_total > bgp_session_flaps_total,
            "peer", "$1", "peer", `\[?([^\]]+?)\]?:[0-9]+$`
          )
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No prefixes from {{ $labels.peer }}"
          description: >-
            The session to {{ $labels.peer }} on {{ $labels.instance }}
            is Established but its Adj-RIB-In has held zero prefixes
            for 10 minutes.

      - alert: BgpMaxPrefixLimitExceeded
        # Each increment is followed by a Cease NOTIFICATION and
        # session teardown (docs/OPERATIONS.md "Peer max-prefix
        # exceeded").
        expr: increase(bgp_max_prefix_exceeded_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Peer {{ $labels.peer }} exceeded its max-prefix limit"
          description: >-
            Peer {{ $labels.peer }} on {{ $labels.instance }} breached
            a configured max-prefix ceiling in the last 10 minutes;
            the session was torn down with a Cease / Maximum Number of
            Prefixes Reached NOTIFICATION.

      - alert: BgpMaxPrefixNearLimit
        # Limit series exist only for finite configured bounds. Unlimited
        # scopes are absent rather than represented by a fake zero, and
        # disconnected sessions reap all three capacity series.
        expr: bgp_max_prefix_usage / bgp_max_prefix_limit >= 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: >-
            Peer {{ $labels.peer }} max-prefix {{ $labels.scope }} usage is high
          description: >-
            Peer {{ $labels.peer }} on {{ $labels.instance }} has remained at
            or above 80% of its finite {{ $labels.scope }} max-prefix limit for
            10 minutes. Continued accepted-route growth can exhaust
            bgp_max_prefix_headroom and eventually trigger Cease / Maximum
            Number of Prefixes Reached.

      - alert: RpkiVrpTableEmpty
        # Series only exist once an RTR cache has delivered data, so
        # this cannot fire on deployments without RPKI configured. An
        # empty merged VRP table afterwards means every configured
        # cache is down or expired — origin validation is effectively
        # off (routes fall back to not_found).
        expr: sum by (instance, job) (bgp_rpki_vrp_count) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "RPKI VRP table empty on {{ $labels.instance }}"
          description: >-
            The merged RPKI VRP table on {{ $labels.instance }} has been
            empty for 30 minutes. All configured RTR caches are down,
            expired, or delivering no data; prefix origin validation is
            not filtering anything.

      - alert: BgpEventOutboxDegraded
        # Latches to 1 on any durability-impacting drop, decode/codec
        # failure, or DB-open failure; does not auto-clear (operator
        # restarts to clear — docs/OPERATIONS.md event-outbox section).
        expr: bgp_event_outbox_degraded == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Event outbox degraded on {{ $labels.instance }}"
          description: >-
            The durable event outbox on {{ $labels.instance }} has seen
            a durability-impacting drop, decode failure, or open failure
            since start. Check bgp_event_outbox_dropped_total and
            bgp_event_outbox_open_failures_total, then the daemon log.

      - alert: BgpUpdateGroupResidueGrowing
        # Withdrawal residue is bounded by the resync timer; a climb
        # sustained for a full hour means a wedged update-group member
        # is accumulating residue its resync never clears.
        expr: delta(bgp_update_group_residue_entries[1h]) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Update-group withdrawal residue growing on {{ $labels.instance }}"
          description: >-
            bgp_update_group_residue_entries on {{ $labels.instance }}
            has grown continuously for over an hour. A dirty update-group
            member appears wedged; its resync is not draining residue.

      - alert: BgpPolicyTransitionStalled
        # Healthy transitions are expected to finish well below this window.
        # Readiness fails closed at 30s; the alert requires persistence for a
        # full minute before firing.
        expr: bgp_rib_policy_transition_in_progress == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Export-policy transition stalled on {{ $labels.instance }}"
          description: >-
            bgp_rib_policy_transition_in_progress on {{ $labels.instance }}
            has remained 1 for at least one minute. RIB readiness is
            failing closed and ordinary queries and mutations remain fenced.
            Check the poll_kind histogram and the daemon's policy-transition
            warning; bgp_rib_policy_transition_last_duration_milliseconds is
            the previous terminal sample until this transition completes.

      - alert: BgpPolicyTransitionActorPollExceededReadinessBudget
        # Histogram subtraction classifies observations above the exact
        # 200ms bucket boundary. `ignoring(le)` is required to match the
        # histogram count and bucket series while retaining bounded
        # instance/job/poll_kind identity.
        expr: >-
          increase(bgp_rib_policy_transition_actor_poll_duration_seconds_count[15m])
          - ignoring(le)
          increase(bgp_rib_policy_transition_actor_poll_duration_seconds_bucket{le="0.2"}[15m])
          > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            RIB actor poll exceeded readiness budget ({{ $labels.poll_kind }})
          description: >-
            The {{ $labels.poll_kind }} export-policy transition path on
            {{ $labels.instance }} exceeded the 200ms actor-poll budget in
            the last 15 minutes. A long single-threaded poll could delay a
            concurrent readiness probe and other RIB work; inspect the
            dashboard p99 and transition state before retrying a reload.

      - alert: BgpPolicyEvalErrors
        # An evaluation error makes the policy engine treat the
        # affected route as Deny (uniform eval-error rails), so every
        # increment is a route silently dropped by a broken policy —
        # fix the policy (`rbgp policy check`), don't silence the
        # alert.
        expr: increase(bgp_policy_eval_errors_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            Policy evaluation errors ({{ $labels.direction }},
            {{ $labels.kind }})
          description: >-
            bgp_policy_eval_errors_total{direction="{{ $labels.direction
            }}", kind="{{ $labels.kind }}"} on {{ $labels.instance }}
            increased by {{ $value | printf "%.0f" }} in the last 15
            minutes. Routes hitting the failing statement are being
            denied.

      - alert: BgpExactExportRejected
        # The counter is labeled with the bare configured neighbor address,
        # not the transport endpoint used by session metrics. Every increment
        # means an announcement was withheld before Adj-RIB-Out commit.
        expr: increase(bgp_exact_export_rejections_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            Exact export rejected for {{ $labels.peer }} ({{ $labels.family }})
          description: >-
            bgp_exact_export_rejections_total for neighbor {{ $labels.peer }}
            on {{ $labels.instance }} increased by
            {{ $value | printf "%.0f" }} in the last 15 minutes
            (family={{ $labels.family }}, reason={{ $labels.reason }}).
            The rejected announcement was not committed to Adj-RIB-Out;
            inspect the corresponding daemon warning and advertised-route
            explain output.

      - alert: BgpMalformedUpdate
        # The counter keeps the transport/session peer label (addr:port or
        # [IPv6]:port). Every increment is one malformed UPDATE after its
        # strongest RFC 7606 disposition has been selected.
        expr: increase(bgp_update_malformed_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            Malformed UPDATE from {{ $labels.peer }}
            ({{ $labels.disposition }})
          description: >-
            bgp_update_malformed_total for session endpoint
            {{ $labels.peer }} on {{ $labels.instance }} increased by
            {{ $value | printf "%.0f" }} in the last 15 minutes. The
            strongest RFC 7606 disposition was {{ $labels.disposition }};
            inspect the peer and the daemon's malformed-UPDATE diagnostics.

      - alert: BgpSelectionDeferralTimedOut
        # Normal active/waiter/release state is intentionally not alertable.
        # A timer release is an exceptional convergence fallback.
        expr: increase(bgp_selection_deferral_timeouts_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            Selection deferral timed out for {{ $labels.afi_safi }}
          description: >-
            bgp_selection_deferral_timeouts_total for
            {{ $labels.afi_safi }} on {{ $labels.instance }} increased by
            {{ $value | printf "%.0f" }} in the last 15 minutes. The family
            gate used its bounded timer fallback before all planned-restart
            convergence signals arrived.
      - alert: BgpSelectionDeferralLedgerOverflow
        # Overflow remains safe because release falls back to a complete
        # family sweep, but it signals that the bounded identity ledger was
        # exhausted and merits operator investigation.
        expr: increase(bgp_selection_deferral_ledger_overflows_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            Selection-deferral ledger overflow for {{ $labels.afi_safi }}
          description: >-
            bgp_selection_deferral_ledger_overflows_total for
            {{ $labels.afi_safi }} on {{ $labels.instance }} increased by
            {{ $value | printf "%.0f" }} in the last 15 minutes. The family
            exceeded the bounded identity ledger and used a complete release
            sweep; inspect table scale and retained-key pressure.
