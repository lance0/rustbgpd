# Prometheus alert rules for rustbgpd.
#
# Load via prometheus.yml:
#
#   rule_files:
#     - rustbgpd-alerts.yml
#
# Every expression references only metrics the daemon actually exports
# (crates/telemetry/src/metrics.rs). The rules assume the scrape config
# from docs/GRAFANA.md (`job_name: rustbgpd`) — adjust the `job` label
# in RustbgpdDown, RustbgpdRestarted, and MrtDumpStale if yours differs.
#
# Current peer health uses the level gauges
# `bgp_peer_admin_enabled{peer,interface}` and
# `bgp_peer_session_established{peer,interface}`. The historical
# `bgp_session_established_total` / `bgp_session_flaps_total` counters remain
# available for churn and flap-rate analysis.
# Every `peer` label is the bare neighbor address ("192.0.2.1",
# "2001:db8::1") in every metric family, so `by (peer)` aggregations and
# joins across families work without rewriting the label.
#
# Unit tests: rustbgpd-alerts_test.yml (`promtool test rules`).

groups:
  - name: rustbgpd
    rules:
      - alert: RustbgpdDown
        expr: up{job="rustbgpd"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "rustbgpd is down ({{ $labels.instance }})"
          description: >-
            Prometheus has been unable to scrape rustbgpd at
            {{ $labels.instance }} for 2 minutes. The daemon is down,
            unreachable, or `prometheus_addr` is no longer configured.

      - alert: RustbgpdRestarted
        expr: changes(process_start_time_seconds{job="rustbgpd"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "rustbgpd restarted ({{ $labels.instance }})"
          description: >-
            The sampled process start time for rustbgpd at
            {{ $labels.instance }} changed in the last 10 minutes. This is a
            generic restart signal; inspect logs and the service manager for
            the reason.

      - alert: BgpRuntimeConfigSettlementSlow
        # Early advisory: ten minutes of owned settlement is far past any
        # measured normal apply but leaves twenty minutes of the fixed
        # 30-minute fail-stop budget for an operator to inspect the owner.
        # Elapsed is derived at scrape time from the stored start instant,
        # so a wedged owner keeps this firing on a frozen phase.
        # Recovery-fenced owners are already committed to exit 70 and are
        # deliberately excluded.
        expr: >-
          bgp_runtime_config_settlement_active{fence_reason="none"} == 1
          and
          bgp_runtime_config_settlement_elapsed_seconds{fence_reason="none"} >= 600
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Runtime-config settlement still running after ten minutes"
          description: >-
            The {{ $labels.kind }} runtime-config operation on
            {{ $labels.instance }} has held ownership in {{ $labels.phase }}
            with its response {{ $labels.response_attached }} for at least
            ten minutes. Inspect the owning actor now; the daemon exits
            independently when the fixed 30-minute budget plus five-second
            grace expires.

      - alert: BgpRuntimeConfigSettlementHalfBudget
        # The owner has consumed half of the fixed 30-minute settlement
        # budget. Recovery-fenced owners are already committed to exit 70 and
        # are deliberately excluded from this early operator warning.
        expr: >-
          bgp_runtime_config_settlement_active{fence_reason="none"} == 1
          and
          (bgp_runtime_config_settlement_elapsed_seconds{fence_reason="none"}
          / bgp_runtime_config_settlement_budget_seconds{fence_reason="none"}) >= 0.5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Runtime-config settlement consumed half its budget"
          description: >-
            The {{ $labels.kind }} runtime-config operation on
            {{ $labels.instance }} remains in {{ $labels.phase }} with its
            response {{ $labels.response_attached }} after consuming at least
            half of the fail-stop budget. Inspect the owning actor now; the
            daemon exits independently when the 30-minute budget plus
            five-second grace expires.

      - alert: BgpSessionNotEstablished
        # Exact configured identity join: catches enabled peers that have never
        # Established as well as peers that established previously and went
        # down. Disabled peers and a healthy scoped sibling do not match.
        expr: >-
          bgp_peer_admin_enabled == 1
          and on (instance, peer, interface)
          bgp_peer_session_established == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "BGP session to {{ $labels.peer }} not Established"
          description: >-
            The administratively enabled BGP session to peer
            {{ $labels.peer }} on interface "{{ $labels.interface }}" at
            {{ $labels.instance }} has not been Established for more than
            2 minutes.

      - alert: BgpSessionFlapping
        expr: increase(bgp_session_flaps_total[15m]) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "BGP session to {{ $labels.peer }} is flapping"
          description: >-
            The BGP session to peer {{ $labels.peer }} on
            {{ $labels.instance }} left Established
            {{ $value | printf "%.0f" }} times in the last 15 minutes.

      - alert: BgpPeerSlow
        expr: bgp_peer_slow == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "BGP peer {{ $labels.peer }} is slow"
          description: >-
            The Established session to {{ $labels.peer }} on
            {{ $labels.instance }} has remained slow for 5 minutes because
            its outbound coalesced-frame queue is not draining. Updates are
            still buffered; inspect bgp_peer_outbound_queue_depth and the
            remote receiver before the backlog reaches its bound.

      - alert: BgpPeerAdjRibInEmpty
        # At least one current scoped session is Established, but the
        # peer-level Adj-RIB-In is empty across all families
        # (afi_safi="all" is the aggregate series). Aggregating the
        # session gauge by peer handles link-local siblings while the
        # join preserves native labels from the RIB series. Expected for
        # send-only peers — silence or drop this rule for those.
        expr: >-
          bgp_rib_prefixes{afi_safi="all"} == 0
          and on (instance, peer)
          max by (instance, peer) (bgp_peer_session_established) == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No prefixes from {{ $labels.peer }}"
          description: >-
            The session to {{ $labels.peer }} on {{ $labels.instance }}
            is Established but its Adj-RIB-In has held zero prefixes
            for 10 minutes.

      - alert: BgpMaxPrefixLimitExceeded
        # Each increment is followed by a Cease NOTIFICATION and
        # session teardown (docs/OPERATIONS.md "Peer max-prefix
        # exceeded").
        expr: increase(bgp_max_prefix_exceeded_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Peer {{ $labels.peer }} exceeded its max-prefix limit"
          description: >-
            Peer {{ $labels.peer }} on {{ $labels.instance }} breached
            a configured max-prefix ceiling in the last 10 minutes;
            the session was torn down with a Cease / Maximum Number of
            Prefixes Reached NOTIFICATION.

      - alert: BgpMaxPrefixNearLimit
        # Limit series exist only for finite configured bounds. Unlimited
        # scopes are absent rather than represented by a fake zero, and
        # disconnected sessions reap all three capacity series.
        expr: bgp_max_prefix_usage / bgp_max_prefix_limit >= 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: >-
            Peer {{ $labels.peer }} max-prefix {{ $labels.scope }} usage is high
          description: >-
            Peer {{ $labels.peer }} on {{ $labels.instance }} has remained at
            or above 80% of its finite {{ $labels.scope }} max-prefix limit for
            10 minutes. Continued accepted-route growth can exhaust
            bgp_max_prefix_headroom and eventually trigger Cease / Maximum
            Number of Prefixes Reached.

      - alert: BgpDynamicNeighborSlotsNearLimit
        # Both gauges are process-global and label-free before scrape labels.
        # Require a positive configured limit explicitly so an absent or zero
        # limit cannot produce a capacity warning.
        expr: >-
          bgp_dynamic_neighbor_slots_used
          / bgp_dynamic_neighbor_slots_limit >= 0.8
          and bgp_dynamic_neighbor_slots_limit > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Dynamic-neighbor admission slots are nearly exhausted"
          description: >-
            Dynamic-neighbor admission-slot usage on {{ $labels.instance }}
            has remained at or above 80% of its process-global limit for
            10 minutes. Inspect bgp_dynamic_neighbor_slots_headroom before
            new matching inbound sessions are rejected.

      - alert: BgpDynamicNeighborLimitRejected
        expr: increase(bgp_dynamic_neighbor_limit_rejections_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Dynamic-neighbor admission rejected"
          description: >-
            Dynamic-neighbor admission on {{ $labels.instance }} rejected
            {{ $value | printf "%.0f" }} matching inbound connection(s) in
            the last 10 minutes because the process-global slot limit was
            full.

      - alert: BgpRfc8212MissingImportPolicy
        expr: bgp_rfc8212_missing_import_policy == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Peer {{ $labels.peer }} is missing an RFC 8212 import policy"
          description: >-
            The RFC 8212 missing-import gauge for {{ $labels.peer }} on
            {{ $labels.instance }} has remained 1 for 5 minutes; inbound
            routes are failing closed.

      - alert: BgpRfc8212MissingExportPolicy
        expr: bgp_rfc8212_missing_export_policy == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Peer {{ $labels.peer }} is missing an RFC 8212 export policy"
          description: >-
            The RFC 8212 missing-export gauge for {{ $labels.peer }} on
            {{ $labels.instance }} has remained 1 for 5 minutes; outbound
            routes are failing closed.

      - alert: BgpOutboundPrefixBlocking
        expr: bgp_outbound_prefix_blocking == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: >-
            Outbound prefix blocking for {{ $labels.peer }}
            ({{ $labels.family }})
          description: >-
            The outbound prefix-limit blocking gauge for {{ $labels.peer }}
            ({{ $labels.family }}) on {{ $labels.instance }} has remained 1
            for 5 minutes; its advertised view is intentionally below group
            intent.

      - alert: BgpBlackholeDiscardInstallActivity
        # Use a zero-activity baseline so every successful discard install is
        # correlated with intended policy. This follows the established
        # reset-safe event-counter convention without inventing a
        # deployment-specific volume threshold.
        expr: increase(bgp_blackhole_discard_installed_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "BLACKHOLE discard install activity on {{ $labels.instance }}"
          description: >-
            rustbgpd successfully installed {{ $value | printf "%.0f" }} RFC
            7999 kernel discard route(s) on {{ $labels.instance }} in the last
            10 minutes. Confirm the activity matches expected policy and
            inspect current kernel discard state.

      - alert: BgpBlackholeDiscardAdmissionLimited
        expr: increase(bgp_blackhole_discard_rejected_total{reason=~"active_limit_exceeded|install_rate_limited"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "BLACKHOLE discard admission limited on {{ $labels.instance }}"
          description: >-
            rustbgpd recorded {{ $value | printf "%.0f" }} retryable BLACKHOLE
            discard admission transition(s) for {{ $labels.reason }} on
            {{ $labels.instance }} in the last 10 minutes. Inspect the active
            population, configured cap, and install token-bucket settings.

      - alert: RpkiVrpTableEmpty
        # Series only exist once an RTR cache has delivered data, so
        # this cannot fire on deployments without RPKI configured. An
        # empty merged VRP table afterwards means every configured
        # cache is down or expired — origin validation is effectively
        # off (routes fall back to not_found).
        expr: sum by (instance, job) (bgp_rpki_vrp_count) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "RPKI VRP table empty on {{ $labels.instance }}"
          description: >-
            The merged RPKI VRP table on {{ $labels.instance }} has been
            empty for 30 minutes. All configured RTR caches are down,
            expired, or delivering no data; prefix origin validation is
            not filtering anything.

      - alert: RpkiCacheEndOfDataNotReady
        expr: bgp_rpki_cache_end_of_data_ready == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "RPKI cache {{ $labels.cache }} has no validated End of Data"
          description: >-
            RPKI cache {{ $labels.cache }} on {{ $labels.instance }} has had no
            usable retained contribution for 15 minutes. Check this cache
            independently; other configured caches may still be ready and
            contributing to the merged validation table.

      - alert: BgpEventOutboxDegraded
        # Latches to 1 on any durability-impacting drop, decode/codec
        # failure, or DB-open failure; does not auto-clear (operator
        # restarts to clear — docs/OPERATIONS.md event-outbox section).
        expr: bgp_event_outbox_degraded == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Event outbox degraded on {{ $labels.instance }}"
          description: >-
            The durable event outbox on {{ $labels.instance }} has seen
            a durability-impacting drop, decode failure, or open failure
            since start. Check bgp_event_outbox_dropped_total and
            bgp_event_outbox_open_failures_total, then the daemon log.

      - alert: MrtDumpStale
        # mrt_last_dump_success_timestamp_seconds stays 0 until the first
        # successful dump, so dump age is anchored on process start until
        # then: a daemon whose dumps have never succeeded alerts after the
        # same 2x interval as one whose dumps stopped. The mrt_* gauges are
        # exported (as 0) on every instance, [mrt] configured or not; the
        # `mrt_dump_interval_seconds > 0` guard is what keeps a 0 interval
        # (no [mrt]) from firing 5m after every start.
        expr: >-
          time()
          - (
            mrt_last_dump_success_timestamp_seconds
            > process_start_time_seconds{job="rustbgpd"}
            or process_start_time_seconds{job="rustbgpd"}
          )
          > 2 * mrt_dump_interval_seconds
          and mrt_dump_interval_seconds > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MRT dump stale on {{ $labels.instance }}"
          description: >-
            No MRT TABLE_DUMP_V2 file has been published on
            {{ $labels.instance }} for more than twice the configured
            mrt_dump_interval_seconds. Check mrt_dump_failures_total by stage
            and the daemon log for the failing dump; `rbgp mrt-dump` runs one
            on demand.

      - alert: BgpUpdateGroupResidueGrowing
        # Withdrawal residue is bounded by the resync timer; a climb
        # sustained for a full hour means a wedged update-group member
        # is accumulating residue its resync never clears.
        expr: delta(bgp_update_group_residue_entries[1h]) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Update-group withdrawal residue growing on {{ $labels.instance }}"
          description: >-
            bgp_update_group_residue_entries on {{ $labels.instance }}
            has grown continuously for over an hour. A dirty update-group
            member appears wedged; its resync is not draining residue.

      - alert: BgpPolicyTransitionStalled
        # Healthy transitions are expected to finish well below this window.
        # Readiness fails closed at 30s; the alert requires persistence for a
        # full minute before firing.
        expr: bgp_rib_policy_transition_in_progress == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Export-policy transition stalled on {{ $labels.instance }}"
          description: >-
            bgp_rib_policy_transition_in_progress on {{ $labels.instance }}
            has remained 1 for at least one minute. RIB readiness is
            failing closed and ordinary queries and mutations remain fenced.
            Check the poll_kind histogram and the daemon's policy-transition
            warning; bgp_rib_policy_transition_last_duration_milliseconds is
            the previous terminal sample until this transition completes.

      - alert: BgpPolicyTransitionActorPollExceededReadinessBudget
        # Histogram subtraction classifies observations above the exact
        # 200ms bucket boundary. `ignoring(le)` is required to match the
        # histogram count and bucket series while retaining bounded
        # instance/job/poll_kind identity.
        expr: >-
          increase(bgp_rib_policy_transition_actor_poll_duration_seconds_count[15m])
          - ignoring(le)
          increase(bgp_rib_policy_transition_actor_poll_duration_seconds_bucket{le="0.2"}[15m])
          > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            RIB actor poll exceeded readiness budget ({{ $labels.poll_kind }})
          description: >-
            The {{ $labels.poll_kind }} export-policy transition path on
            {{ $labels.instance }} exceeded the 200ms actor-poll budget in
            the last 15 minutes. A long single-threaded poll could delay a
            concurrent readiness probe and other RIB work; inspect the
            dashboard p99 and transition state before retrying a reload.

      - alert: BgpOutboundRouteDrops
        # This counter records terminal outbound work loss. Temporary
        # collision-failback ROUTE-REFRESH saturation is retained and retried,
        # so it does not increment this family.
        expr: increase(bgp_outbound_route_drops_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Outbound BGP work dropped for {{ $labels.peer }}"
          description: >-
            bgp_outbound_route_drops_total for peer {{ $labels.peer }} on
            {{ $labels.instance }} increased by
            {{ $value | printf "%.0f" }} in the last 10 minutes. Outbound BGP
            work was terminally lost before reaching the peer writer; inspect
            the writer, peer, daemon log, and last error to identify the failed
            path. Once healthy, refresh outbound if the peer missed an
            advertised view.

      - alert: BgpSendHoldExpired
        # RFC 9687 expiry means the remote peer stopped draining TCP long
        # enough for rustbgpd to tear down the session without a NOTIFICATION.
        expr: increase(bgp_send_hold_expirations_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Send-hold timer expired for {{ $labels.peer }}"
          description: >-
            bgp_send_hold_expirations_total for peer {{ $labels.peer }} on
            {{ $labels.instance }} increased by
            {{ $value | printf "%.0f" }} in the last 10 minutes. The RFC 9687
            send-hold timer expired because the peer stopped draining its TCP
            socket, so rustbgpd tore down the session without a NOTIFICATION;
            inspect the writer and peer before allowing the session to recover.

      - alert: BgpSessionLifecycleSourceDrops
        # Source loss happens before process-local, live, and durable session-event history.
        expr: increase(bgp_session_lifecycle_source_dropped_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            Session lifecycle source dropped events ({{ $labels.reason }})
          description: >-
            bgp_session_lifecycle_source_dropped_total for reason
            {{ $labels.reason }} on {{ $labels.instance }} increased by
            {{ $value | printf "%.0f" }} in the last 10 minutes. Session event
            history, live delivery, and durable history may be incomplete;
            resnapshot current neighbor state before consuming further
            incremental session events.

      - alert: BgpEventStreamLagged
        # A live subscriber that falls behind misses events and can no longer
        # treat its incremental view as synchronized with daemon state.
        expr: increase(bgp_event_stream_lagged_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            Live event stream lagged ({{ $labels.service }}/{{ $labels.source }})
          description: >-
            bgp_event_stream_lagged_total for {{ $labels.service }} consuming
            {{ $labels.source }} events on {{ $labels.instance }} increased by
            {{ $value | printf "%.0f" }} in the last 10 minutes. The live
            consumer missed events and its incremental view is desynchronized;
            take a fresh authoritative snapshot for this service and source,
            then restart the live watch.

      - alert: BgpPolicyEvalErrors
        # An evaluation error makes the policy engine treat the
        # affected route as Deny (uniform eval-error rails), so every
        # increment is a route silently dropped by a broken policy —
        # fix the policy (`rbgp policy check`), don't silence the
        # alert.
        expr: increase(bgp_policy_eval_errors_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            Policy evaluation errors ({{ $labels.direction }},
            {{ $labels.kind }})
          description: >-
            bgp_policy_eval_errors_total{direction="{{ $labels.direction
            }}", kind="{{ $labels.kind }}"} on {{ $labels.instance }}
            increased by {{ $value | printf "%.0f" }} in the last 15
            minutes. Routes hitting the failing statement are being
            denied.

      - alert: BgpExactExportRejected
        # Every increment means an announcement was withheld before
        # Adj-RIB-Out commit.
        expr: increase(bgp_exact_export_rejections_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            Exact export rejected for {{ $labels.peer }} ({{ $labels.family }})
          description: >-
            bgp_exact_export_rejections_total for neighbor {{ $labels.peer }}
            on {{ $labels.instance }} increased by
            {{ $value | printf "%.0f" }} in the last 15 minutes
            (family={{ $labels.family }}, reason={{ $labels.reason }}).
            The rejected announcement was not committed to Adj-RIB-Out;
            inspect the corresponding daemon warning and advertised-route
            explain output.

      - alert: BgpMalformedUpdate
        # Every increment is one malformed UPDATE after its strongest
        # RFC 7606 disposition has been selected.
        expr: increase(bgp_update_malformed_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            Malformed UPDATE from {{ $labels.peer }}
            ({{ $labels.disposition }})
          description: >-
            bgp_update_malformed_total for peer {{ $labels.peer }}
            on {{ $labels.instance }} increased by
            {{ $value | printf "%.0f" }} in the last 15 minutes. The
            strongest RFC 7606 disposition was {{ $labels.disposition }};
            inspect the peer and the daemon's malformed-UPDATE diagnostics.

      - alert: BgpSelectionDeferralTimedOut
        # Normal active/waiter/release state is intentionally not alertable.
        # A timer release is an exceptional convergence fallback.
        expr: increase(bgp_selection_deferral_timeouts_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            Selection deferral timed out for {{ $labels.afi_safi }}
          description: >-
            bgp_selection_deferral_timeouts_total for
            {{ $labels.afi_safi }} on {{ $labels.instance }} increased by
            {{ $value | printf "%.0f" }} in the last 15 minutes. The family
            gate used its bounded timer fallback before all planned-restart
            convergence signals arrived.
      - alert: BgpSelectionDeferralLedgerOverflow
        # Overflow remains safe because release falls back to a complete
        # family sweep, but it signals that the bounded identity ledger was
        # exhausted and merits operator investigation.
        expr: increase(bgp_selection_deferral_ledger_overflows_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            Selection-deferral ledger overflow for {{ $labels.afi_safi }}
          description: >-
            bgp_selection_deferral_ledger_overflows_total for
            {{ $labels.afi_safi }} on {{ $labels.instance }} increased by
            {{ $value | printf "%.0f" }} in the last 15 minutes. The family
            exceeded the bounded identity ledger and used a complete release
            sweep; inspect table scale and retained-key pressure.

      - alert: BmpSourceDrops
        # The per-peer PeerSession→BmpManager channel is lossy by design
        # (it never backpressures the session). channel_full/channel_closed
        # mean a source event or report was lost. state_query_timeout means
        # one periodic report was omitted and will be retried next tick.
        expr: increase(bmp_source_drops_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            BMP source work not delivered for {{ $labels.peer }} ({{ $labels.reason }})
          description: >-
            bmp_source_drops_total for peer {{ $labels.peer }} on
            {{ $labels.instance }} increased by
            {{ $value | printf "%.0f" }} in the last 10 minutes
            (reason={{ $labels.reason }}). A channel_full or channel_closed
            increment means a source-channel event or report was lost; a
            state_query_timeout increment means one periodic report was
            omitted and will be retried on the next tick. Check
            bmp_stream_diverged for authoritative per-peer divergence, then
            inspect source-channel pressure and session responsiveness.

      - alert: BmpStreamDiverged
        expr: bmp_stream_diverged == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "BMP stream remains diverged for {{ $labels.peer }}"
          description: >-
            bmp_stream_diverged for peer {{ $labels.peer }} on
            {{ $labels.instance }} has remained 1 for five minutes. The
            session has not completed its synthetic PeerDown/PeerUp repair;
            inspect BMP channel pressure and collector health.

      - alert: BmpControlEventDrops
        expr: increase(bmp_control_event_drops_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            BMP control event dropped for {{ $labels.collector }}
            ({{ $labels.kind }})
          description: >-
            bmp_control_event_drops_total for collector
            {{ $labels.collector }} on {{ $labels.instance }} increased by
            {{ $value | printf "%.0f" }} in the last 10 minutes
            (kind={{ $labels.kind }}, reason={{ $labels.reason }}). The BMP
            manager missed a collector lifecycle transition; inspect manager
            channel pressure and reconnect state.

      - alert: BmpLocRibSourceDrops
        # RFC 9069 Loc-RIB events lost at the RIB/PeerManager→BmpManager
        # channel. A dropped route_monitoring event diverges every Loc-RIB
        # collector until its next reconnect-triggered table dump; a dropped
        # stats event only skips one periodic report.
        expr: increase(bmp_loc_rib_source_drops_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            BMP Loc-RIB events dropped ({{ $labels.event }},
            {{ $labels.reason }})
          description: >-
            bmp_loc_rib_source_drops_total{event="{{ $labels.event }}",
            reason="{{ $labels.reason }}"} on {{ $labels.instance }}
            increased by {{ $value | printf "%.0f" }} in the last 10 minutes.
            Connected Loc-RIB collectors may hold a stale table until their
            next reconnect; correlate with bmp_collector_drops_total and the
            bmp_loc_rib_dump_live_buffer_* gauges to find the slow consumer.

      - alert: BmpCollectorDrops
        # Messages discarded toward one collector, in fan_out (its outbound
        # channel is full or closed) or loc_rib_dump (the bounded live buffer
        # overflowed or the dump failed). The collector's view is incomplete
        # until it reconnects and receives a fresh dump.
        expr: increase(bmp_collector_drops_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            BMP messages dropped toward collector {{ $labels.collector }}
            ({{ $labels.phase }})
          description: >-
            bmp_collector_drops_total for collector {{ $labels.collector }}
            on {{ $labels.instance }} increased by
            {{ $value | printf "%.0f" }} in the last 10 minutes
            (phase={{ $labels.phase }}, reason={{ $labels.reason }}). The
            collector is not keeping up or its connection failed; its BMP
            view is incomplete until it reconnects and is re-fed.
