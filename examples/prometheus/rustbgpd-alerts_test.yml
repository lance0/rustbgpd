      - eval_time: 10m
        alertname: BmpLocRibSourceDrops
        exp_alerts:
          - exp_labels:
              severity: warning
              event: route_monitoring
              reason: channel_full
              instance: edge1:9179
            exp_annotations:
              summary: "BMP Loc-RIB events dropped (route_monitoring, channel_full)"
              description: >-
                bmp_loc_rib_source_drops_total{event="route_monitoring",
