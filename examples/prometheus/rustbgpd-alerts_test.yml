                session to recover.
          - exp_labels:
              severity: critical
              peer: 192.0.2.51
              instance: edge1:9179
            exp_annotations:
              summary: "Send-hold timer expired for 192.0.2.51"
              description: >-
                bgp_send_hold_expirations_total for peer 192.0.2.51 on
