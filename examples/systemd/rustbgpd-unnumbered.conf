# Opt-in drop-in for interface-only neighbors (interface without address).
#
# CAP_NET_RAW is needed for the ICMPv6 discovery socket whenever at least
# one interface-only neighbor is configured, even when
# [global.unnumbered] router_advertisements = false.
# Static link-local neighbors with an explicit address do not need it.
#
# Install from the source checkout:
#   sudo mkdir -p /etc/systemd/system/rustbgpd.service.d
#   sudo install -m 0644 examples/systemd/rustbgpd-unnumbered.conf \
#     /etc/systemd/system/rustbgpd.service.d/rustbgpd-unnumbered.conf
#   sudo systemctl daemon-reload && sudo systemctl restart rustbgpd
#
# Capability assignments add to the base unit's CAP_NET_BIND_SERVICE.
# If the config also programs the kernel, install rustbgpd-dataplane.conf
# alongside this file to add CAP_NET_ADMIN independently.

[Service]
AmbientCapabilities=CAP_NET_RAW
CapabilityBoundingSet=CAP_NET_RAW
