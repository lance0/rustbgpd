# EVPN VTEP — Phase 2 alpha leaf
#
# This example shows the local EVPN state a leaf-mode rustbgpd consumes
# for the Gate 7b/7b+1 bidirectional VTEP alpha path: received Type 2
# routes program Linux bridge/VXLAN FDB entries, kernel-learned local
# MACs originate Type 2 routes, and one Type 3 IMET is emitted per L2VNI.
#
# Compare with `examples/rr-evpn-fabric/config.toml` — that example has
# *no* `[[evpn_instances]]` block. The route reflector role is
# stateless from the EVI point of view: it only reflects routes
# between VTEPs and never originates its own. A leaf has the inverse
# shape — it owns local EVIs and may peer with one or more RRs.

[global]
asn = 65000
router_id = "10.0.0.10"
listen_port = 179

[global.telemetry]
prometheus_addr = "127.0.0.1:9179"
log_format = "json"

# --- Spine RR peer (single-RR design; replicate for redundancy) ---

[[neighbors]]
address = "10.0.0.100"
remote_asn = 65000
description = "spine-rr-01"
hold_time = 180
families = ["l2vpn_evpn"]

# --- Local EVPN instances on this leaf ---
#
# Each block describes one local EVI/L2VNI on this VTEP.
#
# Required fields:
#   - vni            : 24-bit VXLAN VNI (RFC 8365 §5)
#   - rd             : Route Distinguisher (RFC 4364 §4.2)
#                      `asn:val`  → 2-byte ASN form (Type 0)
#                      `ipv4:val` → IPv4 form (Type 1)
#                      `4byteasn:val` → 4-byte ASN form (Type 2)
#   - route_targets  : non-empty bidirectional RT list (import = export)
#   - local_vtep_ip  : VXLAN tunnel source IP for this EVI (must be unicast)
#
# Optional:
#   - bridge              : Linux bridge name to bind this EVI to
#   - advertise_svi_mac   : originate Type 2 for the SVI's own MAC (RFC 9135)
#                          (recognized today; default-gateway/SVI-MAC
#                           origination remains a follow-on phase)
#   - sticky_macs         : MACs to mark with the RFC 7432 §15.4 sticky
#                           bit when this VTEP originates a Type 2 for
#                           them. NOT a static FDB — the daemon does
#                           not synthesize routes for these MACs; it
#                           only sets the sticky bit when the local
#                           kernel learns one. See ADR-0056.

[[evpn_instances]]
vni = 10100
rd = "10.0.0.10:10100"
route_targets = ["65000:10100"]
local_vtep_ip = "10.0.0.10"
bridge = "br100"
# Pin two anycast-gateway MACs sticky on origination. Misbehaving
# peers that try to win best-path with a higher mobility seq for
# these MACs are still preferred at the RIB level (RFC 7432 §15.1
# sequence rules) — this only affects what *we* originate. Pair with
# the duplicate-MAC-move counter to catch contention early.
sticky_macs = [
  "aa:bb:cc:dd:ee:01",
  "aa:bb:cc:dd:ee:02",
]

[[evpn_instances]]
vni = 10200
rd = "10.0.0.10:10200"
route_targets = ["65000:10200"]
local_vtep_ip = "10.0.0.10"
bridge = "br200"
advertise_svi_mac = true

[[evpn_instances]]
vni = 10300
# 4-octet AS in the RD — picks RD type 2 automatically.
rd = "4200000000:300"
# Multiple RTs allowed; deduplicated and sorted on resolution.
route_targets = ["65000:10300", "65000:55000"]
local_vtep_ip = "10.0.0.10"
