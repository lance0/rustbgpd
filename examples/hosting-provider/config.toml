# Hosting provider prefix management configuration
#
# rustbgpd as a programmable route injection layer for a hosting provider.
# Customer provisioning systems add/remove prefixes via gRPC. rustbgpd peers
# with edge routers via iBGP; the edge routers install routes into the kernel
# FIB and announce them upstream.
#
# Architecture:
#   Customer portal → Provisioning API → rustbgpd (gRPC) → Edge routers (iBGP)
#
# See docs/USE_CASES.md for detailed walkthrough and API examples.

[global]
asn = 65100
router_id = "10.255.0.1"
listen_port = 1179               # Non-standard port — edge routers own 179

[global.telemetry]
prometheus_addr = "127.0.0.1:9179"
log_format = "json"

# Local gRPC uses the implicit owner-only socket at
# <runtime_state_dir>/grpc.sock. Its filesystem ownership authenticates the
# implicit local-operator identity at operator tier.

# Remote provisioning-system access over TCP. Under tier a TCP listener needs a
# bearer token + matching principal (or native mTLS); create the token file
# first, then uncomment.
# [global.telemetry.grpc_tcp]
# enabled = true
# address = "127.0.0.1:50051"
# token_file = "/etc/rustbgpd/grpc-token"
# principal = "provisioning-system"
# [security.grpc.roles]
# provisioning-system = "automation"

# Optional edge-router mode:
# Leave this block absent when rustbgpd is only a control-plane route
# injection layer. Configure it only on a Linux host where rustbgpd should
# program ordinary unicast best routes into dedicated kernel tables.
#
# [[fib_tables]]
# name = "edge"
# table_id = 1000
# metric = 200
# families = ["ipv4_unicast", "ipv6_unicast"]
#
# Inspect runtime status with:
#   rbgp rib fib
#   rbgp -j rib fib

# RPKI validation — don't announce prefixes we can't prove we hold
[rpki]
[[rpki.cache_servers]]
address = "127.0.0.1:3323"

# Import-decision explain, on. The edge routers below are iBGP peers that
# send back only what this AS originates, so the per-session cache stays
# small and "why did the provisioning system's prefix not come back?" is
# answerable per prefix. Explain is opt-in daemon-wide because the cache is
# per session and multiplies by peer count; at this peer count and table
# size it is a few MiB.
[policy.explain]
enabled = true

# BMP export for audit trail
[bmp]
sys_name = "rustbgpd-hosting"
[[bmp.collectors]]
address = "10.0.0.100:5000"

# --- iBGP to edge routers ---
# Same ASN = iBGP. Edge routers run FRR/BIRD with FIB integration and
# handle eBGP sessions to transits and IXPs.

[[neighbors]]
address = "10.255.0.2"
remote_asn = 65100
description = "edge-router-1"
families = ["ipv4_unicast", "ipv6_unicast"]

[[neighbors]]
address = "10.255.0.3"
remote_asn = 65100
description = "edge-router-2"
families = ["ipv4_unicast", "ipv6_unicast"]
