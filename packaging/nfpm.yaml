# nfpm configuration — builds the .deb and .rpm release packages.
#
# Driven by scripts/build-packages.sh, which stages the payload under
# ${PKGROOT} (binaries, package-path systemd unit, production-path
# config skeleton, man pages, completions) and resolves the
# ${VERSION} / ${ARCH} / ${PKGROOT} placeholders before invoking
# `nfpm package`. Run the script, not nfpm directly.
name: rustbgpd
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Lance Tuller <lancey3@gmail.com>
vendor: rustbgpd
homepage: https://github.com/lance0/rustbgpd
license: MIT OR Apache-2.0
description: |
  BGP daemon with route-reflector and route-server support.
  Ships the rustbgpd daemon, the rbgp CLI, and the rs-config-render
  route-server config renderer, plus a hardened systemd unit and a
  starter configuration at /etc/rustbgpd/config.toml.

scripts:
  preinstall: packaging/preinstall.sh
  postinstall: packaging/postinstall.sh

contents:
  # Binaries.
  - src: ${PKGROOT}/usr/bin/rustbgpd
    dst: /usr/bin/rustbgpd
  - src: ${PKGROOT}/usr/bin/rbgp
    dst: /usr/bin/rbgp
  - src: ${PKGROOT}/usr/bin/rs-config-render
    dst: /usr/bin/rs-config-render

  # systemd unit (ExecStart rewritten to /usr/bin by the build script)
  # + declarative service user.
  - src: ${PKGROOT}/lib/systemd/system/rustbgpd.service
    dst: /lib/systemd/system/rustbgpd.service
    file_info:
      mode: 0644
  - src: packaging/sysusers.conf
    dst: /usr/lib/sysusers.d/rustbgpd.conf
    file_info:
      mode: 0644

  # Config skeleton: the minimal example rewritten to production paths.
  # config|noreplace: never overwrite an operator-edited file on
  # upgrade (dpkg keeps the local file; rpm writes .rpmnew).
  - src: ${PKGROOT}/etc/rustbgpd/config.toml
    dst: /etc/rustbgpd/config.toml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: rustbgpd
  - dst: /etc/rustbgpd
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: rustbgpd

  # Man pages + completions, generated by the shipped binaries.
  - src: ${PKGROOT}/usr/share/man/man1/rbgp.1.gz
    dst: /usr/share/man/man1/rbgp.1.gz
  - src: ${PKGROOT}/usr/share/man/man8/rustbgpd.8.gz
    dst: /usr/share/man/man8/rustbgpd.8.gz
  - src: ${PKGROOT}/usr/share/completions/rbgp.bash
    dst: /usr/share/bash-completion/completions/rbgp
  - src: ${PKGROOT}/usr/share/completions/rbgp.zsh
    dst: /usr/share/zsh/site-functions/_rbgp
  - src: ${PKGROOT}/usr/share/completions/rbgp.fish
    dst: /usr/share/fish/vendor_completions.d/rbgp.fish

  # Licenses, config JSON Schema, and the opt-in kernel-dataplane
  # capability drop-in (an example to copy into
  # /etc/systemd/system/rustbgpd.service.d/ — see docs/deployment.md).
  - src: LICENSE-MIT
    dst: /usr/share/doc/rustbgpd/LICENSE-MIT
    file_info:
      mode: 0644
  - src: LICENSE-APACHE
    dst: /usr/share/doc/rustbgpd/LICENSE-APACHE
    file_info:
      mode: 0644
  - src: docs/rustbgpd.schema.json
    dst: /usr/share/doc/rustbgpd/rustbgpd.schema.json
    file_info:
      mode: 0644
  - src: examples/systemd/rustbgpd-dataplane.conf
    dst: /usr/share/doc/rustbgpd/examples/rustbgpd-dataplane.conf
    file_info:
      mode: 0644
