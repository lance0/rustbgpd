# systemd-sysusers(8) declaration for the rustbgpd service user.
# preinstall.sh creates the user imperatively at install time (package
# file ownership needs it before this file is processed); this file
# keeps the declaration for image builds and stateless provisioning.
u rustbgpd - "rustbgpd BGP daemon" /var/lib/rustbgpd /usr/sbin/nologin
